function updateChunkManager(){let b=camera.bounds||getCameraBounds(),globalTop=worldState.absoluteDistance+(b.top-p.y),globalBottom=worldState.absoluteDistance+(b.bottom-p.y),globalLeft=worldState.originOffsetX+b.left,globalRight=worldState.originOffsetX+b.right,minY=Math.floor(globalTop/CHUNK_HEIGHT)-1,maxY=Math.floor(globalBottom/CHUNK_HEIGHT)+2,minX=Math.floor(globalLeft/CHUNK_WIDTH)-1,maxX=Math.floor(globalRight/CHUNK_WIDTH)+1,needed=new Set();for(let cy=minY;cy<=maxY;cy++)for(let cx=minX;cx<=maxX;cx++){let key=chunkKey(cx,cy);needed.add(key);if(!worldState.generatedChunks.has(key)){let c=makeChunk(cx,cy);worldState.generatedChunks.set(key,c);worldState.generationQueue.push(c)}}worldState.generationQueue=worldState.generationQueue.filter(c=>needed.has(c.key)&&!c.loaded);let budget=MAX_CHUNKS_GENERATED_PER_UPDATE;while(budget--&&worldState.generationQueue.length)generateChunk(worldState.generationQueue.shift());worldState.activeChunks=needed;worldState.currentChunkY=Math.floor(worldState.absoluteDistance/CHUNK_HEIGHT);worldState.currentChunkX=Math.floor((worldState.originOffsetX+p.x)/CHUNK_WIDTH);for(let [key,c] of worldState.generatedChunks)if(!needed.has(key)&&(Math.abs(c.y-worldState.currentChunkY)>4||Math.abs(c.x-worldState.currentChunkX)>4)){world=world.filter(e=>e.chunkKey!==key);worldState.generatedChunks.delete(key)}let cur=worldState.generatedChunks.get(chunkKey(worldState.currentChunkX,worldState.currentChunkY));if(cur)worldState.currentBiome=cur.biome}
