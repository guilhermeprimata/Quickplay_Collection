function updateHud(){$('#hMode').textContent=mode==='survival'?T('surv'):mode==='timeattack'?T('attack'):T('zen');$('#hScore').textContent=mode==='zen'?'ZEN':score.toLocaleString();$('#hSpeed').textContent=Math.round(p.speed);$('#hDist').textContent=Math.round(dist)+'m';$('#hAbd').textContent=stats.total;$('#hCombo').textContent='x'+Math.max(1,combo);$('#hAlert').textContent=Math.round(alert);$('#lifeFill').style.width=life+'%';$('#lifeFill').classList.toggle('low',life<40);$('#lifeVal').textContent=Math.ceil(life)+'%';$('#beamFill').style.width=beam+'%';$('#beamVal').textContent=Math.ceil(beam)+'%';$('#heatFill').style.width=heat+'%';$('#heatVal').textContent=Math.ceil(heat)+'%'}
function reset(m){mode=m;state='play';time=score=dist=alert=combo=comboTimer=bestCombo=beamTime=beamStarts=overheats=0;life=beam=100;heat=0;overheated=false;beamHeld=turboHeld=touchBeam=touchTurbo=false;entities=[];shots=[];parts=[];debris=[];chunks.clear();stats={total:0,civilians:0,buildings:0,vehicles:0,animals:0,defense:0,beamStarts:0,beamTime:0,overheats:0};p={x:0,y:0,vx:0,vy:0,angle:0,speed:0};cam={x:0,y:0,zoom:1};manageChunks();$$('.screen').forEach(x=>x.classList.add('hidden'));$('#hud').classList.remove('hidden');$('#meters').classList.remove('hidden');$('#pauseBtn').classList.remove('hidden');$('#touch').classList.remove('hidden');previewAI=PREVIEW;beginShared();music(true);updateHud()}
function pause(){if(state==='play'){state='pause';$('#pauseScreen').classList.remove('hidden');music(false)}else if(state==='pause'){state='play';$('#pauseScreen').classList.add('hidden');music(true)}}
function end(reason){if(state!=='play')return;state='over';music(false);finishShared();saveScore();$('#hud').classList.add('hidden');$('#meters').classList.add('hidden');$('#pauseBtn').classList.add('hidden');$('#touch').classList.add('hidden');$('#overScreen').classList.remove('hidden');$('#overTitle').textContent=T('over');$('#overReason').textContent=reason==='timeup'?T('timeup'):T('destroyed');$('#overStats').innerHTML=gameOverStats()}
function gameOverStats(){const cells=[['SCORE',mode==='zen'?'—':score.toLocaleString()],['TEMPO',formatTime(time)],['DIST',Math.round(dist)+'m'],[T('abd').toUpperCase(),stats.total],['CIVIS',stats.civilians],['ESTRUTURAS',stats.buildings],['VEÍCULOS',stats.vehicles],['FAUNA',stats.animals],['DEFESA',stats.defense],['RAIO ATIVO',stats.beamTime.toFixed(1)+'s'],['SUPERAQUEC.',stats.overheats],['MELHOR CADEIA','x'+bestCombo]];return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">'+cells.map(([a,b])=>`<div style="padding:8px;border:1px solid var(--line);background:#ffffff08"><small style="color:var(--muted)">${a}</small><b style="display:block;font-size:18px;color:var(--acid)">${b}</b></div>`).join('')+'</div><p class="subtitle">'+(cfg.lang==='pt-BR'?'Manifesto final da nave-mãe: transferências confirmadas antes da perda do sinal.':'Mothership final manifest: confirmed transfers before signal loss.')+'</p>'}
function formatTime(s){let m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')}
function saveScore(){if(PREVIEW||mode==='zen')return;let d=safeRead(SCORES,{}),arr=d[mode]||[];arr.push({score,time,dist,abducted:stats.total,date:new Date().toISOString().slice(0,10)});arr.sort((a,b)=>b.score-a.score);d[mode]=arr.slice(0,10);safeWrite(SCORES,d)}
function renderScores(){const d=safeRead(SCORES,{}),all=[...(d.survival||[]).map(x=>({...x,m:'SURV'})),...(d.timeattack||[]).map(x=>({...x,m:'60S'}))].sort((a,b)=>b.score-a.score).slice(0,12);$('#scoreList').innerHTML=all.length?all.map((x,i)=>`<div class="scoreRow"><b>#${i+1}</b><span>${x.m} · ${x.abducted||0} ${T('abd').toLowerCase()}</span><b>${(x.score||0).toLocaleString()}</b></div>`).join(''):'<p class="subtitle">—</p>'}
let sharedActive=false,sharedLast=performance.now();function beginShared(){if(PREVIEW)return;let all=safeRead(SHARED,{}),s=all[GAME_ID]||{},today=new Date().toISOString().slice(0,10),prev=s.lastDay||'',gap=99;if(prev){let a=new Date(prev+'T12:00:00'),b=new Date(today+'T12:00:00');gap=Math.round((b-a)/86400000)}s.starts=(s.starts||0)+1;if(prev!==today){s.currentStreak=gap===1?(s.currentStreak||1)+1:1;s.longestStreak=Math.max(s.longestStreak||0,s.currentStreak);s.lastDay=today}s.totalSeconds=s.totalSeconds||0;all[GAME_ID]=s;safeWrite(SHARED,all);sharedActive=true;sharedLast=performance.now()}function updateShared(){if(PREVIEW||!sharedActive)return;let n=performance.now(),d=Math.min(2,(n-sharedLast)/1000);sharedLast=n;if(d<.1)return;let all=safeRead(SHARED,{}),s=all[GAME_ID]||{};s.totalSeconds=(s.totalSeconds||0)+d;all[GAME_ID]=s;safeWrite(SHARED,all)}function finishShared(){updateShared();sharedActive=false}
let ac,bgmTimer=0,step=0;function audio(){if(ac)return ac;const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A();return ac}function tone(f,d=.08,type='square',v=.02,delay=0){if(!cfg.sound)return;let a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}function noise(d=.06,v=.015){if(!cfg.sound)return;let a=audio();if(!a)return;let len=a.sampleRate*d|0,b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);let s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(a.destination);s.start()}function music(on){clearTimeout(bgmTimer);bgmTimer=0;if(!on||!cfg.sound||state!=='play')return;let a=audio();if(!a)return;a.resume().then(()=>beat())}function beat(){if(!cfg.sound||state!=='play')return;let roots=[55,61.74,65.41,49],r=roots[(step>>2)%roots.length],i=step%8;if(i%2===0)tone(r,.32,'sine',.018);if(i===2||i===6)tone(r*2,.07,'triangle',.009);if(alert>35&&i%2)tone(r*3,.04,'square',.004);step++;bgmTimer=setTimeout(beat,270-clamp(alert,0,80))}
function applyUI(){document.documentElement.lang=cfg.lang;document.body.classList.toggle('light',cfg.theme==='light');$('#tag').textContent=T('tag');$('#surv b').textContent=T('surv');$('#surv small').textContent=T('survD');$('#attack b').textContent=T('attack');$('#attack small').textContent=T('attackD');$('#zen b').textContent=T('zen');$('#zen small').textContent=T('zenD');$('#opts').textContent=T('options');$('#scores').textContent=T('scores');$('#about').textContent='ⓘ '+T('about');$('#collection').textContent='↩ '+T('collection');$('#pauseCollection').textContent='↩ '+T('collection');$('#overCollection').textContent='↩ '+T('collection');$('#sound').textContent=(cfg.sound?'🔊 ':'🔇 ')+T('sound');$('#theme').textContent='◐ '+(cfg.theme==='light'?T('dark'):T('light'));$('#optTitle').textContent=T('options');$('#scoreTitle').textContent=T('scores');$('#aboutTitle').textContent=T('about');$('#langLabel').textContent=T('lang');$('#diffLabel').textContent=T('diff');$('#controls').textContent=T('controls');$$('.back').forEach(b=>b.textContent=T('back'));$('#resume').textContent=T('resume');$('#restart').textContent=T('restart');$('#quit').textContent=T('quit');$('#overRestart').textContent=T('restart');$('#overMenu').textContent=T('quit');$('#aboutText').innerHTML=(LANGS[cfg.lang]||fallback).aboutHtml||fallback.aboutHtml;$('#lSpeed').textContent=T('speed');$('#lDist').textContent=T('dist');$('#lAbd').textContent=T('abd');$('#lCombo').textContent=T('combo');$('#lAlert').textContent=T('alert');$('#mLife').textContent=T('life');$('#mBeam').textContent=T('beam');$('#mHeat').textContent=T('heat');safeWrite(CFG,cfg)}
Object.entries(LANGS).forEach(([k,v])=>$('#lang').add(new Option(v.name,k)));$('#lang').value=cfg.lang;$('#diff').value=cfg.diff;applyUI();
function show(id){$$('.screen').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}
$('#surv').onclick=()=>reset('survival');$('#attack').onclick=()=>reset('timeattack');$('#zen').onclick=()=>reset('zen');$('#opts').onclick=()=>show('#options');$('#scores').onclick=()=>{renderScores();show('#scoreScreen')};$('#about').onclick=()=>show('#aboutScreen');$$('.back').forEach(b=>b.onclick=()=>show('#menu'));const goCollection=()=>location.href='./index.html';$('#collection').onclick=goCollection;$('#pauseCollection').onclick=goCollection;$('#overCollection').onclick=goCollection;$('#sound').onclick=()=>{cfg.sound=!cfg.sound;applyUI();if(!cfg.sound)music(false)};$('#theme').onclick=()=>{cfg.theme=cfg.theme==='light'?'dark':'light';applyUI()};$('#lang').onchange=e=>{cfg.lang=e.target.value;applyUI()};$('#diff').onchange=e=>{cfg.diff=e.target.value;applyUI()};$('#pauseBtn').onclick=pause;$('#resume').onclick=pause;$('#restart').onclick=()=>reset(mode);$('#quit').onclick=()=>{finishShared();music(false);state='menu';$('#hud').classList.add('hidden');$('#meters').classList.add('hidden');$('#pauseBtn').classList.add('hidden');$('#touch').classList.add('hidden');show('#menu')};$('#overRestart').onclick=()=>reset(mode);$('#overMenu').onclick=()=>{state='menu';show('#menu')};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Escape')pause();if(e.code==='Space'&&state==='play'&&!beamHeld){beamStarts++;stats.beamStarts=beamStarts}});addEventListener('keyup',e=>keys[e.code]=false);
let joyId=null,joyX=0,joyY=0,joyOrigin={x:0,y:0};const joy=$('#joy'),nub=$('#nub');function joyStart(x,y,id){joyId=id;joyOrigin={x,y};joy.style.left=x+'px';joy.style.top=y+'px';joy.style.display='block';joyX=joyY=0;nub.style.transform='translate(0,0)'}function joyMove(x,y){let dx=x-joyOrigin.x,dy=y-joyOrigin.y,d=Math.hypot(dx,dy),m=32;if(d>m){dx=dx/d*m;dy=dy/d*m}joyX=dx/m;joyY=dy/m;nub.style.transform=`translate(${dx}px,${dy}px)`}function joyEnd(){joyId=null;joyX=joyY=0;joy.style.display='none';nub.style.transform='translate(0,0)'}
cv.addEventListener('pointerdown',e=>{if(state!=='play'||e.pointerType==='mouse')return;const r=$('#game').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x>r.width*.55)return;cv.setPointerCapture(e.pointerId);joyStart(x,y,e.pointerId)});cv.addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;const r=$('#game').getBoundingClientRect();joyMove(e.clientX-r.left,e.clientY-r.top)});cv.addEventListener('pointerup',e=>{if(e.pointerId===joyId)joyEnd()});cv.addEventListener('pointercancel',e=>{if(e.pointerId===joyId)joyEnd()});
function actionButton(el,which){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(which==='beam'){if(!touchBeam){beamStarts++;stats.beamStarts=beamStarts}touchBeam=true}else touchTurbo=true});const up=()=>{if(which==='beam')touchBeam=false;else touchTurbo=false};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}actionButton($('#beamBtn'),'beam');actionButton($('#turboBtn'),'turbo');
if(PREVIEW)setTimeout(()=>{if(state==='menu')reset('zen')},450);requestAnimationFrame(loop);addEventListener('beforeunload',finishShared);
</script>
