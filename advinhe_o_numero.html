
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Adivinhação</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 40px; }
    input, button { padding: 10px; font-size: 16px; margin: 5px; }
    #mensagem, #historico { margin-top: 20px; font-size: 18px; }
    #cronometro { margin-top: 20px; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>🎯 Adivinhe o Número!</h1>
  <p>Escolha um número entre 0 e 1000:</p>
  <input type="number" id="palpite" placeholder="Seu palpite" />
  <button id="btnTentar" onclick="verificarPalpite()">Tentar</button>
  <button onclick="resetarJogo()">🔄 Resetar</button>

  <div id="cronometro">
    <canvas id="cronometroCanvas" width="200" height="200"></canvas>
    <p id="tempoRestante">180</p>
  </div>

  <p id="mensagem"></p>
  <div id="historico"></div>

  <script>
    let numeroSecreto = Math.floor(Math.random() * 1001);
    let tentativas = 0;
    let tempoRestante = 180;
    let cronometroInterval;
    let jogoAtivo = true;

    function iniciarCronometro() {
      cronometroInterval = setInterval(function() {
        tempoRestante--;
        document.getElementById('tempoRestante').textContent = tempoRestante;
        desenharCronometro(tempoRestante);
        if (tempoRestante <= 0) {
          clearInterval(cronometroInterval);
          document.getElementById('mensagem').textContent = "⏰ Tempo esgotado! O número era " + numeroSecreto + ".";
          document.getElementById('palpite').disabled = true;
          document.getElementById('btnTentar').disabled = true;
          jogoAtivo = false;
        }
      }, 1000);
    }

    function desenharCronometro(tempo) {
      const canvas = document.getElementById('cronometroCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height, cx=W/2, cy=H/2;
      const t = Math.max(0, Math.min(180, tempo));
      const ratio = t / 180;
      const start = -Math.PI / 2;
      const end = start + ratio * Math.PI * 2;
      ctx.clearRect(0,0,W,H);

      // Halo externo e profundidade.
      const halo=ctx.createRadialGradient(cx,cy,55,cx,cy,100);
      halo.addColorStop(0,'rgba(124,92,255,.04)');
      halo.addColorStop(.72,'rgba(72,240,202,.06)');
      halo.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);

      ctx.save();
      ctx.translate(cx,cy);
      for(let i=0;i<60;i++){
        const a=start+i*Math.PI*2/60;
        const major=i%5===0;
        const r1=major?82:86, r2=major?94:91;
        ctx.strokeStyle=major?'rgba(226,235,255,.48)':'rgba(226,235,255,.18)';
        ctx.lineWidth=major?2:1;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke();
      }
      ctx.restore();

      ctx.lineCap='round';
      ctx.lineWidth=16;
      ctx.strokeStyle='rgba(255,255,255,.09)';
      ctx.beginPath();ctx.arc(cx,cy,72,0,Math.PI*2);ctx.stroke();

      const hue = ratio>.5 ? '#48f0ca' : ratio>.2 ? '#ffd166' : '#ff4d7d';
      ctx.shadowColor=hue;ctx.shadowBlur=18;
      ctx.strokeStyle=hue;
      ctx.beginPath();ctx.arc(cx,cy,72,start,end);ctx.stroke();
      ctx.shadowBlur=0;

      const core=ctx.createRadialGradient(cx-18,cy-20,5,cx,cy,60);
      core.addColorStop(0,'rgba(40,48,88,.96)');
      core.addColorStop(1,'rgba(8,11,27,.98)');
      ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,58,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.stroke();

      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#f7f8ff';ctx.font='900 34px ui-monospace, SFMono-Regular, Consolas, monospace';
      ctx.fillText(String(t),cx,cy-4);
      ctx.fillStyle='rgba(190,202,226,.72)';ctx.font='700 10px system-ui, sans-serif';
      ctx.fillText('SEGUNDOS',cx,cy+24);
    }
function verificarPalpite() {
      const input = document.getElementById('palpite');
      const palpite = Number(input.value);
      const mensagem = document.getElementById('mensagem');
      const historico = document.getElementById('historico');
      if (!jogoAtivo) return;
      if (!Number.isInteger(palpite) || palpite < 0 || palpite > 1000) {
        mensagem.textContent = "Digite um número inteiro entre 0 e 1000.";
        input.focus();
        return;
      }

      if (tentativas === 0) iniciarCronometro();
      tentativas++;

      if (palpite === numeroSecreto) {
        mensagem.textContent = `🎉 Parabéns! Você acertou em ${tentativas} tentativas.`;
        clearInterval(cronometroInterval);
        document.getElementById('palpite').disabled = true;
        document.getElementById('btnTentar').disabled = true;
        jogoAtivo = false;
      } else if (palpite < numeroSecreto) {
        mensagem.textContent = "🔼 Tente um número maior.";
        historico.innerHTML = `<p>${palpite} ↑</p>` + historico.innerHTML;
      } else {
        mensagem.textContent = "🔽 Tente um número menor.";
        historico.innerHTML = `<p>${palpite} ↓</p>` + historico.innerHTML;
      }

      document.getElementById('palpite').value = '';
      document.getElementById('palpite').focus();
    }

    function resetarJogo() {
      numeroSecreto = Math.floor(Math.random() * 1001);
      tentativas = 0;
      tempoRestante = 180;
      jogoAtivo = true;
      clearInterval(cronometroInterval);
      document.getElementById('tempoRestante').textContent = tempoRestante;
      desenharCronometro(tempoRestante);
      document.getElementById('mensagem').textContent = '';
      document.getElementById('historico').innerHTML = '';
      document.getElementById('palpite').disabled = false;
      document.getElementById('btnTentar').disabled = false;
      document.getElementById('palpite').value = '';
      document.getElementById('palpite').focus();
    }

    document.getElementById('palpite').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        verificarPalpite();
      }
    });

    window.onload = function() {
      desenharCronometro(tempoRestante);
    };
  </script>

#historico{width:min(620px,92vw);max-height:128px;margin-top:7px!important;overflow:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:6px;scrollbar-width:thin}#historico p{margin:0!important;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#aebbd7;font:750 12px ui-monospace,monospace;animation:guessChip .22s ease both}@keyframes guessChip{from{opacity:0;transform:translateY(-5px) scale(.95)}}
body.ppg-light{--guess-text:#18213b;--guess-muted:#61708d;background:radial-gradient(circle at 15% 15%,#d9d0ff 0,transparent 28%),radial-gradient(circle at 84% 82%,#c6fff0 0,transparent 29%),linear-gradient(145deg,#f4f6fb,#e7ebf4 70%)!important}body.ppg-light #palpite{background:#fff;color:#172038;border-color:#cfd6e4}body.ppg-light #cronometro{background:rgba(255,255,255,.75)}body.ppg-light #mensagem,body.ppg-light #historico p{background:rgba(255,255,255,.66);color:#3a4864;border-color:#d7deeb}
@media(max-height:760px){body{justify-content:flex-start!important;padding-top:64px!important}h1{font-size:34px!important}#cronometro{width:174px;height:174px}#cronometroCanvas{width:160px;height:160px}#historico{max-height:76px}}
@media(max-width:520px){body{padding-inline:10px!important}h1{font-size:38px!important}#palpite{width:min(280px,76vw)}body>button{min-width:105px!important;padding-inline:13px!important}}
</style>
