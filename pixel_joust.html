<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#192239">
<title>Pixel Joust — Impact Duel</title>
<style>
:root{
  --ink:#161b27; --panel:#111827e8; --paper:#f3ecd2; --gold:#f2c14e; --blue:#7fb3ff;
  --red:#e7685a; --green:#7fcf75; --wood:#8b5435; --silver:#d7deea; --bronze:#cf8e3b;
}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1424;color:#fff}
body{font-family:Consolas,"Courier New",monospace;touch-action:none;user-select:none}
button,select{font:inherit}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#263a62,#0d1424 72%)}
#gameShell{position:relative;width:min(100vw,1200px);height:min(100vh,720px);aspect-ratio:5/3;overflow:hidden;border:4px solid #090d16;background:#7fb5e8;box-shadow:0 18px 70px #000a;image-rendering:pixelated}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#topbar{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.cluster{display:flex;gap:8px;align-items:center}.mini{pointer-events:auto;background:#111827d9;border:2px solid #060a12;color:#fff;padding:7px 9px;box-shadow:inset 0 0 0 2px #ffffff14;cursor:pointer}.mini:hover{filter:brightness(1.18)}
#hud{position:absolute;z-index:4;inset:0;pointer-events:none;display:none}.hudBlock{position:absolute;top:50px;width:360px;padding:10px 12px;background:#101827d9;border:3px solid #080b12;box-shadow:inset 0 0 0 2px #ffffff12}.hudBlock.player{left:18px}.hudBlock.enemy{right:18px;text-align:right}.nameRow{display:flex;justify-content:space-between;gap:12px;font-weight:900;text-shadow:2px 2px #000}.enemy .nameRow{flex-direction:row-reverse}.bar{height:15px;margin-top:7px;background:#080c13;border:2px solid #05070c}.fill{height:100%;width:100%;transition:width .18s}.fill.balance{background:linear-gradient(90deg,#72ce78,#e5c24a,#d95d52)}.enemy .fill{margin-left:auto}.subRow{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:#d7dfef}.enemy .subRow{flex-direction:row-reverse}
#scoreCenter{position:absolute;top:48px;left:50%;transform:translateX(-50%);min-width:215px;text-align:center;background:#111827e8;border:3px solid #070a11;padding:7px 12px;font-weight:900}.passDots{display:flex;gap:7px;justify-content:center;margin-top:6px}.dot{width:12px;height:12px;border:2px solid #060910;background:#556070}.dot.done{background:var(--gold)}
#message{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;text-align:center;font-weight:900;font-size:clamp(18px,3.8vw,44px);text-shadow:4px 4px #000;letter-spacing:1px;opacity:0;transition:opacity .12s}.smallMessage{display:block;font-size:.38em;margin-top:8px;color:#fff2b0;max-width:760px}
#aimHelp{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:5;background:#101827d7;border:2px solid #080b12;padding:7px 12px;font-size:12px;text-align:center;display:none}
.screen{position:absolute;z-index:12;inset:0;display:grid;place-items:center;background:linear-gradient(#15213a66,#08101bd9);padding:18px}.panel{width:min(720px,94%);max-height:94%;overflow:auto;background:#111827f2;border:4px solid #060911;box-shadow:inset 0 0 0 3px #ffffff12,10px 10px 0 #0007;padding:28px;text-align:center}.title{font-size:clamp(34px,7vw,70px);line-height:.9;margin:5px 0;color:#f5d36a;text-shadow:5px 5px #6c3b24,8px 8px #000}.subtitle{color:#c8d8ef;font-weight:700;margin:10px auto 20px;max-width:560px}.menuRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.bigBtn{min-width:150px;background:#d8dee9;border:4px solid #080b12;padding:12px 15px;color:#101522;font-weight:900;cursor:pointer;box-shadow:inset -4px -4px #8994a6,inset 4px 4px #fff}.bigBtn:hover,.bigBtn.active{transform:translateY(-2px);background:#f2c14e;box-shadow:inset -4px -4px #9d6727,inset 4px 4px #fff0a6}.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;text-align:left;margin:18px 0}.rule{background:#0a1120;border:2px solid #28354a;padding:10px;font-size:13px}.kbd{display:inline-block;background:#e5e9f0;color:#111722;border:2px solid #05080d;padding:2px 6px;font-weight:900;text-shadow:none}.legend{font-size:12px;color:#aab7c9;margin-top:12px}#restartHint{margin-top:12px;color:#f5d36a;font-weight:900;letter-spacing:.04em}body.preview #topbar,body.preview #touch,body.preview #aimHelp{display:none!important}
#touch{position:absolute;z-index:8;left:0;right:0;bottom:9px;display:none;justify-content:space-between;padding:0 10px;pointer-events:none}.touchGroup{display:flex;gap:8px;align-items:flex-end}.touchBtn{pointer-events:auto;width:62px;height:52px;border:3px solid #070a11;background:#111827c9;color:#fff;font-weight:900;box-shadow:inset 0 0 0 2px #ffffff18;touch-action:none}.touchBtn:active,.touchBtn.on{background:#d49d38;color:#101522}.touchBtn.space{width:112px;background:#334662d9}
#summaryStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#0a1120;border:2px solid #28354a;padding:10px}.stat b{display:block;color:#f2c14e;font-size:22px}.shake{animation:shake .22s linear}.bigshake{animation:bigshake .28s linear}@keyframes shake{25%{transform:translate(4px,-2px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,1px)}}@keyframes bigshake{20%{transform:translate(-8px,3px) scale(1.005)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
@media(max-width:760px){#gameShell{width:100vw;height:100vh;border:0;aspect-ratio:auto}.hudBlock{width:42%;top:43px;padding:6px}.hudBlock.player{left:5px}.hudBlock.enemy{right:5px}.subRow{font-size:9px}.nameRow{font-size:11px}#scoreCenter{top:40px;min-width:145px;font-size:11px;padding:5px}.panel{padding:18px}.rules{grid-template-columns:1fr}.legend{display:none}#touch{display:flex}#aimHelp{bottom:68px;font-size:10px}.mini{padding:5px 7px;font-size:11px}}
@media(pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap"><div id="gameShell">
<canvas id="game" width="1200" height="720"></canvas>
<div id="topbar"><div class="cluster"><button class="mini" id="hallBtn">⌂ HALL</button><button class="mini" id="langBtn">PT</button></div><div class="cluster"><button class="mini" id="soundBtn">🔊 SOM</button><button class="mini" id="fsBtn" title="Tela cheia">⛶</button><button class="mini" id="pauseBtn" style="display:none">Ⅱ</button></div></div>
<div id="hud">
  <div class="hudBlock player"><div class="nameRow"><span id="pName">VOCÊ</span><span id="pScore">0</span></div><div class="bar"><div id="pBal" class="fill balance"></div></div><div class="subRow"><span id="pPower">ESPADA 0%</span><span id="pShield">ESCUDO ↑</span></div></div>
  <div id="scoreCenter"><div id="passText">PASSADA 1 / 5</div><div class="passDots" id="passDots"></div></div>
  <div class="hudBlock enemy"><div class="nameRow"><span id="eName">SIR CEDRIC</span><span id="eScore">0</span></div><div class="bar"><div id="eBal" class="fill balance"></div></div><div class="subRow"><span id="ePower">ESPADA 0%</span><span id="eShield">ESCUDO ↑</span></div></div>
</div>
<div id="message"></div><div id="aimHelp"></div>
<div id="touch"><div class="touchGroup"><button class="touchBtn" data-key="KeyW">W<br>🛡↑</button><button class="touchBtn" data-key="KeyS">S<br>🛡↓</button></div><div class="touchGroup"><button class="touchBtn space" data-key="KeyN">N<br>⚔↑</button><button class="touchBtn space" data-key="KeyM">M<br>⚔↓</button></div></div>
<div class="screen" id="menu"><div class="panel"><div class="title">PIXEL<br>JOUST</div><div class="subtitle" id="menuSub"></div><div class="menuRow" id="diffRow"><button class="bigBtn" data-diff="Easy">FÁCIL</button><button class="bigBtn active" data-diff="Normal">NORMAL</button><button class="bigBtn" data-diff="Hard">DIFÍCIL</button></div><div class="rules" id="rules"></div><button class="bigBtn" id="playBtn">⚔ JOGAR</button><div class="legend" id="legend"></div></div></div>
<div class="screen" id="end" style="display:none"><div class="panel"><h1 class="title" id="endTitle">VITÓRIA</h1><div class="subtitle" id="endSub"></div><div id="summaryStats"></div><div class="menuRow"><button class="bigBtn" id="againBtn">↻ NOVAMENTE</button><button class="bigBtn" id="menuBtn">MENU</button></div><div class="legend" id="restartHint">ENTER / ESPAÇO / R — NOVA CORRIDA</div></div></div>
</div></div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d'); const W=1200,H=720;
const $=id=>document.getElementById(id); const shell=$('gameShell');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const Store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
const QS=new URLSearchParams(location.search),PREVIEW=QS.get('preview')==='1',EMBEDDED=QS.get('embedded')==='1';
const PORTAL_STATS_KEY='ppg_minigames_stats_v1',GAME_ID='pixel_joust';
if(PREVIEW)document.body.classList.add('preview');
function portalRead(){try{return JSON.parse(localStorage.getItem(PORTAL_STATS_KEY))||{}}catch(e){return {}}}
function portalWrite(v){try{localStorage.setItem(PORTAL_STATS_KEY,JSON.stringify(v))}catch(e){}}
let portalSegmentStart=0,portalSessionActive=false;
function portalStartRun(){if(PREVIEW)return;portalPauseTime();portalSessionActive=true;const all=portalRead(),st=all[GAME_ID]||{},day=new Date().toISOString().slice(0,10);let streak=st.currentStreak||0;if(st.lastDay!==day){if(st.lastDay){const diff=(new Date(day+'T12:00:00')-new Date(st.lastDay+'T12:00:00'))/86400000;streak=diff===1?streak+1:1}else streak=1}st.starts=(st.starts||0)+1;st.currentStreak=streak;st.longestStreak=Math.max(st.longestStreak||0,streak);st.lastDay=day;st.lastStarted=Date.now();all[GAME_ID]=st;portalWrite(all);portalSegmentStart=performance.now()}
function portalCommitActiveTime(){if(PREVIEW||!portalSegmentStart)return;const all=portalRead(),st=all[GAME_ID]||{};st.totalSeconds=(st.totalSeconds||0)+Math.max(0,(performance.now()-portalSegmentStart)/1000);st.lastPlayed=Date.now();all[GAME_ID]=st;portalWrite(all);portalSegmentStart=performance.now()}
function portalPauseTime(){if(!portalSegmentStart)return;portalCommitActiveTime();portalSegmentStart=0}
function portalResumeTime(){if(!PREVIEW&&portalSessionActive&&state==='playing'&&!paused&&!portalSegmentStart)portalSegmentStart=performance.now()}
function leaveToHall(){portalPauseTime();portalSessionActive=false;if(EMBEDDED&&parent!==window){parent.postMessage({type:'ppg-exit-game'},location.origin)}else location.href='index.html'}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();try{screen.orientation?.unlock?.()}catch(e){}}else{await document.documentElement.requestFullscreen?.({navigationUI:'hide'});try{await screen.orientation?.lock?.('landscape')}catch(e){}}}catch(e){}}
window.addEventListener('pagehide',portalPauseTime);setInterval(()=>{if(portalSegmentStart)portalCommitActiveTime()},30000);

const T={
 pt:{sub:'Duelo de cavalaria com aço, escudo e decisões questionáveis tomadas a 40 km/h.',play:'⚔ JOGAR',rules:[['W / S','Escudo alto / baixo. Intercepte a lâmina antes que ela encontre você.'],['N / M','Espada alta / baixa. Segure para armar o golpe e acumular potência.'],['FINTA','Trocar N↔M muda o alvo, mas sacrifica parte da potência acumulada.'],['OBJETIVO','Marque pontos em 5 passadas ou desmonte o rival.']],legend:'A espada agora colide de verdade com escudo, elmo e corpo. O chão continua invicto.',pass:'PASSADA',lance:'ESPADA',shield:'ESCUDO',high:'↑ ALTO',low:'↓ BAIXO',you:'VOCÊ',pause:'PAUSADO',ready:'PREPARE-SE',readSub:'W/S protege • N/M arma o golpe. O cavalo cuida da parte de correr sem perguntar.',impact:'IMPACTO!',blocked:'APARADO!',glance:'RASPÃO!',clean:'ACERTO LIMPO',break:'ESPADA QUEBROU!',dismount:'DESMONTADO!',miss:'PASSOU LONGE!',draw:'EMPATE — MORTE SÚBITA',victory:'VITÓRIA!',defeat:'DERROTA',again:'↻ NOVAMENTE',menu:'MENU',restart:'ENTER / ESPAÇO / R — NOVA CORRIDA',pts:'PTS',best:'RECORDE',acc:'PRECISÃO',breaks:'QUEBRAS',passes:'PASSADAS',endWin:'Você dominou a pista. Seu cavalo exige participação nos lucros.',endLose:'O rival levou a melhor. O chão, como sempre, permaneceu neutro.',perfect:'GOLPE PERFEITO',soundOn:'🔊 SOM',soundOff:'🔇 MUDO',help:'W/S: escudo alto/baixo • N/M: espada alta/baixa (segure para potência)'},
 en:{sub:'Mounted steel, shield work, and questionable decisions made at full gallop.',play:'⚔ PLAY',rules:[['W / S','Shield high / low. Put metal between blade and knight.'],['N / M','Sword high / low. Hold to wind up and build power.'],['FEINT','Switching N↔M changes target but sacrifices some stored power.'],['GOAL','Score through 5 passes or dismount your rival.']],legend:'The sword now physically collides with shield, helmet and body. Gravity remains undefeated.',pass:'PASS',lance:'SWORD',shield:'SHIELD',high:'↑ HIGH',low:'↓ LOW',you:'YOU',pause:'PAUSED',ready:'GET READY',readSub:'W/S guards • N/M attacks. The horse handles the running without a committee meeting.',impact:'IMPACT!',blocked:'PARRIED!',glance:'GLANCING HIT!',clean:'CLEAN HIT',break:'SWORD BROKE!',dismount:'DISMOUNTED!',miss:'WIDE MISS!',draw:'DRAW — SUDDEN DEATH',victory:'VICTORY!',defeat:'DEFEAT',again:'↻ AGAIN',menu:'MENU',restart:'ENTER / SPACE / R — NEW RUN',pts:'PTS',best:'BEST',acc:'ACCURACY',breaks:'BREAKS',passes:'PASSES',endWin:'You ruled the lists. Your horse requests royalties.',endLose:'Your rival had the better run. Gravity stayed impartial.',perfect:'PERFECT STRIKE',soundOn:'🔊 SOUND',soundOff:'🔇 MUTED',help:'W/S: shield high/low • N/M: sword high/low (hold for power)'}
};
let lang=Store.get('pixelJoustLang')||'pt', difficulty=Store.get('pixelJoustDifficulty')||'Normal';
const DIF={Easy:{run:4.7,react:.60,skill:.42,feint:.10,wobble:1.15},Normal:{run:4.15,react:.34,skill:.68,feint:.28,wobble:1},Hard:{run:3.65,react:.20,skill:.84,feint:.48,wobble:.88}};
let state='menu',paused=false,last=0,simTime=0,slow=1,messageUntil=0,messageText='',messageSub='',shakeTimer=0,flash=0;
const keys={}; const pointerButtons=[...document.querySelectorAll('.touchBtn')];
let pass=1,maxPasses=5,sudden=false,suddenCount=0,runT=0,impactDone=false,postT=0,scoreP=0,scoreE=0,judgeP=0,judgeE=0,totalHits=0,totalAttacks=0,breaks=0;
let particles=[],crowdPulse=0,confetti=[];
const makeFighter=(player)=>({player,x:player?125:1075,y:515,aim:.48,aimVis:.48,shield:'high',couched:false,couchT:0,power:0,balance:100,lanceIntegrity:100,broken:false,recoil:0,fall:0,fallRot:0,hitFlash:0,scoreFlash:0,weaponDir:null,lastWeaponDir:null,aiTarget:.34,aiGuard:'high',aiThink:0,aiCommit:0,aiFeintDone:false});
let P=makeFighter(true),E=makeFighter(false);

// -------- Audio: fully procedural Web Audio --------
let AC=null,master=null,musicGain=null,sfxGain=null,muted=false,musicTimer=0,gallopTick=0;
function audioInit(){if(AC)return; AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();musicGain=AC.createGain();sfxGain=AC.createGain();master.gain.value=.7;musicGain.gain.value=.18;sfxGain.gain.value=.55;musicGain.connect(master);sfxGain.connect(master);master.connect(AC.destination)}
function tone(freq,dur=.08,type='square',vol=.12,when=0,out=sfxGain){if(!AC||muted)return;let t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.03)}
function noise(dur=.12,vol=.18,cut=1200){if(!AC||muted)return;let n=Math.max(1,Math.floor(AC.sampleRate*dur)),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=cut;g.gain.value=vol;s.buffer=buf;s.connect(f);f.connect(g);g.connect(sfxGain);s.start()}
function sfx(k){audioInit();if(AC.state==='suspended')AC.resume();if(k==='ui'){tone(500,.05,'square',.07)}if(k==='couch'){tone(360,.045,'triangle',.05);tone(520,.07,'square',.035,.025)}if(k==='swish'){noise(.055,.055,4200);tone(250,.045,'triangle',.035)}if(k==='block'){noise(.11,.22,1800);tone(160,.18,'square',.18);tone(640,.05,'square',.08)}if(k==='hit'){noise(.18,.28,1100);tone(92,.22,'square',.22);tone(180,.1,'sawtooth',.13)}if(k==='break'){noise(.32,.32,2500);tone(110,.3,'sawtooth',.18);for(let i=0;i<5;i++)tone(380+i*70,.08,'square',.06,i*.025)}if(k==='cheer'){for(let i=0;i<7;i++)tone(220+rnd(-40,80),.3,'square',.035,i*.04)}if(k==='win'){[262,330,392,523].forEach((f,i)=>tone(f,.28,'square',.1,i*.12))}if(k==='lose'){[330,294,247,196].forEach((f,i)=>tone(f,.28,'square',.08,i*.12))}}
function musicStep(dt){if(!AC||muted||state!=='playing'||paused)return;musicTimer-=dt;if(musicTimer<=0){musicTimer=.32;let seq=[110,147,165,147,123,147,196,165],i=Math.floor(simTime/.32)%seq.length;tone(seq[i],.22,'triangle',.035,0,musicGain);if(i%2===0)tone(seq[i]*2,.07,'square',.018,.04,musicGain)}}
function gallopSound(dt){if(state!=='playing'||impactDone||paused)return;gallopTick-=dt;if(gallopTick<=0){gallopTick=.22-rnd(0,.025);noise(.045,.045,420);tone(72,.035,'triangle',.035)}}

function setLang(){let t=T[lang];document.documentElement.lang=lang==='pt'?'pt-BR':'en';$('langBtn').textContent=lang.toUpperCase();$('menuSub').textContent=t.sub;$('playBtn').textContent=t.play;$('legend').textContent=t.legend;$('rules').innerHTML=t.rules.map(r=>`<div class="rule"><span class="kbd">${r[0]}</span><br>${r[1]}</div>`).join('');$('againBtn').textContent=t.again;$('menuBtn').textContent=t.menu;$('restartHint').textContent=t.restart;$('pName').textContent=t.you;$('soundBtn').textContent=muted?t.soundOff:t.soundOn;$('aimHelp').textContent=t.help;updateHUD()}
function updateHUD(){let t=T[lang];$('pScore').textContent=scoreP;$('eScore').textContent=scoreE;$('pBal').style.width=P.balance+'%';$('eBal').style.width=E.balance+'%';$('pPower').textContent=`${t.lance} ${Math.round(P.power*100)}%`;$('ePower').textContent=`${t.lance} ${Math.round(E.power*100)}%`;$('pShield').textContent=`${t.shield} ${P.shield==='high'?t.high:t.low}`;$('eShield').textContent=`${t.shield} ${E.shield==='high'?t.high:t.low}`;$('passText').textContent=sudden?t.draw:`${t.pass} ${pass} / ${maxPasses}`;$('passDots').innerHTML=Array.from({length:maxPasses},(_,i)=>`<i class="dot ${i<pass-1?'done':''}"></i>`).join('')}
function showMsg(main,sub='',sec=1){messageText=main;messageSub=sub;messageUntil=simTime+sec;let el=$('message');el.innerHTML=main+(sub?`<span class="smallMessage">${sub}</span>`:'');el.style.opacity=1}
function hideMsg(){if(simTime>messageUntil)$('message').style.opacity=0}
function setDiff(d){difficulty=d;Store.set('pixelJoustDifficulty',d);document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('active',b.dataset.diff===d))}

function startGame(){audioInit();sfx('ui');portalStartRun();state='playing';paused=false;pass=1;maxPasses=5;sudden=false;suddenCount=0;scoreP=scoreE=judgeP=judgeE=0;totalHits=totalAttacks=breaks=0;P=makeFighter(true);E=makeFighter(false);$('menu').style.display='none';$('end').style.display='none';$('hud').style.display='block';$('pauseBtn').style.display='block';$('aimHelp').style.display='block';beginPass()}
function beginPass(){runT=0;impactDone=false;postT=0;P.x=125;E.x=1075;P.aim=.48;P.aimVis=.48;E.aim=.48;E.aimVis=.48;P.shield='high';E.shield=Math.random()<.5?'high':'low';P.couched=E.couched=false;P.couchT=E.couchT=0;P.power=E.power=0;P.weaponDir=E.weaponDir=null;P.lastWeaponDir=E.lastWeaponDir=null;P.broken=E.broken=false;P.lanceIntegrity=E.lanceIntegrity=100;P.recoil=E.recoil=0;P.fall=E.fall=0;P.fallRot=E.fallRot=0;E.aiTarget=Math.random()<.5?.30:.69;E.aiGuard=Math.random()<.5?'high':'low';E.aiThink=DIF[difficulty].react;E.aiCommit=rnd(.75,1.28);E.aiFeintDone=false;particles.length=0;showMsg(T[lang].ready,T[lang].readSub,1.2);updateHUD()}

function drawParticles(){for(let p of particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.kind==='wood'?'#8a512f':p.kind==='metal'?'#e2e6ec':'#ffd55c';ctx.fillRect(-p.size/2,-p.size/2,p.kind==='wood'?p.size*2:p.size,p.size);ctx.restore()}for(let q of confetti){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-4,-2,8,4);ctx.restore()}}
function drawImpactFlash(){if(flash<=0)return;ctx.save();ctx.globalAlpha=flash*.45;ctx.fillStyle='#fff6cf';ctx.fillRect(0,0,W,H);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawBackground();drawHorse(P,false);drawHorse(E,true);drawAimGuide(P,E);drawAimGuide(E,P);drawMetersOnField(P);drawMetersOnField(E);drawParticles();drawImpactFlash();if(paused&&state==='playing'){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 38px monospace';ctx.textAlign='center';ctx.fillText(T[lang].pause,W/2,H/2)}}

function tick(ts){requestAnimationFrame(tick);let dt=Math.min(.033,(ts-last)/1000||0);last=ts;if(paused){draw();return}dt*=slow;simTime+=dt;if(state==='playing'){if(!impactDone)updateRun(dt);else postImpact(dt);hideMsg()}updateParticles(dt);flash=Math.max(0,flash-dt*4.5);if(shakeTimer>0){shakeTimer-=dt;if(!shell.classList.contains('bigshake')){shell.classList.add('bigshake');setTimeout(()=>shell.classList.remove('bigshake'),280)}}draw();updateHUD()}
requestAnimationFrame(tick);

// -------- input --------
window.addEventListener('keydown',e=>{if(['KeyW','KeyS','KeyN','KeyM','Space','Enter','KeyR','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(state==='end'&&['Enter','Space','KeyR'].includes(e.code)){startGame();return}if(state==='menu'&&e.code==='Enter'){startGame();return}if(e.code==='KeyP'||e.code==='Escape'){if(state==='playing')togglePause();return}keys[e.code]=true;if(state==='playing'&&e.code==='KeyW')P.shield='high';if(state==='playing'&&e.code==='KeyS')P.shield='low'});window.addEventListener('keyup',e=>{keys[e.code]=false});
pointerButtons.forEach(b=>{let code=b.dataset.key;const on=e=>{e.preventDefault();keys[code]=true;b.classList.add('on')},off=e=>{e.preventDefault();keys[code]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
function togglePause(){paused=!paused;if(paused)portalPauseTime();else portalResumeTime();sfx('ui')}
$('playBtn').onclick=startGame;$('againBtn').onclick=startGame;$('menuBtn').onclick=()=>{portalPauseTime();portalSessionActive=false;sfx('ui');state='menu';$('end').style.display='none';$('menu').style.display='grid';confetti.length=0};$('hallBtn').onclick=leaveToHall;$('fsBtn').onclick=toggleFullscreen;$('pauseBtn').onclick=togglePause;$('soundBtn').onclick=()=>{audioInit();muted=!muted;if(master)master.gain.value=muted?0:.7;setLang()};$('langBtn').onclick=()=>{lang=lang==='pt'?'en':'pt';Store.set('pixelJoustLang',lang);setLang()};document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{sfx('ui');setDiff(b.dataset.diff)});
setDiff(difficulty);setLang();if(PREVIEW){muted=true;if(master)master.gain.value=0;setLang();setTimeout(startGame,50)}
})();
</script>
