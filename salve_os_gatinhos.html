function seeded01(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function parallaxX(depth) {
  // One shared projection rule keeps every layer visually locked to the same camera rig.
  const inertial = camera25D.x * depth;
  const directional = camera25D.lean * Math.min(1.25, depth * 2.8);
  return Math.round(inertial + directional);
}
function panForX(x) { return clamp((x / W) * 2 - 1, -0.82, 0.82); }

// --------------------------------------------------------------------------

// --------------------------------------------------------------------------
let ac = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let bgmTimer = null;
let bgmStep = 0;

function audioInit() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    masterGain = ac.createGain();
    musicGain = ac.createGain();
    sfxGain = ac.createGain();
    masterGain.gain.value = muted ? 0.0001 : 0.34;
    musicGain.gain.value = 0.34;
    sfxGain.gain.value = 0.78;
    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
  applyAudioState();
  startBGM();
}

function applyAudioState() {
  if (!ac || !masterGain) return;
  const now = ac.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setTargetAtTime(muted ? 0.0001 : 0.34, now, 0.015);
}

function playTone(freq, dur, type = 'square', vol = .1, slide = 0, when = 0, bus = 'sfx', pan = 0) {
  if (muted || !ac || freq <= 0 || dur <= 0) return;
  const t = ac.currentTime + when;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  const targetBus = bus === 'music' ? musicGain : sfxGain;
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(20, freq), t);
  if (slide !== 0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  gain.gain.setValueAtTime(Math.max(.0001, vol), t);
  gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
  osc.connect(gain);
  if (ac.createStereoPanner && Math.abs(pan) > .01) {
    const panner = ac.createStereoPanner();
    panner.pan.setValueAtTime(clamp(pan, -1, 1), t);
    gain.connect(panner);
    panner.connect(targetBus);
  } else gain.connect(targetBus);
  osc.start(t);
  osc.stop(t + dur + .02);
}

function playSfx(type, param = 1, pan = 0) {
  if (muted || !ac) return;
  const tone = (freq, dur, wave = 'square', vol = .1, slide = 0, when = 0) => playTone(freq, dur, wave, vol, slide, when, 'sfx', pan);
  switch (type) {
    case 'spawn':
      tone(620, .075, 'triangle', .10, 210);
      tone(900, .11, 'sine', .08, -225, .05);
      break;
    case 'danger':
      tone(510, .055, 'triangle', .05, 90);
      tone(720, .06, 'sine', .038, -80, .045);
      break;
    case 'catch': {
      const base = 320 + Math.min(param, 12) * 37;
      tone(base, .10, 'triangle', .18, 130);
      tone(base * 1.5, .14, 'square', .075, 75, .045);
      break;
    }
    case 'perfect':
      tone(659, .07, 'square', .105, 0);
      tone(880, .09, 'triangle', .11, 0, .055);
      tone(1174, .15, 'sine', .105, 80, .11);
      break;
    case 'golden':
      [523, 659, 784, 1046].forEach((n, i) => tone(n, i === 3 ? .22 : .09, 'square', .115, i === 3 ? 90 : 0, i * .075));
      break;
    case 'miss':
      tone(185, .22, 'sawtooth', .13, -105);
      tone(96, .28, 'triangle', .145, -42, .04);
      break;
    case 'life':
      tone(440, .08, 'sine', .145, 110);
      tone(660, .09, 'sine', .13, 130, .07);
      tone(880, .20, 'sine', .135, 0, .14);
      break;
    case 'phase':
      tone(196, .12, 'square', .10, 45);
      tone(294, .12, 'square', .09, 70, .09);
      tone(392, .18, 'triangle', .10, 90, .18);
      break;
    case 'gameover':
      tone(330, .16, 'triangle', .13, -60);
      tone(220, .22, 'square', .10, -80, .12);
      tone(110, .36, 'triangle', .145, -50, .28);
      break;
  }
}

function startBGM() {
  if (bgmTimer || !ac) return;
  const bass = [110, 110, 146.83, 110, 164.81, 146.83, 130.81, 123.47];
  const lead = [440, 0, 523.25, 587.33, 659.25, 523.25, 440, 392];
  bgmTimer = setInterval(() => {
    if (state !== 'play' || muted || !ac) return;
    const step = bgmStep++;
    const intensity = difficultyAt();
    const b = bass[step % bass.length];
    const l = lead[step % lead.length];
    if (step % 2 === 0) playTone(b, .14, 'triangle', .055, -7, 0, 'music');
    if (l && (step % 2 || intensity > .48)) playTone(l, .075, 'square', .026 + intensity * .008, 0, .015, 'music');
    if (step % 4 === 0) playTone(92, .09, 'sine', .07, -52, 0, 'music');
    if (intensity > .30 && step % 2 === 1) playTone(1040 + (step % 3) * 90, .025, 'square', .010 + intensity * .004, -80, 0, 'music');
    if (intensity > .62 && step % 4 === 3) playTone(1568, .018, 'square', .009, -160, 0, 'music');
    if (combo >= 8 && step % 4 === 2) playTone(784, .05, 'triangle', .018, 80, .02, 'music');
  }, 188);
}

function setGameSound(on) {
  muted = !on;
  ui.sound.textContent = muted ? '🔇' : '🔊';

  if (on) audioInit();
  applyAudioState();
}

function difficultyAt(seconds = elapsed) {
  // Pequena zona de aprendizado seguida por uma curva smoothstep: o jogo deixa
  // o jogador aprender a inércia antes de empilhar pressão, mas ainda fecha forte.
  const span = Math.max(1, CFG.difficultySeconds - CFG.difficultyGrace);
  const raw = Math.min(1, Math.max(0, (seconds - CFG.difficultyGrace) / span));
  return raw * raw * (3 - 2 * raw);
}

function phaseIndexFor(seconds) {
  let idx = 0;
  for (let i = 1; i < PHASES.length; i++) if (seconds >= PHASES[i].at) idx = i;
  return idx;
}

function showToast(text) {
  ui.toast.textContent = text;
  ui.toast.classList.add('showToast');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ui.toast.classList.remove('showToast'), 1450);
}

  score = 0;
  lives = CFG.maxLives;
  combo = 1;
  maxCombo = 1;
  rescueCount = 0;
  perfectCount = 0;
  elapsed = 0;
  spawnTimer = 1.45;
  sceneCheckTimer = 2.4;
  smokeAccumulator = 0;
  shake = 0;
  flash = 0;
  trampolineBounce = 0;
  currentPhase = 0;
  level = 1; levelProgress = 0; runCoins = 0; collectedThisRun = [];
  player.w = 106 + meta.upgrades.width * 8;
  player.acc = 2860 * (1 + meta.upgrades.acceleration * .08);
  player.insuranceReady = meta.upgrades.insurance > 0;
  mouseTargetX = null;
  camera25D.x = camera25D.targetX = camera25D.lean = camera25D.kick = camera25D.settle = 0;
  cats.length = 0;
  particles.length = 0;
  floatTexts.length = 0;

  windows.forEach(w => { w.scene = null; w.spawnGlow = 0; });

function syncUI() {
  ui.score.textContent = String(score).padStart(6, '0');
  ui.combo.textContent = `COMBO x${combo}`;
  ui.combo.style.transform = combo > 1 ? `scale(${Math.min(1.22, 1.04 + combo * .012)})` : 'scale(1)';
  ui.lives.textContent = lives > 0 ? '♥ '.repeat(lives).trim() : 'SEM VIDAS';
  ui.phase.textContent = `NÍVEL ${level} · ${LEVELS[Math.min(level-1,LEVELS.length-1)].name} · 🪙 ${meta.coins}`;
  ui.perfect.textContent = `PERFEITOS ${perfectCount}`;
}

function rescueGrade() {
  if (rescueCount >= 32 && maxCombo >= 10 && perfectCount >= 8) return 3;
  if (rescueCount >= 16 && maxCombo >= 6) return 2;
  return 1;
}

function gameOver() {
  if (state !== 'play') return;
  state = 'over';
  playSfx('gameover');
  const previousBest = Number(meta.bestScore) || 0;
  const isRecord = score > previousBest;
  meta.bestScore = Math.max(previousBest, score);
  meta.bestRescues = Math.max(Number(meta.bestRescues) || 0, rescueCount);
  meta.bestCombo = Math.max(Number(meta.bestCombo) || 1, maxCombo);
  meta.bestPerfect = Math.max(Number(meta.bestPerfect) || 0, perfectCount);
  writeJSON(META_KEY, meta);
  window.PPG?.recordScore?.(score);

  const paws = '🐾'.repeat(rescueGrade()) + '▫️'.repeat(3 - rescueGrade());
  ui.title.textContent = isRecord ? 'NOVO RECORDE!' : 'FIM DO RESGATE';
  ui.message.innerHTML =
    `Avaliação: <b>${paws}</b><br>` +
    `Gatinhos salvos: <b>${rescueCount}</b> • Perfeitos: <b>${perfectCount}</b><br>` +
    `Maior combo: <b>x${maxCombo}</b> • Pontos: <b>${score}</b><br>` +
    `Moedas no resgate: <b>🪙 ${runCoins}</b> • Nível: <b>${level}</b><br>` +
    `Colecionáveis novos: <b>${collectedThisRun.length ? collectedThisRun.join(', ') : 'nenhum'}</b><br>` +
    `Melhor marca local: <b>${meta.bestScore}</b>`;
  ui.start.textContent = 'TENTAR NOVAMENTE';
  ui.overlay.classList.remove('hidden');
}

// --------------------------------------------------------------------------
// SPAWN, CENAS E EFEITOS
// --------------------------------------------------------------------------
function chooseSpawnWindow() {
  let available = windows.filter(w => w.f <= 2 && !w.fire);
  const difficulty = difficultyAt();
  const playerCenter = player.x + player.w / 2;

  // Fairness espacial: janelas mais baixas dão menos tempo de reação, então o
  // alcance permitido também diminui. A dificuldade aperta a margem, não a lógica.
  const fair = available.filter(w => {
    const spawnY = w.wy + 31;
    const fallDistance = Math.max(0, player.y - spawnY);
    const reachable = 240 + fallDistance * .50 - difficulty * 55;
    return Math.abs(w.x - playerCenter) <= reachable;
  });
  if (fair.length) available = fair;

  // Com várias quedas, evita abrir uma segunda ameaça no extremo oposto da tela.
  if (cats.length) {
    const lastCat = cats[cats.length - 1];
    const cluster = available.filter(w => Math.abs(w.x - lastCat.x) < 390 - difficulty * 35);
    if (cluster.length) available = cluster;
  }
  return available[(Math.random() * available.length) | 0];
}

function spawnCat() {
  const difficulty = difficultyAt();
  const win = chooseSpawnWindow();
  if (!win) return;
  win.lit = true;
  win.spawnGlow = .7;

  const cfgLevel = LEVELS[Math.min(level-1, LEVELS.length-1)];
  const availableObjects = FALLING_OBJECTS.filter(o => o.unlock <= level);
  const spawnObject = availableObjects.length && Math.random() < cfgLevel.objectChance;
  const isGolden = !spawnObject && Math.random() < (.045 + difficulty * .045);
  const type = spawnObject ? availableObjects[(Math.random()*availableObjects.length)|0] : CAT_TYPES[isGolden ? 4 : ((Math.random() * 4) | 0)];
  const centerPull = (W / 2 - win.x) * .028;
  cats.push({
    kind: spawnObject ? 'object' : 'cat',
    x: win.x,
    y: win.wy + 31,
    vx: (Math.random() - .5) * (20 + difficulty * 28) + centerPull * difficulty,
    vy: -24 - Math.random() * 16,
    r: 12,
    rot: (Math.random() - .5) * .18,
    spin: (Math.random() - .5) * (2.35 + difficulty * .8),
    air: .86 + Math.random() * .24,
    gustSeed: Math.random() * Math.PI * 2,
    warned: false,
    type,
    wiggle: Math.random() * 6,
    trail: 0
  });
  addBurst(win.x, win.wy + 29, isGolden ? '#fff198' : '#ffd166', isGolden ? 11 : 6, isGolden ? 55 : 35);
  playSfx('spawn', 1, panForX(win.x));
}

function updateWindowScenes(dt) {
  sceneCheckTimer -= dt;
  for (const w of windows) {
    w.spawnGlow = Math.max(0, w.spawnGlow - dt);
    if (!w.scene) continue;
    w.scene.t += dt;
    if (w.scene.t >= w.scene.dur) w.scene = null;
  }
  if (sceneCheckTimer > 0) return;
  sceneCheckTimer = 4.2 + Math.random() * 4.2;
  const activeCount = windows.filter(w => w.scene).length;
  if (activeCount >= 2 || Math.random() >= .68) return;
  const candidates = windows.filter(w => w.lit && !w.fire && !w.scene && w.f > 0 && w.spawnGlow <= 0);
  if (!candidates.length) return;
  const picked = candidates[(Math.random() * candidates.length) | 0];
  picked.scene = { type: SCENE_TYPES[(Math.random() * SCENE_TYPES.length) | 0], t: 0, dur: 9 + Math.random() * 10 };
}

function addBurst(x, y, color, count = 10, speed = 80) {
  const room = Math.max(0, CFG.maxParticles - particles.length);
  count = Math.min(count, room);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = Math.random() * speed + 18;
    particles.push({
      x, y,
      vx: Math.cos(angle) * s,
      vy: Math.sin(angle) * s - 22,
      life: .38 + Math.random() * .38,
      maxLife: .76,
      color,
      size: 2 + Math.random() * 3,
      depth: Math.random() < .24 ? 0 : (Math.random() < .72 ? 1 : 2)
    });
  }
}

function addFloatText(x, y, text, color = '#ffd166', life = .78) {
  floatTexts.push({ x, y, text, color, life, maxLife: life });
  if (floatTexts.length > 28) floatTexts.shift();
}

function addSmoke(difficulty, wind) {
  if (smokePuffs.length >= CFG.maxSmoke) return;
  const fires = windows.filter(w => w.fire);
  const source = fires.length ? fires[(Math.random() * fires.length) | 0] : null;
  const depthRoll = Math.random();
  smokePuffs.push({
    x: source ? source.x + (Math.random() - .5) * 30 : 45 + Math.random() * (W - 90),
    y: source ? source.wy - 3 + Math.random() * 8 : 86 + Math.random() * 10,
    vx: (Math.random() - .5) * 12 + wind * .20,
    vy: -15 - Math.random() * (17 + difficulty * 9),
    size: 4 + Math.random() * 8,
    life: 1.0 + Math.random() * .38,
    maxLife: 1.38,
    depth: depthRoll < .28 ? 0 : (depthRoll < .82 ? 1 : 2)
  });
}

function resetInput() {
  keys.left = false;
  keys.right = false;
  document.querySelectorAll('.touchBtn').forEach(b => b.classList.remove('active'));
}

// --------------------------------------------------------------------------
// GAME UPDATE
// --------------------------------------------------------------------------
function update(dt) {
  for (const s of stars) s.t += dt * s.speed;
  const playerCenter = player.x + player.w / 2;
  const centerDelta = playerCenter - W / 2;
  const deadZoneDelta = Math.abs(centerDelta) < 34 ? 0 : centerDelta - Math.sign(centerDelta) * 34;
  const velocityN = clamp(player.vx / player.maxSpeed, -1, 1);
  const cameraIntent = state === 'play' ? (deadZoneDelta * .014 + player.vx * .0058) : 0;
  camera25D.targetX = clamp(-cameraIntent, -CFG.cameraMaxOffset * .82, CFG.cameraMaxOffset * .82);
  camera25D.x += (camera25D.targetX - camera25D.x) * (1 - Math.exp(-dt * 4.6));
  camera25D.lean += (velocityN - camera25D.lean) * (1 - Math.exp(-dt * 5.6));
  camera25D.settle += ((Math.abs(velocityN) < .06 ? 0 : velocityN) - camera25D.settle) * (1 - Math.exp(-dt * 3.7));
  camera25D.kick *= Math.exp(-dt * 10.5);
  if (state !== 'play') return;

  elapsed += dt;
  shake = Math.max(0, shake - dt * 24);
  flash = Math.max(0, flash - dt * 3.9);
  trampolineBounce = Math.max(0, trampolineBounce - dt * 8.5);

  const nextPhase = phaseIndexFor(elapsed);
  if (nextPhase !== currentPhase) {
    currentPhase = nextPhase;
    showToast(`⚠ ${PHASES[currentPhase].label}`);
    playSfx('phase');
    syncUI();
  }
  updateWindowScenes(dt);
  levelProgress += dt;
  const activeLevel = LEVELS[Math.min(level-1, LEVELS.length-1)];
  if(levelProgress >= activeLevel.duration && level < LEVELS.length){
    level++; levelProgress = 0; meta.highestLevel = Math.max(meta.highestLevel||1,level);
    meta.steamStats.levelsReached = Math.max(meta.steamStats.levelsReached||1,level); writeJSON(META_KEY,meta);
    showToast(`🏙 NÍVEL ${level} · ${LEVELS[level-1].name}`); playSfx('phase');
    steamAchievement('LEVEL_5', level>=5); steamAchievement('LEVEL_8', level>=8);
  }
  let axis = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if(!axis && mouseTargetX != null){
    // Mouse uses the same acceleration and maximum speed as the keyboard.
    // A target velocity prevents snapping and brakes before overshooting the cursor.
    const center = player.x + player.w/2;
    const delta = mouseTargetX-center;
    const desiredVelocity = Math.abs(delta) < 4 ? 0 : clamp(delta * 5.2, -player.maxSpeed, player.maxSpeed);
    axis = clamp((desiredVelocity-player.vx)/(player.acc*.11), -1, 1);
  }
  player.vx += axis * player.acc * dt;
  player.vx *= Math.exp(-player.drag * dt);
  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.x = Math.max(8, Math.min(W - player.w - 8, player.x + player.vx * dt));

  const difficulty = difficultyAt();
  let maxActiveCats = LEVELS[Math.min(level-1,LEVELS.length-1)].cats;

  spawnTimer -= dt;
  if (spawnTimer <= 0 && cats.length < maxActiveCats) {
    spawnCat();
    // Menos rajadas aleatórias no início; no fim a cadência fica agressiva sem
    // cair no território de "perdi porque duas coisas nasceram juntas".
    const baseDelay = LEVELS[Math.min(level-1,LEVELS.length-1)].delay;
    const jitter = .22 + (1-difficulty)*.16;
    spawnTimer = baseDelay + Math.random()*jitter;
  }

  const wind = (Math.sin(elapsed * .58) * .72 + Math.sin(elapsed * .21 + 1.7) * .28) * (4 + difficulty * 17);
  const gravity = 205 + difficulty * 150;

  for (let i = cats.length - 1; i >= 0; i--) {
    const c = cats[i];
    const localGust = Math.sin(elapsed * 1.08 + c.gustSeed) * (1.4 + difficulty * 3.2);
    c.vy = Math.min(CFG.maxCatFallSpeed + level*12, c.vy + (gravity + LEVELS[Math.min(level-1,LEVELS.length-1)].gravity) * (c.type.weight||1) * dt);
    c.vx += (wind * .31 + localGust) * c.air * dt;
    c.vx *= Math.exp(-.12 * dt);
    c.vx = Math.max(-CFG.maxCatSideSpeed, Math.min(CFG.maxCatSideSpeed, c.vx));
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    c.wiggle += dt * (10.4 + difficulty * .8);
    c.trail -= dt;

    if (!c.warned && c.vy > 0 && c.y > 350) {
      c.warned = true;
      if (cats.length > 1 || difficulty > .42) playSfx('danger', 1, panForX(c.x));
    }

    if (c.kind === 'cat' && c.type.name === 'golden' && c.trail <= 0) {
      c.trail = .065;
      addBurst(c.x, c.y, '#ffe96a', 1, 12);
    }

    if (c.x < c.r + 6) {
      c.x = c.r + 6;
      c.vx = Math.abs(c.vx) * .58;
    } else if (c.x > W - c.r - 6) {
      c.x = W - c.r - 6;
      c.vx = -Math.abs(c.vx) * .58;
    }

    const hitY = c.vy > 0 && c.y + c.r >= player.y + 3 && c.y - c.r <= player.y + player.h + 9;
    const hitX = c.x >= player.x - 8 && c.x <= player.x + player.w + 8;

    if (hitY && hitX) {
      const isCat = c.kind !== 'object';
      if(isCat){ rescueCount++; meta.steamStats.catsSaved++; }
      else meta.steamStats.odditiesCaught++;
      const catchCombo = combo;
      let gained = c.type.points * catchCombo;
      const centerDistance = Math.abs(c.x - (player.x + player.w / 2));
      const perfect = centerDistance <= CFG.perfectHalfWidth + meta.upgrades.magnet * 5;
      const earnedCoins = isCat ? (c.type.name==='golden'?12:2) : (c.type.coin||1);
      runCoins += earnedCoins; meta.coins += earnedCoins; meta.totalCoins += earnedCoins;
      if(c.type.collectible && !meta.collectibles.includes(c.type.id)){
        meta.collectibles.push(c.type.id); collectedThisRun.push(c.type.collectible);
        showToast(`🎁 COLECIONÁVEL: ${c.type.collectible}`); steamAchievement('FIRST_COLLECTIBLE');
      }
      writeJSON(META_KEY,meta);
      if (perfect) {
        perfectCount++;
        const perfectBonus = 75 * catchCombo;
        gained += perfectBonus;
        addFloatText(c.x, c.y - 36, `PERFEITO +${perfectBonus}`, '#8ff4d2', .9);
        playSfx('perfect', 1, panForX(c.x));
      }
      score += gained;
      addFloatText(c.x, c.y - 10, `+${gained}`, c.type.name === 'golden' ? '#fff06b' : '#ffd166');
      if (catchCombo > 1) addFloatText(c.x, c.y - 25, `x${catchCombo} COMBO`, '#ff7c9d');

      const reachedMaxCombo = combo < CFG.maxCombo && combo + 1 >= CFG.maxCombo;
      combo = Math.min(CFG.maxCombo, combo + 1);
      maxCombo = Math.max(maxCombo, combo);
      trampolineBounce = 1;
      shake = perfect ? 4.0 : 2.7;
      flash = perfect ? .19 : .105;
      camera25D.kick = clamp((c.x - W / 2) / W * (perfect ? 5.2 : 3.4), -2.8, 2.8);

      let healed = false;
      if (isCat && c.type.name === 'golden') {
        if (lives < CFG.maxLives) {
          lives++;
          healed = true;
          addFloatText(c.x, c.y - 54, 'VIDA DOURADA +1 ♥', '#8ff4d2', 1.0);
          playSfx('life');
        }
        playSfx('golden', 1, panForX(c.x));
        addBurst(c.x, c.y, '#ffe853', 24, 118);
      } else {
        playSfx('catch', combo, panForX(c.x));
        addBurst(c.x, c.y, c.type.color, perfect ? 18 : 13, perfect ? 104 : 84);
      }

      if (!healed && rescueCount % CFG.healEvery === 0 && lives < CFG.maxLives) {
        lives++;
        playSfx('life');
        addFloatText(player.x + player.w / 2, player.y - 44, 'VIDA +1 ♥', '#70f0c8', 1.0);
      }
      if (reachedMaxCombo) showToast('🔥 COMBO MÁXIMO x15');

      cats.splice(i, 1);
      syncUI();
      continue;
    }

    if (c.y - c.r > GROUND + 4) {
      const dangerousObject = c.kind === 'object' && !c.type.good;
      const harmlessObject = c.kind === 'object' && c.type.good;
      if(harmlessObject){ cats.splice(i,1); continue; }
      if(player.insuranceReady){ player.insuranceReady=false; showToast('🛡 SEGURO DO PLANTÃO ATIVADO'); }
      else lives--;
      combo = 1;
      shake = 10.5;
      flash = .42;
      camera25D.kick = clamp((c.x - W / 2) / W * 8.0, -4.2, 4.2);
      addBurst(c.x, GROUND, '#ef476f', 22, 116);
      addFloatText(c.x, GROUND - 18, 'PERDIDO!', '#ff6486', .9);
      playSfx('miss', 1, panForX(c.x));
      cats.splice(i, 1);
      syncUI();
      if (lives <= 0) {
        gameOver();
        return;
      }
    }
  }

  smokeAccumulator += dt * (2.2 + difficulty * 2.4);
  while (smokeAccumulator >= 1) {
    smokeAccumulator -= 1;
    addSmoke(difficulty, wind);
  }

  for (let i = smokePuffs.length - 1; i >= 0; i--) {
    const s = smokePuffs[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.size += dt * 4.2;
    if (s.life <= 0) smokePuffs.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vy += 250 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.life -= dt;
    ft.y -= dt * 37;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }
}

// RENDER PIXEL DIORAMA 2.5D
// --------------------------------------------------------------------------
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function poly(points, color) {
  if (!points.length) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(Math.round(points[0][0]), Math.round(points[0][1]));
  for (let i = 1; i < points.length; i++) ctx.lineTo(Math.round(points[i][0]), Math.round(points[i][1]));
  ctx.closePath();
  ctx.fill();
}

function wrapX(x, pad = 40) {
  const span = W + pad * 2;
  return ((x + pad) % span + span) % span - pad;
}

function pixelShadow(cx, y, width, alpha = .25) {
  ctx.globalAlpha = alpha;
  rect(cx - width * .5, y, width, 2, '#03050c');
  rect(cx - width * .38, y - 2, width * .76, 2, '#03050c');
  ctx.globalAlpha = 1;
}

function pixelGradientRect(x, y, w, h, topColor, bottomColor) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, topColor);
  g.addColorStop(1, bottomColor);
  ctx.fillStyle = g;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function facadeTexture(bx, by, bw, bh, cfg, pal) {
  if (perf25D.level === 'low') return;
  const density = perf25D.level === 'high' ? 26 : 14;
  ctx.save();
  ctx.globalAlpha = perf25D.level === 'high' ? .12 : .08;
  for (let i = 0; i < density; i++) {
    const rx = seeded01(cfg.stainSeed + i * 3.1);
    const ry = seeded01(cfg.stainSeed + i * 5.7 + 2);
    const rw = 2 + Math.floor(seeded01(cfg.stainSeed + i * 7.9) * 9);
    const x = bx + 9 + Math.floor(rx * Math.max(1, bw - 20));
    const y = by + 10 + Math.floor(ry * Math.max(1, bh - 28));
    rect(x, y, rw, seeded01(i + cfg.b * 11) > .72 ? 2 : 1, seeded01(i * 13 + cfg.b) > .5 ? '#ffffff' : '#07101f');
  }
  if (cfg.brick) {
    ctx.globalAlpha = perf25D.level === 'high' ? .09 : .055;
    for (let yy = by + 24, row = 0; yy < by + bh - 15; yy += 13, row++) {
      const offset = row % 2 ? 7 : 0;
      for (let xx = bx + 10 + offset; xx < bx + bw - 12; xx += 18) rect(xx, yy, 10, 1, '#dfe7ff');
    }
  }
  ctx.restore();
}

function drawWindowDepthDetails(w, ox, pal) {
  if (perf25D.level === 'low') return;
  const wx = w.wx + ox, wy = w.wy;
  ctx.globalAlpha = .28;

  rect(wx + 33, wy + 1, 2, 38, pal.side);      // tiny recess side
  ctx.globalAlpha = 1;
  if (w.lit && !w.fire) {
    ctx.globalAlpha = .08;
    rect(wx + 3, wy + 3, 5, 30, '#fff7d2');
    ctx.globalAlpha = 1;
  }
}

    darkWindow: '#405276', ground: '#1d2a3f', road: '#26364d', roadFar: '#34465f', curb: '#8390a8', roadGlint: '#a9bdd4',

function rebuildStaticCache(pal) {
  if (cache25D.theme === pal.key + ':' + perf25D.level) return;
  cache25D.theme = pal.key + ':' + perf25D.level;
  const back = cache25D.backCtx, mid = cache25D.midCtx;
  back.clearRect(0, 0, W, H); mid.clearRect(0, 0, W, H);
  back.imageSmoothingEnabled = mid.imageSmoothingEnabled = false;

  back.globalAlpha = .52;
  back.fillStyle = pal.skylineBack;
  for (const s of skylineBack) {
    const y = 372 - s.h;
    back.fillRect(s.x, y, s.w, s.h);
    if (s.antenna) back.fillRect(s.x + Math.round(s.w * .63), y - 15, 2, 15);
    if (perf25D.level !== 'low') {
      back.globalAlpha = .14; back.fillStyle = '#ffd990';
      for (let wy = y + 12; wy < 360; wy += 18) for (let wx = s.x + 8; wx < s.x + s.w - 5; wx += 16) {
        if (seeded01(wx * .17 + wy * .31) > .72) back.fillRect(wx, wy, 3, 4);
      }
      back.fillStyle = pal.skylineBack; back.globalAlpha = .52;
    }
  }
  back.globalAlpha = 1;

  mid.globalAlpha = .72;
  mid.fillStyle = pal.skylineMid;
  for (const s of skylineMid) {
    const y = 418 - s.h;
    mid.fillRect(s.x, y, s.w, s.h);
    if (s.antenna) { mid.fillRect(s.x + Math.round(s.w * .35), y - 19, 3, 19); mid.fillRect(s.x + Math.round(s.w * .35) - 4, y - 17, 11, 2); }
    if (perf25D.level === 'high') {
      mid.globalAlpha = .18; mid.fillStyle = '#ffd166';
      for (let wy = y + 15; wy < 404; wy += 23) for (let wx = s.x + 9; wx < s.x + s.w - 6; wx += 19) {
        if (seeded01(wx * .21 + wy * .19) > .67) mid.fillRect(wx, wy, 4, 5);
      }
      mid.fillStyle = pal.skylineMid; mid.globalAlpha = .72;
    }
  }
  mid.globalAlpha = 1;
}

function drawSkyLayer(pal) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, pal.sky0); grad.addColorStop(.52, pal.sky1); grad.addColorStop(.84, pal.sky2); grad.addColorStop(1, pal.sky3);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Low-cost horizon haze ties the skyline to the street instead of leaving flat color bands.
  const haze = ctx.createLinearGradient(0, 300, 0, 465);
  haze.addColorStop(0, 'rgba(255,255,255,0)');
  haze.addColorStop(.65, pal.horizon);
  haze.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 285, W, 190);

  const starShift = parallaxX(DEPTH25D.stars);
  for (const s of stars) {
    ctx.globalAlpha = (.28 + Math.sin(s.t) * .23) * pal.starAlpha;
    rect(wrapX(s.x + starShift), s.y, s.s, s.s, '#fff6d8');
  }
  ctx.globalAlpha = 1;

  const moonShift = parallaxX(DEPTH25D.moon);
  ctx.globalAlpha = .10;
  rect(780 + moonShift, 30, 92, 92, '#fff4c2');
  ctx.globalAlpha = 1;
  rect(800 + moonShift, 50, 48, 48, '#ffeaa7'); rect(808 + moonShift, 42, 32, 64, '#ffeaa7');
  rect(792 + moonShift, 58, 64, 32, '#ffeaa7'); rect(824 + moonShift, 54, 20, 20, '#ffd166');

  rebuildStaticCache(pal);
  const backShift = parallaxX(DEPTH25D.skylineBack);
  const midShift = parallaxX(DEPTH25D.skylineMid);
  ctx.globalAlpha = 1;
  ctx.drawImage(cache25D.backCanvas, backShift, 0);
  if (backShift > 0) ctx.drawImage(cache25D.backCanvas, backShift - W, 0);
  else if (backShift < 0) ctx.drawImage(cache25D.backCanvas, backShift + W, 0);
  ctx.drawImage(cache25D.midCanvas, midShift, 0);
  if (midShift > 0) ctx.drawImage(cache25D.midCanvas, midShift - W, 0);
  else if (midShift < 0) ctx.drawImage(cache25D.midCanvas, midShift + W, 0);

  if (perf25D.level !== 'low') {
    ctx.globalAlpha = .065;
    for (let i = 0; i < 5; i++) {
      const cloudX = wrapX(i * 240 + elapsed * (2.2 + i * .25) + parallaxX(DEPTH25D.skylineBack), 120);
      rect(cloudX, 130 + i * 29, 112, 3, '#fff6e7');
      rect(cloudX + 18, 126 + i * 29, 72, 3, '#fff6e7');
    }
    ctx.globalAlpha = 1;
  }
}

function drawBuildingWindow(w, pal, ox = 0) {
  const wx = w.wx + ox, wy = w.wy;

function drawSmokeLayer(pal, layer) {
  const qCap = perf25D.level === 'high' ? smokePuffs.length : Math.min(smokePuffs.length, perf25D.level === 'medium' ? 62 : 38);
  for (let i = 0; i < qCap; i++) {
    const s = smokePuffs[i];
    const depth = s.depth ?? 1;
    if ((layer === 'back' && depth > 0) || (layer === 'front' && depth < 2) || (layer === 'mid' && depth !== 1)) continue;
    const shift = parallaxX(depth === 0 ? DEPTH25D.smokeBack : depth === 1 ? DEPTH25D.smokeMid : DEPTH25D.smokeFront);
    ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * (depth === 2 ? .34 : .43);
    rect(s.x + shift, s.y, s.size, s.size, pal.smoke);
    if (s.size > 8) rect(s.x + shift + 3, s.y - 2, s.size * .72, s.size * .72, pal.smoke);

function drawBuilding25D(b, pal) {
  const cfg = building25D[b];
  const bx0 = 12 + b * 156;
  const bh = 385 + (b % 3) * 20;
  const by = GROUND - bh;
  const ox = parallaxX(DEPTH25D.buildings);
  const bx = bx0 + ox;
  const d = cfg.depth;
  const lift = cfg.roofLift;

  // Side face: gradient and AO make the extrusion read as volume rather than a flat rhombus.
  const sideGrad = ctx.createLinearGradient(bx + 144, 0, bx + 144 + d, 0);
  sideGrad.addColorStop(0, pal.side);
  sideGrad.addColorStop(1, pal.sideDark);
  ctx.fillStyle = sideGrad;
  ctx.beginPath();
  ctx.moveTo(Math.round(bx + 144), Math.round(by));
  ctx.lineTo(Math.round(bx + 144 + d), Math.round(by - lift));
  ctx.lineTo(Math.round(bx + 144 + d), Math.round(GROUND - lift));
  ctx.lineTo(Math.round(bx + 144), Math.round(GROUND));
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .22;
  rect(bx + 144, by + 5, 2, bh - 8, '#000');
  ctx.globalAlpha = 1;

  for (let yy = by + 18; yy < GROUND - 12; yy += 34) {

    rect(bx + 147, yy - Math.round(lift * .25), Math.max(3, d - 5), 2, '#8b98b5');
    ctx.globalAlpha = 1;
  }

  const roofGrad = ctx.createLinearGradient(bx, by - lift, bx + 150 + d, by + 8);
  roofGrad.addColorStop(0, pal.roof);
  roofGrad.addColorStop(1, pal.roofDark);
  ctx.fillStyle = roofGrad;
  ctx.beginPath();
  [[bx - 3, by], [bx + 147, by], [bx + 147 + d, by - lift], [bx - 3 + d, by - lift]].forEach((p, i) => i ? ctx.lineTo(Math.round(p[0]),Math.round(p[1])) : ctx.moveTo(Math.round(p[0]),Math.round(p[1])));
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .20;
  poly([[bx - 1 + d, by - lift], [bx + 145 + d, by - lift], [bx + 143 + d, by - lift + 2], [bx + 1 + d, by - lift + 2]], '#e1e8ff');
  ctx.globalAlpha = 1;

  rect(bx, by, 144, bh, pal.building);

  rect(bx + 6, by + 7, 4, bh - 10, 'rgba(255,255,255,.04)');
  rect(bx + 134, by + 8, 4, bh - 12, 'rgba(0,0,0,.15)');

    }
  }

  // Rooftop silhouette variety.

    if (cfg.vents) { rect(bx + 88, by - 10, 20, 10, '#252c45'); rect(bx + 91, by - 13, 14, 3, '#687491'); rect(bx + 91, by - 8, 14, 2, '#39445f'); }
  } else {
    rect(bx + 108, by - 14, 4, 14, '#65708b'); rect(bx + 103, by - 16, 14, 2, '#65708b');
    if (cfg.vents) { rect(bx + 38, by - 8, 18, 8, '#252c45'); rect(bx + 41, by - 11, 12, 3, '#687491'); }
  }
  if (cfg.pipes && perf25D.level !== 'low') {
    rect(bx + 65, by - 5, 3, 12, '#56627d'); rect(bx + 67, by - 5, 11, 3, '#56627d'); rect(bx + 76, by - 5, 3, 8, '#323b54');
  }
  if (cfg.awning && perf25D.level === 'high') {

    poly([[bx + 12, ay], [bx + 62, ay], [bx + 58, ay + 8], [bx + 16, ay + 8]], b % 2 ? '#5d7c8f' : '#91566f');
    ctx.globalAlpha = .25; rect(bx + 16, ay + 8, 42, 3, '#000'); ctx.globalAlpha = 1;
  }

}

function drawStreetLayer(pal) {

function drawStreetProp(p, front, pal) {

    pixelShadow(x + 6, GROUND - 1, 18, .2);
    poly([[x + 6, GROUND - 18], [x + 12, GROUND - 2], [x, GROUND - 2]], '#ff793f');
    rect(x + 2, GROUND - 10, 8, 3, '#fff0cf'); rect(x - 2, GROUND - 3, 16, 3, '#bd4f31');
  } else if (p.kind === 'sign') {
    pixelShadow(x + 2, GROUND + 1, 24, .3);
    rect(x, GROUND - 73, 5, 74, '#222a42'); rect(x + 4, GROUND - 69, 28, 23, '#455270');
    rect(x + 7, GROUND - 66, 22, 17, '#ffd166'); rect(x + 15, GROUND - 64, 6, 13, '#1d2740');
  }
}

function drawPropsLayer(front, pal) {
  for (const p of streetProps) drawStreetProp(p, front, pal);
}

function drawCatShadow(c) {
  if (c.vy <= 0 || c.y < 125) return;
  const proximity = clamp((c.y - 125) / (GROUND - 125), 0, 1);
  const sx = c.x + parallaxX(DEPTH25D.entities);
  const sw = 7 + proximity * 22;
  pixelShadow(sx, GROUND - 3, sw, .045 + proximity * .22);
}

function drawCat(c) {
  const worldShift = parallaxX(DEPTH25D.entities);
  if(c.kind === 'object'){
    drawCatShadow(c); ctx.save(); ctx.translate(Math.round(c.x+worldShift),Math.round(c.y)); ctx.rotate(c.rot);
    const t=c.type; rect(-12,-12,24,24,t.color); rect(-8,-8,16,16,t.inner); rect(8,-10,4,22,'rgba(0,0,0,.22)');
    ctx.fillStyle='#fff'; ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.icon,0,0);
    ctx.restore(); return;
  }
  drawCatShadow(c);
  ctx.save();
  ctx.translate(Math.round(c.x + worldShift), Math.round(c.y));
  ctx.rotate(c.rot);
  const speedN = clamp(Math.max(0, c.vy) / CFG.maxCatFallSpeed, 0, 1);
  const sx = 1 - speedN * .055;
  const sy = 1 + speedN * .10;
  ctx.scale(sx, sy);
  const t = c.type;
  const paw = Math.sin(c.wiggle) * (2.4 + speedN * 1.2);

  ctx.globalAlpha = .28; rect(-12, -23, 25, 35, '#060814'); ctx.globalAlpha = 1;
  // tiny side faces make the sprite read as a chunky voxel-ish volume.
  rect(7, -7, 3, 14, '#15192a'); rect(5, -15, 3, 8, '#3a3040');
  rect(-13, 2 - paw, 4, 4, t.color); rect(-16, -2 - paw, 4, 5, t.color);
  rect(-9, -8, 18, 16, t.color); rect(-5, -2, 10, 10, t.inner);
  ctx.globalAlpha = .16; rect(-7, -7, 3, 13, '#fff'); ctx.globalAlpha = 1;
  rect(-8, -16, 16, 10, t.color); rect(-8, -21, 5, 6, t.color); rect(3, -21, 5, 6, t.color);
  rect(-6, -19, 2, 3, '#ff7597'); rect(4, -19, 2, 3, '#ff7597');
  rect(-5, -13, 3, 4, '#121626'); rect(2, -13, 3, 4, '#121626'); rect(-5, -13, 1, 2, '#fff'); rect(2, -13, 1, 2, '#fff'); rect(-1, -9, 2, 2, '#ff7597');
  rect(-11, -9, 6, 1, '#fff6d8'); rect(5, -9, 6, 1, '#fff6d8');
  rect(-11, 4 + paw, 5, 6, t.inner); rect(6, 4 - paw, 5, 6, t.inner);

  }
  if (t.name === 'golden') {
    ctx.globalAlpha = .16 + (Math.sin(elapsed * 11) + 1) * .085;
    rect(-14, -25, 28, 37, '#fff6a1');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawFirefighter(bx, by, flip, step = 0, lean = 0) {
  const bodyLean = lean * .55;
  ctx.save();
  ctx.translate(Math.round(bx), Math.round(by));
  ctx.transform(1, 0, bodyLean * .015, 1, 0, 0);
  // back/right faces
  rect(18, -10, 4, 8, '#9a7406'); rect(17, 6, 4, 18, '#862b28'); rect(16, 25, 4, 11, '#1d293a');
  // main pixel firefighter
  rect(2, -12, 18, 8, '#f1c40f'); rect(0, -6, 22, 4, '#d4ac0d'); rect(8, -10, 6, 4, '#e67e22');
  rect(4, -4, 14, 8, '#fcd3a1'); rect(flip ? 6 : 12, -2, 3, 3, '#1e272e');
  rect(2, 4, 18, 20, '#c0392b'); rect(2, 12, 18, 4, '#f1c40f'); rect(2, 14, 18, 2, '#ecf0f1');
  rect(3 + step, 24, 7, 12, '#2c3e50'); rect(12 - step, 24, 7, 12, '#2c3e50');
  rect(1 + step, 34, 9, 5, '#11162d'); rect(12 - step, 34, 9, 5, '#11162d');
  rect(flip ? -3 : 15, 6, 8, 6, '#e74c3c'); rect(flip ? -5 : 19, 5, 5, 5, '#fcd3a1');

  rect(4, -11, 11, 2, '#ffe46e'); rect(4, 6, 2, 16, '#e85b4e');

  ctx.restore();
}

function drawPlayer() {
  const worldShift = parallaxX(DEPTH25D.entities);
  const x = Math.round(player.x + worldShift);
  const y = player.y;
  const impact = Math.sin(clamp(trampolineBounce, 0, 1) * Math.PI);
  const bounceY = impact * 7.2;
  const lean = clamp(player.vx / 68, -4.4, 4.4);
  const step = Math.sin(elapsed * 15.5) * Math.min(2.4, Math.abs(player.vx) / 190);

  pixelShadow(x + player.w / 2, GROUND - 2, player.w + 18 - impact * 9, .28);

  // rear rim of trampoline
  poly([[x + 12, y + 2 - lean * .22], [x + player.w - 12, y + 2 + lean * .22], [x + player.w - 8, y + 7 + lean * .22], [x + 8, y + 7 - lean * .22]], '#a9b5c9');
  // fabric surface: a very subtle vertical gradient adds materiality without losing pixel-art readability.
  const fabricGrad = ctx.createLinearGradient(0, y + 3, 0, y + 16);
  const skin=meta.cosmetics.selected; const fabrics=skin==='mint'?['#9ff5d8','#43bfa2']:skin==='sunset'?['#ffd166','#ef476f']:skin==='rescue'?['#ffebe8','#e23f53']:['#fff8ea','#d9d0c8']; fabricGrad.addColorStop(0,fabrics[0]); fabricGrad.addColorStop(1,fabrics[1]);

  ctx.lineTo(x + player.w - 14, y + 12 + lean * .25);
  ctx.quadraticCurveTo(x + player.w / 2 + lean, y + 14 + bounceY, x + 14, y + 12 - lean * .25);

  ctx.globalAlpha = .33; rect(x + 19, y + 13, player.w - 38, 1, '#fff'); ctx.globalAlpha = 1;
  rect(x + player.w / 2 - 12, y + 4 + bounceY * .82, 24, 7, '#ef476f');

function drawParticles(depthClass) {
  for (const p of particles) {
    const d = p.depth ?? 1;
    if (d !== depthClass) continue;
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * (d === 0 ? .65 : 1);
    const shift = parallaxX(d === 0 ? DEPTH25D.smokeBack : d === 1 ? DEPTH25D.entities : DEPTH25D.smokeFront);
    rect(p.x + shift, p.y, p.size * (d === 2 ? 1.15 : 1), p.size * (d === 2 ? 1.15 : 1), p.color);
  }
  ctx.globalAlpha = 1;
}

function drawWorldLighting(pal) {
  // warm glow around fire windows; gradients are few (2) and quality-gated.
  if (perf25D.level !== 'low') {
    const fireWindows = windows.filter(w => w.fire);
    const ox = parallaxX(DEPTH25D.entities);
    for (const w of fireWindows) {
      const pulse = .76 + Math.sin(elapsed * 8 + w.b) * .14;
      const g = ctx.createRadialGradient(w.x + ox, w.y, 5, w.x + ox, w.y, perf25D.level === 'high' ? 86 : 58);
      g.addColorStop(0, `rgba(255,166,69,${.12 * pulse})`);
      g.addColorStop(1, 'rgba(255,90,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(w.x + ox - 90, w.y - 90, 180, 180);
    }

  // Cool top wash + warm ambient helps separate roof/facade/road material planes.
  if (perf25D.level === 'high') {
    const moonWash = ctx.createLinearGradient(0, 0, W, H);
    moonWash.addColorStop(0, 'rgba(117,154,220,.028)');
    moonWash.addColorStop(.62, 'rgba(117,154,220,0)');
    ctx.fillStyle = moonWash; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = .13;
  for (let b = 0; b < 6; b++) {
    const bx = 12 + b * 156 + parallaxX(DEPTH25D.buildings);
    rect(bx + 6, GROUND - 3, 136, 3, pal.shadow);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = pal.ambient;
  ctx.fillRect(0, 0, W, H);
}

function drawForegroundAtmosphere() {
  if (perf25D.level === 'low') return;
  ctx.globalAlpha = perf25D.level === 'high' ? .12 : .07;
  const drift = elapsed * 6 + parallaxX(DEPTH25D.foreground);
  for (let i = 0; i < (perf25D.level === 'high' ? 14 : 8); i++) {
    const x = wrapX(i * 83 + drift, 20);
    const y = 180 + ((i * 47) % 280);
    rect(x, y, i % 4 === 0 ? 2 : 1, 1, i % 3 === 0 ? '#ffd8a8' : '#c7d8ef');
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  const shift = parallaxX(DEPTH25D.entities);
  for (const ft of floatTexts) {
    ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 15px monospace';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    const width = ctx.measureText(ft.text).width;
    ctx.fillText(ft.text, Math.round(ft.x + shift - width / 2), Math.round(ft.y));
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawPostFX() {
  if (flash > 0) {
    ctx.globalAlpha = Math.min(.18, flash * .34);
    rect(0, 0, W, H, '#fff');
    ctx.globalAlpha = 1;
  }
  const vignette = ctx.createRadialGradient(W / 2, H * .45, 175, W / 2, H * .48, 600);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, perf25D.level === 'low' ? 'rgba(0,0,0,.12)' : 'rgba(0,0,0,.18)');
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = 1;
  }
}

function draw() {
  const pal = palette();
  ctx.save();
  const sx = shake ? (Math.random() - .5) * shake : 0;
  const sy = shake ? (Math.random() - .5) * shake * .62 : 0;
  ctx.translate(sx + camera25D.kick * .25, sy);

  drawSkyLayer(pal);
  drawSmokeLayer(pal, 'back');
  drawBuildingsLayer(pal);
  drawSmokeLayer(pal, 'mid');
  drawStreetLayer(pal);
  drawPropsLayer(false, pal);
  drawParticles(0);
  cats.forEach(drawCat);
  drawPlayer();
  drawParticles(1);
  drawSmokeLayer(pal, 'front');
  drawParticles(2);
  drawPropsLayer(true, pal); // explicit occlusion layer
  drawWorldLighting(pal);
  drawForegroundAtmosphere();
  drawFloatTexts();
  drawPostFX();
  ctx.restore();
}

function updateRenderQuality(rawMs) {
  if (!Number.isFinite(rawMs) || rawMs <= 0 || rawMs > 180) return;
  perf25D.avgMs += (rawMs - perf25D.avgMs) * .035;
  const tooSlow = perf25D.avgMs > 22.5;
  const comfortablyFast = perf25D.avgMs < 17.4;
  perf25D.bad = tooSlow ? perf25D.bad + 1 : Math.max(0, perf25D.bad - 2);

    perf25D.bad = perf25D.good = 0;
    cache25D.theme = '';
  } else if (perf25D.good > 540) {
    perf25D.level = perf25D.level === 'low' ? 'medium' : 'high';
    perf25D.bad = perf25D.good = 0;
    cache25D.theme = '';
  }
}

function loop(now) {
  const rawMs = Math.max(0, now - last);
  updateRenderQuality(rawMs);
  const dt = Math.min(.033, rawMs / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// --------------------------------------------------------------------------
// CONTROLES
// --------------------------------------------------------------------------
function setMouseTarget(e){
  if(state!=='play') return;
  const r=canvas.getBoundingClientRect();
  mouseTargetX=(e.clientX-r.left)*W/r.width;
}
canvas.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') setMouseTarget(e); });
canvas.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'){ setMouseTarget(e); audioInit(); } });
canvas.addEventListener('pointerleave',e=>{ if(state!=='play') return; const r=canvas.getBoundingClientRect(); const localX=(e.clientX-r.left)*W/r.width; mouseTargetX=localX < W/2 ? -W*.35 : W*1.35; });

    e.preventDefault();
    keys[key] = false;
    el.classList.remove('active');
  };

  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

bindTouch('#left', 'left');
bindTouch('#right', 'right');

addEventListener('keydown', e => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
  if ([' ', 'Enter'].includes(e.key) && state !== 'play') reset();
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  audioInit();
});
addEventListener('keyup', e => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
});
addEventListener('blur', resetInput);
document.addEventListener('visibilitychange', () => { if (document.hidden) resetInput(); last = performance.now(); });

ui.start.addEventListener('click', reset);
ui.sound.addEventListener('click', () => {
  const on = muted;
  setGameSound(on);
  window.PPG?.syncSound?.(on);
});

if (PREVIEW) {
  muted = true;
  ui.sound.textContent = '🔇';
  setTimeout(reset, 80);
}

(()=>{'use strict';

let pausedFrom='play';

function home(){

 const root=shell(`<span class="kicker">CAMPANHA · PIXEL DIORAMA 2.5D</span><h1>PLANTÃO DE<br>RESGATE</h1><p>Domine a lona, salve os moradores felinos e intercepte o caos que despenca das janelas.</p><div class="flow-stats"><span class="flow-stat">CARTEIRA<b>🪙 ${meta.coins}</b></span><span class="flow-stat">RECORDE<b>${meta.bestScore}</b></span><span class="flow-stat">NÍVEL MÁX.<b>${meta.highestLevel}</b></span></div><div class="flow-actions"><button class="flow-choice" id="flowPlay"><span class="ico">🚒</span>NOVO PLANTÃO<small>Iniciar campanha progressiva</small></button><button class="flow-choice blue" id="flowShop"><span class="ico">🛒</span>LOJINHA<small>Melhorias e itens cosméticos</small></button></div><p class="flow-hint"><span class="kbd">A D</span> ou <span class="kbd">← →</span> para mover · mouse acompanha suavemente · <span class="kbd">ESC</span> pausa</p>`);

 if(state!=='play')return;pausedFrom=state;state='paused';resetInput();mouseTargetX=null;
 const root=shell(`<span class="pause-tag">PLANTÃO INTERROMPIDO</span><h1>PAUSA</h1><p>A cidade congelou por alguns instantes. Respire e retome quando estiver pronto.</p><div class="pause-summary"><span>NÍVEL<b>${level}</b></span><span>PONTOS<b>${score}</b></span><span>RESGATES<b>${rescueCount}</b></span><span>MOEDAS<b>🪙 ${runCoins}</b></span></div><div class="flow-actions"><button class="flow-choice" id="flowResume"><span class="ico">▶</span>CONTINUAR<small>Voltar exatamente ao ponto da pausa</small></button><button class="flow-choice gold" id="flowRestart"><span class="ico">↻</span>REINICIAR<small>Começar um novo plantão</small></button><button class="flow-choice blue" id="flowSound"><span class="ico">${muted?'🔇':'🔊'}</span>${muted?'ATIVAR SOM':'DESATIVAR SOM'}<small>Preferência de áudio</small></button><button class="flow-choice dark" id="flowHome"><span class="ico">⌂</span>TELA INICIAL<small>Encerrar esta tentativa</small></button></div><p class="flow-hint"><span class="kbd">ESC</span> também continua a partida.</p>`,'⏸','TEMPO E FÍSICA CONGELADOS');
 root.querySelector('#flowResume').onclick=resume;

function restartConfirm(){
 const root=shell(`<span class="pause-tag">CONFIRMAR REINÍCIO</span><h1>NOVO PLANTÃO?</h1><p>A pontuação, o nível e as moedas desta tentativa serão encerrados. Compras e colecionáveis permanentes continuam salvos.</p><div class="flow-actions"><button class="flow-choice gold" id="confirmRestart"><span class="ico">↻</span>SIM, REINICIAR<small>Começar desde o nível 1</small></button><button class="flow-choice blue" id="cancelRestart"><span class="ico">←</span>VOLTAR À PAUSA<small>Manter a tentativa atual</small></button></div>`,'🚨','DECISÃO DO COMANDANTE');

 const root=shell(`<span class="kicker">RELATÓRIO DO PLANTÃO</span><h1>${isRecord?'NOVO RECORDE!':'FIM DO RESGATE'}</h1><div class="result-banner"><span class="result-grade">${paws}</span><span class="result-title"><b>${grade===3?'RESGATE LENDÁRIO':grade===2?'ÓTIMO PLANTÃO':'MISSÃO CONCLUÍDA'}</b>Brigada avaliada pela central</span></div><div class="result-grid"><span>PONTOS<b>${score}</b></span><span>NÍVEL<b>${level}</b></span><span>GATINHOS<b>${rescueCount}</b></span><span>PERFEITOS<b>${perfectCount}</b></span><span>COMBO MÁX.<b>x${maxCombo}</b></span><span>MOEDAS<b>🪙 ${runCoins}</b></span></div>${collectedThisRun.length?`<p>🎁 Novos colecionáveis: <b>${collectedThisRun.join(', ')}</b></p>`:''}<div class="flow-actions"><button class="flow-choice" id="resultAgain"><span class="ico">↻</span>JOGAR NOVAMENTE<small>Recomeçar imediatamente</small></button><button class="flow-choice blue" id="resultHome"><span class="ico">⌂</span>TELA INICIAL<small>Ver progresso e opções</small></button></div>`,'🏆','RELATÓRIO FINAL');
 root.querySelector('#resultAgain').onclick=()=>{last=performance.now();reset()};root.querySelector('#resultHome').onclick=home;
}
const baseGameOver=gameOver;
gameOver=function(){if(state!=='play')return;const previous=Number(meta.bestScore)||0;baseGameOver();results(score>previous)};
window.GatinhosFlow={home,pause,resume,restartConfirm,results};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;e.preventDefault();e.stopImmediatePropagation();if(state==='play')pause();else if(state==='paused')resume()},true);
addEventListener('keydown',e=>{if(state==='paused' && ['Enter',' '].includes(e.key)){e.preventDefault();e.stopImmediatePropagation()}},true);
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&state==='play')guide.style.opacity='.28'},{passive:true});
setTimeout(home,0);
})();
</script>

<script id="gatinhos-campaign-map-runtime">
(()=>{'use strict';
const flow=window.GatinhosFlow,overlay=document.querySelector('#overlay');
if(!flow||!overlay)return;
const icons=['🐱','🪴','🧺','🧸','🧳','🤖','🐤','🌪'];

 const target=Math.max(1,Math.min(LEVELS.length,index));

 elapsed=LEVELS.slice(0,target-1).reduce((a,x)=>a+x.duration,0);

function campaign(){
 state='menu';resetInput();mouseTargetX=null;overlay.className='flow-overlay';

 overlay.innerHTML=`<section class="card flow-card campaign-card"><header class="flow-head"><span class="flow-brand">🏙 MAPA DA CAMPANHA</span><span class="flow-status">${unlocked}/${LEVELS.length} FASES LIBERADAS</span></header><div class="campaign-body"><div class="campaign-top"><div class="campaign-title"><span class="kicker">ESCOLHA O PRÓXIMO PLANTÃO</span><h1>ROTA DE RESGATE</h1><p>Todas as fases aparecem no mapa. Conclua novos níveis para liberar os próximos distritos.</p></div><div class="campaign-progress"><strong><span>PROGRESSO DA CAMPANHA</span><span>${pct}%</span></strong><div class="campaign-progress-track"><i style="width:${pct}%"></i></div></div></div><div class="campaign-map">${LEVELS.map((cfg,i)=>{const n=i+1,open=n<=unlocked,cls=n<unlocked?'done':n===unlocked?'current':'locked';return `<button class="phase-node ${cls}" data-level="${n}" ${open?'':'disabled'}><span class="phase-num"><b>${String(n).padStart(2,'0')}</b><span>${Math.round(cfg.duration)}s</span></span><span class="phase-icon">${icons[i]}</span><strong>${cfg.name}</strong><small>${descriptions[i]}</small><span class="phase-state">${statusFor(i,unlocked)}</span></button>`}).join('')}</div><footer class="campaign-footer"><button class="flow-choice dark campaign-back" id="campaignBack">← TELA INICIAL</button><span class="campaign-side-art"><span class="truck">🚒</span>Selecione uma fase liberada para iniciar</span></footer></div></section>`;
 overlay.querySelectorAll('.phase-node:not(:disabled)').forEach(btn=>btn.onclick=()=>startAt(Number(btn.dataset.level)));

}
const oldHome=flow.home;
function reformedHome(){

 const play=document.querySelector('#flowPlay');
 if(play){play.innerHTML='<span class="ico">🗺</span>MODO CAMPANHA<small>Ver mapa, fases e progresso</small>';play.onclick=campaign}
 const copy=document.querySelector('.flow-copy>p');if(copy)copy.textContent='Escolha seu próximo plantão, acompanhe a campanha e prepare a brigada para o caos que despenca das janelas.';
}
flow.home=reformedHome;flow.campaign=campaign;flow.startAt=startAt;
// Mouse tracking is global: leaving the canvas or the browser keeps the last horizontal intent.
addEventListener('mousemove',e=>{
 lastPointerX=e.clientX;lastPointerSide=e.clientX<innerWidth*.5?-1:1;
 if(state!=='play')return;
 const r=canvas.getBoundingClientRect();
 const local=(e.clientX-r.left)*W/r.width;
 mouseTargetX=clamp(local,-W*.45,W*1.45);

},{passive:true});

 if(state!=='play')return;

});
addEventListener('mouseenter',()=>{if(state==='play'&&lastPointerX>=0&&lastPointerX<=innerWidth)edge.className=''});
setTimeout(reformedHome,20);
})();
</script>

 overlay.querySelector('#shopBack').onclick=flow.home;
 overlay.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>{const it=SHOP_ITEMS.find(x=>x.id===btn.dataset.buy),lvl=meta.upgrades[it.id]||0,c=itemCost(it,lvl);if(lvl>=it.max)return;if(meta.coins<c){feedback('Moedas insuficientes para esta melhoria.',true);return}meta.coins-=c;meta.upgrades[it.id]=lvl+1;writeJSON(META_KEY,meta);shop();feedback(`${it.name} melhorado com sucesso.`)});
 overlay.querySelectorAll('[data-cos]').forEach(btn=>btn.onclick=()=>{const it=SHOP_ITEMS.find(x=>x.id===btn.dataset.cos);if(!meta.cosmetics.owned.includes(it.id)){if(meta.coins<it.base){feedback('Moedas insuficientes para este cosmético.',true);return}meta.coins-=it.base;meta.cosmetics.owned.push(it.id)}meta.cosmetics.selected=it.id;writeJSON(META_KEY,meta);shop();feedback(`${it.name} equipado.`)});
}
flow.shop=shop;
// Capture phase fixes stale onclick handlers left by the older menu runtime.
document.addEventListener('click',e=>{const btn=e.target.closest('#flowShop');if(!btn)return;e.preventDefault();e.stopImmediatePropagation();shop()},true);
})();
</script>
</body></html>
