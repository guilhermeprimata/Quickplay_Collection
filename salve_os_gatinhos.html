<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Salve os Gatinhos! - Edição Pixel Deluxe</title>
<style>
:root{color-scheme:dark;--ink:#fff6d8;--red:#ef476f;--yellow:#ffd166;--blue:#49c6e5;--navy:#0c1024}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#060814}
body{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);touch-action:none;user-select:none}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 25%,#1c254a,#060814 78%)}
#stage{position:relative;width:min(calc(100vw - 12px),calc((100vh - 12px)*16/9));aspect-ratio:16/9;max-height:calc(100vh - 12px);overflow:hidden;border:3px solid #f8d878;border-radius:12px;box-shadow:0 0 0 3px #562d5f,0 20px 80px rgba(0,0,0,.85);background:#0d122b}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#top{position:absolute;left:2%;right:2%;top:2%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:2px 2px #0a0d1a;font-weight:900;font-size:clamp(11px,2.2vmin,21px)}
.pill{background:#0e1329eb;border:2px solid #ffffff33;padding:.35em .7em;border-radius:10px;box-shadow:0 4px 12px #0009;letter-spacing:.04em}.lives{color:#ff7597}.combo{color:#ffd166;transition:transform .1s ease}
#sound{position:absolute;right:2%;bottom:2.5%;width:clamp(36px,7.5vmin,58px);aspect-ratio:1;border:2px solid #fff;border-radius:10px;background:#20294d;color:white;font-size:clamp(16px,3vmin,24px);cursor:pointer;box-shadow:0 4px 10px #000a}
#touch{position:absolute;left:2%;bottom:2.5%;display:flex;gap:12px}.touchBtn{width:clamp(48px,11.5vmin,82px);aspect-ratio:1;border:2px solid #fff;border-radius:14px;background:#26345de0;color:white;font-size:clamp(22px,5vmin,38px);font-weight:900;touch-action:none;box-shadow:0 4px 10px #0008}.touchBtn:active{background:#ef476f;transform:scale(.95)}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,9,22,.86);backdrop-filter:blur(3px)}
.card{width:min(90%,620px);padding:clamp(16px,4vmin,36px);text-align:center;background:linear-gradient(160deg,#192248,#0e132c);border:3px solid #ffd166;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.85)}.card h1{margin:.1em 0;color:#ffd166;font-size:clamp(22px,6vmin,52px);text-shadow:4px 4px #a83258;letter-spacing:.05em}.card p{font-size:clamp(12px,2.2vmin,18px);line-height:1.5;color:#e3e7fc}.card button{border:0;border-bottom:5px solid #9c2d50;border-radius:10px;padding:.75em 1.6em;background:#ef476f;color:#fff;font:900 clamp(14px,3vmin,23px) inherit;cursor:pointer;transition:transform .08s,filter .1s;box-shadow:0 6px 20px #ef476f44}.card button:hover{filter:brightness(1.15)}.card button:active{transform:translateY(3px);border-bottom-width:2px}.hidden{display:none!important}
@media (pointer:fine){#touch{opacity:.38}.touchBtn:hover{opacity:1}}
</style>
</head>
<body><main id="app"><section id="stage" aria-label="Jogo Salve os Gatinhos">
<canvas id="game" width="960" height="540"></canvas>
<div id="top">
  <div class="pill">PONTOS <span id="score">000000</span><br><span class="combo" id="combo">COMBO x1</span></div>
  <div class="pill lives" id="lives">♥ ♥ ♥</div>
</div>
<div id="touch"><button class="touchBtn" id="left" aria-label="Mover para esquerda">◀</button><button class="touchBtn" id="right" aria-label="Mover para direita">▶</button></div>
<button id="sound" aria-label="Ativar ou desativar som">🔊</button>
<div id="overlay"><div class="card"><h1 id="title">SALVE OS GATINHOS!</h1><p id="message">Mova os bombeiros com <b>← →</b> ou <b>A D</b>.<br>Amorteça a queda dos bichanos e faça combos épicos!</p><button id="start">INICIAR RESGATE</button></div></div>
</section></main>

<script>
'use strict';
const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 960, H = 540, GROUND = 486;
const ui = {
  score: document.querySelector('#score'),
  combo: document.querySelector('#combo'),
  lives: document.querySelector('#lives'),
  overlay: document.querySelector('#overlay'),
  title: document.querySelector('#title'),
  message: document.querySelector('#message'),
  start: document.querySelector('#start'),
  sound: document.querySelector('#sound')
};

let state = 'menu', score = 0, lives = 3, combo = 1, best = 0, elapsed = 0;
let spawnTimer = 1.4, sceneCheckTimer = 3.0, shake = 0, flash = 0, muted = false;
let last = performance.now(), rescueCount = 0, trampolineBounce = 0;
const keys = { left: false, right: false };

// Jogador: Bombeiros ágeis e ágeis no reposicionamento
const player = { x: 430, y: 444, w: 106, h: 26, vx: 0, maxSpeed: 540, acc: 2900, drag: 11.5 };

let cats = [], particles = [], floatTexts = [], stars = [], windows = [], smokePuffs = [];

// Geração de estrelas e janelas do prédio
for (let i = 0; i < 90; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * 320, s: Math.random() < .2 ? 2 : 1, t: Math.random() * 6 });
}
for (let b = 0; b < 6; b++) {
  for (let f = 0; f < 5; f++) {
    windows.push({
      x: 28 + b * 156 + 32 + (f % 2) * 64,
      y: 92 + f * 66,
      b, f,
      lit: Math.random() < .45,
      fire: (f === 0 && (b === 2 || b === 4)),
      scene: null // Silhueta humorística
    });
  }
}

// --------------------------------------------------------------------------
// AUDIO ENGINE (Web Audio API Synthesizer - 8-Bit Chiptune + SFX)
// --------------------------------------------------------------------------
let ac = null, masterGain = null, bgmTimer = null, bgmStep = 0;

function audioInit() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ac.createGain();
    masterGain.gain.value = 0.16;
    masterGain.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  startBGM();
}

function playTone(freq, dur, type = 'square', vol = 0.1, slide = 0, when = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + when;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide !== 0) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  }
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(t);
  osc.stop(t + dur);
}

function playSfx(type, param = 1) {
  if (muted || !ac) return;
  if (type === 'spawn') {
    // Miau agudo na janela
    playTone(680, 0.08, 'triangle', 0.08, 250);
    playTone(930, 0.11, 'sine', 0.06, -220, 0.06);
  } else if (type === 'catch') {
    // Boing musical escalonado com combo
    const baseFreq = 340 + Math.min(param, 10) * 45;
    playTone(baseFreq, 0.12, 'triangle', 0.18, 140);
    playTone(baseFreq * 1.5, 0.15, 'square', 0.08, 60, 0.06);
  } else if (type === 'golden') {
    // Resgate especial do dourado
    playTone(523, 0.09, 'square', 0.12, 0, 0.0);
    playTone(659, 0.09, 'square', 0.12, 0, 0.08);
    playTone(784, 0.09, 'square', 0.12, 0, 0.16);
    playTone(1046, 0.22, 'square', 0.15, 80, 0.24);
  } else if (type === 'miss') {
    // Queda
    playTone(180, 0.28, 'sawtooth', 0.16, -110);
    playTone(90, 0.35, 'triangle', 0.2, -40, 0.05);
  } else if (type === 'life') {
    // Cura de coração
    playTone(440, 0.08, 'sine', 0.14, 100);
    playTone(880, 0.2, 'sine', 0.14, 0, 0.08);
  }
}

function startBGM() {
  if (bgmTimer || !ac) return;
  const bassSeq = [110, 110, 146.83, 110, 164.81, 146.83, 130.81, 123.47];
  const leadSeq = [440, 0, 523.25, 587.33, 659.25, 523.25, 440, 392];
  
  bgmTimer = setInterval(() => {
    if (state === 'play' && !muted) {
      const bNote = bassSeq[bgmStep % bassSeq.length];
      const lNote = leadSeq[bgmStep % leadSeq.length];
      playTone(bNote, 0.12, 'triangle', 0.035, -5);
      if (lNote > 0 && Math.random() < 0.85) {
        playTone(lNote, 0.09, 'square', 0.018, 0, 0.02);
      }
      bgmStep++;
    }
  }, 210);
}

// --------------------------------------------------------------------------
// TIPOS DE GATOS & BALANCING
// --------------------------------------------------------------------------
const CAT_TYPES = [
  { name: 'orange', color: '#f69d3b', inner: '#ffd383', points: 100 },
  { name: 'tuxedo', color: '#222831', inner: '#eceff1', points: 120 },
  { name: 'calico', color: '#e8e8e8', inner: '#d35400', points: 150 },
  { name: 'siamese', color: '#e0d5be', inner: '#5d4037', points: 130 },
  { name: 'golden', color: '#ffd700', inner: '#ffffff', points: 300 }
];

const SCENE_TYPES = ['dressing', 'chat', 'tv', 'cat', 'dance'];

function reset() {
  score = 0;
  lives = 3;
  combo = 1;
  elapsed = 0;
  spawnTimer = 1.6;
  sceneCheckTimer = 2.0;
  rescueCount = 0;
  trampolineBounce = 0;
  cats = [];
  particles = [];
  floatTexts = [];
  smokePuffs = [];
  windows.forEach(w => w.scene = null);
  player.x = (W - player.w) / 2;
  player.vx = 0;
  state = 'play';
  ui.overlay.classList.add('hidden');
  syncUI();
  audioInit();
}

function syncUI() {
  ui.score.textContent = String(score).padStart(6, '0');
  ui.combo.textContent = 'COMBO x' + combo;
  ui.combo.style.transform = combo > 1 ? 'scale(1.15)' : 'scale(1)';
  ui.lives.textContent = '♥ '.repeat(Math.max(0, lives)).trim() || 'SEM VIDAS';
}

function gameOver() {
  state = 'over';
  best = Math.max(best, score);
  ui.title.textContent = 'FIM DO RESGATE';
  ui.message.innerHTML = `Gatinhos Salvos: <b>${rescueCount}</b><br>Pontuação Final: <b>${score}</b><br>Melhor Marca: <b>${best}</b>`;
  ui.start.textContent = 'TENTAR NOVAMENTE';
  ui.overlay.classList.remove('hidden');
}

// Spawner com Diretor de Ritmo (Fácil no Início, Desafiador no Final)
function spawnCat() {
  const difficulty = Math.min(1, elapsed / 130);
  let availableWindows = windows.filter(w => w.f < 3 && !w.fire);
  
  if (cats.length > 0) {
    const lastCat = cats[cats.length - 1];
    // Evita lançar gatos em pontas diametralmente opostas de forma impossível
    availableWindows = availableWindows.filter(w => Math.abs(w.x - lastCat.x) < 420);
    if (availableWindows.length === 0) availableWindows = windows.filter(w => w.f < 3 && !w.fire);
  }
  
  const win = availableWindows[(Math.random() * availableWindows.length) | 0];
  const isGolden = Math.random() < (0.04 + difficulty * 0.05);
  const typeIndex = isGolden ? 4 : (Math.floor(Math.random() * 4));
  const type = CAT_TYPES[typeIndex];

  // Leve impulso horizontal em direção ao centro para trajetórias suaves
  const centerPull = (W / 2 - win.x) * 0.04;
  const vx = (Math.random() - 0.5) * (20 + difficulty * 20) + centerPull * difficulty;

  cats.push({
    x: win.x,
    y: win.y + 14,
    vx: vx,
    vy: -20 - Math.random() * 20, // Queda inicial bem suave
    r: 12,
    rot: (Math.random() - 0.5) * 0.3,
    spin: (Math.random() - 0.5) * 3,
    type: type,
    wiggle: Math.random() * 6
  });

  addBurst(win.x, win.y + 14, '#ffd166', 6, 35);
  playSfx('spawn');
}

// Gerenciador de Cenas Humorísticas nas Janelas (Baixa Frequência)
function updateWindowScenes(dt) {
  sceneCheckTimer -= dt;
  
  // Atualiza timers das cenas ativas
  windows.forEach(w => {
    if (w.scene) {
      w.scene.t += dt;
      if (w.scene.t >= w.scene.dur) {
        w.scene = null;
      }
    }
  });

  if (sceneCheckTimer <= 0) {
    sceneCheckTimer = 4.5 + Math.random() * 4.0; // Checagem espaçada
    const activeCount = windows.filter(w => w.scene !== null).length;
    
    // Máximo de 2 cenas simultâneas em todo o prédio para não poluir
    if (activeCount < 2) {
      const candidates = windows.filter(w => w.lit && !w.fire && !w.scene && w.f > 0);
      if (candidates.length > 0 && Math.random() < 0.65) {
        const picked = candidates[(Math.random() * candidates.length) | 0];
        const sceneType = SCENE_TYPES[(Math.random() * SCENE_TYPES.length) | 0];
        picked.scene = {
          type: sceneType,
          t: 0,
          dur: 10 + Math.random() * 12 // Dura de 10 a 22 segundos
        };
      }
    }
  }
}

function addBurst(x, y, color, count = 10, speed = 80) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = Math.random() * speed + 20;
    particles.push({
      x, y,
      vx: Math.cos(angle) * s,
      vy: Math.sin(angle) * s - 20,
      life: 0.35 + Math.random() * 0.4,
      maxLife: 0.75,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function addFloatText(x, y, text, color = '#ffd166') {
  floatTexts.push({ x, y, text, color, life: 0.7, maxLife: 0.7 });
}

function update(dt) {
  if (state !== 'play') return;
  elapsed += dt;

  shake = Math.max(0, shake - dt * 22);
  flash = Math.max(0, flash - dt * 3.5);
  trampolineBounce = Math.max(0, trampolineBounce - dt * 8);

  updateWindowScenes(dt);

  // Física do Jogador
  const axis = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  player.vx += axis * player.acc * dt;
  player.vx *= Math.exp(-player.drag * dt);
  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.x = Math.max(8, Math.min(W - player.w - 8, player.x + player.vx * dt));

  // Progressão Gradual de Dificuldade
  const difficulty = Math.min(1, elapsed / 130);

  // Controle estrito de gatos simultâneos:
  // 0 a 20s -> 1 gato
  // 20 a 55s -> 2 gatos
  // 55s+ -> até 3 gatos
  let maxActiveCats = 1;
  if (elapsed >= 20) maxActiveCats = 2;
  if (elapsed >= 55) maxActiveCats = (difficulty > 0.65 ? 3 : 2);

  spawnTimer -= dt;
  if (spawnTimer <= 0 && cats.length < maxActiveCats) {
    spawnCat();
    // No início, intervalo calmo (~1.8s a 2.3s), descendo até ~0.8s
    const baseDelay = 1.85 - difficulty * 1.05;
    spawnTimer = baseDelay + Math.random() * 0.55;
  }

  // Vento suave
  const wind = Math.sin(elapsed * 0.75) * (5 + difficulty * 14);

  // Gravidade escalonada suavemente (começa em 210 e sobe até 380)
  const gravity = 210 + difficulty * 170;

  // Atualiza Gatinhos
  for (let i = cats.length - 1; i >= 0; i--) {
    const c = cats[i];
    c.vy += gravity * dt;
    c.vx += wind * dt * 0.35;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    c.wiggle += dt * 11;

    // Paredes laterais
    if (c.x < c.r + 6) {
      c.x = c.r + 6;
      c.vx = Math.abs(c.vx) * 0.6;
    } else if (c.x > W - c.r - 6) {
      c.x = W - c.r - 6;
      c.vx = -Math.abs(c.vx) * 0.6;
    }

    // Colisão com a Lona dos Bombeiros
    const hitY = (c.vy > 0) && (c.y + c.r >= player.y + 4) && (c.y - c.r <= player.y + player.h + 8);
    const hitX = (c.x >= player.x - 8) && (c.x <= player.x + player.w + 8);

    if (hitY && hitX) {
      rescueCount++;
      const gainedPoints = c.type.points * combo;
      score += gainedPoints;
      
      addFloatText(c.x, c.y - 10, `+${gainedPoints}`, c.type.name === 'golden' ? '#ffe853' : '#ffd166');
      if (combo > 1) {
        addFloatText(c.x, c.y - 28, `${combo}x COMBO!`, '#ff7597');
      }

      combo = Math.min(12, combo + 1);
      trampolineBounce = 1.0;
      shake = 3.5;
      flash = 0.15;

      // Recuperação de vida a cada 15 resgates
      if (rescueCount % 15 === 0 && lives < 3) {
        lives++;
        playSfx('life');
        addFloatText(player.x + player.w / 2, player.y - 40, 'VIDA +1 ♥', '#5ff0c0');
      }

      if (c.type.name === 'golden') {
        playSfx('golden');
        addBurst(c.x, c.y, '#ffe853', 22, 110);
      } else {
        playSfx('catch', combo);
        addBurst(c.x, c.y, c.type.color, 14, 85);
      }

      cats.splice(i, 1);
      syncUI();
      continue;
    }

    // Gato tocou o chão (Miss)
    if (c.y > GROUND + 6) {
      lives--;
      combo = 1;
      shake = 12;
      flash = 0.4;
      addBurst(c.x, GROUND, '#ef476f', 20, 110);
      addFloatText(c.x, GROUND - 18, 'PERDIDO!', '#ef476f');
      playSfx('miss');
      cats.splice(i, 1);
      syncUI();

      if (lives <= 0) {
        gameOver();
        return;
      }
    }
  }

  // Fumaça decorativa no topo
  if (Math.random() < 0.25) {
    smokePuffs.push({
      x: 80 + Math.random() * (W - 160),
      y: 85,
      vx: (Math.random() - 0.5) * 15 + wind * 0.2,
      vy: -18 - Math.random() * 20,
      size: 4 + Math.random() * 8,
      life: 1.2,
      maxLife: 1.2
    });
  }

  for (let i = smokePuffs.length - 1; i >= 0; i--) {
    const s = smokePuffs[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.size += dt * 4;
    if (s.life <= 0) smokePuffs.splice(i, 1);
  }

  // Partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vy += 250 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Textos flutuantes
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.life -= dt;
    ft.y -= dt * 36;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }
}

// --------------------------------------------------------------------------
// RENDERIZAÇÃO RETRO & SILHUETAS NAS JANELAS
// --------------------------------------------------------------------------
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawWindowSilhouette(wx, wy, scene) {
  const silColor = '#101424'; // Silhueta escura contra a luz
  const t = scene.t;

  if (scene.type === 'dressing') {
    // Mulher trocando de roupa / ajustando vestido
    const armLift = Math.sin(t * 3) > 0 ? 4 : 0;
    rect(wx + 13, wy + 8, 6, 6, silColor); // cabeça
    rect(wx + 11, wy + 14, 10, 10, silColor); // tronco / vestido
    rect(wx + 9, wy + 24, 14, 10, silColor); // saia
    rect(wx + 7 - armLift, wy + 12 - armLift, 4, 8, silColor); // braço esquerdo
    rect(wx + 21 + armLift, wy + 12 - armLift, 4, 8, silColor); // braço direito
  } 
  else if (scene.type === 'chat') {
    // Duas pessoas conversando e gesticulando
    const nod = Math.sin(t * 4) > 0 ? 1 : 0;
    // Pessoa 1 (esquerda)
    rect(wx + 5, wy + 12 - nod, 6, 6, silColor);
    rect(wx + 3, wy + 18, 10, 16, silColor);
    rect(wx + 11, wy + 20 + nod * 2, 4, 4, silColor); // mão gesticulando

    // Pessoa 2 (direita)
    rect(wx + 21, wy + 12 + nod, 6, 6, silColor);
    rect(wx + 19, wy + 18, 10, 16, silColor);
    rect(wx + 17, wy + 22 - nod * 2, 4, 4, silColor);
  }
  else if (scene.type === 'tv') {
    // Morador na poltrona assistindo TV (com reflexo azulado piscando)
    const tvFlicker = Math.sin(t * 8) > 0 ? '#68d8d6' : '#ffd166';
    rect(wx + 2, wy + 16, 10, 14, '#1c223d');
    rect(wx + 3, wy + 17, 8, 12, tvFlicker); // tela da tv
    // Pessoa na poltrona
    rect(wx + 18, wy + 14, 12, 18, silColor);
    rect(wx + 20, wy + 10, 7, 7, silColor); // cabeça
    rect(wx + 16, wy + 22, 6, 5, silColor); // braço da poltrona
  }
  else if (scene.type === 'cat') {
    // Gato curioso na janela observando o resgate
    const tailWag = Math.sin(t * 5) * 2;
    rect(wx + 11, wy + 20, 10, 12, silColor); // corpo
    rect(wx + 12, wy + 14, 8, 7, silColor); // cabeça
    rect(wx + 11, wy + 11, 3, 4, silColor); // orelha esq
    rect(wx + 18, wy + 11, 3, 4, silColor); // orelha dir
    rect(wx + 6 + tailWag, wy + 24, 6, 3, silColor); // cauda
    // Olhinhos brilhantes na sombra
    rect(wx + 14, wy + 16, 1, 2, '#fff');
    rect(wx + 17, wy + 16, 1, 2, '#fff');
  }
  else if (scene.type === 'dance') {
    // Vizinho dançando / se exercitando
    const bounce = Math.abs(Math.sin(t * 6)) * 3;
    rect(wx + 13, wy + 8 - bounce, 6, 6, silColor); // cabeça
    rect(wx + 11, wy + 14 - bounce, 10, 12, silColor); // tronco
    rect(wx + 6, wy + 10 - bounce + Math.sin(t * 6) * 4, 5, 5, silColor); // braço esq
    rect(wx + 21, wy + 10 - bounce - Math.sin(t * 6) * 4, 5, 5, silColor); // braço dir
    rect(wx + 9, wy + 26, 5, 8, silColor); // perna esq
    rect(wx + 18, wy + 26, 5, 8, silColor); // perna dir
  }
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0c1026');
  grad.addColorStop(0.55, '#251b3d');
  grad.addColorStop(0.85, '#682a3d');
  grad.addColorStop(1, '#a34839');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Estrelas
  stars.forEach(s => {
    s.t += 0.025;
    ctx.globalAlpha = 0.35 + Math.sin(s.t) * 0.35;
    rect(s.x, s.y, s.s, s.s, '#fff6d8');
  });
  ctx.globalAlpha = 1;

  // Lua Pixelada
  rect(800, 50, 48, 48, '#ffeaa7');
  rect(808, 42, 32, 64, '#ffeaa7');
  rect(792, 58, 64, 32, '#ffeaa7');
  rect(824, 54, 20, 20, '#ffd166');

  // Prédios
  for (let b = 0; b < 6; b++) {
    const bx = 12 + b * 156;
    const bh = 385 + (b % 3) * 20;
    const by = GROUND - bh;
    
    rect(bx, by, 144, bh, '#1c223d');
    rect(bx + 6, by + 6, 132, bh - 6, '#283054');
    rect(bx - 3, by, 150, 8, '#13182b');

    // Janelas
    for (let f = 0; f < 5; f++) {
      for (let q = 0; q < 2; q++) {
        const wx = bx + 18 + q * 65;
        const wy = by + 36 + f * 66;
        const winObj = windows.find(w => w.b === b && w.f === f && Math.abs(w.x - (wx + 14)) < 20);

        rect(wx - 2, wy - 2, 36, 42, '#121626');
        
        if (winObj && winObj.fire) {
          const flicker = Math.sin(elapsed * 12 + b) > 0 ? '#ff793f' : '#ffb142';
          rect(wx, wy, 32, 38, flicker);
          rect(wx + 4, wy + 4, 10, 12, '#fffa65');
        } else {
          const litColor = (winObj && winObj.lit) ? '#ffd166' : '#384366';
          rect(wx, wy, 32, 38, litColor);

          // Renderiza a silhueta da cena humorística se a janela estiver iluminada
          if (winObj && winObj.lit && winObj.scene) {
            drawWindowSilhouette(wx, wy, winObj.scene);
          }
        }

        // Grades da esquadria
        rect(wx + 15, wy, 2, 38, '#1b2033');
        rect(wx, wy + 18, 32, 2, '#1b2033');
      }
    }
  }

  // Fumaça no topo
  smokePuffs.forEach(s => {
    ctx.globalAlpha = (s.life / s.maxLife) * 0.45;
    rect(s.x, s.y, s.size, s.size, '#2c334d');
  });
  ctx.globalAlpha = 1;

  // Solo e Calçada
  rect(0, GROUND, W, H - GROUND, '#111524');
  rect(0, GROUND, W, 8, '#434d6b');
  rect(0, GROUND + 8, W, 3, '#2a3147');
  for (let x = 12; x < W; x += 54) {
    rect(x, 514, 28, 5, '#2f3852');
  }

  // Hidrante
  rect(48, GROUND - 18, 12, 18, '#ef476f');
  rect(45, GROUND - 14, 18, 5, '#d63031');
  rect(50, GROUND - 22, 8, 4, '#ffd166');
}

function drawCat(c) {
  ctx.save();
  ctx.translate(Math.round(c.x), Math.round(c.y));
  ctx.rotate(c.rot);

  const t = c.type;
  const pawOffset = Math.sin(c.wiggle) * 3;

  // Cauda
  rect(-13, 2 - pawOffset, 4, 4, t.color);
  rect(-16, -2 - pawOffset, 4, 5, t.color);

  // Corpo e Barriga
  rect(-9, -8, 18, 16, t.color);
  rect(-5, -2, 10, 10, t.inner);

  // Cabeça e Orelhas
  rect(-8, -16, 16, 10, t.color);
  rect(-8, -21, 5, 6, t.color);
  rect(3, -21, 5, 6, t.color);
  rect(-6, -19, 2, 3, '#ff7597');
  rect(4, -19, 2, 3, '#ff7597');

  // Olhos e Focinho
  rect(-5, -13, 3, 4, '#121626');
  rect(2, -13, 3, 4, '#121626');
  rect(-5, -13, 1, 2, '#ffffff');
  rect(2, -13, 1, 2, '#ffffff');
  rect(-1, -9, 2, 2, '#ff7597');

  // Patinhas
  rect(-11, 4 + pawOffset, 5, 6, t.inner);
  rect(6, 4 - pawOffset, 5, 6, t.inner);

  if (t.name === 'golden') {
    ctx.globalAlpha = 0.5 + Math.sin(elapsed * 10) * 0.4;
    rect(-12, -23, 24, 32, '#fff9a6');
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawPlayer() {
  const x = Math.round(player.x);
  const y = player.y;
  const bounceY = Math.sin(trampolineBounce * Math.PI) * 7;

  // Lona elástica
  ctx.fillStyle = '#fceade';
  ctx.beginPath();
  ctx.moveTo(x + 14, y + 4);
  ctx.quadraticCurveTo(x + player.w / 2, y + 6 + bounceY, x + player.w - 14, y + 4);
  ctx.lineTo(x + player.w - 14, y + 12);
  ctx.quadraticCurveTo(x + player.w / 2, y + 14 + bounceY, x + 14, y + 12);
  ctx.closePath();
  ctx.fill();

  rect(x + player.w / 2 - 12, y + 4 + bounceY * 0.8, 24, 7, '#ef476f');

  // Bombeiro da Esquerda e da Direita
  drawFirefighter(x - 6, y + 2, false);
  drawFirefighter(x + player.w - 18, y + 2, true);
}

function drawFirefighter(bx, by, flip) {
  // Capacete
  rect(bx + 2, by - 12, 18, 8, '#f1c40f');
  rect(bx, by - 6, 22, 4, '#d4ac0d');
  rect(bx + 8, by - 10, 6, 4, '#e67e22');

  // Rosto e Olho
  rect(bx + 4, by - 4, 14, 8, '#fcd3a1');
  rect(flip ? bx + 6 : bx + 12, by - 2, 3, 3, '#1e272e');

  // Traje
  rect(bx + 2, by + 4, 18, 20, '#c0392b');
  rect(bx + 2, by + 12, 18, 4, '#f1c40f');
  rect(bx + 2, by + 14, 18, 2, '#ecf0f1');

  // Calça e Botas
  rect(bx + 3, by + 24, 7, 12, '#2c3e50');
  rect(bx + 12, by + 24, 7, 12, '#2c3e50');
  rect(bx + 1, by + 34, 9, 5, '#11162d');
  rect(bx + 12, by + 34, 9, 5, '#11162d');

  // Braços
  rect(flip ? bx - 3 : bx + 15, by + 6, 8, 6, '#e74c3c');
  rect(flip ? bx - 5 : bx + 19, by + 5, 5, 5, '#fcd3a1');
}

function draw() {
  ctx.save();

  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(sx, sy);

  drawBackground();
  cats.forEach(drawCat);
  drawPlayer();

  // Partículas
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    rect(p.x, p.y, p.size, p.size, p.color);
  });
  ctx.globalAlpha = 1;

  // Textos flutuantes
  floatTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 15px monospace';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, Math.round(ft.x - 18), Math.round(ft.y));
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  if (flash > 0) {
    ctx.globalAlpha = flash * 0.35;
    rect(0, 0, W, H, '#fff');
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// --------------------------------------------------------------------------
// CONTROLES & EVENTOS
// --------------------------------------------------------------------------
function bindTouch(id, key) {
  const el = document.querySelector(id);
  const on = e => { e.preventDefault(); keys[key] = true; audioInit(); };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}

bindTouch('#left', 'left');
bindTouch('#right', 'right');

addEventListener('keydown', e => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
  if ([' ', 'Enter'].includes(e.key) && state !== 'play') reset();
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  audioInit();
});

addEventListener('keyup', e => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
});

ui.start.addEventListener('click', reset);
ui.sound.addEventListener('click', () => {
  muted = !muted;
  ui.sound.textContent = muted ? '🔇' : '🔊';
  if (!muted) audioInit();
  window.PPG?.syncSound?.(!muted);
});
if(new URLSearchParams(location.search).has('preview')){muted=true;setTimeout(reset,80);}

requestAnimationFrame(loop);
</script>

function metric(){try{return window.__ppgHelpers.num(document.querySelector('#score')?.textContent)}catch{return null}}
function upsert(v){if(v==null||!Number.isFinite(v))return;let db=readJSON(REC_KEY,{});if(Array.isArray(db))db={'Padrão':db};const dk=difficultyKey(),r=Array.isArray(db[dk])?db[dk]:[],me=r.find(x=>x.sessionId===sessionId);if(me){if(v<=me.value)return;me.value=v;me.at=Date.now()}else r.push({sessionId,value:v,at:Date.now()});r.sort((a,b)=>b.value-a.value);db[dk]=r.slice(0,5);writeJSON(REC_KEY,db)}setInterval(()=>upsert(metric()),800);addEventListener('pagehide',()=>upsert(metric()));
function renderRecords(){let db=readJSON(REC_KEY,{});if(Array.isArray(db))db={'Padrão':db};const keys=Object.keys(db).sort();const sections=keys.length?keys.map(dk=>{const r=db[dk]||[];return `<section class="ppg-diff-section"><div class="ppg-diff-title">◆ ${dk}</div>${r.length?`<div class="ppg-record-list">${r.map((x,i)=>`<div class="ppg-record"><b>#${i+1}</b><span><strong>${formatValue(x.value)}</strong><br><small>${new Date(x.at).toLocaleDateString('pt-BR')}</small></span><small>${CFG.metric}</small></div>`).join('')}</div>`:`<div class="ppg-empty">Sem marcas nesta dificuldade.</div>`}</section>`}).join(''):`<div class="ppg-empty">Ainda não há marca registrada neste navegador.</div>`;open(`<h2>Placares locais</h2><p>Os recordes são gravados automaticamente a cada partida.</p>${sections}`)}$('#ppg-records').onclick=renderRecords;
function pollLife(){let v=null;try{v=(typeof lives!=='undefined')?Math.max(0,Math.min(100,lives/3*100)):null}catch{}const e=$('#ppg-life'),f=$('#ppg-life-fill'),n=$('#ppg-life-num');if(v==null){e.classList.remove('show')}else{e.classList.add('show');f.style.width=v+'%';n.textContent=Math.round(v)}}setInterval(pollLife,250);pollLife();syncNative(prefs.sound);
})();
</script>
