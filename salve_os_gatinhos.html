<style>
:root{color-scheme:dark;--ink:#fff6d8;--red:#ef476f;--yellow:#ffd166;--blue:#49c6e5;--navy:#11162d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090d1d}
body{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);touch-action:none;user-select:none}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 30%,#24305e,#090d1d 72%)}
#stage{position:relative;width:min(calc(100vw - 12px),calc((100vh - 12px)*16/9));aspect-ratio:16/9;max-height:calc(100vh - 12px);overflow:hidden;border:3px solid #f8d878;border-radius:10px;box-shadow:0 0 0 3px #562d5f,0 18px 70px #000a;background:#11162d}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#top{position:absolute;left:2%;right:2%;top:2%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:2px 2px #111;font-weight:900;font-size:clamp(10px,2.1vmin,20px)}
.pill{background:#101528d9;border:2px solid #fff4;padding:.35em .6em;border-radius:8px;box-shadow:3px 3px #0008}.lives{color:#ff819d}.combo{color:#ffd166}
#sound{position:absolute;right:2%;bottom:2%;width:clamp(34px,7vmin,56px);aspect-ratio:1;border:2px solid #fff;border-radius:8px;background:#20294d;color:white;font-size:clamp(16px,3vmin,24px);cursor:pointer}
#touch{position:absolute;left:2%;bottom:2%;display:flex;gap:10px}.touchBtn{width:clamp(46px,11vmin,78px);aspect-ratio:1;border:2px solid #fff;border-radius:12px;background:#26345dcc;color:white;font-size:clamp(22px,5vmin,38px);font-weight:bold;touch-action:none}.touchBtn:active{background:#ef476f}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#080b19c9;backdrop-filter:blur(2px)}
.card{width:min(88%,620px);padding:clamp(14px,4vmin,34px);text-align:center;background:#192144;border:3px solid #ffd166;border-radius:12px;box-shadow:8px 8px #080b19}.card h1{margin:.1em 0;color:#ffd166;font-size:clamp(22px,6vmin,54px);text-shadow:4px 4px #b43b61}.card p{font-size:clamp(11px,2.2vmin,19px);line-height:1.45}.card button{border:0;border-bottom:5px solid #9c2d50;border-radius:8px;padding:.7em 1.4em;background:#ef476f;color:#fff;font:900 clamp(14px,3vmin,24px) inherit;cursor:pointer}.hidden{display:none!important}
@media (pointer:fine){#touch{opacity:.32}.touchBtn:hover{opacity:1}}
</style>

<style id="ppg-quality-controls-style">
#ppg-quality-pause-overlay{position:fixed;z-index:2147483635;inset:0;display:none;place-items:center;padding:18px;background:rgba(4,6,16,.82);backdrop-filter:blur(9px);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff}#ppg-quality-pause-overlay.open{display:grid}.ppg-quality-pause-card{width:min(440px,94vw);padding:24px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:linear-gradient(145deg,#17192d,#090b17);box-shadow:0 30px 100px #000a;text-align:center}.ppg-quality-pause-card h2{margin:0 0 8px;font-size:clamp(25px,5vw,38px);color:#e8dcff}.ppg-quality-pause-card p{margin:0 0 18px;color:#bcc2d8;line-height:1.45}.ppg-quality-pause-actions{display:grid;gap:9px}.ppg-quality-pause-actions button,.ppg-quality-pause-actions a{display:block;width:100%;padding:12px 14px;border:1px solid #ffffff22;border-radius:12px;background:#242941;color:#fff;font:800 14px/1.2 Inter,"Segoe UI",system-ui,sans-serif;text-decoration:none;cursor:pointer}.ppg-quality-pause-actions button:first-child{background:linear-gradient(135deg,#6d5cff,#27d9c0);color:#081016}.ppg-quality-pause-actions :is(button,a):hover{filter:brightness(1.13)}#ppg-quality-pause,#ppg-quality-restart{white-space:nowrap}.ppg-quality-paused body{overflow:hidden!important}
</style>
<script id="ppg-quality-controls-runtime">
(()=>{'use strict';
const qs=new URLSearchParams(location.search);if(qs.get('preview')==='1'||qs.has('preview'))return;
const ADD_RESTART=true;
const realPerfNow=performance.now.bind(performance),realDateNow=Date.now.bind(Date),nativeRAF=window.requestAnimationFrame.bind(window),nativeSetInterval=window.setInterval.bind(window),nativeSetTimeout=window.setTimeout.bind(window);
let paused=false,pausePerf=0,pauseDate=0,perfOffset=0,dateOffset=0;
const gamePerfNow=()=>{const n=realPerfNow();return n-perfOffset-(paused?n-pausePerf:0)};
const gameDateNow=()=>{const n=realDateNow();return n-dateOffset-(paused?n-pauseDate:0)};
try{Object.defineProperty(performance,'now',{value:gamePerfNow,configurable:true})}catch{}
try{Date.now=gameDateNow}catch{}
window.requestAnimationFrame=cb=>nativeRAF(function gate(){if(paused)return nativeRAF(gate);cb(gamePerfNow())});
window.setInterval=(fn,ms,...args)=>typeof fn==='function'?nativeSetInterval(()=>{if(!paused)fn(...args)},ms):nativeSetInterval(fn,ms,...args);
window.setTimeout=(fn,ms,...args)=>{if(typeof fn!=='function')return nativeSetTimeout(fn,ms,...args);const run=()=>{if(paused)return nativeSetTimeout(run,50);fn(...args)};return nativeSetTimeout(run,ms)};
const L={
 en:{pause:'Pause',paused:'Paused',desc:'Gameplay time and controls are frozen.',resume:'Resume game',restart:'New game',exit:'Exit to Mini Games'},
 'pt-BR':{pause:'Pausar',paused:'Pausado',desc:'O tempo e os controles da partida estão congelados.',resume:'Continuar jogo',restart:'Novo jogo',exit:'Sair para Mini Games'},
 es:{pause:'Pausa',paused:'En pausa',desc:'El tiempo y los controles están congelados.',resume:'Continuar',restart:'Nueva partida',exit:'Salir a Mini Games'},
 fr:{pause:'Pause',paused:'En pause',desc:'Le temps et les contrôles sont figés.',resume:'Reprendre',restart:'Nouvelle partie',exit:'Quitter vers Mini Games'},
 de:{pause:'Pause',paused:'Pausiert',desc:'Spielzeit und Steuerung sind angehalten.',resume:'Fortsetzen',restart:'Neues Spiel',exit:'Zu Mini Games'},
 it:{pause:'Pausa',paused:'In pausa',desc:'Tempo e controlli di gioco sono fermi.',resume:'Riprendi',restart:'Nuova partita',exit:'Esci ai Mini Games'},
 tr:{pause:'Duraklat',paused:'Duraklatıldı',desc:'Oyun süresi ve kontroller donduruldu.',resume:'Devam et',restart:'Yeni oyun',exit:"Mini Games'e çık"},
 ru:{pause:'Пауза',paused:'Игра на паузе',desc:'Игровое время и управление остановлены.',resume:'Продолжить',restart:'Новая игра',exit:'В Mini Games'},
 ja:{pause:'一時停止',paused:'一時停止中',desc:'ゲーム時間と操作を停止しています。',resume:'再開',restart:'新しいゲーム',exit:'ミニゲームへ'},
 ko:{pause:'일시정지',paused:'일시정지됨',desc:'게임 시간과 조작이 멈췄습니다.',resume:'계속',restart:'새 게임',exit:'미니게임으로'},
 'zh-CN':{pause:'暂停',paused:'已暂停',desc:'游戏时间和操作已冻结。',resume:'继续',restart:'新游戏',exit:'返回小游戏菜单'}
};
function lang(){const raw=(document.documentElement.lang||navigator.language||'en').replace('_','-');if(/^pt/i.test(raw))return'pt-BR';if(/^zh/i.test(raw))return'zh-CN';const k=raw.split('-')[0];return L[k]?k:'en'}function t(k){return(L[lang()]||L.en)[k]||L.en[k]}
let overlay,pauseBtn,restartBtn;
function refresh(){if(pauseBtn)pauseBtn.textContent='⏸ '+t('pause');if(restartBtn)restartBtn.textContent='↻ '+t('restart');if(!overlay)return;overlay.querySelector('h2').textContent=t('paused');overlay.querySelector('p').textContent=t('desc');overlay.querySelector('[data-act=resume]').textContent='▶ '+t('resume');overlay.querySelector('[data-act=restart]').textContent='↻ '+t('restart');overlay.querySelector('[data-act=exit]').textContent='↩ '+t('exit')}
function releaseKeys(){for(const key of ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D',' '])document.dispatchEvent(new KeyboardEvent('keyup',{key,bubbles:true}))}
function setPaused(next){next=!!next;if(next===paused)return;if(next){releaseKeys();pausePerf=realPerfNow();pauseDate=realDateNow();paused=true}else{perfOffset+=realPerfNow()-pausePerf;dateOffset+=realDateNow()-pauseDate;paused=false}window.__PPG_PAUSED__=paused;document.documentElement.classList.toggle('ppg-quality-paused',paused);overlay?.classList.toggle('open',paused);document.dispatchEvent(new CustomEvent(paused?'ppg:pause':'ppg:resume'));if(!paused)nativeSetTimeout(()=>document.activeElement?.blur?.(),0)}
function restart(){if(paused)setPaused(false);if(typeof window.PPGGameRestart==='function'){window.PPGGameRestart();return}location.reload()}
function mount(){if(document.getElementById('ppg-quality-pause-overlay'))return;overlay=document.createElement('div');overlay.id='ppg-quality-pause-overlay';overlay.innerHTML='<div class="ppg-quality-pause-card" role="dialog" aria-modal="true"><h2></h2><p></p><div class="ppg-quality-pause-actions"><button data-act="resume"></button><button data-act="restart"></button><a data-act="exit" href="menu_minigames.html"></a></div></div>';document.body.appendChild(overlay);overlay.querySelector('[data-act=resume]').onclick=()=>setPaused(false);overlay.querySelector('[data-act=restart]').onclick=restart;const toolbar=document.getElementById('ppg-toolbar');if(toolbar){pauseBtn=document.createElement('button');pauseBtn.id='ppg-quality-pause';pauseBtn.type='button';pauseBtn.onclick=()=>setPaused(!paused);const menu=toolbar.querySelector('a[href*="menu_minigames"]');toolbar.insertBefore(pauseBtn,menu||null);if(ADD_RESTART){restartBtn=document.createElement('button');restartBtn.id='ppg-quality-restart';restartBtn.type='button';restartBtn.onclick=restart;toolbar.insertBefore(restartBtn,menu||null)}}refresh();new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.ppg-modal.open,dialog[open],.modal.open')&&!paused)return;e.preventDefault();e.stopImmediatePropagation();setPaused(!paused);return}if(paused){e.preventDefault();e.stopImmediatePropagation()}},true);for(const ev of ['pointerdown','mousedown','touchstart','click'])document.addEventListener(ev,e=>{if(paused&&!e.target.closest('#ppg-quality-pause-overlay')){e.preventDefault();e.stopImmediatePropagation()}},true);
window.PPGQualityControls={pause:()=>setPaused(true),resume:()=>setPaused(false),toggle:()=>setPaused(!paused),restart,get paused(){return paused}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>

<body><main id="app"><section id="stage" aria-label="Jogo Salve os Gatinhos">
<canvas id="game" width="960" height="540"></canvas>
<div id="top"><div class="pill">PONTOS <span id="score">000000</span><br><span class="combo" id="combo">COMBO x1</span></div><div class="pill lives" id="lives">♥ ♥ ♥</div></div>
<div id="touch"><button class="touchBtn" id="left" aria-label="Mover para esquerda">◀</button><button class="touchBtn" id="right" aria-label="Mover para direita">▶</button></div>
<button id="sound" aria-label="Ativar ou desativar som">🔊</button>
<div id="overlay"><div class="card"><h1 id="title">SALVE OS GATINHOS!</h1><p id="message">Mova os bombeiros com <b>← →</b>, <b>A D</b> ou toque nos botões.<br>Amorteça a queda dos gatinhos e faça combos!</p><button id="start">INICIAR RESGATE</button></div></div>
</section></main>
<script>
'use strict';
// O jogo usa uma resolução lógica fixa. O CSS escala tudo para caber na tela sem rolagem.
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=960,H=540,GROUND=492;
const ui={score:document.querySelector('#score'),combo:document.querySelector('#combo'),lives:document.querySelector('#lives'),overlay:document.querySelector('#overlay'),title:document.querySelector('#title'),message:document.querySelector('#message'),start:document.querySelector('#start'),sound:document.querySelector('#sound')};
let state='menu',score=0,lives=3,combo=1,best=0,elapsed=0,spawnTimer=1.2,shake=0,flash=0,muted=false,last=performance.now(),lastLifeLoss=-99,lifeRegenAcc=0,rescueCount=0;
const keys={left:false,right:false};
const player={x:440,y:453,w:94,h:21,vx:0,max:430,acc:1900,drag:9};
let cats=[],particles=[],stars=[],windows=[];
for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*330,s:Math.random()<.18?2:1,t:Math.random()*6});
for(let b=0;b<6;b++)for(let f=0;f<5;f++)windows.push({x:25+b*158+32+(f%2)*65,y:100+f*64,b,f,lit:Math.random()<.36});

// Sons sintetizados: nenhum arquivo externo é necessário.
let ac=null,master=null,musicTimer=null;
function audioOn(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.18;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume();startMusic()}
function tone(freq,dur,type='square',vol=.12,slide=0,when=0){if(muted||!ac)return;const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur)}
function sfx(name){if(name==='catch'){tone(520,.08,'square',.16,180);tone(790,.14,'square',.1,80,.07)}if(name==='miss'){tone(150,.32,'sawtooth',.12,-80)}if(name==='spawn')tone(730,.06,'square',.05,-150)}
function startMusic(){if(musicTimer||!ac)return;let n=0;const notes=[220,277,330,440,330,277,247,330];musicTimer=setInterval(()=>{if(state==='play'&&!muted){tone(notes[n++%notes.length],.11,'triangle',.035);if(n%4===1)tone(110,.16,'square',.025,-20)}},240)}

function reset(){score=0;lives=3;combo=1;elapsed=0;spawnTimer=.8;cats=[];particles=[];player.x=433;player.vx=0;lastLifeLoss=-99;lifeRegenAcc=0;rescueCount=0;state='play';ui.overlay.classList.add('hidden');syncUI();audioOn()}
function syncUI(){ui.score.textContent=String(score).padStart(6,'0');ui.combo.textContent='COMBO x'+combo;ui.lives.textContent='♥ '.repeat(lives).trim()||'SEM VIDAS'}
function gameOver(){state='over';best=Math.max(best,score);ui.title.textContent='FIM DO RESGATE';ui.message.innerHTML=`Pontuação: <b>${score}</b><br>Recorde desta sessão: <b>${best}</b>`;ui.start.textContent='TENTAR NOVAMENTE';ui.overlay.classList.remove('hidden')}

// A lógica de spawn funciona como um diretor de dificuldade: observa o lado do jogador,
// evita sequências injustas e aumenta gradualmente vento, frequência e variedade.
function spawnCat(){const difficulty=Math.min(1,elapsed/95),safe=Math.random()<.68;let choices=windows.filter(w=>w.f<3);if(safe&&cats.length)choices=choices.filter(w=>Math.abs(w.x-cats[cats.length-1].x)>100);let win=choices[(Math.random()*choices.length)|0];const dir=Math.sign((player.x+player.w/2)-win.x);cats.push({x:win.x,y:win.y+16,vx:(Math.random()-.5)*28+dir*18*difficulty,vy:-35-Math.random()*30,r:13,rot:0,spin:(Math.random()-.5)*4,phase:Math.random()*7,color:['#f6a33b','#e9e0d0','#9297a5','#e98181'][(Math.random()*4)|0],smart:Math.random()<difficulty*.45});burst(win.x,win.y+15,'#ffd166',4);sfx('spawn')}
function burst(x,y,color,n=10){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-45,life:.35+Math.random()*.45,max:.8,color,size:2+Math.random()*4})}}
function update(dt){if(state!=='play')return;elapsed+=dt;if(lives<3&&elapsed-lastLifeLoss>12){lifeRegenAcc+=dt;if(lifeRegenAcc>=20){lifeRegenAcc=0;lives++;sfx('catch');syncUI()}}shake=Math.max(0,shake-dt*18);flash=Math.max(0,flash-dt*3);
 const axis=(keys.right?1:0)-(keys.left?1:0);player.vx+=axis*player.acc*dt;player.vx*=Math.exp(-player.drag*dt);player.vx=Math.max(-player.max,Math.min(player.max,player.vx));player.x=Math.max(5,Math.min(W-player.w-5,player.x+player.vx*dt));
 spawnTimer-=dt;if(spawnTimer<=0){spawnCat();const d=Math.min(1,elapsed/100);spawnTimer=.64+Math.random()*.68+(1-d)*.55}
 const wind=Math.sin(elapsed*.73)*12*Math.min(1,elapsed/70);
 for(let i=cats.length-1;i>=0;i--){const c=cats[i];c.vy+=390*dt;c.vx+=wind*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.spin*dt;
   // Gatinhos mais espertos tentam reduzir a deriva quando a maca está próxima.
   if(c.smart&&c.y>300)c.vx+=Math.sign(player.x+player.w/2-c.x)*16*dt;
   if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*.55}else if(c.x>W-c.r){c.x=W-c.r;c.vx=-Math.abs(c.vx)*.55}
   const caught=c.vy>0&&c.y+c.r>=player.y&&c.y-c.r<player.y+player.h&&c.x>player.x-5&&c.x<player.x+player.w+5;
   if(caught){score+=100*combo;combo=Math.min(9,combo+1);rescueCount++;if(rescueCount%15===0&&lives<3){lives++;lifeRegenAcc=0}sfx('catch');c.vy=-250;c.vx+=player.vx*.25;burst(c.x,c.y,c.color,16);cats.splice(i,1);shake=4;flash=.3;syncUI();continue}
   if(c.y>H+20){cats.splice(i,1);lives--;lastLifeLoss=elapsed;lifeRegenAcc=0;combo=1;shake=12;burst(c.x,GROUND,'#ef476f',18);sfx('miss');syncUI();if(lives<=0)gameOver()}
 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy+=240*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}
}

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11183d');g.addColorStop(.7,'#3d315b');g.addColorStop(1,'#df6c63');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);stars.forEach(s=>{s.t+=.02;ctx.globalAlpha=.45+Math.sin(s.t)*.35;rect(s.x,s.y,s.s,s.s,'#fff3ba')});ctx.globalAlpha=1;rect(778,62,70,70,'#ffe8a3');rect(766,74,94,46,'#ffe8a3');rect(790,50,46,94,'#ffe8a3');rect(806,62,30,16,'#ffd383')}
function drawCity(){for(let b=0;b<6;b++){const x=8+b*158,h=375+(b%3)*22;rect(x,GROUND-h,145,h,'#202645');rect(x+7,GROUND-h+8,131,h-8,'#2d3355');rect(x-5,GROUND-h,155,9,'#151a35');for(let f=0;f<5;f++)for(let q=0;q<2;q++){const wx=x+22+q*67,wy=GROUND-h+45+f*64;rect(wx-3,wy-3,34,38,'#151a28');rect(wx,wy,28,32,(f+b+q)%3===0?'#ffc85b':'#3d4967');rect(wx+13,wy,2,32,'#202640');rect(wx,wy+15,28,2,'#202640')}}rect(0,GROUND,W,H-GROUND,'#151a2c');rect(0,GROUND,W,6,'#59627e');for(let x=0;x<W;x+=48)rect(x,510,28,4,'#303951')}
function drawCat(c){ctx.save();ctx.translate(Math.round(c.x),Math.round(c.y));ctx.rotate(c.rot*.18);rect(-10,-9,20,17,c.color);rect(-8,-15,16,10,c.color);rect(-8,-19,5,7,c.color);rect(3,-19,5,7,c.color);rect(-5,-12,3,3,'#182033');rect(3,-12,3,3,'#182033');rect(-1,-8,3,2,'#f07575');rect(-12,5,5,7,c.color);rect(7,5,5,7,c.color);ctx.restore()}
function drawPlayer(){const x=Math.round(player.x),y=player.y;rect(x-10,y-4,player.w+20,9,'#fff3cf');rect(x-5,y+5,player.w+10,9,'#ef476f');for(let i=0;i<5;i++){rect(x+i*20,y-2,11,5,i%2?'#ef476f':'#ffd166')}rect(x+6,y+14,15,22,'#b72f52');rect(x+player.w-21,y+14,15,22,'#b72f52');rect(x+5,y+34,18,5,'#11162d');rect(x+player.w-23,y+34,18,5,'#11162d');rect(x+12,y+17,9,8,'#ffd3a3');rect(x+player.w-21,y+17,9,8,'#ffd3a3')}
function draw(){ctx.save();const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.translate(sx,sy);drawSky();drawCity();cats.forEach(drawCat);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);rect(p.x,p.y,p.size,p.size,p.color)});ctx.globalAlpha=1;drawPlayer();if(flash){ctx.globalAlpha=flash*.2;rect(0,0,W,H,'#fff');ctx.globalAlpha=1}ctx.restore()}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function bindHold(id,key){const el=document.querySelector(id);const on=e=>{e.preventDefault();keys[key]=true;audioOn()},off=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}
bindHold('#left','left');bindHold('#right','right');
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if([' ','Enter'].includes(e.key)&&state!=='play')reset();if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();audioOn()});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
