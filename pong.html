<head><script>window.RELEASE_CONFIG={"id": "neon_pong", "portal": "standalone", "cooldown": 75000, "aimReward": false, "steam": "https://store.steampowered.com/search/?developer=Projeto+Primata+Games", "website": "https://www.projetoprimata.com", "guide": {"pt": "Rebata a bola e procure ângulos para marcar. No modo solo, deslize o dedo na quadra para mover a raquete.", "en": "Return the ball and find angles to score. In solo mode, drag inside the court to move the paddle.", "bn": "প্যাডলের মাঝখান দিয়ে মারলে সুপার চার্জ হয়। দীর্ঘ র‍্যালি, নির্ভুলতা, কম্বো, গতি, গোল, রক্ষা এবং সময়মতো শক্তিবর্ধক ব্যবহার দক্ষতার পয়েন্ট বাড়ায়। গোলেই বিজয়ী নির্ধারিত হয়। রিপ্লে আছে এবং সময়ের সঙ্গে কম্পিউটার ক্লান্ত হয়।", "en-US": "Center hits charge your Super. Long rallies, precision, combos, speed, goals, saves and well-timed power-ups build skill points. Goals decide the winner. Includes replays and a computer opponent that tires over time.", "zh-CN": "击中球拍中心可为超级技能充能。长回合、精准击球、连击、速度、进球、救球和适时使用强化道具都能增加技巧分。进球决定胜负。游戏包含回放，电脑对手会逐渐疲劳。", "zh-TW": "擊中球拍中心可為超級技能充能。長回合、精準擊球、連擊、速度、進球、救球和適時使用強化道具都能增加技巧分。進球決定勝負。遊戲包含重播，電腦對手會逐漸疲勞。", "hi": "बीच से किए गए हिट सुपर को चार्ज करते हैं। लंबी रैली, सटीकता, कॉम्बो, गति, गोल, बचाव और सही समय पर पावर-अप से कौशल अंक मिलते हैं। गोल से विजेता तय होता है। रीप्ले उपलब्ध हैं और कंप्यूटर समय के साथ थकता है।", "es-ES": "Los golpes centrales cargan el supergolpe. Los intercambios largos, la precisión, los combos, la velocidad, los goles, las defensas y los potenciadores oportunos dan puntos de habilidad. Los goles deciden la victoria. Hay repeticiones y el ordenador se fatiga con el tiempo.", "es-419": "Los golpes centrales cargan el supergolpe. Los intercambios largos, la precisión, los combos, la velocidad, los goles, las defensas y los potenciadores oportunos dan puntos de habilidad. Los goles deciden la victoria. Hay repeticiones y la computadora se fatiga con el tiempo.", "fr": "Les frappes centrales chargent le supercoup. Les longs échanges, la précision, les combos, la vitesse, les buts, les sauvetages et les bonus bien utilisés rapportent des points de maîtrise. Les buts décident du vainqueur. Des ralentis sont proposés et l’ordinateur se fatigue avec le temps.", "ar": "تشحن الضربات بمنتصف المضرب الضربة الخارقة. تمنح التبادلات الطويلة والدقة والضربات المتتالية والسرعة والأهداف والتصديات والتعزيزات المستخدمة في وقتها نقاط مهارة. تحدد الأهداف الفائز. تتوفر الإعادة ويتعب الكمبيوتر بمرور الوقت.", "ru": "Удары центром заряжают суперудар. Долгие розыгрыши, точность, комбо, скорость, голы, спасения и своевременные усиления дают очки мастерства. Победителя определяют голы. Есть повторы, а компьютерный соперник со временем устаёт.", "pt-BR": "Acertos centrais carregam o Super. Trocas longas, precisão, combos, velocidade, gols, defesas e poderes usados na hora certa aumentam os pontos de habilidade. Os gols decidem o vencedor. Há replays e o adversário controlado pelo computador se cansa com o tempo.", "pt-PT": "Acertos centrais carregam o Super. Trocas longas, precisão, combos, velocidade, golos, defesas e poderes usados na altura certa aumentam os pontos de habilidade. Os golos decidem o vencedor. Há repetições e o adversário controlado pelo computador cansa-se com o tempo.", "de": "Mittige Treffer laden den Superschlag auf. Lange Ballwechsel, Präzision, Kombos, Tempo, Tore, Rettungen und passend eingesetzte Power-ups bringen Könnenspunkte. Die Tore entscheiden den Sieger. Es gibt Wiederholungen und der Computergegner ermüdet mit der Zeit.", "ja": "パドルの中心で打ち返すとスーパー技がたまります。長いラリー、精度、コンボ、速度、得点、セーブ、効果的なアイテム使用でスキルポイントを獲得します。勝敗は得点で決まります。リプレイがあり、コンピューターは時間とともに疲労します。", "ko": "패들 중앙으로 치면 슈퍼 기술이 충전됩니다. 긴 랠리, 정확도, 콤보, 속도, 득점, 수비와 적절한 아이템 사용으로 기술 점수를 얻습니다. 승패는 득점으로 결정됩니다. 리플레이가 있으며 컴퓨터 상대는 시간이 지나면 지칩니다.", "it": "I colpi centrali caricano il supercolpo. Scambi lunghi, precisione, combo, velocità, gol, salvataggi e potenziamenti ben utilizzati aumentano i punti abilità. I gol decidono il vincitore. Ci sono replay e il computer si affatica nel tempo.", "bg": "Ударите с центъра зареждат суперудара. Дългите разигравания, точността, комбото, скоростта, головете, спасяванията и навременните усилвания носят точки за умение. Головете определят победителя. Има повторения, а компютърният противник се уморява с времето.", "cs": "Zásahy středem nabíjejí superúder. Dlouhé výměny, přesnost, komba, rychlost, góly, záchrany a vhodně použité bonusy přinášejí body za dovednost. Vítěze určují góly. Hra nabízí opakované záběry a počítačový soupeř se postupně unavuje.", "da": "Træffere med midten oplader superslaget. Lange dueller, præcision, kombinationer, fart, mål, redninger og velvalgte bonusser giver færdighedspoint. Mål afgør vinderen. Der er gentagelser, og computermodstanderen bliver træt med tiden.", "nl": "Treffers met het midden laden de superslag op. Lange rally’s, precisie, combo’s, snelheid, doelpunten, reddingen en slim gebruikte power-ups leveren vaardigheidspunten op. Doelpunten bepalen de winnaar. Er zijn herhalingen en de computertegenstander raakt geleidelijk vermoeid.", "fi": "Keskiosumat lataavat superiskua. Pitkät pallorallit, tarkkuus, kombot, nopeus, maalit, torjunnat ja oikein ajoitetut tehosteet tuovat taitopisteitä. Maalit ratkaisevat voittajan. Pelissä on uusintoja, ja tietokonevastustaja väsyy ajan myötä.", "el": "Τα χτυπήματα στο κέντρο φορτίζουν το σούπερ χτύπημα. Μεγάλες ανταλλαγές, ακρίβεια, συνδυασμοί, ταχύτητα, γκολ, αποκρούσεις και σωστή χρήση ενισχύσεων δίνουν πόντους δεξιότητας. Τα γκολ κρίνουν τον νικητή. Υπάρχουν επαναλήψεις και ο υπολογιστής κουράζεται με τον χρόνο.", "hu": "A középső találatok töltik a szuperütést. Hosszú labdamenetek, pontosság, kombók, sebesség, gólok, mentések és jól időzített erősítések adnak ügyességi pontokat. A gólok döntik el a győztest. Vannak visszajátszások, és a gépi ellenfél idővel elfárad.", "ms": "Pukulan tengah mengecas pukulan super. Rali panjang, ketepatan, kombo, kelajuan, gol, penyelamatan dan peningkatan kuasa yang tepat pada masanya memberi mata kemahiran. Gol menentukan pemenang. Terdapat ulang tayang dan lawan komputer menjadi letih dengan masa.", "id": "Pukulan tengah mengisi pukulan super. Reli panjang, ketepatan, kombo, kecepatan, gol, penyelamatan dan peningkat kekuatan yang tepat waktu memberi poin keterampilan. Gol menentukan pemenang. Ada tayangan ulang dan lawan komputer akan lelah seiring waktu.", "no": "Treff med midten lader superslaget. Lange ballvekslinger, presisjon, kombinasjoner, fart, mål, redninger og godt timede forsterkninger gir ferdighetspoeng. Mål avgjør vinneren. Spillet har repriser, og datamotstanderen blir sliten over tid.", "pl": "Trafienia środkiem ładują superuderzenie. Długie wymiany, precyzja, kombinacje, szybkość, gole, obrony i dobrze użyte wzmocnienia dają punkty umiejętności. Gole decydują o zwycięstwie. Są powtórki, a komputerowy przeciwnik z czasem się męczy.", "ro": "Loviturile centrale încarcă superlovitura. Schimburile lungi, precizia, combinațiile, viteza, golurile, salvările și bonusurile folosite la timp aduc puncte de îndemânare. Golurile decid câștigătorul. Există reluări, iar adversarul controlat de calculator obosește în timp.", "sv": "Träffar med mitten laddar superslaget. Långa bollväxlingar, precision, kombinationer, fart, mål, räddningar och vältajmade förstärkningar ger färdighetspoäng. Målen avgör vinnaren. Det finns repriser och datormotståndaren blir trött med tiden.", "th": "ตีด้วยกลางไม้เพื่อชาร์จท่าซูเปอร์ การโต้ลูกยาว ความแม่นยำ คอมโบ ความเร็ว การทำประตู การเซฟ และการใช้พลังในเวลาที่เหมาะสมเพิ่มคะแนนทักษะ ประตูเป็นตัวตัดสินผู้ชนะ มีภาพย้อนและคู่แข่งคอมพิวเตอร์จะเหนื่อยตามเวลา", "tr": "Ortadan vuruşlar süper vuruşu doldurur. Uzun ralliler, isabet, kombolar, hız, goller, kurtarışlar ve zamanında kullanılan güçlendirmeler beceri puanı kazandırır. Kazananı goller belirler. Tekrar gösterimleri vardır ve bilgisayar rakibi zamanla yorulur.", "uk": "Удари центром заряджають суперудар. Довгі розіграші, точність, комбо, швидкість, голи, порятунки та вчасні підсилення дають очки майстерності. Переможця визначають голи. Є повтори, а комп’ютерний суперник із часом втомлюється.", "vi": "Đánh bằng giữa vợt để nạp siêu chiêu. Loạt bóng dài, độ chính xác, liên hoàn, tốc độ, bàn thắng, cứu bóng và dùng vật phẩm đúng lúc giúp tăng điểm kỹ năng. Bàn thắng quyết định người thắng. Có phát lại và đối thủ máy sẽ mệt dần.", "sk": "Zásahy stredom nabíjajú superúder. Dlhé výmeny, presnosť, kombá, rýchlosť, góly, záchrany a správne použité bonusy prinášajú body za zručnosť. Víťaza určujú góly. Hra ponúka opakované zábery a počítačový súper sa postupne unavuje.", "fa": "ضربه با مرکز راکت، ضربهٔ ویژه را شارژ می‌کند. رفت‌وبرگشت‌های طولانی، دقت، ضربات پیاپی، سرعت، گل، مهار و تقویت‌کننده‌های به‌موقع امتیاز مهارت می‌دهند. گل‌ها برنده را تعیین می‌کنند. بازپخش وجود دارد و حریف رایانه‌ای با گذشت زمان خسته می‌شود."}, "directions": {"en-US": {"up": "Up", "down": "Down", "left": "Left", "right": "Right"}, "pt-BR": {"up": "Para cima", "down": "Para baixo", "left": "Para a esquerda", "right": "Para a direita"}, "pt-PT": {"up": "Para cima", "down": "Para baixo", "left": "Para a esquerda", "right": "Para a direita"}, "es-ES": {"up": "Arriba", "down": "Abajo", "left": "Izquierda", "right": "Derecha"}, "es-419": {"up": "Arriba", "down": "Abajo", "left": "Izquierda", "right": "Derecha"}, "fr": {"up": "Haut", "down": "Bas", "left": "Gauche", "right": "Droite"}, "de": {"up": "Nach oben", "down": "Nach unten", "left": "Nach links", "right": "Nach rechts"}, "it": {"up": "Su", "down": "Giù", "left": "Sinistra", "right": "Destra"}, "zh-CN": {"up": "向上", "down": "向下", "left": "向左", "right": "向右"}, "zh-TW": {"up": "向上", "down": "向下", "left": "向左", "right": "向右"}, "ja": {"up": "上", "down": "下", "left": "左", "right": "右"}, "ko": {"up": "위", "down": "아래", "left": "왼쪽", "right": "오른쪽"}, "ar": {"up": "أعلى", "down": "أسفل", "left": "يسار", "right": "يمين"}, "fa": {"up": "بالا", "down": "پایین", "left": "چپ", "right": "راست"}, "hi": {"up": "ऊपर", "down": "  "Ukážkoví hráči", "Super", "Chyba pri behu", "Vyskytla sa neočakávaná chyba. Obnovte stránku a skúste to znova."], "fa": ["ترکیب {n}×", "ضریب ×{n}", "پاداش ترکیب", "ضربهٔ بی‌نقص", "ضربه به مرکز", "نجات شبح‌وار", "رالی {n}", "سرعت فوق‌العاده", "میدان شعله‌ور", "ادامه بده", "تقویت‌کننده آماده است", "برداشت هوشمندانه", "تقویت‌کننده برداشته شد", "دفع با مصونیت", "زمان کندشده", "فشار سه توپ", "سپر آماده", "زمان‌بندی قدرت ویژه", "انفجار نئون", "قدرت ویژه", "میدان در حال تغییر", "میدان به حالت عادی برگشت", "رایانه در حال خستگی", "واکنش‌ها کند می‌شوند", "رایانه خسته است", "احتمال خطا بیشتر است", "ولتاژ نهایی", "امتیاز تعیین‌کننده", "نجات سرنوشت‌ساز", "جان اضافه استفاده شد", "امتیاز نجات یافت", "کیفیت گل", "گل!", "بازپخش فوری", "بازیکنان نمایشی", "ویژه", "خطای اجرا", "خطای غیرمنتظره‌ای رخ داد. برای تلاش دوباره صفحه را بازخوانی کنید."]}, "neonGuide": {"en-US": "Center hits charge your Super. Long rallies, precision, combos, speed, goals, saves and well-timed power-ups build skill points. Goals decide the winner. Includes replays and a computer opponent that tires over time.", "zh-CN": "击中球拍中心可为超级技能充能。长回合、精准击球、连击、速度、进球、救球和适时使用强化道具都能增加技巧分。进球决定胜负。游戏包含回放，电脑对手会逐渐疲劳。", "zh-TW": "擊中球拍中心可為超級技能充能。長回合、精準擊球、連擊、速度、進球、救球和適時使用強化道具都能增加技巧分。進球決定勝負。遊戲包含重播，電腦對手會逐漸疲勞。", "hi": "बीच से किए गए हिट सुपर को चार्ज करते हैं। लंबी रैली, सटीकता, कॉम्बो, गति, गोल, बचाव और सही समय पर पावर-अप से कौशल अंक मिलते हैं। गोल से विजेता तय होता है। रीप्ले उपलब्ध हैं और कंप्यूटर समय के साथ थकता है।", "es-ES": "Los golpes centrales cargan el supergolpe. Los intercambios largos, la precisión, los combos, la velocidad, los goles, las defensas y los potenciadores oportunos dan puntos de habilidad. Los goles deciden la victoria. Hay repeticiones y el ordenador se fatiga con el tiempo.", "es-419": "Los golpes centrales cargan el supergolpe. Los intercambios largos, la precisión, los combos, la velocidad, los goles, las defensas y los potenciadores oportunos dan puntos de habilidad. Los goles deciden la victoria. Hay repeticiones y la computadora se fatiga con el tiempo.", "fr": "Les frappes centrales chargent le supercoup. Les longs échanges, la précision, les combos, la vitesse, les buts, les sauvetages et les bonus bien utilisés rapportent des points de maîtrise. Les buts décident du vainqueur. Des ralentis sont proposés et l’ordinateur se fatigue avec le temps.", "ar": "تشحن الضربات بمنتصف المضرب الضربة الخارقة. تمنح التبادلات الطويلة والدقة والضربات المتتالية والسرعة والأهداف والتصديات والتعزيزات المستخدمة في وقتها نقاط مهارة. تحدد الأهداف الفائز. تتوفر الإعادة ويتعب الكمبيوتر بمرور الوقت.", "bn": "প্যাডলের মাঝখান দিয়ে মারলে সুপার চার্জ হয়। দীর্ঘ র‍্যালি, নির্ভুলতা, কম্বো, গতি, গোল, রক্ষা এবং সময়মতো শক্তিবর্ধক ব্যবহার দক্ষতার পয়েন্ট বাড়ায়। গোলেই বিজয়ী নির্ধারিত হয়। রিপ্লে আছে এবং সময়ের সঙ্গে কম্পিউটার ক্লান্ত হয়।", "ru": "Удары центром заряжают суперудар. Долгие розыгрыши, точность, комбо, скорость, голы, спасения и своевременные усиления дают очки мастерства. Победителя определяют голы. Есть повторы, а компьютерный соперник со временем устаёт.", "pt-BR": "Acertos centrais carregam o Super. Trocas longas, precisão, combos, velocidade, gols, defesas e poderes usados na hora certa aumentam os pontos de habilidade. Os gols decidem o vencedor. Há replays e o adversário controlado pelo computador se cansa com o tempo.", "pt-PT": "Acertos centrais carregam o Super. Trocas longas, precisão, combos, velocidade, golos, defesas e poderes usados na altura certa aumentam os pontos de habilidade. Os golos decidem o vencedor. Há repetições e o adversário controlado pelo computador cansa-se com o tempo.", "de": "Mittige Treffer laden den Superschlag auf. Lange Ballwechsel, Präzision, Kombos, Tempo, Tore, Rettungen und passend eingesetzte Power-ups bringen Könnenspunkte. Die Tore entscheiden den Sieger. Es gibt Wiederholungen und der Computergegner ermüdet mit der Zeit.", "ja": "パドルの中心で打ち返すとスーパー技がたまります。長いラリー、精度、コンボ、速度、得点、セーブ、効果的なアイテム使用でスキルポイントを獲得します。勝敗は得点で決まります。リプレイがあり、コンピューターは時間とともに疲労します。", "ko": "패들 중앙으로 치면 슈퍼 기술이 충전됩니다. 긴 랠리, 정확도, 콤보, 속도, 득점, 수비와 적절한 아이템 사용으로 기술 점수를 얻습니다. 승패는 득점으로 결정됩니다. 리플레이가 있으며 컴퓨터 상대는 시간이 지나면 지칩니다.", "it": "I colpi centrali caricano il supercolpo. Scambi lunghi, precisione, combo, velocità, gol, salvataggi e potenziamenti ben utilizzati aumentano i punti abilità. I gol decidono il vincitore. Ci sono replay e il computer si affatica nel tempo.", "bg": "Ударите с центъра зареждат суперудара. Дългите разигравания, точността, комбото, скоростта, головете, спасяванията и навременните усилвания носят точки за умение. Головете определят победителя. Има повторения, а компютърният противник се уморява с времето.", "cs": "Zásahy středem nabíjejí superúder. Dlouhé výměny, přesnost, komba, rychlost, góly, záchrany a vhodně použité bonusy přinášejí body za dovednost. Vítěze určují góly. Hra nabízí opakované záběry a počítačový soupeř se postupně unavuje.", "da": "Træffere med midten oplader superslaget. Lange dueller, præcision, kombinationer, fart, mål, redninger og velvalgte bonusser giver færdighedspoint. Mål afgør vinderen. Der er gentagelser, og computermodstanderen bliver træt med tiden.", "nl": "Treffers met het midden laden de superslag op. Lange rally’s, precisie, combo’s, snelheid, doelpunten, reddingen en slim gebruikte power-ups leveren vaardigheidspunten op. Doelpunten bepalen de winnaar. Er zijn herhalingen en de computertegenstander raakt geleidelijk vermoeid.", "fi": "Keskiosumat lataavat superiskua. Pitkät pallorallit, tarkkuus, kombot, nopeus, maalit, torjunnat ja oikein ajoitetut tehosteet tuovat taitopisteitä. Maalit ratkaisevat voittajan. Pelissä on uusintoja, ja tietokonevastustaja väsyy ajan myötä.", "el": "Τα χτυπήματα στο κέντρο φορτίζουν το σούπερ χτύπημα. Μεγάλες ανταλλαγές, ακρίβεια, συνδυασμοί, ταχύτητα, γκολ, αποκρούσεις και σωστή χρήση ενισχύσεων δίνουν πόντους δεξιότητας. Τα γκολ κρίνουν τον νικητή. Υπάρχουν επαναλήψεις και ο υπολογιστής κουράζεται με τον χρόνο.", "hu": "A középső találatok töltik a szuperütést. Hosszú labdamenetek, pontosság, kombók, sebesség, gólok, mentések és jól időzített erősítések adnak ügyességi pontokat. A gólok döntik el a győztest. Vannak visszajátszások, és a gépi ellenfél idővel elfárad.", "ms": "Pukulan tengah mengecas pukulan super. Rali panjang, ketepatan, kombo, kelajuan, gol, penyelamatan dan peningkatan kuasa yang tepat pada masanya memberi mata kemahiran. Gol menentukan pemenang. Terdapat ulang tayang dan lawan komputer menjadi letih dengan masa.", "id": "Pukulan tengah mengisi pukulan super. Reli panjang, ketepatan, kombo, kecepatan, gol, penyelamatan dan peningkat kekuatan yang tepat waktu memberi poin keterampilan. Gol menentukan pemenang. Ada tayangan ulang dan lawan komputer akan lelah seiring waktu.", "no": "Treff med midten lader superslaget. Lange ballvekslinger, presisjon, kombinasjoner, fart, mål, redninger og godt timede forsterkninger gir ferdighetspoeng. Mål avgjør vinneren. Spillet har repriser, og datamotstanderen blir sliten over tid.", "pl": "Trafienia środkiem ładują superuderzenie. Długie wymiany, precyzja, kombinacje, szybkość, gole, obrony i dobrze użyte wzmocnienia dają punkty umiejętności. Gole decydują o zwycięstwie. Są powtórki, a komputerowy przeciwnik z czasem się męczy.", "ro": "Loviturile centrale încarcă superlovitura. Schimburile lungi, precizia, combinațiile, viteza, golurile, salvările și bonusurile folosite la timp aduc puncte de îndemânare. Golurile decid câștigătorul. Există reluări, iar adversarul controlat de calculator obosește în timp.", "sv": "Träffar med mitten laddar superslaget. Långa bollväxlingar, precision, kombinationer, fart, mål, räddningar och vältajmade förstärkningar ger färdighetspoäng. Målen avgör vinnaren. Det finns repriser och datormotståndaren blir trött med tiden.", "th": "ตีด้วยกลางไม้เพื่อชาร์จท่าซูเปอร์ การโต้ลูกยาว ความแม่นยำ คอมโบ ความเร็ว การทำประตู การเซฟ และการใช้พลังในเวลาที่เหมาะสมเพิ่มคะแนนทักษะ ประตูเป็นตัวตัดสินผู้ชนะ มีภาพย้อนและคู่แข่งคอมพิวเตอร์จะเหนื่อยตามเวลา", "tr": "Ortadan vuruşlar süper vuruşu doldurur. Uzun ralliler, isabet, kombolar, hız, goller, kurtarışlar ve zamanında kullanılan güçlendirmeler beceri puanı kazandırır. Kazananı goller belirler. Tekrar gösterimleri vardır ve bilgisayar rakibi zamanla yorulur.", "uk": "Удари центром заряджають суперудар. Довгі розіграші, точність, комбо, швидкість, голи, порятунки та вчасні підсилення дають очки майстерності. Переможця визначають голи. Є повтори, а комп’ютерний суперник із часом втомлюється.", "vi": "Đánh bằng giữa vợt để nạp siêu chiêu. Loạt bóng dài, độ chính xác, liên hoàn, tốc độ, bàn thắng, cứu bóng và dùng vật phẩm đúng lúc giúp tăng điểm kỹ năng. Bàn thắng quyết định người thắng. Có phát lại và đối thủ máy sẽ mệt dần.", "sk": "Zásahy stredom nabíjajú superúder. Dlhé výmeny, presnosť, kombá, rýchlosť, góly, záchrany a správne použité bonusy prinášajú body za zručnosť. Víťaza určujú góly. Hra ponúka opakované zábery a počítačový súper sa postupne unavuje.", "fa": "ضربه با مرکز راکت، ضربهٔ ویژه را شارژ می‌کند. رفت‌وبرگشت‌های طولانی، دقت، ضربات پیاپی، سرعت، گل، مهار و تقویت‌کننده‌های به‌موقع امتیاز مهارت می‌دهند. گل‌ها برنده را تعیین می‌کنند. بازپخش وجود دارد و حریف رایانه‌ای با گذشت زمان خسته می‌شود."}, "recordLabels": {"en-US": ["Standard", "Expedition", "Daily challenge", "Score", "Cash balance", "Saved only in this browser.", "Combo", "Perfect hits", "Longest rally"], "zh-CN": ["标准", "远征", "每日挑战", "得分", "现金余额", "仅保存在此浏览器中。", "连击", "完美击球", "最长回合"], "zh-TW": ["標準", "遠征", "每日挑戰", "得分", "現金餘額", "僅儲存在此瀏覽器中。", "連擊", "完美擊球", "最長回合"], "hi": ["मानक", "अभियान", "दैनिक चुनौती", "स्कोर", "नकद शेष", "केवल इस ब्राउज़र में सहेजा गया।", "कॉम्बो", "सटीक हिट", "सबसे लंबी रैली"], "es-ES": ["Estándar", "Expedición", "Desafío diario", "Puntuación", "Saldo en efectivo", "Guardado solo en este navegador.", "Combo", "Golpes perfectos", "Intercambio más largo"], "es-419": ["Estándar", "Expedición", "Desafío diario", "Puntuación", "Saldo en efectivo", "Guardado solo en este  const challengeOffset={alien_threat:0,crystal_xplorer:3,domination_wars:6,neon_pong:9,reef_runner:12,snowball_avalanche:15};
 function progressChallengeName(id,index){
  if(!Object.hasOwn(challengeOffset,id)||!Number.isInteger(index)||index<0||index>2)throw new Error('Unknown progress challenge');
  return progressChallenges[locale()][challengeOffset[id]+index];
 }
 function progressCriteria(config,index){
  const goal=config.goals[index],values=config.challengeThresholds?.[index]||[goal,Math.ceil(goal*1.5),goal*2];
  const metricIndex=progressMetricIndex[config.id],code=locale();
  if(metricIndex===undefined||values.length!==3||!values.every(Number.isFinite))throw new Error('Invalid progress criteria');
  const format=value=>{
   const text=metricIndex===2?new Intl.NumberFormat(code,{style:'percent',maximumFractionDigits:2}).format(value/100):new Intl.NumberFormat(code).format(value);
   return ['ar','fa'].includes(code)?'\u2068'+text+'\u2069':text;
  };
  return progressDetails[code][metricIndex]+': '+values.map(format).join(' / ');
 }

 const progressMetricIndex={alien_threat:0,atomic_raid:0,kombo_blocks:0,skate_or_die:0,snowball_avalanche:0,space_raid_2093:0,crystal_xplorer:1,domination_wars:2,'hipódromo_estelar':3,idle_trader:4,neon_pong:5,reef_runner:6,salve_os_gatinhos:7,survive_ninja_mayhem:8};
 function progressMetric(value,id=cfg.id){
  const index=progressMetricIndex[id];
  if(index===undefined||!Number.isFinite(value))throw new Error('Invalid progress metric: '+id);
  const code=locale(),number=index===2?new Intl.NumberFormat(code,{style:'percent',maximumFractionDigits:2}).format(value/100):new Intl.NumberFormat(code).format(value);
  return progressDetails[code][index]+': '+(['ar','fa'].includes(code)?'\u2068'+number+'\u2069':number);
 }
 function progressMessage(key,values={}){
  const index={best:9,daily:10,nearGoal:11,allGoals:12}[key];
  if(index===undefined)throw new Error('Unknown progress message: '+key);
  return progressDetails[locale()][index].replace(/\{(\w+)\}/g,(_,name)=>{
   if(!Object.hasOwn(values,name))throw new Error('Missing progress placeholder: '+name);
   return String(values[name]);
  });
 }

 function resolveLocale(requested){
  if(typeof requested!=='string'||!requested)return null;
  let locale;
  try{locale=new Intl.Locale(requested.replaceAll('_','-'))}catch{return null}
  const {baseName,language,region,script}=locale;
  if(Object.hasOwn(dictionary,baseName))return baseName;
  if(language==='zh')return script==='Hant'||['TW','HK','MO'].includes(region)?'zh-TW':'zh-CN';
  if(language==='pt'&&region==='PT')return 'pt-PT';
  if(language==='es'&&region==='ES')return 'es-ES';
  if(Object.hasOwn(dictionary,language))return language;
  return defaults[language]||null;

  if(!Array.isArray(available)||!available.length)throw new Error('Native locale catalogue is empty');
  const requested=locale(),base=requested.split('-')[0];
  const fallbacks=base==='zh'?[requested]:[requested,base];
  if(base==='pt')fallbacks.push('pt-BR');
  for(const candidate of fallbacks){
   if(available.includes(candidate))return candidate;
   const normalized=resolveLocale(candidate);
   const match=normalized&&available.find(code=>resolveLocale(code)===normalized);
   if(match)return match;
  }
  const english=['en-US','en'].find(code=>available.includes(code))||available.find(code=>resolveLocale(code)==='en-US');
