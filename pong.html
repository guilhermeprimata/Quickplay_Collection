<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06152f">
<title>Neon Pong: Pixel Arena</title>
<style>
:root{--gold:#ff61c7;--blue:#20d9ff;--deep:#031026;--cyan:#52e7ff;--white:#f4fbff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020916;color:var(--white);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;touch-action:none}
body{display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 20%,#0d3470 0,#06152f 36%,#020916 75%)}
#app{width:min(96vw,calc(92vh * 16 / 9),1100px);display:flex;flex-direction:column;gap:clamp(6px,1vh,12px)}
header{height:clamp(32px,5vh,52px);display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;color:var(--gold);font-size:clamp(15px,2.2vh,24px);text-shadow:3px 3px 0 #4d1c94;white-space:nowrap}.hint{font-size:clamp(9px,1.4vh,13px);color:#a8d7ff;text-align:right}
#stage{position:relative;width:100%;aspect-ratio:16/9;border:clamp(3px,.6vh,7px) solid #1cc7df;box-shadow:0 0 0 3px #1b1244,0 0 28px #9d4dff88,inset 0 0 28px #001538;border-radius:10px;overflow:hidden;background:#061b48}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#02091ac9;backdrop-filter:blur(3px);padding:18px;text-align:center}.panel{max-width:560px;padding:clamp(16px,3vh,30px);border:3px solid var(--cyan);background:#061b48;box-shadow:8px 8px 0 #00102c,0 0 24px #52e7ff55}.panel h1{margin:0 0 8px;color:var(--gold);font-size:clamp(25px,5vh,48px);text-shadow:4px 4px 0 #4d1c94}.panel p{margin:7px 0;color:#ceeaff;font-size:clamp(11px,1.8vh,16px);line-height:1.45}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;height:clamp(34px,6vh,50px)}button{border:0;border-bottom:4px solid #815a00;background:var(--gold);color:#09204d;font:900 clamp(10px,1.6vh,15px) ui-monospace,monospace;padding:7px 14px;cursor:pointer;box-shadow:3px 3px 0 #00102c;border-radius:4px}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #00102c}button.secondary{background:#65dfff;border-bottom-color:#146c8b}.hidden{display:none!important}
@media(max-height:520px){header{height:26px}.hint{display:none}.controls{height:32px}button{padding:4px 10px}#app{gap:4px;width:min(94vw,calc(82vh * 16 / 9))}}
</style>
</head>
<body>
<main id="app">
<header><div class="brand">NEON PONG // PIXEL ARENA</div><div class="hint">↑ ↓ ou W S • mouse/toque • P pausa • M som</div></header>
<div id="stage"><canvas id="game" width="960" height="540" aria-label="Jogo Pong"></canvas><div id="overlay"><div class="panel"><h1 id="overlayTitle">NEON PONG</h1><p id="overlayText">Primeiro a marcar 10 pontos vence.<br>Rebata no miolo colorido para construir COMBO. Colete power-ups com a bola.</p><button id="startBtn">INICIAR PARTIDA</button></div></div></div>
<div class="controls"><button id="pauseBtn" class="secondary">PAUSAR</button><button id="restartBtn">REINICIAR</button><button id="soundBtn" class="secondary">SOM: LIGADO</button><button id="difficultyBtn">IA: ESTRATEGISTA</button></div>
</main>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=960,H=540,WIN=10,BASE_SPEED=410,MAX_SPEED=930,BASE_H=124;
let state='menu',last=0,serveTimer=0,shake=0,flash=0,elapsed=0,audio=null,musicStep=0,musicTimer=0,musicMorph=.25,musicMorphTarget=.25,morphTimer=9;
let arcadeScore=0,centerCombo=0,comboPeak=0,powerup=null,powerupTimer=6.5,slowmoTimer=0,tripleTimer=0,labelSerial=0,pointerTarget=null;
const keys=new Set(),particles=[],labels=[],stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2,p:Math.random()*6.28}));
const savedPrefs=(()=>{try{return JSON.parse(localStorage.getItem('ppg_platform_prefs_v1'))||{}}catch{return {}}})();
let soundEnabled=savedPrefs.sound!==false;
const player={side:'player',x:34,y:H/2-BASE_H/2,w:18,h:BASE_H,vy:0,score:0,shield:0};
const ai={side:'ai',x:W-52,y:H/2-BASE_H/2,w:18,h:BASE_H,vy:0,score:0,shield:0,target:H/2,reaction:0,mode:'recover',confidence:0,lastSeen:null,shotMemory:[0,0,0],rallyHits:0,fatigue:0,fatigueNotice:0};
const effects={player:{smash:0,big:0,immune:0,jam:0,shrink:0,overdrive:0},ai:{smash:0,big:0,immune:0,jam:0,shrink:0,overdrive:0}};
const difficulties=[
 {name:'CASUAL',reaction:.19,error:58,maxSpeed:350,accel:1450,adapt:0,fatigueCap:.40,fatigueRate:.0018},
 {name:'ESTRATEGISTA',reaction:.125,error:34,maxSpeed:430,accel:1900,adapt:.42,fatigueCap:.34,fatigueRate:.00155},
 {name:'MESTRE',reaction:.080,error:18,maxSpeed:505,accel:2450,adapt:.72,fatigueCap:.27,fatigueRate:.00125}
];let difficultyIndex=1;
function makeBall(primary=true,x=W/2,y=H/2){return{x,y,r:10,vx:0,vy:0,baseSpeed:BASE_SPEED,trail:[],primary,lastHitter:null,hitPulse:0,id:Math.random().toString(36).slice(2)}}
let ball=makeBall(true),balls=[ball];
const overlay=document.querySelector('#overlay'),oTitle=document.querySelector('#overlayTitle'),oText=document.querySelector('#overlayText');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),choose=a=>a[(Math.random()*a.length)|0];
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixColor(a,b,t){const A=hexToRgb(a),B=hexToRgb(b),m=A.map((v,i)=>Math.round(v+(B[i]-v)*t));return `rgb(${m[0]},${m[1]},${m[2]})`}
function heatFor(b){return clamp((b.baseSpeed-BASE_SPEED)/(MAX_SPEED-BASE_SPEED),0,1)}
function paddleHeight(side){let s=1;if(effects[side].big>0)s*=1.42;if(effects[side].shrink>0)s*=.66;return BASE_H*s}
function preservePaddleCenter(p,newH){const c=p.y+p.h/2;p.h=newH;p.y=clamp(c-p.h/2,0,H-p.h)}
function updatePaddleSizes(){preservePaddleCenter(player,paddleHeight('player'));preservePaddleCenter(ai,paddleHeight('ai'))}
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();makeNoiseBuffer()}
let noiseBuffer=null;
function makeNoiseBuffer(){if(!audio||noiseBuffer)return;noiseBuffer=audio.createBuffer(1,audio.sampleRate*.12,audio.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
function tone(freq,dur=.08,type='square',vol=.06,when=0,detune=0){if(!soundEnabled||!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);o.detune.setValueAtTime(detune,t);g.gain.setValueAtTime(Math.max(.0001,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}
function hitSfx(b){const h=heatFor(b),f=220+h*760;tone(f,.045,'square',.075);tone(f*1.52,.035,'triangle',.032,.018);if(h>.68)tone(f*2.02,.025,'sine',.018,.03)}
function sfx(name,b=ball){if(name==='hit')hitSfx(b);else if(name==='wall')tone(145+heatFor(b)*260,.035,'triangle',.04);else if(name==='score'){tone(330,.09);tone(494,.12,'square',.06,.08)}else if(name==='lose'){tone(180,.12,'sawtooth',.05);tone(110,.2,'sawtooth',.05,.1)}else if(name==='power'){tone(620,.08,'square',.06);tone(930,.12,'triangle',.045,.06)}else if(name==='shield'){tone(520,.05,'sine',.05);tone(780,.12,'sine',.045,.05)}}
function kick(when=0){if(!soundEnabled||!audio)return;const t=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(125,t);o.frequency.exponentialRampToValueAtTime(43,t+.12);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.17)}
function hat(when=0,open=false){if(!soundEnabled||!audio||!noiseBuffer)return;const t=audio.currentTime+when,src=audio.createBufferSource(),hp=audio.createBiquadFilter(),g=audio.createGain();src.buffer=noiseBuffer;hp.type='highpass';hp.frequency.value=5200;g.gain.setValueAtTime(open?.022:.015,t);g.gain.exponentialRampToValueAtTime(.0001,t+(open?.09:.035));src.connect(hp).connect(g).connect(audio.destination);src.start(t);src.stop(t+(open?.1:.05))}
function acid(freq,dur=.09,accent=false,when=0){if(!soundEnabled||!audio)return;const t=audio.currentTime+when,o=audio.createOscillator(),f=audio.createBiquadFilter(),g=audio.createGain();o.type=musicMorph>.58?'square':'sawtooth';o.frequency.setValueAtTime(freq,t);f.type='lowpass';f.Q.value=7+musicMorph*8;const cutoff=480+musicMorph*1900+(accent?650:0);f.frequency.setValueAtTime(cutoff,t);f.frequency.exponentialRampToValueAtTime(Math.max(240,cutoff*.48),t+dur);g.gain.setValueAtTime(accent?.035:.024,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}
const bassDegrees=[0,0,3,0,7,5,3,10,0,12,10,7,5,3,0,7,0,0,12,10,7,5,3,0,3,5,7,10,12,7,5,3];
const leadDegrees=[12,15,19,22,19,15,12,10,12,17,19,24,22,19,17,15];
function music(dt){if(!soundEnabled||!audio||state!=='playing')return;morphTimer-=dt;if(morphTimer<=0){musicMorphTarget=rnd(.12,.92);morphTimer=rnd(9,18)}musicMorph+=(musicMorphTarget-musicMorph)*Math.min(1,dt*.18);musicTimer-=dt;const stepDur=60/134/4;if(musicTimer<=0){musicTimer+=stepDur;const s=musicStep++%512,bar=(s/16)|0,step=s%16;const root=[55,55,65.41,49][bar%4];if(step%4===0)kick();if(step%2===1)hat(0,step===15);const deg=bassDegrees[(s+bar*3)%bassDegrees.length],freq=root*Math.pow(2,deg/12);if(step%2===0||Math.random()<.28+musicMorph*.18)acid(freq,stepDur*(step%4===2?1.55:.88),step%8===0||Math.random()<.18);if((bar%4===2||bar%4===3)&&step%4===2){const ld=leadDegrees[(bar*4+step)%leadDegrees.length];tone(root*2*Math.pow(2,ld/12),.055,'square',.012)}if(s%128===96)tone(root*8,.18,'triangle',.018)}}
function burst(x,y,color,n=12,speed=190){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-speed,speed),vy:rnd(-speed,speed),life:rnd(.25,.72),max:.72,color,size:rnd(2,6)})}
function label(text,x,y,color='#fff',size=20,life=1.05){labels.push({id:labelSerial++,text,x,y,color,size,life,max:life,vy:rnd(-36,-24),wiggle:rnd(0,6.28),rot:rnd(-.05,.05)})}
function serve(dir=Math.random()<.5?-1:1){ball=makeBall(true);balls=[ball];const ang=rnd(-.52,.52);ball.vx=Math.cos(ang)*ball.baseSpeed*dir;ball.vy=Math.sin(ang)*ball.baseSpeed;serveTimer=.65;ai.rallyHits=0;ai.mode='recover';powerup=null;powerupTimer=Math.max(powerupTimer,rnd(4.5,7.5));tripleTimer=0}
function resetEffects(){for(const s of ['player','ai'])for(const k of Object.keys(effects[s]))effects[s][k]=0;slowmoTimer=0;tripleTimer=0;player.shield=ai.shield=0;updatePaddleSizes()}
function reset(){player.score=ai.score=0;player.y=ai.y=H/2-BASE_H/2;player.vy=ai.vy=0;player.h=ai.h=BASE_H;ai.target=H/2;ai.shotMemory=[0,0,0];ai.fatigue=0;ai.fatigueNotice=0;elapsed=0;arcadeScore=0;centerCombo=0;comboPeak=0;pointerTarget=null;powerup=null;powerupTimer=rnd(5.5,8.5);labels.length=0;particles.length=0;resetEffects();serve(Math.random()<.5?-1:1);state='playing';overlay.classList.add('hidden');last=performance.now();initAudio();audio?.resume();musicStep=(Math.random()*256)|0;musicTimer=0}
function end(win){cashCombo('FIM');state='gameover';sfx(win?'score':'lose');oTitle.textContent=win?'VOCÊ VENCEU!':'CPU VENCEU';oText.innerHTML=`Placar ${player.score} × ${ai.score}<br>Tempo: ${elapsed.toFixed(1)}s<br>Arcade: ${arcadeScore.toLocaleString('pt-BR')} • Melhor combo: ${comboPeak}x`;document.querySelector('#startBtn').textContent='JOGAR NOVAMENTE';overlay.classList.remove('hidden')}
function comboMultiplier(n=centerCombo){return Math.min(5,1+Math.floor(Math.max(0,n-1)/2)*.5)}
function cashCombo(reason='BREAK'){if(centerCombo>=2){const mult=comboMultiplier(centerCombo),bonus=Math.round(centerCombo*mult*35);arcadeScore+=bonus;label(`${reason} • COMBO ${centerCombo}x = +${bonus}`,W/2,H*.34,'#ff70df',23,1.35);burst(W/2,H*.38,'#ff70df',18,150)}centerCombo=0}
function registerPlayerZone(zone,x,y){if(zone===1){centerCombo++;comboPeak=Math.max(comboPeak,centerCombo);const mult=comboMultiplier(),pts=Math.round(50*mult);arcadeScore+=pts;const col=centerCombo>=7?'#ff4d8d':centerCombo>=4?'#ffd84d':'#56f3ff';label(`CENTER ${centerCombo}x • ×${mult.toFixed(mult%1?1:0)} • +${pts}`,x+75,y,col,18+Math.min(8,centerCombo),.9);if(centerCombo===3||centerCombo===6||centerCombo===9){shake=Math.max(shake,10);flash=.07;burst(x,y,col,20)}}else{cashCombo('CASHOUT');arcadeScore+=20;label('EDGE +20',x+58,y,'#b8c9ff',15,.65)}}
function hitBoost(side){return effects[side].smash>0?1.30:1}
function normalizeBallSpeed(b){if(!b.lastHitter)return;const desired=b.baseSpeed*hitBoost(b.lastHitter),mag=Math.hypot(b.vx,b.vy)||1,ratio=desired/mag;b.vx*=ratio;b.vy*=ratio}
function collide(b,p,dir){const nearestX=clamp(b.x,p.x,p.x+p.w),nearestY=clamp(b.y,p.y,p.y+p.h),dx=b.x-nearestX,dy=b.y-nearestY;if(dx*dx+dy*dy>b.r*b.r||Math.sign(b.vx)!==dir)return false;const local=clamp((b.y-p.y)/p.h,0,1),zone=local<1/3?0:local>2/3?2:1,rel=clamp((b.y-(p.y+p.h/2))/(p.h/2),-1,1),angle=rel*1.05;b.baseSpeed=Math.min(MAX_SPEED,b.baseSpeed*1.034+5);const side=p.side,boost=hitBoost(side),out=b.baseSpeed*boost;b.vx=Math.cos(angle)*out*-dir;b.vy=Math.sin(angle)*out+p.vy*.17;b.lastHitter=side;b.x=dir<0?p.x+p.w+b.r:p.x-b.r;b.hitPulse=.16;shake=Math.max(shake,6+heatFor(b)*7);flash=Math.max(flash,.045+heatFor(b)*.045);const hot=mixColor('#52e7ff','#ff334f',heatFor(b));burst(b.x,b.y,hot,12+Math.round(heatFor(b)*8),190+heatFor(b)*90);sfx('hit',b);label(`SPEED ↑ ${Math.round(b.baseSpeed)}`,b.x+(side==='player'?58:-58),b.y,hot,14+heatFor(b)*8,.62);if(side==='player'){registerPlayerZone(zone,b.x,b.y);rememberPlayerShot()}ai.rallyHits++;return true}
function reflectY(y,r=ball.r){const low=r,span=H-r*2,period=span*2;let n=((y-low)%period+period)%period;return low+(n<=span?n:period-n)}
function predictIntercept(obs){if(!obs||obs.vx<=0)return H/2;const travel=(ai.x-ball.r-obs.x)/Math.max(1,obs.vx);return reflectY(obs.y+obs.vy*Math.max(0,travel),ball.r)}
function updateAI(dt){const d=difficulties[difficultyIndex];const jam=effects.ai.jam>0?1:0;ai.fatigue=clamp(ai.fatigue+dt*(d.fatigueRate+Math.min(.0007,ai.rallyHits*.000035)),0,d.fatigueCap);if(ai.fatigue>=.20&&ai.fatigueNotice<1){ai.fatigueNotice=1;label('CPU: FADIGA SUBINDO!',W*.69,112,'#ffb34d',18,1.4)}if(ai.fatigue>=.30&&ai.fatigueNotice<2){ai.fatigueNotice=2;label('CPU: REFLEXOS CAINDO!',W*.69,112,'#ff5a68',19,1.5)}ai.reaction-=dt;if(ai.reaction<=0){const reactPenalty=1+ai.fatigue*1.7+jam*.38;ai.reaction=d.reaction*rnd(.82,1.2)*reactPenalty;ai.lastSeen={x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy};if(ball.vx>35){ai.mode='intercept';let impact=predictIntercept(ai.lastSeen);const total=ai.shotMemory.reduce((a,b)=>a+b,0);let bias=0;if(total>2&&d.adapt){const dominant=ai.shotMemory.indexOf(Math.max(...ai.shotMemory));bias=(dominant-1)*18*d.adapt}const proximity=clamp((ai.x-ball.x)/W,0,1),rallyPenalty=Math.min(18,ai.rallyHits*1.45),fatigueError=d.error*ai.fatigue*2.15,uncertainty=(d.error*proximity+rallyPenalty+fatigueError+jam*24)*(Math.random()*2-1);const lapseChance=ai.fatigue*.16+jam*.07;if(Math.random()<lapseChance)impact+=rnd(-115,115)*(0.45+ai.fatigue);ai.confidence=clamp(1-proximity*.55-rallyPenalty/70-ai.fatigue*.7,.12,1);ai.target=clamp(impact+uncertainty+bias,ai.h*.35,H-ai.h*.35)}else{ai.mode='recover';const scorePressure=(player.score-ai.score)*7;ai.target=clamp(H/2+scorePressure,ai.h/2,H-ai.h/2);ai.confidence=.45-ai.fatigue*.25}}
 const center=ai.y+ai.h/2,diff=ai.target-center,stamina=1-ai.fatigue*.34,impair=jam?.72:1,boost=effects.ai.overdrive>0?1.22:1;const maxSpeed=d.maxSpeed*stamina*impair*boost,accel=d.accel*(1-ai.fatigue*.28)*impair*boost;const desired=clamp(diff*5.8,-maxSpeed,maxSpeed),delta=clamp(desired-ai.vy,-accel*dt,accel*dt);ai.vy+=delta;ai.vy*=Math.pow(.72,dt);if(Math.abs(diff)<5)ai.vy*=Math.pow(.05,dt);ai.y=clamp(ai.y+ai.vy*dt,0,H-ai.h);if((ai.y<=0&&ai.vy<0)||(ai.y>=H-ai.h&&ai.vy>0))ai.vy=0}
function rememberPlayerShot(){const zone=ball.y<H/3?0:ball.y>H*2/3?2:1;ai.shotMemory[zone]=Math.min(12,ai.shotMemory[zone]+1);for(let i=0;i<3;i++)if(i!==zone)ai.shotMemory[i]*=.94}
function cycleDifficulty(){difficultyIndex=(difficultyIndex+1)%difficulties.length;document.querySelector('#difficultyBtn').textContent=`IA: ${difficulties[difficultyIndex].name}`;tone(520+difficultyIndex*90,.07);if(state==='playing'){ai.fatigue=Math.min(ai.fatigue,difficulties[difficultyIndex].fatigueCap);serve(ball.vx<0?-1:1)}}
const POWERUPS={
 smash:{name:'POWER SMASH',short:'PWR',color:'#ff5d75',dur:10,kind:'self',key:'smash'},
 big:{name:'BIG SIZE',short:'BIG',color:'#66f0ff',dur:10,kind:'self',key:'big'},
 immune:{name:'IMMUNITY',short:'IMM',color:'#9d83ff',dur:12,kind:'self',key:'immune'},
 slow:{name:'SLOW MOTION',short:'SLO',color:'#55ffae',dur:6,kind:'global'},
 triple:{name:'TRIPLE BALL',short:'3X',color:'#ffd34d',dur:8,kind:'triple'},
 life:{name:'EXTRA LIFE',short:'♥',color:'#ff7ac6',dur:0,kind:'life'},
 shrink:{name:'SHRINK RIVAL',short:'-SZ',color:'#ff934d',dur:9,kind:'enemy',key:'shrink'},
 jam:{name:'RIVAL JAM',short:'JAM',color:'#ff4df3',dur:8,kind:'enemy',key:'jam'},
 overdrive:{name:'OVERDRIVE',short:'OVR',color:'#a6ff4d',dur:8,kind:'self',key:'overdrive'}
};
const POWER_POOL=['smash','smash','big','big','immune','immune','slow','triple','triple','life','shrink','shrink','jam','jam','overdrive'];
function spawnPowerup(){const type=choose(POWER_POOL),def=POWERUPS[type];powerup={type,x:rnd(W*.39,W*.61),y:rnd(120,H-70),r:24,spin:0,life:10,color:def.color};label(def.name,powerup.x,powerup.y-38,def.color,15,.9)}
function opponent(side){return side==='player'?'ai':'player'}
function applyTimed(side,key,dur,name,color){effects[side][key]=Math.max(effects[side][key],dur);label(`${name} • ${dur}s`,side==='player'?W*.28:W*.72,H*.21,color,21,1.25);sfx('power');if(key==='big'||key==='shrink')updatePaddleSizes()}
function spawnTriple(owner,b){tripleTimer=POWERUPS.triple.dur;const speed=b.baseSpeed,dir=Math.sign(b.vx)||1,baseAngle=Math.atan2(b.vy,b.vx);const clones=[-.36,.36].map(off=>{const c=makeBall(false,b.x,b.y);c.baseSpeed=speed;c.lastHitter=owner;c.vx=Math.cos(baseAngle+off)*speed*dir/Math.sign(Math.cos(baseAngle+off)||1);c.vy=Math.sin(baseAngle+off)*speed;return c});for(const c of clones){const mag=Math.hypot(c.vx,c.vy)||1;c.vx=c.vx/mag*speed*Math.sign(b.vx||dir);c.vy=c.vy/mag*speed}balls.push(...clones);label('TRIPLE BALL • 8s',W/2,H*.28,POWERUPS.triple.color,25,1.4);burst(b.x,b.y,POWERUPS.triple.color,26,260);sfx('power')}

$('#ppg-about').onclick=()=>open(`<h2>${CFG.name}</h2><p>${CFG.desc}</p><h3>Como jogar</h3><p>${CFG.how}</p><h3>Dica de estratégia</h3><p>${CFG.tip}</p><p class="ppg-credit">Produção: Projeto Primata Games em 2026.</p>`);
$('#ppg-theme').onclick=()=>{prefs.theme=prefs.theme==='light'?'dark':'light';writeJSON(PREF_KEY,prefs);document.body.classList.toggle('ppg-light',prefs.theme==='light');document.body.classList.toggle('ppg-dark',prefs.theme==='dark');$('#ppg-theme').textContent=prefs.theme==='light'?'🌙 Escuro':'☀️ Claro';window.PPGPongAudio?.uiTone()};
function syncSound(v){prefs.sound=!!v;writeJSON(PREF_KEY,prefs);$('#ppg-sound').textContent=prefs.sound?'🔊 Som':'🔇 Som';window.PPGPongAudio?.setEnabled(prefs.sound)}
$('#ppg-sound').onclick=e=>{e.stopPropagation();syncSound(!prefs.sound);if(prefs.sound)window.PPGPongAudio?.uiTone()};document.addEventListener('pong:sound',e=>{prefs.sound=!!e.detail.enabled;writeJSON(PREF_KEY,prefs);$('#ppg-sound').textContent=prefs.sound?'🔊 Som':'🔇 Som'});syncSound(prefs.sound);
const sessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);function formatValue(v){if(v==null)return '—';return (Number.isInteger(v)?v:v.toFixed(2).replace('.',','))+CFG.unit}function metric(){try{const title=$('#overlayTitle')?.textContent||'',t=$('#overlayText')?.textContent||'',m=t.match(/Tempo:\s*([\d,.]+)s/i);return /VOCÊ VENCEU/i.test(title)&&m?num(m[1]):null}catch{return null}}function upsert(v){if(v==null||!Number.isFinite(v)||(CFG.mode==='min'&&v<=0))return;let r=readJSON(REC_KEY,[]),me=r.find(x=>x.sessionId===sessionId);if(me){const better=CFG.mode==='min'?v<me.value:v>me.value;if(!better)return;me.value=v;me.at=Date.now()}else r.push({sessionId,value:v,at:Date.now()});r.sort((a,b)=>CFG.mode==='min'?a.value-b.value:b.value-a.value);writeJSON(REC_KEY,r.slice(0,5))}setInterval(()=>upsert(metric()),800);addEventListener('pagehide',()=>upsert(metric()));
function renderRecords(){const r=readJSON(REC_KEY,[]);const list=r.length?`<div class="ppg-record-list">${r.map((x,i)=>`<div class="ppg-record"><b>#${i+1}</b><span><strong>${formatValue(x.value)}</strong><br><small>${new Date(x.at).toLocaleDateString('pt-BR')}</small></span><small>${CFG.metric}</small></div>`).join('')}</div>`:`<div class="ppg-empty">Ainda não há marca registrada neste navegador. Jogue uma partida e ela aparece aqui.</div>`;open(`<h2>Recordes locais</h2><p>Top 5 persistente deste jogo, salvo somente neste navegador.</p>${list}`)}$('#ppg-records').onclick=renderRecords;
})();
</script>
</body>
</html>
