'use strict';

let state='menu',last=performance.now(),elapsed=0,serveTimer=.7,mode='ai',difficulty=1,seriesIndex=0,chaos=false,sudden=false;
const seriesOptions=[1,3,5],diffs=[{name:'CASUAL',reaction:.19,error:58,max:390,accel:1750,fatigueCap:.42,fatigueRate:.0019},{name:'ESTRATEGISTA',reaction:.125,error:34,max:470,accel:2200,fatigueCap:.35,fatigueRate:.0016},{name:'MESTRE',reaction:.08,error:19,max:550,accel:2850,fatigueCap:.28,fatigueRate:.0013}];

const prefs=(()=>{try{return JSON.parse(localStorage.getItem('ppg_platform_prefs_v1'))||{}}catch{return {}}})();let soundOn=prefs.sound!==false,pointerTarget=null;if(prefs.theme==='light')document.body.classList.add('light');
const STATS_KEY='ppg_minigames_stats_v1';let usageLast=performance.now();(function markStart(){let all={};try{all=JSON.parse(localStorage.getItem(STATS_KEY))||{}}catch{}const today=new Date().toISOString().slice(0,10),st=all.neon_pong||{starts:0,totalSeconds:0,longestStreak:0,currentStreak:0,lastDay:null};st.starts=(st.starts||0)+1;if(st.lastDay!==today){const prev=st.lastDay?Math.round((new Date(today+'T12:00:00')-new Date(st.lastDay+'T12:00:00'))/86400000):99;st.currentStreak=prev===1?(st.currentStreak||0)+1:1;st.longestStreak=Math.max(st.longestStreak||0,st.currentStreak);st.lastDay=today}st.lastStarted=Date.now();all.neon_pong=st;try{localStorage.setItem(STATS_KEY,JSON.stringify(all))}catch{}})();function flushUsage(){const now=performance.now(),d=Math.max(0,(now-usageLast)/1000);usageLast=now;let all={};try{all=JSON.parse(localStorage.getItem(STATS_KEY))||{}}catch{}const st=all.neon_pong||{starts:1,totalSeconds:0};st.totalSeconds=(st.totalSeconds||0)+d;st.lastPlayed=Date.now();all.neon_pong=st;try{localStorage.setItem(STATS_KEY,JSON.stringify(all))}catch{}}setInterval(flushUsage,5000);addEventListener('pagehide',flushUsage);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushUsage();else usageLast=performance.now()});
const mkP=(side,x,color,center)=>({side,x,y:H/2-BASE_H/2,w:18,h:BASE_H,vy:0,score:0,setWins:0,shield:0,meter:0,color,center,fatigue:0,reaction:0,target:H/2,notice:0,distance:0});
const p1=mkP('p1',34,'#2fe2ff','#ff59c8'),p2=mkP('p2',W-52,'#ff526d','#ffd34d');
const fx={p1:{smash:0,big:0,immune:0,jam:0,shrink:0,overdrive:0,invert:0,ghost:0,berserk:0,glass:0,super:0},p2:{smash:0,big:0,immune:0,jam:0,shrink:0,overdrive:0,invert:0,ghost:0,berserk:0,glass:0,super:0}};
const combo={p1:0,p2:0},comboPeak={p1:0,p2:0},tech={p1:0,p2:0},hitStreak={p1:0,p2:0};
const stats={p1:{hits:0,perfect:0,center:0,power:0,smart:0,goals:0,shield:0,supers:0,maxCombo:0,maxRally:0,maxSpeed:0},p2:{hits:0,perfect:0,center:0,power:0,smart:0,goals:0,shield:0,supers:0,maxCombo:0,maxRally:0,maxSpeed:0}};
let rally=0,powerup=null,powerTimer=6,modifier=null,modifierTimer=14,slowmo=0,triple=0;
function makeBall(primary=true,x=W/2,y=H/2){return{x,y,r:10,vx:0,vy:0,base:BASE,primary,last:null,trail:[],id:Math.random().toString(36).slice(2),pulse:0}}let ball=makeBall(true),balls=[ball];
const POWER={smash:{name:'POWER SMASH',short:'PWR',color:'#ff5d75',kind:'self',key:'smash',dur:10,w:9},life:{name:'EXTRA LIFE',short:'♥',color:'#ff7ac6',kind:'life',w:2},triple:{name:'TRIPLE BALL',short:'3X',color:'#ffd34d',kind:'triple',dur:8,w:7},slow:{name:'SLOW MOTION',short:'SLO',color:'#55ffae',kind:'global',dur:6,w:6},big:{name:'BIG SIZE',short:'BIG',color:'#62e8ff',kind:'self',key:'big',dur:10,w:8},immune:{name:'IMMUNITY',short:'IMM',color:'#b69cff',kind:'self',key:'immune',dur:9,w:6},shrink:{name:'SHRINK RIVAL',short:'MIN',color:'#ff6adf',kind:'enemy',key:'shrink',dur:8,w:7},jam:{name:'RIVAL JAM',short:'JAM',color:'#ff9266',kind:'enemy',key:'jam',dur:7,w:7},over:{name:'OVERDRIVE',short:'OVR',color:'#72f1b8',kind:'self',key:'overdrive',dur:8,w:7},ghost:{name:'GHOST PADDLE',short:'GST',color:'#bfeaff',kind:'self',key:'ghost',dur:9,w:6},berserk:{name:'BERSERK',short:'BRK',color:'#ff334f',kind:'self',key:'berserk',dur:7,w:4},glass:{name:'GLASS CANNON',short:'X2',color:'#fff173',kind:'self',key:'glass',dur:8,w:4},invert:{name:'CONTROL FLIP',short:'↕',color:'#d683ff',kind:'enemy',key:'invert',dur:4.5,w:3}};
const MODS=[{type:'gravity',name:'GRAVITY WAVE',color:'#ff8ad8',dur:9},{type:'magnet',name:'MAGNET CORE',color:'#5effe4',dur:9},{type:'bumpers',name:'NEON BUMPERS',color:'#ffd34d',dur:10},{type:'blackout',name:'BLACKOUT',color:'#a98cff',dur:8},{type:'narrow',name:'NARROW TUNNEL',color:'#ff765d',dur:9}];
let ac=null,master=null,musicBus=null,sfxBus=null,noise=null,musicStep=0,musicClock=0,morph=.35,morphTarget=.35,morphClock=10;
function audioInit(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();musicBus=ac.createGain();sfxBus=ac.createGain();master.gain.value=.85;musicBus.gain.value=.23;sfxBus.gain.value=.42;musicBus.connect(master);sfxBus.connect(master);master.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate*.15,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
function osc(f,d=.07,type='square',v=.12,when=0,bus=sfxBus){if(!soundOn)return;audioInit();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(Math.max(.0001,v),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus||sfxBus);o.start(t);o.stop(t+d)}
function noiseHit(v=.05,when=0){if(!soundOn)return;audioInit();const t=ac.currentTime+when,s=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;hp.type='highpass';hp.frequency.value=4600;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(hp).connect(g).connect(musicBus);s.start(t);s.stop(t+.06)}
function hitSfx(b,perfect=false){const h=clamp((b.base-BASE)/(MAX-BASE),0,1),f=240+h*850+(perfect?150:0);osc(f,.045,'square',.16);osc(f*1.5,.035,'triangle',.07,.018);if(perfect)osc(f*2.05,.08,'sine',.08,.03)}function sfx(n){if(n==='power'){osc(620,.07,'square',.15);osc(930,.12,'triangle',.1,.05)}else if(n==='goal'){osc(330,.09,'square',.13);osc(495,.12,'square',.13,.07);osc(660,.15,'triangle',.08,.14)}else if(n==='shield'){osc(520,.06,'sine',.12);osc(780,.14,'sine',.1,.04)}else if(n==='super'){osc(220,.12,'sawtooth',.12);osc(440,.15,'square',.12,.07);osc(880,.2,'triangle',.09,.15)}}
function kick(){if(!soundOn)return;audioInit();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(135,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(musicBus);o.start(t);o.stop(t+.19)}
function acid(f,accent=false){if(!soundOn)return;audioInit();const t=ac.currentTime,o=ac.createOscillator(),fil=ac.createBiquadFilter(),g=ac.createGain();o.type=morph>.55?'square':'sawtooth';o.frequency.value=f;fil.type='lowpass';fil.Q.value=8+morph*10;const cut=520+morph*2300+(accent?900:0);fil.frequency.setValueAtTime(cut,t);fil.frequency.exponentialRampToValueAtTime(Math.max(260,cut*.44),t+.11);g.gain.setValueAtTime(accent?.1:.068,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(fil).connect(g).connect(musicBus);o.start(t);o.stop(t+.13)}
const bass=[0,0,3,0,7,5,3,10,0,12,10,7,5,3,0,7,0,0,12,10,7,5,3,0,3,5,7,10,12,7,5,3],lead=[12,15,19,22,19,15,12,10,12,17,19,24,22,19,17,15];function music(dt){if(!soundOn||state!=='playing')return;audioInit();morphClock-=dt;if(morphClock<=0){morphTarget=rnd(.15,.95);morphClock=rnd(10,22)}morph+=(morphTarget-morph)*Math.min(1,dt*.12);musicClock-=dt;const step=60/136/4;if(musicClock<=0){musicClock+=step;const s=musicStep++%1024,bar=(s/16)|0,k=s%16,root=[55,55,65.41,49,58.27,55,73.42,49][bar%8];if(k%4===0)kick();if(k%2===1)noiseHit(k===15?.08:.045);if(k%2===0||Math.random()<.25+morph*.22)acid(root*Math.pow(2,bass[(s+bar*5)%bass.length]/12),k%8===0);if((bar%4>=2)&&k%4===2)osc(root*2*Math.pow(2,lead[(bar+k)%lead.length]/12),.055,'square',.045,0,musicBus);if(s%128===96)osc(root*8,.18,'triangle',.055,0,musicBus)}}
function burst(x,y,color,n=16,sp=220){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-sp,sp),vy:rnd(-sp,sp),life:rnd(.25,.8),max:.8,size:rnd(2,7),color})}function announce(text,sub='',color='#fff',power=1.1){msgs.push({text,sub,color,age:0,life:rnd(1.15,1.9)*power,style:(Math.random()*5)|0,rot:rnd(-.15,.15),x:W/2+rnd(-30,30),y:H/2+rnd(-45,30),seed:rnd(0,10),power})}
function mult(side){return Math.min(5,1+Math.floor(Math.max(0,combo[side]-1)/2)*.5)}function score(side,pts,why=''){const m=fx[side].glass>0?2:1;tech[side]+=Math.round(pts*m);if(why&&pts>=150)announce(`${side==='p1'?'P1':'P2'} +${Math.round(pts*m)}`,why,side==='p1'?'#63edff':'#ffd34d',.7)}
function smartValue(type,side){const me=side==='p1'?p1:p2,op=side==='p1'?p2:p1;let v=120;if(type==='life')v+=me.score<=op.score?420:120;if(type==='big'||type==='ghost')v+=ball.base>700?220:60;if(type==='immune')v+=60;if(['shrink','jam','invert'].includes(type))v+=rally>12?230:90;if(type==='smash'||type==='berserk')v+=rally>10?180:70;if(type==='slow')v+=ball.base>760?260:40;if(type==='triple')v+=rally>8?160:70;if(type==='glass')v+=combo[side]>=4?260:70;if(type==='over')v+=ball.base>720?130:60;return v}
function paddleHeight(side){let s=1;if(fx[side].big>0)s*=1.42;if(fx[side].shrink>0)s*=.66;if(fx[side].berserk>0)s*=.8;return BASE_H*s}function arenaTop(){return modifier?.type==='narrow'?48:0}function arenaBottom(){return modifier?.type==='narrow'?H-48:H}function resizePaddles(){for(const p of[p1,p2]){const c=p.y+p.h/2;p.h=paddleHeight(p.side);p.y=clamp(c-p.h/2,arenaTop(),arenaBottom()-p.h)}}
function resetEffects(){for(const s of['p1','p2'])for(const k in fx[s])fx[s][k]=0;p1.shield=p2.shield=0;slowmo=triple=0;resizePaddles()}function resetStats(){for(const s of['p1','p2']){tech[s]=0;combo[s]=comboPeak[s]=hitStreak[s]=0;Object.assign(stats[s],{hits:0,perfect:0,center:0,power:0,smart:0,goals:0,shield:0,supers:0,maxCombo:0,maxRally:0,maxSpeed:0});(s==='p1'?p1:p2).meter=0;(s==='p1'?p1:p2).distance=0}}
function serve(dir=Math.random()<.5?-1:1,speed=BASE){ball=makeBall(true);balls=[ball];ball.base=speed;const a=rnd(-.48,.48);ball.vx=Math.cos(a)*speed*dir;ball.vy=Math.sin(a)*speed;serveTimer=.65;rally=0;history.length=0;triple=0;powerup=null;powerTimer=Math.max(powerTimer,rnd(4,7))}
function startMatch(){p1.setWins=p2.setWins=0;p1.score=p2.score=0;p1.y=p2.y=H/2-BASE_H/2;p1.vy=p2.vy=0;p1.fatigue=p2.fatigue=0;p2.notice=0;elapsed=0;powerup=null;powerTimer=rnd(5,8);modifier=null;modifierTimer=rnd(12,18);resetEffects();resetStats();sudden=false;state='playing';document.querySelector('#overlay').classList.add('hidden');audioInit();ac?.resume();last=performance.now();musicStep=(Math.random()*512)|0;serve()}
function needed(){const n=seriesOptions[seriesIndex];return n===1?1:Math.ceil(n/2)}function recordKey(){return'neon_pong_skill_records_v4'}function saveRecords(){let r=[];try{r=JSON.parse(localStorage.getItem(recordKey()))||[]}catch{}const add=s=>{if(mode==='ai'&&s==='p2')return;r.push({score:tech[s],side:s,mode,series:seriesOptions[seriesIndex],chaos,at:Date.now(),rally:stats[s].maxRally,perfect:stats[s].perfect,combo:stats[s].maxCombo})};add('p1');add('p2');r.sort((a,b)=>b.score-a.score);try{localStorage.setItem(recordKey(),JSON.stringify(r.slice(0,12)))}catch{}}

function drawModifier(){if(!modifier)return;if(modifier.type==='bumpers')for(const[x,y]of[[W/2-65,H*.34],[W/2+65,H*.66]]){X.save();X.shadowBlur=24;X.shadowColor='#ffd34d';X.fillStyle='#1d1733';X.strokeStyle='#ffd34d';X.lineWidth=5;X.beginPath();X.arc(x,y,28,0,Math.PI*2);X.fill();X.stroke();X.restore()}if(modifier.type==='narrow'){X.fillStyle='#ff6b5d33';X.fillRect(0,0,W,48);X.fillRect(0,H-48,W,48);X.strokeStyle='#ff765d';X.lineWidth=3;X.beginPath();X.moveTo(0,48);X.lineTo(W,48);X.moveTo(0,H-48);X.lineTo(W,H-48);X.stroke()}}
function drawEffects(side,x,align){let y=102;for(const[k,v]of Object.entries(fx[side]))if(v>0){pixel(`${k.toUpperCase()} ${v.toFixed(1)}s`,x,y,10,align,['jam','shrink','invert'].includes(k)?'#ff7add':'#8fffea');y+=15}const p=side==='p1'?p1:p2;if(p.shield)pixel(`♥ ×${p.shield}`,x,y,12,align,'#ff7ac6')}
function drawMsgs(){for(const m of msgs){const q=m.age/m.life,inA=clamp(q/.14,0,1),outA=clamp((1-q)/.28,0,1),a=Math.min(inA,outA)*.78,boom=1+(1-inA)*1.6,fade=1+q*.16,scale=boom*fade,wig=Math.sin((m.age*10)+m.seed);X.save();X.globalAlpha=a;let x=m.x,y=m.y;if(m.style===0){x+=wig*15;y-=q*55}if(m.style===1){x+=Math.sin(m.age*18)*25;y+=Math.cos(m.age*11)*10}if(m.style===2){X.rotate(m.rot*(1-q));x+=wig*8;y-=q*30}if(m.style===3){x+=rnd(-3,3)*(1-q);y+=rnd(-2,2)*(1-q)}if(m.style===4){scale*=1+.08*Math.sin(m.age*22)}X.translate(x,y);X.rotate(m.rot*Math.sin(m.age*6));X.scale(scale,scale);X.shadowBlur=22*m.power;X.shadowColor=m.color;for(let e=2;e>=0;e--){X.globalAlpha=a*(e?0.18:.92);pixel(m.text,e*rnd(-5,5),e*rnd(-4,4),clamp(30*m.power,20,48),'center',m.color,a*(e?0.3:1))}if(m.sub)pixel(m.sub,0,38,clamp(13*m.power,11,20),'center','#ffffff',a*.85);X.restore()}X.globalAlpha=1}
function drawReplay(){const f=replay.frames[replay.i];if(!f)return;drawPaddle({...p1,y:f.p1.y,h:f.p1.h});drawPaddle({...p2,y:f.p2.y,h:f.p2.h});for(const b of f.b){X.fillStyle=b.primary?'#fff':'#ffd34d';X.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2)}pixel('⏪ INSTANT REPLAY',W/2,126,25,'center','#fff')}
function draw(){X.save();const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,sudden?'#4a1020':modifier?.type==='magnet'?'#08334b':'#082960');g.addColorStop(1,'#03112e');X.fillStyle=g;X.fillRect(0,0,W,H);stars.forEach(s=>{X.globalAlpha=.25+.35*Math.sin(s.p);X.fillStyle=s.s>2?'#52e7ff':'#a7cfff';X.fillRect(s.x,s.y,s.s,s.s)});X.globalAlpha=1;X.strokeStyle='#1375ca55';for(let y=92;y<H;y+=48){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.setLineDash([16,14]);X.strokeStyle='#90dfff88';X.lineWidth=4;X.beginPath();X.moveTo(W/2,82);X.lineTo(W/2,H);X.stroke();X.setLineDash([]);X.fillStyle='#021638e8';X.fillRect(0,0,W,82);pixel(p1.score,350,36,40,'center','#52e7ff');pixel(p2.score,610,36,40,'center','#ff657b');pixel(`${p1.setWins}-${p2.setWins} SETS`,480,20,12,'center','#ffd34d');pixel(`SKILL ${tech.p1.toLocaleString('pt-BR')}`,20,29,12,'left','#83efff');pixel(`${tech.p2.toLocaleString('pt-BR')} SKILL`,940,29,12,'right','#ffd86b');pixel(`${Math.floor(elapsed/60).toString().padStart(2,'0')}:${Math.floor(elapsed%60).toString().padStart(2,'0')} • SPD ${Math.round(ball.base)} • RALLY ${rally}`,480,58,12,'center',mix('#52e7ff','#ff334f',clamp((ball.base-BASE)/(MAX-BASE),0,1)));pixel(`SUPER ${Math.round(p1.meter)}%`,20,68,10,'left',p1.meter>=100?'#fff173':'#72f1b8');pixel(`SUPER ${Math.round(p2.meter)}%`,940,68,10,'right',p2.meter>=100?'#fff173':'#72f1b8');drawModifier();if(replay.active)drawReplay();else{drawPaddle(p1);drawPaddle(p2);drawPower();for(const b of balls)drawBall(b)}for(const p of particles){X.globalAlpha=clamp(p.life/p.max,0,1);X.fillStyle=p.color;X.fillRect(p.x,p.y,p.size,p.size)}X.globalAlpha=1;drawEffects('p1',18,'left');drawEffects('p2',942,'right');if(combo.p1)pixel(`P1 COMBO ${combo.p1}x ×${mult('p1')}`,18,90,12,'left','#ff76dc');if(combo.p2)pixel(`P2 COMBO ${combo.p2}x ×${mult('p2')}`,942,90,12,'right','#ffd34d');if(modifier)pixel(`${modifier.name} ${modifier.time.toFixed(1)}s`,W/2,101,11,'center',modifier.color);if(slowmo)pixel(`SLOW MOTION ${slowmo.toFixed(1)}s`,W/2,118,11,'center','#55ffae');drawMsgs();if(modifier?.type==='blackout'&&!replay.active){X.save();X.fillStyle='#000c';X.fillRect(0,82,W,H-82);X.globalCompositeOperation='destination-out';const rg=X.createRadialGradient(ball.x,ball.y,28,ball.x,ball.y,155);rg.addColorStop(0,'#000');rg.addColorStop(1,'#0000');X.fillStyle=rg;X.beginPath();X.arc(ball.x,ball.y,155,0,Math.PI*2);X.fill();X.restore()}if(state==='paused'){X.fillStyle='#020916c9';X.fillRect(0,0,W,H);pixel('PAUSADO',W/2,H/2-18,46,'center','#ffd34d');pixel('P para continuar',W/2,H/2+35,15,'center','#a8e8ff')}X.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}function setPointer(e){if(state!=='playing'||mode==='pvp')return;const r=C.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*H;pointerTarget=clamp(y,p1.h/2,H-p1.h/2)}function togglePause(){if(state==='playing')state='paused';else if(state==='paused'){state='playing';last=performance.now()}document.querySelector('#pauseBtn').textContent=state==='paused'?'CONTINUAR':'PAUSAR'}
function setSound(v){soundOn=!!v;prefs.sound=soundOn;try{localStorage.setItem('ppg_platform_prefs_v1',JSON.stringify(prefs))}catch{}document.querySelector('#soundBtn').textContent=`SOM: ${soundOn?'LIGADO':'DESLIGADO'}`;document.querySelector('#soundTop').textContent=soundOn?'🔊 Som':'🔇 Som';if(soundOn){audioInit();ac?.resume();osc(440,.06)}}function refreshUI(){const pvp=mode==='pvp';document.querySelector('#modeBtn').textContent=pvp?'MODO: 2P LOCAL':'MODO: 1P vs IA';document.querySelector('#difficultyBtn').disabled=pvp;document.querySelector('#difficultyBtn').textContent=pvp?'IA: —':`IA: ${diffs[difficulty].name}`;document.querySelector('#seriesBtn').textContent=`SÉRIE: ${seriesOptions[seriesIndex]===1?'PARTIDA ÚNICA':'MELHOR DE '+seriesOptions[seriesIndex]}`;document.querySelector('#chaosBtn').textContent=`ARENA: ${chaos?'CHAOS':'CLÁSSICA'}`;document.querySelector('#controlHint').textContent=pvp?'2P • P1 W/S + D • P2 ↑/↓ + ←/→ SUPER • gamepads suportados':'1P • W/S, ↑↓, mouse/toque • D SUPER • gamepad suportado'}
function cycleMode(){mode=mode==='ai'?'pvp':'ai';refreshUI();if(state==='playing'||state==='paused')startMatch()}function cycleDiff(){if(mode==='pvp')return;difficulty=(difficulty+1)%diffs.length;p2.fatigue=0;p2.notice=0;refreshUI()}function cycleSeries(){seriesIndex=(seriesIndex+1)%seriesOptions.length;refreshUI();if(state==='playing'||state==='paused')startMatch()}function cycleChaos(){chaos=!chaos;modifier=null;modifierTimer=8;refreshUI();if(chaos)announce('CHAOS MODE','ARENAS MUTANTES ATIVADAS','#ff67dc',1.3)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='p')togglePause();if(k==='m')setSound(!soundOn);if(k==='d')activateSuper('p1');if(mode==='pvp'&&(k==='arrowleft'||k==='arrowright'))activateSuper('p2')},{passive:false});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));C.addEventListener('pointermove',setPointer);C.addEventListener('pointerdown',e=>{audioInit();ac?.resume();setPointer(e)});
document.querySelector('#startBtn').onclick=startMatch;document.querySelector('#restartBtn').onclick=startMatch;document.querySelector('#pauseBtn').onclick=togglePause;document.querySelector('#soundBtn').onclick=()=>setSound(!soundOn);document.querySelector('#modeBtn').onclick=cycleMode;document.querySelector('#difficultyBtn').onclick=cycleDiff;document.querySelector('#seriesBtn').onclick=cycleSeries;document.querySelector('#chaosBtn').onclick=cycleChaos;
const modal=document.querySelector('#modal'),body=document.querySelector('#modalBody');function openModal(h){body.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.close'))closeModal()});
document.querySelector('#aboutTop').onclick=()=>openModal(`<h2>Neon Pong: Hyper Arcade</h2><p>Pong competitivo com física progressiva, combos de núcleo, Perfect Hits, power-ups, IA com fadiga, PvP local, séries, Chaos Mode, replay e gamepad.</p><h3>Controles</h3><p><b>1P:</b> W/S, setas, mouse/toque ou gamepad. D ativa NEON BURST.<br><b>2P:</b> P1 W/S + D; P2 ↑/↓ + ←/→ para Super. Dois gamepads também funcionam.</p><h3>Estratégia</h3><p>Priorize o núcleo central e os Perfect Hits para carregar o Super. Power-ups dão mais Skill Score quando usados em situações onde realmente ajudam; sobreviver a rallies longos vale muito mais que apenas devolver a bola.</p><h3>Pontuação técnica</h3><p>O recorde considera consistência, rallies, precisão central, Perfect Hits, combos, velocidade, gols, defesas com Extra Life, Supers e uso contextual dos power-ups. Gols continuam decisivos para vencer, mas habilidade ao longo da jogada constrói o recorde.</p><p><b>Produção: Projeto Primata Games em 2026.</b></p>`);
document.querySelector('#recordsTop').onclick=()=>{let r=[];try{r=JSON.parse(localStorage.getItem(recordKey()))||[]}catch{}openModal(`<h2>🏆 Skill Records</h2><p>Ranking local pela pontuação técnica construída durante a partida.</p>${r.length?r.map((q,i)=>`<div class="record"><b>#${i+1}</b><span><b>${q.score.toLocaleString('pt-BR')}</b><br><small>${q.mode==='pvp'?q.side.toUpperCase():'1P vs IA'} • ${q.series===1?'single':'BO'+q.series} • ${q.chaos?'CHAOS':'classic'}</small></span><small>R${q.rally} • P${q.perfect} • C${q.combo}x</small></div>`).join(''):'<p>Ainda não há recordes.</p>'}`)};
document.querySelector('#themeTop').onclick=()=>{document.body.classList.toggle('light');prefs.theme=document.body.classList.contains('light')?'light':'dark';try{localStorage.setItem('ppg_platform_prefs_v1',JSON.stringify(prefs))}catch{}document.querySelector('#themeTop').textContent=document.body.classList.contains('light')?'🌙 Escuro':'☀️ Claro'};document.querySelector('#soundTop').onclick=()=>setSound(!soundOn);document.querySelector('#themeTop').textContent=document.body.classList.contains('light')?'🌙 Escuro':'☀️ Claro';setSound(soundOn);refreshUI();serve();requestAnimationFrame(loop);
</script>
</body>
