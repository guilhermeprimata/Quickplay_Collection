<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulso Genius</title>
<style>
        :root {
            --pulse-gold: #FFC857;
            --pulse-violet: #7457FF;
            --pulse-light: #CCCCCC;
            --pulse-muted: #666666;
            --text-color: #333333;
            --bg-color: #FFFFFF;
            --panel-bg: #F5F5F5;
        }

        .dark-mode {
            --text-color: #E0E0E0;
            --bg-color: #121212;
            --panel-bg: #1E1E1E;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .logo {
            height: 60px;
            margin-right: 20px;
        }

        h1 {
            color: var(--pulse-violet);
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1/1;
            margin-bottom: 20px;
        }

        .color-button {
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            border: 4px solid transparent;
        }

        .color-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.3); /* Efeito de overlay um pouco mais sutil */
            opacity: 0;
            transition: opacity 0.2s;
        }

        .color-button.active {
            border-color: white;
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); /* Sombra do flash um pouco mais sutil */
        }

        .color-button.active::after {
            opacity: 1;
        }

        .color-button:disabled {
            opacity: 0.75; /* Botões desabilitados um pouco menos transparentes */
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--pulse-violet);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #5037C7;
        }

        button:disabled {
            background-color: var(--pulse-light);
            cursor: not-allowed;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--pulse-violet);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .modal h2 {
            color: var(--pulse-violet);
            margin-top: 0;
        }

        .modal input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid var(--pulse-light);
            border-radius: 5px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .ranking {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .ranking h2 {
            color: var(--pulse-violet);
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
        }

        .ranking-list {
            list-style-type: none;
            padding: 0;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--pulse-light);
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-position {
            font-weight: bold;
            color: var(--pulse-violet);
        }

        .credits {
            font-style: italic;
            margin-top: 30px;
            text-align: center;
            color: var(--pulse-muted);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                height: 50px;
                margin-right: 15px;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
            
            .controls {
                gap: 8px;
            }
        }
    </style>
<script id="ppg-tone-shim">
(function(){
  if(window.Tone) return;
  let ac=null;
  const get=()=>ac||(ac=new (window.AudioContext||window.webkitAudioContext)());
  const noteFreq=n=>{if(typeof n==='number')return n;const m=String(n).match(/^([A-G])([#b]?)(-?\d)$/);if(!m)return 440;const semi={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,((+m[3]-4)*12+semi-9)/12)};
  const durSec=d=>{if(typeof d==='number')return d; if(/^\d+(\.\d+)?$/.test(String(d)))return +d; return ({'1n':2,'2n':1,'4n':.5,'8n':.25,'16n':.125,'32n':.0625})[d]||.2};
  class Synth{constructor(opts={}){this.opts=opts;this.volume={value:0}}toDestination(){return this}triggerAttackRelease(note,dur='8n',when){const A=get(),t=typeof when==='number'?when:A.currentTime,notes=Array.isArray(note)?note:[note];notes.forEach((n,i)=>{const o=A.createOscillator(),g=A.createGain(),d=durSec(dur),v=Math.pow(10,(this.volume.value||0)/20)*.10;o.type=this.opts.oscillator?.type||'sine';o.frequency.setValueAtTime(noteFreq(n),t);g.gain.setValueAtTime(v/Math.max(1,notes.length),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(A.destination);o.start(t+i*.002);o.stop(t+d+.01)})}}
  class PolySynth extends Synth{constructor(_Type,opts={}){super(opts)}}
  class NoiseSynth extends Synth{triggerAttackRelease(dur='8n',when){const A=get(),t=typeof when==='number'?when:A.currentTime,d=durSec(dur),buf=A.createBuffer(1,Math.max(1,A.sampleRate*d),A.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const src=A.createBufferSource(),g=A.createGain();src.buffer=buf;g.gain.value=Math.pow(10,(this.volume.value||0)/20)*.12;src.connect(g).connect(A.destination);src.start(t)}}
  window.Tone={Synth,PolySynth,NoiseSynth,start:async()=>{const A=get();if(A.state==='suspended')await A.resume()},now:()=>get().currentTime,get context(){return get()}};
})();
</script>

<body>
    <div class="header">
        
        <h1>PULSO GENIUS</h1>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">Nível</div>
            <div class="stat-value" id="level">1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Pontos</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Tempo</div>
            <div class="stat-value" id="timer">00:00</div>
        </div>
    </div>

    <div class="game-board">
        <button class="color-button" id="green" style="background-color: #00A651;"></button>
        <button class="color-button" id="red" style="background-color: #E31937;"></button>
        <button class="color-button" id="yellow" style="background-color: var(--pulse-gold);"></button>
        <button class="color-button" id="blue" style="background-color: var(--pulse-violet);"></button>
    </div>

    <div class="controls">
        <button id="startBtn">Iniciar</button>
        <button id="soundBtn">Som: ON</button>
        <button id="resetBtn">Resetar Tudo</button>
        <button id="darkModeBtn">Modo Escuro</button>
        <button id="backBtn">Voltar</button>
    </div>

    <div class="ranking">
        <h2>TOP 5</h2>
        <ul class="ranking-list" id="rankingList">
            </ul>
    </div>

    <div class="credits">PULSO GENIUS · Projeto Primata Games · 2026</div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>Fim de Jogo!</h2>
            <p id="finalScoreText">Você alcançou o nível <span id="finalLevel">1</span> com <span id="finalScore">0</span> pontos em <span id="finalTime">00:00</span>.</p>
            <input type="text" id="playerName" placeholder="Digite seu nome" maxlength="20">
            <div class="modal-buttons">
                <button id="saveScoreBtn">Salvar Pontuação</button>
                <button id="cancelBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="resetModal">
        <div class="modal-content">
            <h2>Resetar Tudo</h2>
            <p>Tem certeza que deseja resetar todas as pontuações salvas?</p>
            <p>Esta ação não pode ser desfeita.</p>
            <div class="modal-buttons">
                <button id="confirmResetBtn">Confirmar</button>
                <button id="cancelResetBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Elementos do DOM
        const greenButton = document.getElementById('green');
        const redButton = document.getElementById('red');
        const yellowButton = document.getElementById('yellow');
        const blueButton = document.getElementById('blue');
        const startBtn = document.getElementById('startBtn');
        const soundBtn = document.getElementById('soundBtn');
        const resetBtn = document.getElementById('resetBtn');
        const darkModeBtn = document.getElementById('darkModeBtn');
        const backBtn = document.getElementById('backBtn');
        const levelDisplay = document.getElementById('level');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const gameOverModal = document.getElementById('gameOverModal');
        const resetModal = document.getElementById('resetModal');
        const finalLevelDisplay = document.getElementById('finalLevel');
        const finalScoreDisplay = document.getElementById('finalScore');
        const finalTimeDisplay = document.getElementById('finalTime');
        const playerNameInput = document.getElementById('playerName');
        const saveScoreBtn = document.getElementById('saveScoreBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmResetBtn = document.getElementById('confirmResetBtn');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const rankingList = document.getElementById('rankingList');

        // Variáveis do jogo
        let gameActive = false;
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let score = 0;
        let startTime = 0;
        let timerInterval = null;
        let canClick = false;
        let colors = ['green', 'red', 'yellow', 'blue'];
        let ranking = JSON.parse(localStorage.getItem('bbGeniusRanking')) || [];
        let darkMode = false;
        let soundEnabled = true;
        let life = 100;
        let lastLifeHit = 0;
        
        let synth;
        try {
            if (typeof Tone !== 'undefined') {
                 synth = new Tone.Synth().toDestination();
            } else {
                console.warn("Tone.js não carregado. O som usará a API Web Audio como fallback ou ficará silencioso se não implementado.");
            }
        } catch (e) {
            console.error("Erro ao inicializar o synth do Tone.js:", e);
            synth = null;
        }

        function init() {
            setupEventListeners();
            loadRanking();
            checkDarkModePreference();
            checkSoundPreference();
            disableColorButtons();
            
            if (/Mobi|Android/i.test(navigator.userAgent)) {
                setTimeout(() => {
                    // Considere solicitar ao usuário para iniciar no celular em vez de iniciar automaticamente
                    // startGame(); 
                }, 1000);
            }
        }

        function setupEventListeners() {
            greenButton.addEventListener('click', () => handleColorClick('green'));
            redButton.addEventListener('click', () => handleColorClick('red'));
            yellowButton.addEventListener('click', () => handleColorClick('yellow'));
            blueButton.addEventListener('click', () => handleColorClick('blue'));
            
            startBtn.addEventListener('click', () => {
                if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                    Tone.start().then(startGame).catch(e => {
                        console.error("Erro ao iniciar Tone.js:", e);
                        startGame(); // Tenta iniciar o jogo mesmo se Tone.start falhar
                    });
                } else {
                    startGame();
                }
            });
            soundBtn.addEventListener('click', toggleSound);
            resetBtn.addEventListener('click', showResetModal);
            darkModeBtn.addEventListener('click', toggleDarkMode);
            backBtn.addEventListener('click', goBack);
            saveScoreBtn.addEventListener('click', saveScore);
            cancelBtn.addEventListener('click', hideGameOverModal);
            confirmResetBtn.addEventListener('click', resetAll);
            cancelResetBtn.addEventListener('click', hideResetModal);
        }

        function disableColorButtons() {
            canClick = false;
            colors.forEach(color => {
                document.getElementById(color).disabled = true;
            });
        }

        function enableColorButtons() {
            canClick = true;
            colors.forEach(color => {
                document.getElementById(color).disabled = false;
            });
        }

        function flashButton(color) {
            const button = document.getElementById(color);
            button.classList.add('active');
            
            if (soundEnabled) {
                playTone(getFrequencyForColor(color));
            }
            
            setTimeout(() => {
                button.classList.remove('active');
            }, 300); 
        }

        function playTone(noteOrFreq) {
            if (synth && typeof Tone !== 'undefined' && Tone.context.state === 'running') {
                try {
                    synth.triggerAttackRelease(noteOrFreq, "8n", Tone.now()); // "8n" é a duração de uma colcheia
                } catch (e) {
                    console.error('Erro ao tocar tom com Tone.js:', e);
                    playFallbackTone(getNumericFrequencyForColor(noteOrFreq)); // Fallback para o método antigo se Tone.js falhar
                }
            } else {
                playFallbackTone(getNumericFrequencyForColor(noteOrFreq));
            }
        }
        
        function playFallbackTone(frequency) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (!audioCtx) return; // Não pode reproduzir som
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime); // Usar setValueAtTime
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log('Erro ao reproduzir som de fallback:', e);
            }
        }

        // Retorna notas musicais para Tone.js
        function getFrequencyForColor(color) {
            switch(color) {
                case 'green': return "C4"; 
                case 'red': return "E4";   
                case 'yellow': return "G4"; 
                case 'blue': return "A4";  // ou "C5" para um tom mais alto
                default: return "C4";
            }
        }

        // Retorna frequências numéricas para o fallback
        function getNumericFrequencyForColor(colorOrNote) {
            // Se já for um número (frequência), retorna. Senão, converte a nota de cor.
            if (typeof colorOrNote === 'number') return colorOrNote;
            switch(colorOrNote) { // Assume que colorOrNote é uma string de cor aqui
                case 'green': return 329.63; // E3 (exemplo, ajuste conforme necessário)
                case 'red':   return 392.00; // G3
                case 'yellow':return 440.00; // A3
                case 'blue':  return 523.25; // C4
                default: return 440; // Frequência padrão
            }
        }


        function startGame() {
            if (gameActive) return;
            
            gameActive = true;
            sequence = [];
            playerSequence = [];
            level = 1;
            score = 0;
            life = 100; lastLifeHit = 0;
            levelDisplay.textContent = level;
            scoreDisplay.textContent = score;
            startBtn.disabled = true;
            
            startTime = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerDisplay.textContent = '00:00';
            
            nextLevel();
        }

        function nextLevel() {
            disableColorButtons();
            
            const randomIndex = Math.floor(Math.random() * colors.length);
            sequence.push(colors[randomIndex]);
            
            showSequence(0);
        }

        function showSequence(index) {
            if (index < sequence.length) {
                const color = sequence[index];
                flashButton(color);
                
                setTimeout(() => {
                    showSequence(index + 1);
                }, 500); // Velocidade da sequência, ajuste conforme necessário (era 600)
            } else {
                setTimeout(() => {
                    enableColorButtons();
                    if (startTime === 0 && sequence.length > 0) { 
                        startTime = Date.now();
                        timerInterval = setInterval(updateTimer, 1000);
                    }
                }, 250); // Atraso reduzido para entrada do jogador (era 500)
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            if (gameActive && life < 100 && Date.now() - lastLifeHit > 5000) life = Math.min(100, life + 1);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${minutes}:${seconds}`;
        }

        function handleColorClick(color) {
            if (!canClick || !gameActive) return;
            
            flashButton(color);
            playerSequence.push(color);
            
            for (let i = 0; i < playerSequence.length; i++) {
                if (playerSequence[i] !== sequence[i]) {
                    life = Math.max(0, life - 34); lastLifeHit = Date.now();
                    score = Math.max(0, score - Math.max(2, level * 2)); scoreDisplay.textContent = score;
                    playerSequence = []; disableColorButtons();
                    if (life <= 0) { gameOver(); return; }
                    setTimeout(() => showSequence(0), 650);
                    return;
                }
            }
            
            if (playerSequence.length === sequence.length) {
                score += level * 10;
                if(level % 5 === 0) life = Math.min(100, life + 12);
                scoreDisplay.textContent = score;
                playerSequence = [];
                level++;
                levelDisplay.textContent = level;
                
                if (level > 20) { // Nível de vitória
                    gameOver(true);
                } else {
                    setTimeout(() => {
                        nextLevel();
                    }, 800); // Pequeno atraso antes do próximo nível (era 1000)
                }
            }
        }

        function gameOver(win = false) {
            gameActive = false;
            canClick = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            disableColorButtons(); 
            
            const elapsed = startTime > 0 ? Math.floor((Date.now() - startTime) / 1000) : 0;
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            const timeString = `${minutes}:${seconds}`;
            
            const finalLevelVal = level > 1 ? level -1 : (sequence.length > 0 ? 1: 0) ; // Se perdeu no nível 1, mostra 1, ou 0 se não começou
            finalLevelDisplay.textContent = finalLevelVal;
            finalScoreDisplay.textContent = score;
            finalTimeDisplay.textContent = timeString;
            
            if (win) {
                 document.getElementById('finalScoreText').innerHTML = 
                    `Parabéns! Você venceu alcançando o nível <span id="finalLevel">${finalLevelVal}</span> com <span id="finalScore">${score}</span> pontos em <span id="finalTime">${timeString}</span>.`;
            } else {
                 document.getElementById('finalScoreText').innerHTML = 
                    `Você alcançou o nível <span id="finalLevel">${finalLevelVal}</span> com <span id="finalScore">${score}</span> pontos em <span id="finalTime">${timeString}</span>.`;
            }
            
            showGameOverModal();
        }

        function showGameOverModal() {
            playerNameInput.value = ''; // Limpa o nome do jogador anterior
            gameOverModal.style.display = 'flex';
            playerNameInput.focus();
        }

        function hideGameOverModal() {
            gameOverModal.style.display = 'none';
        }

        function saveScore() {
            const name = playerNameInput.value.trim() || 'Anônimo';
            const currentLevel = level > 1 ? level -1 : (sequence.length > 0 ? 1: 0) ;
            const playerScore = {
                name: name.substring(0, 20),
                level: currentLevel,
                score: score,
                time: finalTimeDisplay.textContent, // Usa o tempo final calculado
                date: new Date().toLocaleDateString()
            };
            
            ranking = JSON.parse(localStorage.getItem('bbGeniusRanking')) || [];
            ranking.push(playerScore);
            ranking.sort((a, b) => b.score - a.score || b.level - a.level); 
            ranking = ranking.slice(0, 5);
            localStorage.setItem('bbGeniusRanking', JSON.stringify(ranking));
            
            loadRanking();
            hideGameOverModal();
        }

        function loadRanking() {
            ranking = JSON.parse(localStorage.getItem('bbGeniusRanking')) || [];
            rankingList.innerHTML = '';
            
            if (ranking.length === 0) {
                const item = document.createElement('li');
                item.className = 'ranking-item';
                item.innerHTML = '<span>Nenhuma pontuação registrada ainda</span>';
                rankingList.appendChild(item);
            } else {
                ranking.forEach((entry, index) => {
                    const item = document.createElement('li');
                    item.className = 'ranking-item';
                    item.innerHTML = `
