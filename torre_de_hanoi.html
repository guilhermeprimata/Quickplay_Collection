<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre de Hanói</title>
  <style>
    :root {
      --bg-top: #141b33;
      --bg-bottom: #070a14;
      --panel: rgba(18, 27, 49, .82);
      --text: #edf4ff;
      --muted: #9eacc6;
      --accent: #71e3ff;
      --gold: #ffd166;
      --danger: #ff6685;
      --disk-height: 30px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(84, 127, 255, .20), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(111, 227, 255, .12), transparent 28%),
        linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .20;
      background-image: repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.018) 18px 19px);
    }

    .app {
      width: min(1120px, calc(100% - 24px));
      margin: 0 auto;
      padding: 28px 0 38px;
    }

    header { text-align: center; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.3rem); letter-spacing: -.04em; text-shadow: 0 6px 24px #000; }
    .subtitle { margin: 7px 0 0; color: var(--muted); }

    .toolbar, .stats, .help {
      border: 1px solid rgba(255,255,255,.10);
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(0,0,0,.25);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
      gap: 10px;
      padding: 14px;
      border-radius: 18px;
    }

    label { display: grid; gap: 5px; color: var(--muted); font-size: .82rem; text-align: left; }
    select, button {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      color: var(--text);
      background: #202c4a;
      font: inherit;
    }
    select { padding: 0 34px 0 12px; }
    button { padding: 0 15px; cursor: pointer; font-weight: 750; transition: transform .16s, filter .16s, border-color .16s; }
    button:hover { transform: translateY(-2px); filter: brightness(1.13); border-color: rgba(113,227,255,.45); }
    button:active { transform: translateY(0); }
    button.primary { color: #06121b; background: linear-gradient(135deg, #74e9ff, #6b9cff); }
    button:disabled { cursor: not-allowed; opacity: .5; transform: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin: 14px 0;
      overflow: hidden;
      border-radius: 15px;
    }
    .stat { padding: 10px; text-align: center; background: rgba(255,255,255,.025); }
    .stat b { display: block; color: var(--accent); font-size: 1.18rem; }
    .stat span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .11em; }

    .game-board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      min-height: 430px;
      padding: 24px 16px 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(22,34,61,.88), rgba(9,14,28,.94));
      box-shadow: 0 25px 65px rgba(0,0,0,.36), inset 0 1px rgba(255,255,255,.05);
    }

    .game-board::after {
      content: "";
      position: absolute;
      left: 3%; right: 3%; bottom: 32px;
      height: 25px;
      border-radius: 50%;
      background: rgba(0,0,0,.42);
      filter: blur(18px);
    }

    .rod {
      position: relative;
      z-index: 1;
      min-width: 0;
      height: 365px;
      padding: 0 5px;
      border: 2px solid transparent;
      border-radius: 18px;
      cursor: pointer;
      outline: none;
      transition: background .18s, border-color .18s, transform .18s;
    }
    .rod:hover, .rod:focus-visible { background: rgba(113,227,255,.045); }
    .rod.cursor { border-color: rgba(113,227,255,.58); background: rgba(113,227,255,.055); }
    .rod.selected { border-color: var(--gold); background: rgba(255,209,102,.075); transform: translateY(-2px); }
    .rod.invalid { animation: shake .30s ease; border-color: var(--danger); }

    .rod-pole {
      position: absolute;
      left: 50%; bottom: 33px;
      width: 15px; height: 285px;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px 10px 3px 3px;
      background:
        linear-gradient(90deg, #6d391e 0%, #c57a3a 24%, #e2a15b 48%, #9d572c 72%, #542a18 100%);
      box-shadow: 5px 0 10px rgba(0,0,0,.28), inset 2px 0 2px rgba(255,255,255,.25);
    }

    .base {
      position: absolute;
      left: 4%; right: 4%; bottom: 17px;
      height: 28px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px 9px 15px 15px;
      background: linear-gradient(#d99a54 0 16%, #a45f31 17% 54%, #6e371f 55% 100%);
      box-shadow: 0 10px 15px rgba(0,0,0,.40), inset 0 3px 4px rgba(255,255,255,.16);
    }

    .rod-label {
      position: absolute;
      left: 50%; bottom: -4px;
      transform: translateX(-50%);
      z-index: 4;
      width: 27px; height: 27px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: #0a1120;
      background: #d6e7ff;
      font-size: .78rem; font-weight: 900;
      box-shadow: 0 4px 11px #0008;
    }

    .disk {
      position: absolute;
      left: 50%;
      z-index: 3;
      height: var(--disk-height);
      max-width: calc(100% - 16px);
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 50% / 35%;
      box-shadow: 0 7px 8px rgba(0,0,0,.34), inset 0 4px 3px rgba(255,255,255,.28), inset 0 -5px 4px rgba(0,0,0,.24);
      transition: bottom .20s ease, filter .18s, transform .18s;
    }
    .disk::before {
      content: "";
      position: absolute;
      inset: 3px 7px 45%;
      border-radius: 50%;
      background: linear-gradient(100deg, rgba(255,255,255,.27), transparent 35% 67%, rgba(255,255,255,.10));
      mix-blend-mode: screen;
    }
    .disk::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .24;
      background-image:
        repeating-linear-gradient(105deg, transparent 0 5px, rgba(255,255,255,.18) 6px, transparent 7px 11px),
        radial-gradient(circle at 20% 65%, rgba(255,255,255,.35) 0 1px, transparent 2px);
      background-size: auto, 11px 9px;
    }
    .rod.selected .disk.top { filter: brightness(1.24) saturate(1.15); transform: translate(-50%, -12px); }

    .help {
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: 15px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    kbd { padding: 3px 7px; border: 1px solid #ffffff26; border-bottom-width: 3px; border-radius: 6px; color: white; background: #263552; }
    #message { min-height: 24px; margin: 9px 0 0; color: var(--gold); font-weight: 750; }

    .confetti { position: fixed; z-index: 20; top: -20px; width: 10px; height: 16px; pointer-events: none; animation: fall 2.4s ease-in forwards; }
    @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
    @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(760deg); opacity: .3; } }

    @media (max-width: 650px) {
      .app { width: min(100% - 10px, 1120px); padding-top: 16px; }
      .game-board { gap: 2px; min-height: 390px; padding-inline: 4px; }
      .rod { height: 330px; padding-inline: 1px; }
      .rod-pole { height: 260px; }
      :root { --disk-height: 27px; }
      .toolbar button { flex: 1 1 145px; }
      .help { font-size: .88rem; }
    }
  </style>

</style>

<style id="ppg-quality-controls-style">
#ppg-quality-pause-overlay{position:fixed;z-index:2147483635;inset:0;display:none;place-items:center;padding:18px;background:rgba(4,6,16,.82);backdrop-filter:blur(9px);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff}#ppg-quality-pause-overlay.open{display:grid}.ppg-quality-pause-card{width:min(440px,94vw);padding:24px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:linear-gradient(145deg,#17192d,#090b17);box-shadow:0 30px 100px #000a;text-align:center}.ppg-quality-pause-card h2{margin:0 0 8px;font-size:clamp(25px,5vw,38px);color:#e8dcff}.ppg-quality-pause-card p{margin:0 0 18px;color:#bcc2d8;line-height:1.45}.ppg-quality-pause-actions{display:grid;gap:9px}.ppg-quality-pause-actions button,.ppg-quality-pause-actions a{display:block;width:100%;padding:12px 14px;border:1px solid #ffffff22;border-radius:12px;background:#242941;color:#fff;font:800 14px/1.2 Inter,"Segoe UI",system-ui,sans-serif;text-decoration:none;cursor:pointer}.ppg-quality-pause-actions button:first-child{background:linear-gradient(135deg,#6d5cff,#27d9c0);color:#081016}.ppg-quality-pause-actions :is(button,a):hover{filter:brightness(1.13)}#ppg-quality-pause,#ppg-quality-restart{white-space:nowrap}.ppg-quality-paused body{overflow:hidden!important}
</style>
<script id="ppg-quality-controls-runtime">

};
function lang(){const raw=(document.documentElement.lang||navigator.language||'en').replace('_','-');if(/^pt/i.test(raw))return'pt-BR';if(/^zh/i.test(raw))return'zh-CN';const k=raw.split('-')[0];return L[k]?k:'en'}function t(k){return(L[lang()]||L.en)[k]||L.en[k]}

function setPaused(next){next=!!next;if(next===paused)return;if(next){releaseKeys();pausePerf=realPerfNow();pauseDate=realDateNow();paused=true}else{perfOffset+=realPerfNow()-pausePerf;dateOffset+=realDateNow()-pauseDate;paused=false}window.__PPG_PAUSED__=paused;document.documentElement.classList.toggle('ppg-quality-paused',paused);overlay?.classList.toggle('open',paused);document.dispatchEvent(new CustomEvent(paused?'ppg:pause':'ppg:resume'));if(!paused)nativeSetTimeout(()=>document.activeElement?.blur?.(),0)}
function restart(){if(paused)setPaused(false);if(typeof window.PPGGameRestart==='function'){window.PPGGameRestart();return}location.reload()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.ppg-modal.open,dialog[open],.modal.open')&&!paused)return;e.preventDefault();e.stopImmediatePropagation();setPaused(!paused);return}if(paused){e.preventDefault();e.stopImmediatePropagation()}},true);for(const ev of ['pointerdown','mousedown','touchstart','click'])document.addEventListener(ev,e=>{if(paused&&!e.target.closest('#ppg-quality-pause-overlay')){e.preventDefault();e.stopImmediatePropagation()}},true);

<body>
  <main class="app">
    <header>
      <h1>Torre de Hanói</h1>
      <p class="subtitle">Transfira a torre inteira sem colocar um disco maior sobre um menor.</p>
    </header>

    <section class="toolbar" aria-label="Configurações do jogo">
      <label>Número de discos
        <select id="numDisks" aria-label="Número de discos">
          <option value="3">3 discos</option><option value="4">4 discos</option>
          <option value="5">5 discos</option><option value="6">6 discos</option>
          <option value="7">7 discos</option><option value="8">8 discos</option>
        </select>
      </label>
      <button class="primary" id="newGame">↻ Novo jogo</button>
      <button id="autoSolve">▶ Resolver</button>
      <button id="soundToggle" aria-pressed="true">🔊 Sons: ligados</button>
      <button id="musicToggle" aria-pressed="false">♫ Música: desligada</button>
    </section>

    <section class="stats" aria-label="Estatísticas">
      <div class="stat"><b id="moves">0</b><span>Movimentos</span></div>
      <div class="stat"><b id="minimum">7</b><span>Mínimo</span></div>
      <div class="stat"><b id="timer">00:00</b><span>Tempo</span></div>
    </section>

    <section class="game-board" id="game" aria-label="Tabuleiro da Torre de Hanói">
      <div class="rod cursor" id="rod0" data-index="0" tabindex="0" aria-label="Torre A"><div class="rod-pole"></div><div class="base"></div><div class="rod-label">A</div></div>
      <div class="rod" id="rod1" data-index="1" tabindex="0" aria-label="Torre B"><div class="rod-pole"></div><div class="base"></div><div class="rod-label">B</div></div>
      <div class="rod" id="rod2" data-index="2" tabindex="0" aria-label="Torre C"><div class="rod-pole"></div><div class="base"></div><div class="rod-label">C</div></div>
    </section>

    <div class="help">
      Use <kbd>←</kbd> <kbd>→</kbd> para escolher uma torre e <kbd>↑</kbd>, <kbd>↓</kbd>, <kbd>Enter</kbd> ou <kbd>Espaço</kbd> para pegar/soltar. Também é possível usar o mouse.
      <p id="message" aria-live="polite"></p>
    </div>
  </main>

  <script>
    'use strict';

    const DISK_HEIGHT = () => window.innerWidth <= 650 ? 27 : 30;
    const BASE_BOTTOM = 45;
    const palette = [
      ['#ff6484','#c52d5c'], ['#ff9f43','#c85d20'], ['#ffd45a','#c58a24'], ['#52df91','#168f62'],
      ['#47cfeb','#167caa'], ['#7596ff','#3e51bd'], ['#b47bff','#713ac1'], ['#ef78d5','#a53790']
    ];

    let numDisks = 3;
    let rods = [[], [], []];
    let selectedRod = null;
    let cursorRod = 0;
    let moves = 0;
    let elapsed = 0;
    let timerId = null;
    let gameStarted = false;
    let solving = false;
    let solutionToken = 0;

    // Áudio gerado pela Web Audio API, sem arquivos externos.
    let audioCtx = null;
    let soundEnabled = true;
    let musicEnabled = false;
    let musicTimer = null;
    let musicStep = 0;

    const rodEls = [...document.querySelectorAll('.rod')];
    const movesEl = document.getElementById('moves');
    const minimumEl = document.getElementById('minimum');
    const timerEl = document.getElementById('timer');
    const messageEl = document.getElementById('message');
    const autoButton = document.getElementById('autoSolve');

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function tone(frequency, duration = .10, type = 'sine', volume = .07, when = 0) {
      if (!soundEnabled) return;
      ensureAudio();
      const t = audioCtx.currentTime + when;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, t);
      gain.gain.setValueAtTime(.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, t + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + duration + .02);
    }

    function playSound(name) {
      if (name === 'select') tone(520, .08, 'triangle', .05);
      if (name === 'move') { tone(360, .08, 'sine', .05); tone(580, .11, 'triangle', .045, .045); }
      if (name === 'error') { tone(150, .14, 'sawtooth', .045); tone(115, .15, 'square', .025, .08); }
      if (name === 'win') [523,659,784,1047].forEach((n,i) => tone(n, .30, 'triangle', .065, i * .13));
    }

    function startMusic() {
      ensureAudio();
      stopMusic();
      musicEnabled = true;
      // Sequência ambiente discreta e repetitiva.
      const notes = [196, 247, 294, 247, 220, 262, 330, 262];
      const tick = () => {
        if (!musicEnabled) return;
        const previousSound = soundEnabled;
        soundEnabled = true;
        tone(notes[musicStep++ % notes.length], .55, 'sine', .022);
        soundEnabled = previousSound;
      };
      tick();
      musicTimer = setInterval(tick, 620);
    }

    function stopMusic() { clearInterval(musicTimer); musicTimer = null; musicEnabled = false; }

    function formatTime(seconds) {
      return `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
    }

    function startTimer() {
      if (gameStarted || solving) return;
      gameStarted = true;
      timerId = setInterval(() => { elapsed++; timerEl.textContent = formatTime(elapsed); }, 1000);
    }

    function stopTimer() { clearInterval(timerId); timerId = null; }
    function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function render() {
      rodEls.forEach((rod, rodIndex) => {
        rod.querySelectorAll('.disk').forEach(d => d.remove());
        rods[rodIndex].forEach((size, index) => {
          const disk = document.createElement('div');
          const [light, dark] = palette[(size - 1) % palette.length];
          const minWidth = 34;
          const available = Math.max(75, rod.clientWidth - 16);
          const width = minWidth + (available - minWidth) * (size / numDisks);
          disk.className = 'disk' + (index === rods[rodIndex].length - 1 ? ' top' : '');
          disk.style.width = `${width}px`;
          disk.style.bottom = `${BASE_BOTTOM + index * DISK_HEIGHT()}px`;
          disk.style.background = `linear-gradient(110deg, ${dark}, ${light} 42%, ${dark})`;
          disk.dataset.size = size;
          disk.setAttribute('aria-label', `Disco ${size}`);
          rod.appendChild(disk);
        });
        rod.classList.toggle('selected', rodIndex === selectedRod);
        rod.classList.toggle('cursor', rodIndex === cursorRod);
      });
      movesEl.textContent = moves;
    }

    function setup() {
      solutionToken++;
      solving = false;
      autoButton.disabled = false;
      stopTimer();
      numDisks = Number(document.getElementById('numDisks').value);
      rods = [Array.from({length: numDisks}, (_, i) => numDisks - i), [], []];
      selectedRod = null; cursorRod = 0; moves = 0; elapsed = 0; gameStarted = false;
      timerEl.textContent = '00:00';
      minimumEl.textContent = 2 ** numDisks - 1;
      messageEl.textContent = 'Selecione uma torre para começar.';
      render();
    }

    function invalidMove(index, text = 'Movimento inválido: um disco maior não pode ficar sobre um menor.') {
      playSound('error');
      messageEl.textContent = text;
      rodEls[index].classList.remove('invalid');
      void rodEls[index].offsetWidth;
      rodEls[index].classList.add('invalid');
      setTimeout(() => rodEls[index].classList.remove('invalid'), 330);
    }

    function checkWin() {
      if (rods[2].length !== numDisks) return;
      stopTimer();
      gameStarted = false;
      playSound('win');
      const ideal = moves === 2 ** numDisks - 1 ? ' Você atingiu o número mínimo!' : '';
      messageEl.textContent = `Parabéns! Torre concluída em ${moves} movimentos e ${formatTime(elapsed)}.${ideal}`;
      makeConfetti();
    }

    function chooseRod(index) {
      if (solving) return;
      cursorRod = index;

      if (selectedRod === null) {
        if (!rods[index].length) {
          invalidMove(index, 'Esta torre está vazia. Escolha uma torre com discos.');
          render(); return;
        }
        selectedRod = index;
        playSound('select');
        messageEl.textContent = `Disco selecionado na torre ${'ABC'[index]}. Escolha o destino.`;
      } else if (selectedRod === index) {
        selectedRod = null;
        playSound('select');
        messageEl.textContent = 'Seleção cancelada.';
      } else {
        const from = rods[selectedRod];
        const to = rods[index];
        const disk = from[from.length - 1];
        if (to.length && to[to.length - 1] < disk) {
          invalidMove(index);
        } else {
          startTimer();
          to.push(from.pop());
          moves++;
          playSound('move');
          messageEl.textContent = `Disco movido para a torre ${'ABC'[index]}.`;
          selectedRod = null;
          render();
          checkWin();
          return;
        }
        selectedRod = null;
      }
      render();
    }

    function makeConfetti() {
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('i');
        piece.className = 'confetti';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = palette[i % palette.length][0];
        piece.style.setProperty('--drift', `${Math.random() * 180 - 90}px`);
        piece.style.animationDelay = `${Math.random() * .7}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3300);
      }
    }

    function buildSolution(n, from, to, aux, list = []) {
      if (!n) return list;
      buildSolution(n - 1, from, aux, to, list);
      list.push([from, to]);
      buildSolution(n - 1, aux, to, from, list);
      return list;
    }

    async function solveAutomatically() {
      if (solving) return;
      setup();
      solving = true;
      const token = solutionToken;
      autoButton.disabled = true;
      messageEl.textContent = 'Resolução automática em andamento...';
      const solution = buildSolution(numDisks, 0, 2, 1);
      await wait(350);
      for (const [from, to] of solution) {
        if (token !== solutionToken) return;
        rods[to].push(rods[from].pop());
        moves++;
        cursorRod = to;
        playSound('move');
        render();
        await wait(Math.max(115, 500 - numDisks * 45));
      }
      if (token !== solutionToken) return;
      solving = false;
      autoButton.disabled = false;
      messageEl.textContent = `Solução concluída em ${moves} movimentos mínimos.`;
    }

    rodEls.forEach((rod, index) => {
      rod.addEventListener('click', () => chooseRod(index));
      rod.addEventListener('focus', () => { cursorRod = index; render(); });
    });

    document.addEventListener('keydown', event => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(event.key)) event.preventDefault();
      if (solving) return;
      if (event.key === 'ArrowLeft') { cursorRod = (cursorRod + 2) % 3; playSound('select'); render(); }
      if (event.key === 'ArrowRight') { cursorRod = (cursorRod + 1) % 3; playSound('select'); render(); }
      if (['ArrowUp','ArrowDown','Enter',' '].includes(event.key)) chooseRod(cursorRod);
      if (event.key === 'Escape' && selectedRod !== null) { selectedRod = null; messageEl.textContent = 'Seleção cancelada.'; render(); }
    });

    document.getElementById('newGame').addEventListener('click', setup);
    document.getElementById('numDisks').addEventListener('change', setup);
    document.getElementById('autoSolve').addEventListener('click', solveAutomatically);

    document.getElementById('soundToggle').addEventListener('click', event => {
      soundEnabled = !soundEnabled;
      event.currentTarget.textContent = soundEnabled ? '🔊 Sons: ligados' : '🔇 Sons: desligados';
      event.currentTarget.setAttribute('aria-pressed', soundEnabled);
      if (soundEnabled) playSound('select');
    });

    document.getElementById('musicToggle').addEventListener('click', event => {
      if (musicEnabled) stopMusic(); else startMusic();
      event.currentTarget.textContent = musicEnabled ? '♫ Música: ligada' : '♫ Música: desligada';
      event.currentTarget.setAttribute('aria-pressed', musicEnabled);
    });

    window.addEventListener('resize', render);
    setup();
  </script>
