<head>

<title>Cosmo Crash - Jogo do Foguete</title>
<style>
:root{--cyan:#49f6ff;--yellow:#ffe66d;--red:#ff4d6d;--panel:#071329dd;--line:#245080;--text:#eef8ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611;color:var(--text);font-family:ui-monospace,"Courier New",monospace;touch-action:none}
body{display:grid;place-items:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 20%,#102451 0,#050b1d 42%,#01030a 100%)}
#app{position:relative;width:min(100%,calc((100vh - 12px)*.72));height:min(calc(100vh - 12px),calc(100vw/0.72));aspect-ratio:0.72;border:2px solid #2a5790;border-radius:14px;overflow:hidden;background:#020716;box-shadow:0 0 36px #0b8ae955,inset 0 0 28px #000}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hud{position:absolute;inset:0;pointer-events:none;padding:clamp(8px,2vh,16px);display:flex;flex-direction:column;justify-content:space-between;text-shadow:2px 2px #000}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;box-shadow:inset 0 0 12px #091e3c}.right{text-align:right}.logo{text-align:center;color:var(--yellow);font-weight:900;font-size:clamp(12px,2.4vh,22px);letter-spacing:2px}.label{font-size:clamp(8px,1.45vh,12px);color:#8bbce8}.value{font-size:clamp(12px,2.3vh,19px);font-weight:bold;color:var(--cyan)}#multiplier{color:var(--yellow);font-size:clamp(17px,3.3vh,30px)}
.bottom{pointer-events:auto;display:grid;gap:7px}.status{text-align:center;min-height:18px;color:#bfe4ff;font-size:clamp(9px,1.65vh,13px)}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:7px}.betrow{display:grid;grid-template-columns:38px 1fr 38px;gap:5px}.btn,input{min-height:clamp(34px,5.6vh,49px);border:1px solid #3d78ad;border-radius:8px;background:#0a1b35;color:white;font:700 clamp(10px,1.8vh,14px) ui-monospace,monospace;text-transform:uppercase;box-shadow:inset 0 -4px #041024,0 2px #000;outline:none}.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px #041024}.btn.primary{background:#0b6074;border-color:#49f6ff}.btn.cash{background:#8e3850;border-color:#ff718b}.btn:disabled{filter:grayscale(1);opacity:.55}input{text-align:center;width:100%;background:#061329;text-transform:none}.icon{width:clamp(34px,5.6vh,49px);min-height:clamp(34px,5.6vh,49px);font-size:17px}.hint{text-align:center;font-size:clamp(7px,1.25vh,10px);color:#7795b4}.scan{position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 3px,#74cfff21 4px);mix-blend-mode:screen}.flash{position:absolute;inset:0;pointer-events:none;background:white;opacity:0;transition:opacity .18s}.flash.on{opacity:.65;transition:none}
@media(max-width:420px){.logo{display:none}.top{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1.35fr 1fr}.hud{padding:8px}}
</style>
</head>
<body>
<main id="app" aria-label="Cosmo Crash">
<canvas id="game" width="480" height="720"></canvas>
<div class="hud">
  <div class="top">
    <div class="box"><div class="label">CRÉDITOS</div><div class="value">◈ <span id="bank">100.00</span></div></div>
    <div class="logo">COSMO<br>CRASH</div>
    <div class="box right"><div class="label">RECORDE</div><div class="value"><span id="best">1.00</span>x</div></div>
  </div>
  <div class="bottom">
    <div class="box" style="text-align:center"><div class="label">MULTIPLICADOR</div><div id="multiplier">1.00x</div></div>
    <div id="status" class="status">Defina os créditos e inicie a missão</div>
    <div class="controls">
      <div class="betrow"><button id="minus" class="btn">−</button><input id="bet" type="number" min="1" step="1" value="10" aria-label="Créditos da missão"><button id="plus" class="btn">+</button></div>
      <button id="action" class="btn primary">Iniciar</button>
      <button id="sound" class="btn icon" aria-label="Som">🔊</button>
    </div>
    <div class="hint">Mova com A/D, setas, mouse ou toque • Espaço recolhe</div>
  </div>
</div>
<div class="scan"></div><div id="flash" class="flash"></div>
</main>
<script>
'use strict';
// COSMO CRASH: jogo completo em um único arquivo, sem bibliotecas externas.
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=480,H=720,ui={bank:document.querySelector('#bank'),best:document.querySelector('#best'),mult:document.querySelector('#multiplier'),status:document.querySelector('#status'),bet:document.querySelector('#bet'),action:document.querySelector('#action'),sound:document.querySelector('#sound'),flash:document.querySelector('#flash')};
let bank=100,best=1,playing=false,over=false,stake=0,mult=1,time=0,last=0,spawn=0,difficulty=0,shake=0,muted=false,animationId,hull=100,lastHullHit=-99,hullInvulnUntil=0,dodges=0;
const keys={},particles=[],rocks=[],stars=[],trail=[];
const rocket={x:W/2,y:H-190,vx:0,vy:0,r:15,targetX:W/2,tilt:0};
for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:1+Math.random()*3});

// Áudio procedural: efeitos e trilha são criados via Web Audio API.
let ac,master,musicTimer,beat=0;
function initAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.18;master.connect(ac.destination)}
function tone(freq,dur=.1,type='square',vol=.25,slide=0){if(muted)return;initAudio();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),ac.currentTime+dur);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+dur)}
function startMusic(){stopMusic();musicTimer=setInterval(()=>{if(!playing||muted)return;const notes=[110,138.59,164.81,220,164.81,138.59];tone(notes[beat++%notes.length],.16,'triangle',.08);if(beat%4===0)tone(55,.08,'square',.05)},220)}
function stopMusic(){clearInterval(musicTimer)}

function resetRocket(){Object.assign(rocket,{x:W/2,y:H-190,vx:0,vy:0,targetX:W/2,tilt:0})}
function setStatus(s){ui.status.textContent=s}
function updateUI(){ui.bank.textContent=bank.toFixed(2);ui.best.textContent=best.toFixed(2);ui.mult.textContent=mult.toFixed(2)+'x'}
function randomCrashPoint(){// Curva ponderada: partidas longas existem, mas ficam progressivamente mais raras.
 const r=Math.random();return Math.min(12,1.15+(-Math.log(1-r))*1.7)}
let crashAt=randomCrashPoint();
function start(){if(playing)return;initAudio();ac.resume();stake=Number(ui.bet.value);if(!Number.isFinite(stake)||stake<1||stake>bank){setStatus('Escolha entre 1 e '+bank.toFixed(0)+' créditos');tone(90,.2,'sawtooth',.2,-40);return}bank-=stake;playing=true;over=false;mult=1;time=0;spawn=0;difficulty=0;hull=100;lastHullHit=-99;hullInvulnUntil=0;dodges=0;crashAt=randomCrashPoint();rocks.length=particles.length=trail.length=0;resetRocket();ui.action.textContent='Recolher';ui.action.className='btn cash';ui.bet.disabled=true;setStatus('Missão em curso • desvie dos asteroides');tone(220,.1);tone(440,.25,'square',.15,300);startMusic();updateUI()}
function cashOut(){if(!playing)return;bank+=stake*mult;best=Math.max(best,mult);playing=false;ui.action.textContent='Iniciar';ui.action.className='btn primary';ui.bet.disabled=false;setStatus('Resgate concluído: +'+(stake*mult).toFixed(2)+' créditos');tone(523,.1);setTimeout(()=>tone(659,.1),80);setTimeout(()=>tone(784,.25),160);stopMusic();updateUI()}
function explode(reason='A nave foi atingida!'){if(!playing)return;hull=0;playing=false;over=true;shake=18;for(let i=0;i<90;i++)particles.push({x:rocket.x,y:rocket.y,vx:(Math.random()-.5)*280,vy:(Math.random()-.5)*280,life:.5+Math.random(),c:['#ffdf61','#ff6b35','#ff335f','#dff9ff'][i%4],s:2+Math.random()*5});ui.flash.classList.add('on');setTimeout(()=>ui.flash.classList.remove('on'),40);ui.action.textContent='Tentar novamente';ui.action.className='btn primary';ui.bet.disabled=false;setStatus(reason+' Créditos da missão perdidos.');tone(150,.55,'sawtooth',.5,-110);stopMusic();updateUI()}
function spawnRock(){const r=13+Math.random()*20;let x=20+Math.random()*(W-40);const predicted=rocket.x+rocket.vx*.45;if(difficulty>.35&&Math.random()<.48)x=Math.max(r,Math.min(W-r,predicted+(Math.random()-.5)*110));rocks.push({x,y:-r,r,vx:(Math.random()-.5)*(25+difficulty*35),vy:120+difficulty*115+Math.random()*50,rot:Math.random()*6,vr:(Math.random()-.5)*3,seed:Math.random()*99})}
function burst(x,y,c,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,life:.2+Math.random()*.3,c,s:1+Math.random()*3})}

function update(dt){stars.forEach(s=>{s.y+=s.z*(playing?55+mult*12:16)*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;p.life-=dt});for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);if(!playing)return;
 time+=dt;if(hull<100&&time-lastHullHit>5)hull=Math.min(100,hull+3*dt);mult=1+time*.115+time*time*.0018;difficulty=Math.min(1,(mult-1)/5);if(mult>=crashAt){explode('Falha crítica no propulsor!');return}
 // Física com aceleração, arrasto e limite de velocidade.
 let axis=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(Math.abs(rocket.targetX-rocket.x)>7&&!axis)axis=Math.sign(rocket.targetX-rocket.x);rocket.vx+=axis*650*dt;rocket.vx*=Math.pow(.045,dt);rocket.vx=Math.max(-230,Math.min(230,rocket.vx));rocket.x+=rocket.vx*dt;rocket.x=Math.max(25,Math.min(W-25,rocket.x));rocket.tilt+=(rocket.vx/230-rocket.tilt)*8*dt;
 trail.push({x:rocket.x+(Math.random()-.5)*8,y:rocket.y+24,life:.25,s:2+Math.random()*5});if(trail.length>42)trail.shift();trail.forEach(t=>{t.y+=100*dt;t.life-=dt});
 spawn-=dt;if(spawn<=0){spawnRock();spawn=Math.max(.24,.78-difficulty*.42)}
 for(let i=rocks.length-1;i>=0;i--){const a=rocks[i];a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.vr*dt;if(a.x<a.r||a.x>W-a.r)a.vx*=-1;const dx=a.x-rocket.x,dy=a.y-rocket.y;if(dx*dx+dy*dy<(a.r+rocket.r-4)**2){if(time>=hullInvulnUntil){const dmg=Math.min(42,Math.round(19+a.r*.62));hull=Math.max(0,hull-dmg);lastHullHit=time;hullInvulnUntil=time+.7;shake=10;burst(a.x,a.y,'#ff6b5f',18);tone(130,.16,'sawtooth',.10,-60);rocks.splice(i,1);setStatus('Impacto: -'+dmg+' LIFE do casco');if(hull<=0){explode('Casco destruído!');return}}continue}if(a.y>H+50){rocks.splice(i,1);dodges++;if(dodges%12===0&&hull<100){hull=Math.min(100,hull+20);setStatus('Voucher de manutenção: +20 LIFE')}burst(a.x,H-80,'#49f6ff',4);tone(120+Math.random()*40,.035,'square',.025)}}updateUI()}

function pixelRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawRocket(){ctx.save();ctx.translate(Math.round(rocket.x),Math.round(rocket.y));ctx.rotate(rocket.tilt*.28);pixelRect(-5,16,10,18,'#ff7b2f');pixelRect(-2,23,4,14,'#ffe66d');pixelRect(-13,-6,26,26,'#d9f3ff');pixelRect(-9,-15,18,12,'#eefaff');pixelRect(-5,-22,10,8,'#ff4d6d');pixelRect(-16,10,8,14,'#ff4d6d');pixelRect(8,10,8,14,'#ff4d6d');pixelRect(-7,-7,14,10,'#174a7e');pixelRect(-4,-5,8,6,'#49f6ff');pixelRect(-10,17,20,6,'#8799b4');ctx.restore()}
function drawRock(a){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);ctx.fillStyle='#423c55';ctx.beginPath();for(let i=0;i<10;i++){const ang=i*Math.PI*.2,rr=a.r*(.78+Math.sin(a.seed+i*4.7)*.16);ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}ctx.closePath();ctx.fill();ctx.fillStyle='#766881';ctx.fillRect(-a.r*.35,-a.r*.45,a.r*.36,a.r*.25);ctx.fillStyle='#262539';ctx.fillRect(a.r*.18,a.r*.05,a.r*.29,a.r*.3);ctx.restore()}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.2)shake=0}const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03051b');g.addColorStop(.55,'#081a39');g.addColorStop(1,'#091125');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);stars.forEach(s=>pixelRect(s.x,s.y,s.z,s.z,s.z>2?'#d9f7ff':'#6285b2'));ctx.globalAlpha=.16;ctx.strokeStyle='#35c8ff';ctx.lineWidth=2;for(let y=100;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;trail.forEach(t=>{ctx.globalAlpha=Math.max(0,t.life*4);pixelRect(t.x-t.s/2,t.y,t.s,t.s,t.life>.12?'#ffae38':'#ff3d68')});ctx.globalAlpha=1;rocks.forEach(drawRock);if(!over||playing)drawRocket();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);pixelRect(p.x,p.y,p.s,p.s,p.c)});ctx.globalAlpha=1;if(!playing&&!over){ctx.fillStyle='#07142dcc';ctx.fillRect(70,250,W-140,135);ctx.strokeStyle='#2b76a8';ctx.strokeRect(70,250,W-140,135);ctx.textAlign='center';ctx.fillStyle='#ffe66d';ctx.font='bold 25px monospace';ctx.fillText('PRONTO PARA VOAR?',W/2,294);ctx.fillStyle='#a4d9ff';ctx.font='14px monospace';ctx.fillText('Desvie • sobreviva • recolha',W/2,326);ctx.fillText('créditos antes da pane.',W/2,350)}ctx.restore()}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();animationId=requestAnimationFrame(loop)}
function pointer(e){const r=canvas.getBoundingClientRect();rocket.targetX=(e.clientX-r.left)*W/r.width}
canvas.addEventListener('pointerdown',e=>{pointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();playing?cashOut():start()}});addEventListener('keyup',e=>keys[e.key]=false);
ui.action.addEventListener('click',()=>playing?cashOut():start());document.querySelector('#minus').onclick=()=>ui.bet.value=Math.max(1,Number(ui.bet.value||1)-1);document.querySelector('#plus').onclick=()=>ui.bet.value=Math.min(bank,Number(ui.bet.value||0)+1);ui.sound.onclick=()=>{muted=!muted;ui.sound.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.18;if(!muted)tone(440,.08)};
addEventListener('blur',()=>{keys.ArrowLeft=keys.ArrowRight=keys.a=keys.d=false});
updateUI();requestAnimationFrame(loop);
</script>

const STATS_KEY='ppg_minigames_stats_v1',PREF_KEY='ppg_platform_prefs_v2',REC_KEY='ppg_records_v2_'+CFG.id;
const $=s=>document.querySelector(s),num=v=>{const m=String(v??'').replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:null};
const money=v=>{const s=String(v??'').replace(/R\$|◈|Créditos?|Banca:|💰/gi,'').trim();let m=s.match(/(-?[\d.,]+)\s*(K|M|B|T|Qa|Qi|Sx|Sp|Oc|No|Dc)?/i);if(!m)return null;let n=num(m[1]);const u=(m[2]||'').toLowerCase(),map={k:1e3,m:1e6,b:1e9,t:1e12,qa:1e15,qi:1e18,sx:1e21,sp:1e24,oc:1e27,no:1e30,dc:1e33};return n*(map[u]||1)};window.__ppgHelpers={num,money};
function readJSON(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dayDiff(a,b){const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');return Math.round((B-A)/86400000)}
let all=readJSON(STATS_KEY,{}),st=all[CFG.id]||{starts:0,totalSeconds:0,longestStreak:0,currentStreak:0,lastDay:null};const today=dayKey();st.starts=(st.starts||0)+1;if(st.lastDay!==today){const dd=st.lastDay?dayDiff(st.lastDay,today):99;st.currentStreak=dd===1?(st.currentStreak||0)+1:1;st.longestStreak=Math.max(st.longestStreak||0,st.currentStreak);st.lastDay=today}st.lastStarted=Date.now();all[CFG.id]=st;writeJSON(STATS_KEY,all);
let lastTick=performance.now();function flushTime(){const now=performance.now(),d=Math.max(0,(now-lastTick)/1000);lastTick=now;all=readJSON(STATS_KEY,{});const x=all[CFG.id]||st;x.totalSeconds=(x.totalSeconds||0)+d;x.lastPlayed=Date.now();all[CFG.id]=x;writeJSON(STATS_KEY,all)}setInterval(flushTime,5000);addEventListener('pagehide',flushTime);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushTime();else lastTick=performance.now()});
let prefs=readJSON(PREF_KEY,readJSON('ppg_platform_prefs_v1',{theme:'dark',sound:true}));writeJSON(PREF_KEY,prefs);document.body.classList.toggle('ppg-light',prefs.theme==='light');document.body.classList.toggle('ppg-dark',prefs.theme!=='light');
const toolbar=document.createElement('nav');toolbar.id='ppg-toolbar';toolbar.setAttribute('aria-label','Controles comuns do Projeto Primata Games');toolbar.innerHTML=`<span class="ppg-brand">🦧 PPG</span><span class="ppg-life" id="ppg-life"><span>♥</span><span class="ppg-life-track"><span class="ppg-life-fill" id="ppg-life-fill"></span></span><span id="ppg-life-num">100</span></span><button id="ppg-theme">${prefs.theme==='light'?'🌙 Escuro':'☀️ Claro'}</button><button id="ppg-sound">${prefs.sound?'🔊 Som ON':'🔇 Som OFF'}</button><button id="ppg-records">🏆 Placares</button><button id="ppg-about">ⓘ Sobre</button><a href="menu_minigames.html" id="ppg-menu">↩ Mini Games</a>`;document.body.prepend(toolbar);
const modal=document.createElement('div');modal.className='ppg-modal';modal.id='ppg-modal';modal.innerHTML=`<div class="ppg-card"><button class="ppg-close" aria-label="Fechar">✕</button><div id="ppg-modal-body"></div></div>`;document.body.appendChild(modal);const modalBody=$('#ppg-modal-body');function open(html){modalBody.innerHTML=html;modal.classList.add('open')}function close(){modal.classList.remove('open')}modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.ppg-close'))close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
// Reserva uma faixa real para a barra comum. Elementos fixed que começavam em y=0 são deslocados,
// e raízes full-viewport estáticas são encurtadas. Assim a barra não cobre HUD/canvas/menus do jogo.
function protectLayout(){const bar=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ppg-bar-h'))||48;[...document.body.querySelectorAll('*')].forEach(el=>{if(el.closest('#ppg-toolbar,.ppg-modal')||['SCRIPT','STYLE'].includes(el.tagName))return;const cs=getComputedStyle(el);if(cs.position==='fixed'){const r=el.getBoundingClientRect();if(r.top<bar-2&&r.bottom>0&&!el.dataset.ppgShifted){const top=cs.top==='auto'?'0px':cs.top;el.style.setProperty('top',`calc(${top} + var(--ppg-bar-h))`,'important');el.classList.add('ppg-fixed-shift');el.dataset.ppgShifted='1'}}});[...document.body.children].forEach(el=>{if(el===toolbar||el===modal||['SCRIPT','STYLE'].includes(el.tagName))return;const cs=getComputedStyle(el),r=el.getBoundingClientRect();if(cs.position!=='fixed'&&r.height>=innerHeight*.94&&(cs.overflow==='hidden'||getComputedStyle(document.body).overflow==='hidden')&&!el.dataset.ppgTall){el.classList.add('ppg-tall-root');el.dataset.ppgTall='1'}})}requestAnimationFrame(protectLayout);addEventListener('resize',protectLayout);
$('#ppg-about').onclick=()=>open(`<h2>${CFG.name}</h2><p>${CFG.desc}</p><h3>Como jogar</h3><p>${CFG.how}</p><h3>Dica de estratégia</h3><p>${CFG.tip}</p><p class="ppg-credit">Produção: Projeto Primata Games em 2026.</p>`);
$('#ppg-theme').onclick=()=>{prefs.theme=prefs.theme==='light'?'dark':'light';writeJSON(PREF_KEY,prefs);document.body.classList.toggle('ppg-light',prefs.theme==='light');document.body.classList.toggle('ppg-dark',prefs.theme==='dark');$('#ppg-theme').textContent=prefs.theme==='light'?'🌙 Escuro':'☀️ Claro';sfx(520,.05)};
let ac=null,master=null,music=null,beat=0;function initAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=prefs.sound?.10:0;master.connect(ac.destination)}function tone(f,d=.08,type='sine',vol=.08,when=0){if(!prefs.sound)return;initAudio();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d)}function sfx(f=420,d=.045){tone(f,d,'triangle',.10)}function startBgm(){if(music||!prefs.sound)return;initAudio();music=setInterval(()=>{if(document.hidden||!prefs.sound)return;const seq=[110,138.59,164.81,220,196,164.81,146.83,123.47],f=seq[beat++%seq.length];tone(f,.16,'triangle',.019);if(beat%4===1)tone(f/2,.1,'sine',.012)},390)}function stopBgm(){clearInterval(music);music=null}function syncNative(on){try{muted=!on;if(master)master.gain.setTargetAtTime(on?.18:0,ac.currentTime,.02);if(!on)stopMusic();else if(playing)startMusic()}catch{}}function unlock(){initAudio();ac?.resume();if(prefs.sound)startBgm();syncNative(prefs.sound)}addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});window.PPGPlatform={tone,sfx,get soundOn(){return prefs.sound},setLife(v){const e=$('#ppg-life'),f=$('#ppg-life-fill'),n=$('#ppg-life-num');if(v==null){e.classList.remove('show');return}v=Math.max(0,Math.min(100,v));e.classList.add('show');f.style.width=v+'%';n.textContent=Math.round(v)}};
$('#ppg-sound').onclick=e=>{e.stopPropagation();prefs.sound=!prefs.sound;writeJSON(PREF_KEY,prefs);initAudio();master.gain.setTargetAtTime(prefs.sound?.10:0,ac.currentTime,.02);syncNative(prefs.sound);if(prefs.sound){ac.resume();startBgm();sfx(660,.08)}else stopBgm();$('#ppg-sound').textContent=prefs.sound?'🔊 Som ON':'🔇 Som OFF'};
const sessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);function formatValue(v){if(v==null)return '—';if(Math.abs(v)>=1e9)return v.toLocaleString('pt-BR',{notation:'compact',maximumFractionDigits:2})+CFG.unit;return (Number.isInteger(v)?v:v.toFixed(2).replace('.',','))+CFG.unit}function difficultyKey(){try{return String('Padrão')||'Padrão'}catch{return 'Padrão'}}function metric(){try{const num=window.__ppgHelpers.num,money=window.__ppgHelpers.money;return num(document.querySelector('#best')?.textContent)}catch{return null}}
function upsert(v){if(v==null||!Number.isFinite(v)||(CFG.mode==='min'&&v<=0))return;let db=readJSON(REC_KEY,{});if(Array.isArray(db))db={'Padrão':db};const dk=difficultyKey(),r=Array.isArray(db[dk])?db[dk]:[],me=r.find(x=>x.sessionId===sessionId);if(me){const better=CFG.mode==='min'?v<me.value:v>me.value;if(!better)return;me.value=v;me.at=Date.now()}else r.push({sessionId,value:v,at:Date.now()});r.sort((a,b)=>CFG.mode==='min'?a.value-b.value:b.value-a.value);db[dk]=r.slice(0,5);writeJSON(REC_KEY,db)}setInterval(()=>upsert(metric()),800);addEventListener('pagehide',()=>upsert(metric()));
function renderRecords(){let db=readJSON(REC_KEY,{});if(Array.isArray(db))db={'Padrão':db};const keys=Object.keys(db).sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));const sections=keys.length?keys.map(dk=>{const r=db[dk]||[];return `<section class="ppg-diff-section"><div class="ppg-diff-title">◆ ${dk}</div>${r.length?`<div class="ppg-record-list">${r.map((x,i)=>`<div class="ppg-record"><b>#${i+1}</b><span><strong>${formatValue(x.value)}</strong><br><small>${new Date(x.at).toLocaleDateString('pt-BR')}</small></span><small>${CFG.metric}</small></div>`).join('')}</div>`:`<div class="ppg-empty">Sem marcas nesta dificuldade.</div>`}</section>`}).join(''):`<div class="ppg-empty">Ainda não há marca registrada neste navegador.</div>`;open(`<h2>Placares locais</h2><p>Os recordes são separados por dificuldade/modo quando o jogo oferece níveis distintos.</p>${sections}`)}$('#ppg-records').onclick=renderRecords;
function pollLife(){let v=null;try{v=(()=>{try{return typeof hull!=='undefined'?hull:null}catch{return null}})()}catch{}window.PPGPlatform.setLife(v)}setInterval(pollLife,250);pollLife();syncNative(prefs.sound);
})();
