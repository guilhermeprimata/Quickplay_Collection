name: Apply SPACE RAID 2093 polished build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-space-raid-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct approved SPACE RAID build and refresh hub
        run: |
          cat .github/scripts/space_patch_part_*.txt > /tmp/apply_space_raid.py
          python /tmp/apply_space_raid.py

      - name: Verify exact targets
        run: |
          echo "27037f8994bb6010df6ce23f06e4c17986f7639f00c9de93fa8238b54488ebf2  space_raid_2093.html" | sha256sum -c -
          echo "bf88c3f1d10a5bcb2283c430062bb95406d3e95609f9dc9da7719a42aafc663a  index.html" | sha256sum -c -
          grep -q "Spectrum 2093 hub identity" index.html
          grep -q "replay instantâneo" index.html
          git diff --check

      - name: Commit canonical collection update and remove staging
        run: |
          git config user.name "Projeto Primata Games"
          git config user.email "guilhermesteiglederdias@gmail.com"
          git add space_raid_2093.html index.html
          git rm -f .github/scripts/space_patch_part_*.txt
          git rm -f .github/workflows/apply-space-raid-update.yml
          git diff --cached --check
          git commit -m "Polish Space Raid 2093 and refresh hub"
          git push origin HEAD:main
