name: Integrate Iron Delta into Quickplay

on:
  push:
    branches: [main]
    paths:
      - '.iron-delta-upload/READY'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble Iron Delta
        shell: bash
        run: |
          set -euo pipefail
          cat .iron-delta-upload/part_* | base64 -d > /tmp/iron_delta_payload.tar.gz
          echo 'ca0d25cadda79c447fc0105323eba2f2af1dd965e739b0d2de782501878d7f70  /tmp/iron_delta_payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/iron_delta_payload.tar.gz -C .
          echo '685da105f78571dcdabb7ca9a382465e161460a7468462df6015b72fbe06e2c6  iron_delta.html' | sha256sum -c -

      - name: Patch Tier A menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          entry="{file:'iron_delta.html',id:'iron_delta',name:'IRON DELTA',emoji:'✈️',desc:'Ataque em baixa altitude sobre rios procedurais: gerencie combustível, destrua pontes, inimigos e chefes e sobreviva ao delta.',new:true},"
          anchor="{file:'reef_runner.html',id:'reef_runner',name:'REEF RUNNER',emoji:'🐠',desc:'Atravesse um recife vivo com impulsos precisos entre corais, anêmonas e correntezas.',new:true},"
          oldtier="{id:'A',title:'Tier A',games:['snowball_avalanche','brain_matrix','alien_threat','gatinhos','arqueiro','reef_runner']},"
          newtier="{id:'A',title:'Tier A',games:['snowball_avalanche','brain_matrix','alien_threat','gatinhos','arqueiro','reef_runner','iron_delta']},"
          if "id:'iron_delta'" not in s:
              if anchor not in s: raise SystemExit('Reef Runner anchor not found in index.html')
              s=s.replace(anchor,anchor+'\n'+entry,1)
          if newtier not in s:
              if oldtier not in s: raise SystemExit('Tier A anchor not found in index.html')
              s=s.replace(oldtier,newtier,1)
          p.write_text(s,encoding='utf-8')
          print('index patched: IRON DELTA -> Tier A')
          PY

      - name: Validate collection
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_games.py
          node - <<'NODE'
          const fs=require('fs');
          const menu=fs.readFileSync('index.html','utf8');
          const cards=[...menu.matchAll(/file:'([^']+)'/g)].map(m=>m[1]);
          if(cards.length!==25) throw new Error('Expected 25 game cards, found '+cards.length);
          if(!cards.includes('iron_delta.html')) throw new Error('Iron Delta missing from menu');
          const tier=menu.match(/\{id:'A',title:'Tier A',games:\[([^\]]+)\]\}/);
          if(!tier || !tier[1].includes("'iron_delta'")) throw new Error('Iron Delta missing from Tier A');
          const game=fs.readFileSync('iron_delta.html','utf8');
          if(/(?:src|href)\s*=\s*["']https?:\/\//i.test(game)) throw new Error('Iron Delta has remote dependency');
          if(/River\s*Raid|riverRaid/i.test(game)) throw new Error('Legacy clone naming leaked into Iron Delta');
          console.log('Iron Delta menu + standalone checks OK');
          NODE

      - name: Refresh complete package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          out=root/'Quickplay_Collection_COMPLETE.zip'
          include=[]
          for p in root.iterdir():
              if not p.is_file() or p.name==out.name:
                  continue
              if p.suffix.lower() in {'.html','.md','.txt'} or p.name=='.nojekyll':
                  include.append(p)
          include.sort(key=lambda p:p.name.lower())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in include: z.write(p,p.name)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              required={'index.html','iron_delta.html'}
              missing=required-names
              if missing: raise SystemExit('Missing from ZIP: '+','.join(sorted(missing)))
              print('Complete ZIP refreshed:',len(names),'files')
          PY
          sha256sum Quickplay_Collection_COMPLETE.zip > Quickplay_Collection_COMPLETE.zip.sha256
          cat >> RELEASE_2026-08-16.md <<'EOF'

          ## IRON DELTA
          - Novo arcade aéreo/fluvial autocontido integrado ao Tier A.
          - Renomeado para identidade própria; sem referências ao nome clone anterior.
          - Shell Quickplay, controles desktop/mobile, pausa/reinício, preferências e estatísticas locais.
          EOF

      - name: Commit integrated release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .iron-delta-upload
          rm -f .github/workflows/iron-delta-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Iron Delta to Quickplay Tier A'
          git push origin HEAD:main
