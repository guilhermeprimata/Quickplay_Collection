name: Finalize Hover Heroes 2D and 3D

on:
  push:
    branches: [main]
    paths:
      - '.quickplay-hover/READY'

permissions:
  contents: write

concurrency:
  group: finalize-hover-heroes
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch uploaded games and suppress standardized round buttons
        shell: bash
        run: |
          set -euo pipefail
          test -f .quickplay-hover/READY
          test -s HOVER_HEROES_2D.html
          test -s HOVER_HEROES_3D.html
          python - <<'PY'
          from pathlib import Path
          marker='quickplay-round-buttons-suppression'
          css='''\n<style id="quickplay-round-buttons-suppression">\n#quickbar,.quickbar{display:none!important}\n</style>\n'''
          for name in ('HOVER_HEROES_2D.html','HOVER_HEROES_3D.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if marker not in s:
                  if '</head>' not in s.lower():
                      raise SystemExit(f'No </head> found in {name}')
                  idx=s.lower().find('</head>')
                  s=s[:idx]+css+s[idx:]
                  p.write_text(s,encoding='utf-8')
              print(name,'round controls suppressed')
          PY

      - name: Replace Fighting Fire in Mini Games catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="{file:'fighting_fire.html',id:'fighting_fire',name:'FIGHTING FIRE',emoji:'🚁',desc:'Pilote um helicóptero de emergência em uma cidade procedural: combata incêndios, resgate vítimas e coordene equipes terrestres.',new:true},"
          new="{file:'HOVER_HEROES_2D.html',id:'hover_heroes_2d',name:'HOVER HEROES 2D',emoji:'🚁',desc:'Resgate aéreo em 2D com helicóptero, incêndios, vítimas, equipes terrestres e cidade procedural.',new:true},\n{file:'HOVER_HEROES_3D.html',id:'hover_heroes_3d',name:'HOVER HEROES 3D',emoji:'🚁',desc:'A versão 3D de Hover Heroes: operações de emergência, combate a incêndios, resgates e cidade procedural.',new:true},"
          if old in s:
              s=s.replace(old,new,1)
          elif "file:'HOVER_HEROES_2D.html'" not in s or "file:'HOVER_HEROES_3D.html'" not in s:
              raise SystemExit('Could not locate Fighting Fire catalog card')
          s=s.replace("'alien_threat','fighting_fire','gatinhos'","'alien_threat','hover_heroes_2d','hover_heroes_3d','gatinhos'",1)
          s=s.replace('Quatro divisões, vinte e oito jogos.','Quatro divisões, trinta e um jogos.',1)
          # Remove the obsolete Fighting Fire legacy-stat bridge without touching the normal stats bootstrap.
          s=re.sub(r'\n?// Fighting Fire legacy-stat bridge\ntry\{const legacy=.*?\}\s*catch\{\}\n?', '\n', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f fighting_fire.html

      - name: Validate final catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          hub=Path('index.html').read_text(encoding='utf-8')
          for f in ('HOVER_HEROES_2D.html','HOVER_HEROES_3D.html'):
              if not Path(f).is_file(): raise SystemExit('Missing '+f)
              txt=Path(f).read_text(encoding='utf-8')
              if 'quickplay-round-buttons-suppression' not in txt: raise SystemExit('Round-button suppression missing in '+f)
              if f not in hub: raise SystemExit('Catalog does not link '+f)
          if Path('fighting_fire.html').exists() or "file:'fighting_fire.html'" in hub or "id:'fighting_fire'" in hub:
              raise SystemExit('Fighting Fire still present')
          cards=re.findall(r"file:'([^']+)'",hub)
          if len(cards)!=31: raise SystemExit(f'Expected 31 games, got {len(cards)}')
          missing=[f for f in cards if not Path(f).is_file()]
          if missing: raise SystemExit('Broken catalog links: '+','.join(missing))
          print('Catalog OK:',len(cards),'games')
          PY

      - name: Rebuild official complete ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,re
          root=Path('.')
          out=root/'Quickplay_Collection_COMPLETE.zip'
          hashfile=root/'Quickplay_Collection_COMPLETE.zip.sha256'
          include=[]
          for f in root.iterdir():
              if f.is_file() and f.name not in {out.name,hashfile.name} and (f.suffix.lower() in {'.html','.md','.txt'} or f.name=='.nojekyll'):
                  include.append(f)
          include.sort(key=lambda f:f.name.lower())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in include:
                  info=zipfile.ZipInfo(f.name,date_time=(2026,8,22,7,45,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,f.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              if 'fighting_fire.html' in names: raise SystemExit('Fighting Fire remains in ZIP')
              for f in ('index.html','HOVER_HEROES_2D.html','HOVER_HEROES_3D.html'):
                  if f not in names: raise SystemExit('ZIP missing '+f)
              cards=re.findall(r"file:'([^']+)'",z.read('index.html').decode('utf-8'))
              missing=[f for f in cards if f not in names]
              if missing: raise SystemExit('ZIP missing catalog files: '+','.join(missing))
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          hashfile.write_text(digest+'  Quickplay_Collection_COMPLETE.zip\n',encoding='ascii')
          print('ZIP SHA256',digest)
          PY

      - name: Publish and clean temporary integration files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quickplay-hover
          rm -f .github/workflows/integrate-hover-heroes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Fighting Fire with Hover Heroes 2D and 3D'
          git push origin HEAD:main
