name: Quickplay quality audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply quality and balance pass
        run: python tools/apply_quality_pass.py
      - name: Generate audit
        run: python tools/quickplay_quality_audit.py
      - name: Commit quality pass and reports when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Quality pass produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html QUALITY_PASS_REPORT.md QUALITY_AUDIT_AUTOMATED.md
          git commit -m "polish minigame controls and difficulty balance [skip ci]"
          git push
