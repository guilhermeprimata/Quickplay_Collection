name: Quickplay quality audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final runtime repairs
        run: python tools/runtime_repairs.py
      - name: Validate standalone games
        run: python tools/validate_games.py
      - name: Generate feature audit
        run: python tools/quickplay_quality_audit.py
      - name: Commit repairs and reports when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- '*.html' QUALITY_VALIDATION.md QUALITY_AUDIT_AUTOMATED.md)" ]; then
            echo "Games and reports unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' QUALITY_VALIDATION.md QUALITY_AUDIT_AUTOMATED.md
          git commit -m "repair standalone game runtime dependencies [skip ci]"
          git push
