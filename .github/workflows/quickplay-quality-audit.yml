name: Quickplay quality audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate standalone games
        run: python tools/validate_games.py
      - name: Generate feature audit
        run: python tools/quickplay_quality_audit.py
      - name: Commit validation reports when changed
        shell: bash
        run: |
          if git diff --quiet -- QUALITY_VALIDATION.md QUALITY_AUDIT_AUTOMATED.md; then
            echo "Validation reports unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QUALITY_VALIDATION.md QUALITY_AUDIT_AUTOMATED.md
          git commit -m "update minigame validation reports [skip ci]"
          git push
