name: Quickplay quality audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged Neon Pong local PvP patch
        run: python tools/patch_pong_pvp_once.py
      - name: Validate standalone games
        run: python tools/validate_games.py
      - name: Generate feature audit
        run: python tools/quickplay_quality_audit.py
      - name: Commit promoted game and validation reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pong.html QUALITY_VALIDATION.md QUALITY_AUDIT_AUTOMATED.md
          if [ -z "$(git status --porcelain -- pong.html QUALITY_VALIDATION.md QUALITY_AUDIT_AUTOMATED.md)" ]; then
            echo "No promoted changes."
            exit 0
          fi
          git commit -m "add Neon Pong local PvP mode [skip ci]"
          git push
