name: Quickplay staged three-game assembly

on:
  push:
    branches: [main]
    paths:
      - '.quickplay-upload/**'
      - '.github/workflows/quickplay-assemble.yml'

permissions:
  contents: write

concurrency:
  group: quickplay-three-game-assembly
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [ -f .quickplay-upload/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging incomplete; nothing to assemble yet."
          fi

      - name: Assemble and validate three games
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .quickplay-upload/three-games/part_* | base64 -d > /tmp/quickplay_three_games.tar.xz
          echo '9617c2d99b9c933f4cc2ca50d86455254b8392555f634e649e5162a0408bf03f  /tmp/quickplay_three_games.tar.xz' | sha256sum -c -
          tar -xJf /tmp/quickplay_three_games.tar.xz -C .
          echo '6390e9c9e2791ec50c0303dea5db90c29cb2a1fcd83ffbd18f9cd7b99aee554f  bow_and_arrow.html' | sha256sum -c -
          echo '17a779ea9b57cb2d6c111c4a6a3075fddb21e1b3284fd10fb67c776fb878cb15  campo_minado.html' | sha256sum -c -
          echo 'e25bc20ac614b20d0feae71da2200874c0c93b47cc9847aec3194cf94f4a550e  salve_os_gatinhos.html' | sha256sum -c -
          grep -Fq "file:'bow_and_arrow.html',id:'arqueiro'" index.html
          grep -Fq "file:'campo_minado.html',id:'toxic_stench'" index.html
          grep -Fq "file:'salve_os_gatinhos.html',id:'gatinhos'" index.html
          rm -rf .quickplay-upload

      - name: Commit integrated release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Arqueiro do Vale, Toxic Stench e Salve os Gatinhos'
          git push origin HEAD:main
