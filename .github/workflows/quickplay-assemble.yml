name: Quickplay staged assembly

on:
  push:
    branches: [main]
    paths:
      - '.quickplay-upload/**'
      - '.github/workflows/quickplay-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for ready marker
        id: ready
        shell: bash
        run: |
          if [ ! -f .quickplay-upload/READY ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging incomplete; nothing to assemble yet."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble and validate Quickplay release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          assemble() { cat ".quickplay-upload/release3/$1"/part_* | base64 -d | gzip -d > "$2"; }
          assemble brain_matrix brain_matrix.html
          assemble rift_run rift_run.html
          assemble index index.html
          assemble salve_os_gatinhos salve_os_gatinhos.html
          assemble jogo_da_velha jogo_da_velha.html
          assemble advinhe_o_numero advinhe_o_numero.html
          assemble torre_de_hanoi torre_de_hanoi.html
          assemble click_speed click_speed.html
          assemble foguetinho foguetinho.html
          assemble reef_runner reef_runner.html
          assemble sudoku sudoku.html
          echo 'c7d0b08ac4cd9455c5decd7baa7574d81f2029a84f2f15ea557b54aad7f2ffff  brain_matrix.html' | sha256sum -c -
          echo '9e457c6f8156df19c9ada2d8ffff17846c41823f2a8ffb28b29dbe0addff3f7e  rift_run.html' | sha256sum -c -
          echo 'e7205cc3ac3274e8180d22dde015b969a7681dc81cf3b261c2639c93b1279fe7  index.html' | sha256sum -c -
          echo '2beb4f9e428aae369c1c098dfea34426044def8de2d87749d75ea10aefaa70ba  salve_os_gatinhos.html' | sha256sum -c -
          echo '17f16ce89b1edc12a9d61c70adb46f1f49aaa943232db5e256dc5dc63ab95cd2  jogo_da_velha.html' | sha256sum -c -
          echo 'cfbcd4647b7cff76349e3437f7111c23fef8c845c056a6c5e64940fe4573aec5  advinhe_o_numero.html' | sha256sum -c -
          echo '7699870572b59fb9881740d0c92ded9adcefe92b32e516687ba8776d70fc11c3  torre_de_hanoi.html' | sha256sum -c -
          echo 'abca702407f28f5df08be32da2be4262c3e89070d451c1e2cb2664ad935fa355  click_speed.html' | sha256sum -c -
          echo 'a23b22a58672346d4c222a753294b7c9dc2ae096a4d0b1015155dbcc10a6b15f  foguetinho.html' | sha256sum -c -
          echo 'ce8f06b01cce801c2ac84f463cf12eee4addb43ee7760541129e2d68fd715866  reef_runner.html' | sha256sum -c -
          echo 'a8c4f6eebbbd0af8d378d371b3c1f7349781d3185a52f808ec4a47b5fb119537  sudoku.html' | sha256sum -c -
          node - <<'NODE'
          const fs=require('fs');
          const files=['brain_matrix.html','rift_run.html','index.html','salve_os_gatinhos.html','jogo_da_velha.html','advinhe_o_numero.html','torre_de_hanoi.html','click_speed.html','foguetinho.html','reef_runner.html','sudoku.html'];
          for (const f of files) {
            const s=fs.readFileSync(f,'utf8');
            const scripts=s.match(/<script[^>]*>([\s\S]*?)<\/script>/g)||[];
            for(const b of scripts){const js=b.replace(/^<script[^>]*>/,'').replace(/<\/script>$/,'');new Function(js)}
            console.log(f+': scripts parse OK');
          }
          if (fs.readFileSync('index.html','utf8').includes("file:'leaping_into_life.html'")) throw new Error('Legacy LEAP FROG still listed');
          if (!fs.readFileSync('index.html','utf8').includes("file:'reef_runner.html'")) throw new Error('Reef Runner missing from menu');
          NODE
          rm -f leaping_into_life.html
      - name: Commit assembled release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quickplay-upload
          rm -f .github/workflows/quickplay-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh Quickplay games and replace LEAP FROG with Reef Runner'
          git push origin HEAD:main
