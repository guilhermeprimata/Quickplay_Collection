name: Quickplay staged assembly

on:
  push:
    branches: [main]
    paths:
      - '.quickplay-upload/**'
      - '.github/workflows/quickplay-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [ -f .quickplay-upload/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging incomplete; nothing to assemble yet."
          fi

      - name: Assemble reviewed Quickplay batch
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .quickplay-upload/batch/part_* | base64 -d > /tmp/quickplay_batch.tar.xz
          expected="$(tr -d '[:space:]' < .quickplay-upload/SHA256)"
          actual="$(sha256sum /tmp/quickplay_batch.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "Archive SHA mismatch: $actual != $expected"; exit 1; }

          rm -rf /tmp/quickplay_batch
          mkdir -p /tmp/quickplay_batch
          tar -xJf /tmp/quickplay_batch.tar.xz -C /tmp/quickplay_batch

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, zipfile

          root=Path('.')
          staged=Path('/tmp/quickplay_batch')
          manifest=json.loads((staged/'BATCH_SHA256.json').read_text(encoding='utf-8'))
          expected_files=[
              'kombo_blocks.html','jogo_da_forca.html','domination_wars.html','pong.html',
              'snowball_avalanche.html','alien_threat.html','brain_matrix.html'
          ]
          if sorted(manifest)!=sorted(expected_files):
              raise SystemExit('Unexpected batch manifest: '+repr(sorted(manifest)))
          for name in expected_files:
              src=staged/name
              if not src.is_file(): raise SystemExit('Missing staged game: '+name)
              digest=hashlib.sha256(src.read_bytes()).hexdigest()
              if digest!=manifest[name]: raise SystemExit(f'SHA mismatch for {name}')
              text=src.read_text(encoding='utf-8')
              if '<html' not in text.lower() or '</html>' not in text.lower():
                  raise SystemExit('Invalid HTML envelope: '+name)
              shutil.copy2(src,root/name)

          menu_path=root/'index.html'
          menu=menu_path.read_text(encoding='utf-8')
          # Keep canonical filenames/IDs stable while refreshing visible catalog copy.
          menu=menu.replace("{file:'domination_wars.html',id:'domination_wars',name:'Tron: Domínio',emoji:'⚡',desc:'Guerra territorial orgânica com curvas contínuas, trilhas vulneráveis e IA de heading livre.',new:true}",
                            "{file:'domination_wars.html',id:'domination_wars',name:'DOMINATION WARS',emoji:'⚡',desc:'Guerra territorial orgânica com curvas contínuas, trilhas vulneráveis, power-ups e IA agressiva.',new:true}")
          menu=menu.replace("{file:'pong.html',id:'neon_pong',name:'Neon Pong',emoji:'🏓',desc:'Pong pixelado contra uma IA adaptativa.'}",
                            "{file:'pong.html',id:'neon_pong',name:'Neon Pong',emoji:'🏓',desc:'Pong hyper-arcade com combos, supers, power-ups, arenas caóticas e IA em três níveis.'}")
          menu=menu.replace("{file:'jogo_da_forca.html',id:'forca_neon',name:'Forca Neon',emoji:'🔤',desc:'Forca temática com dicas progressivas e ranking por tempo.'}",
                            "{file:'jogo_da_forca.html',id:'forca_neon',name:'Forca Neon',emoji:'🔤',desc:'Forca neon com dicas progressivas, streak, pontuação e ranking local por idioma.'}")
          menu_path.write_text(menu,encoding='utf-8')

          games=re.findall(r"\{file:'([^']+)',id:'([^']+)'", menu)
          ids={i for _,i in games}
          required={'kombo_blocks','forca_neon','domination_wars','neon_pong','snowball_avalanche','alien_threat','brain_matrix'}
          missing_ids=sorted(required-ids)
          if missing_ids: raise SystemExit('Hub missing IDs: '+', '.join(missing_ids))
          missing_targets=[f for f,_ in games if not (root/f).is_file()]
          if missing_targets: raise SystemExit('Missing menu targets: '+', '.join(missing_targets))

          # Rebuild canonical complete snapshot after integrating the reviewed games.
          out=root/'Quickplay_Collection_COMPLETE.zip'
          include=[]
          for p in root.iterdir():
              if not p.is_file() or p.name in {out.name,'Quickplay_Collection_COMPLETE.zip.sha256'}:
                  continue
              if p.suffix.lower() in {'.html','.md','.txt'} or p.name=='.nojekyll': include.append(p)
          include.sort(key=lambda p:p.name.lower())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in include: z.write(p,p.name)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              for name in expected_files+['index.html','menu_minigames.html']:
                  if name not in names: raise SystemExit('Complete ZIP missing '+name)
          print('Quickplay batch validation OK:',len(games),'menu games; updated',len(expected_files),'games')
          PY

          sha256sum Quickplay_Collection_COMPLETE.zip > Quickplay_Collection_COMPLETE.zip.sha256
          rm -rf .quickplay-upload

      - name: Commit integrated release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Atualiza lote revisado de 7 jogos e hub'
          git push origin HEAD:main
