name: Quickplay staged assembly

on:
  push:
    branches: [main]
    paths:
      - '.quickplay-upload/**'
      - '.github/workflows/quickplay-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [ -f .quickplay-upload/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging incomplete; nothing to assemble yet."
          fi

      - name: Assemble SKATE OR DIE release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .quickplay-upload/skate_release/part_* | base64 -d > /tmp/skate_release_bundle.tar.gz
          echo '01409033e229d5a76194fb735e101d57496c9223dad071fd3cf3f6a05085d482  /tmp/skate_release_bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/skate_release_bundle.tar.gz -C .

          python - <<'PY'
          from pathlib import Path
          import re, zipfile
          root=Path('.')
          menu=(root/'index.html').read_text(encoding='utf-8')
          games=re.findall(r"\{file:'([^']+)',id:'([^']+)'", menu)
          if len(games)!=28 or len({i for _,i in games})!=28:
              raise SystemExit(f'Expected 28 unique games, found {len(games)}')
          missing=[f for f,_ in games if not (root/f).is_file()]
          if missing: raise SystemExit('Missing menu targets: '+', '.join(missing))
          if not any(i=='skate_or_die' for _,i in games): raise SystemExit('SKATE OR DIE missing from menu')
          tier=re.search(r"\{id:'A',title:'Tier A',games:\[([^\]]+)\]\}",menu)
          if not tier or "'skate_or_die'" not in tier.group(1): raise SystemExit('SKATE OR DIE missing from Tier A')
          skate=(root/'skate_or_die.html').read_text(encoding='utf-8')
          forbidden=[r'<script[^>]+src=',r'<link[^>]+href=',r'fetch\s*\(']
          for pat in forbidden:
              if re.search(pat,skate,re.I): raise SystemExit('External dependency pattern in skate: '+pat)
          out=root/'Quickplay_Collection_COMPLETE.zip'
          include=[]
          for p in root.iterdir():
              if not p.is_file() or p.name in {out.name,'Quickplay_Collection_COMPLETE.zip.sha256'}:
                  continue
              if p.suffix.lower() in {'.html','.md','.txt'} or p.name=='.nojekyll': include.append(p)
          include.sort(key=lambda p:p.name.lower())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in include: z.write(p,p.name)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              if 'skate_or_die.html' not in names: raise SystemExit('SKATE missing from complete ZIP')
              htmls=[n for n in names if n.endswith('.html')]
              if len(htmls)!=30: raise SystemExit(f'Expected 30 HTML files in complete ZIP, found {len(htmls)}')
          print('Quickplay validation OK:',len(games),'games; ZIP HTMLs:',len(htmls))
          PY

          sha256sum Quickplay_Collection_COMPLETE.zip > Quickplay_Collection_COMPLETE.zip.sha256
          rm -rf .quickplay-upload

      - name: Commit integrated release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate SKATE OR DIE into Tier A'
          git push origin HEAD:main
