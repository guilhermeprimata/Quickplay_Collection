name: Package ChatGPT Download

on:
  push:
    branches:
      - chatgpt/package-20260814

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Remove packaging-only workflow and development metadata
        shell: bash
        run: |
          rm -f .github/workflows/package-chatgpt-download.yml
          rm -rf .release_payload
          rm -f QUALITY_AUDIT_AUTOMATED.md QUALITY_PASS_REPORT.md QUALITY_VALIDATION.md

      - name: Build downloadable ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('/tmp/primata_web_quickplay_2026-08-14.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if '.git' in rel.parts:
                      continue
                  z.write(p, rel.as_posix())
          print(out, out.stat().st_size)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: primata-web-quickplay-full-package
          path: /tmp/primata_web_quickplay_2026-08-14.zip
          if-no-files-found: error
          retention-days: 7
