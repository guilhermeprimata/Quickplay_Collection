name: Package corrected Quickplay collection

on:
  push:
    branches: [chatgpt/package-corrected-20260814]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrected main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate Alien Threat skeleton revision
        shell: bash
        run: |
          set -euo pipefail
          grep -q "skeleton residues" alien_threat.html
          grep -q "kind:'skeleton'" alien_threat.html
          grep -q "drawSkeletonResidue" alien_threat.html
      - name: Build corrected packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          out=Path('/tmp/out')
          playable=out/'Primata_Web_Quickplay_Collection_PLAYABLE_CORRECTED_2026-08-14.zip'
          full=out/'Primata_Web_Quickplay_Collection_FULL_CORRECTED_2026-08-14.zip'
          with zipfile.ZipFile(playable,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.glob('*.html')):
                  z.write(p,p.name)
              for name in ['LEIA-ME.txt','.nojekyll']:
                  p=root/name
                  if p.is_file(): z.write(p,p.name)
          with zipfile.ZipFile(full,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  rel=p.relative_to(root)
                  if '.git' in rel.parts: continue
                  z.write(p,rel.as_posix())
          for p in (playable,full):
              print(p.name,p.stat().st_size)
          PY
      - name: Upload corrected packages
        uses: actions/upload-artifact@v4
        with:
          name: primata-web-quickplay-corrected-packages
          path: /tmp/out/*.zip
          if-no-files-found: error
          retention-days: 7
