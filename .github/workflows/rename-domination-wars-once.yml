name: Rename Domination Wars in hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-domination-wars-once.yml'

permissions:
  contents: write

jobs:
  patch-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename catalog entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "file:'domination_wars.html',id:'domination_wars',name:'Tron: Domínio'"
          new = "file:'domination_wars.html',id:'domination_wars',name:'DOMINATION WARS'"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Hub entry renamed to DOMINATION WARS.')
          elif new in s:
              print('Hub entry already uses DOMINATION WARS.')
          else:
              raise SystemExit('Could not locate the domination_wars catalog entry.')
          PY

      - name: Commit hub rename
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No hub change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename Tron: Domínio to DOMINATION WARS in hub'
          git push origin HEAD:main
