name: Integrate Alien Threat 3D into Quickplay hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-alien-threat-3d.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Alien Threat 3D to collection hub
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_count = 'Quatro divisões, trinta e um jogos.'
          new_count = 'Quatro divisões, trinta e dois jogos.'
          if old_count in s:
              s = s.replace(old_count, new_count, 1)

          anchor = "{file:'alien_threat.html',id:'alien_threat',name:'ALIEN THREAT',emoji:'🛸',desc:'Pilote um disco voador sobre uma cidade procedural, abduza alvos com o raio teleport e sobreviva ao contra-ataque.',new:true},"
          entry = "{file:'alien_threat_3d.html',id:'alien_threat_3d',name:'ALIEN THREAT 3D',emoji:'🛸',desc:'Versão 3D da invasão: pilote o UFO sobre uma cidade procedural volumétrica, abduza alvos e sobreviva à resposta humana.',new:true},"
          if "id:'alien_threat_3d'" not in s:
              if anchor not in s:
                  raise SystemExit('Alien Threat anchor not found in GAMES')
              s = s.replace(anchor, anchor + '\n' + entry, 1)

          tier_anchor = "'snowball_avalanche','brain_matrix','alien_threat','hover_heroes_2d'"
          tier_new = "'snowball_avalanche','brain_matrix','alien_threat','alien_threat_3d','hover_heroes_2d'"
          if "'alien_threat_3d'" not in s:
              if tier_anchor not in s:
                  raise SystemExit('Alien Threat Tier A anchor not found')
              s = s.replace(tier_anchor, tier_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q "file:'alien_threat_3d.html'" index.html
          grep -q "'alien_threat','alien_threat_3d','hover_heroes_2d'" index.html
          grep -q 'trinta e dois jogos' index.html
          git diff --check

      - name: Commit hub integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Projeto Primata Games"
          git config user.email "guilhermesteiglederdias@gmail.com"
          git add index.html
          git rm -f .github/workflows/integrate-alien-threat-3d.yml
          git diff --cached --check
          git commit -m "Add Alien Threat 3D to Quickplay collection"
          git push origin HEAD:main
