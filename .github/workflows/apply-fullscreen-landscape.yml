name: Apply fullscreen landscape launcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fullscreen-landscape.yml'
      - '.github/scripts/apply_fullscreen_landscape.py'
      - '.github/scripts/normalize_fullscreen_runtime.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject and normalize fullscreen runtime
        run: python .github/scripts/normalize_fullscreen_runtime.py
      - name: Validate diff
        run: git diff --check
      - name: Commit collection update
        run: |
          git config user.name "Projeto Primata Games"
          git config user.email "guilhermesteiglederdias@gmail.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes"
            exit 0
          fi
          git commit -m "Normalize fullscreen landscape runtime"
          git push origin HEAD:main
