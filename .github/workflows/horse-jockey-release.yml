name: Release Horse Jockey Challenge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horse-jockey-release.yml'
      - '.horse-jockey-upload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horse-jockey-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate Horse Jockey
        shell: bash
        run: |
          set -euo pipefail
          test -f .horse-jockey-upload/READY
          cat .horse-jockey-upload/payload_* | base64 -d > /tmp/corrida_de_cavalos.html
          echo '911faca7298b9356fc858bfef8aaea61182b3105a2563b464630404573dc60b6  /tmp/corrida_de_cavalos.html' | sha256sum -c -
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/corrida_de_cavalos.html','utf8');
          const scripts=s.match(/<script[^>]*>([\s\S]*?)<\/script>/g)||[];
          for(const b of scripts){
            const js=b.replace(/^<script[^>]*>/,'').replace(/<\/script>$/,'');
            new Function(js);
          }
          if(!s.includes('Jockey Challenge')) throw new Error('Jockey Challenge identity missing');
          if(!s.includes('Nova corrida · N / Enter')) throw new Error('Quick replay control missing');
          if(s.includes('Apostar R$') || s.includes('Painel de odds')) throw new Error('Legacy betting gameplay remains');
          console.log('Horse Jockey scripts parse OK');
          NODE
          cp /tmp/corrida_de_cavalos.html corrida_de_cavalos.html

      - name: Update Quickplay menu and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="{file:'corrida_de_cavalos.html',id:'corrida',name:'Hipódromo Estelar',emoji:'🏇',desc:'Corridas, odds e gestão de banca em rodadas rápidas.'},"
          new="{file:'corrida_de_cavalos.html',id:'corrida',name:'Hipódromo Estelar',emoji:'🏇',desc:'Corrida de habilidade com largada por reação, saltos e sprint estratégico.'},"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Could not locate horse game card in index.html')
          if 'Corridas, odds e gestão de banca' in s:
              raise SystemExit('Legacy horse betting menu description remains')
          p.write_text(s,encoding='utf-8')
          PY
          cat >> RELEASE_2026-08-16.md <<'EOF'

          ## Hipódromo Estelar — Jockey Challenge
          - A antiga mecânica de apostas foi substituída definitivamente por uma corrida de habilidade.
          - A jogabilidade usa largada por reação, saltos com `M` e sprint recarregável com `N`.
          - A barra de sprint recupera lentamente e recompensa uso estratégico durante a prova.
          - Após o resultado, `N` ou `Enter` inicia rapidamente uma nova corrida.
          - O menu principal foi atualizado para refletir a nova versão.
          EOF
          rm -rf .horse-jockey-upload

      - name: Validate menu and game scripts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['index.html','foguetinho.html','corrida_de_cavalos.html']){
            const s=fs.readFileSync(f,'utf8');
            const scripts=s.match(/<script[^>]*>([\s\S]*?)<\/script>/g)||[];
            for(const b of scripts){const js=b.replace(/^<script[^>]*>/,'').replace(/<\/script>$/,'');new Function(js)}
            console.log(f+': scripts parse OK');
          }
          const menu=fs.readFileSync('index.html','utf8');
          const cards=[...menu.matchAll(/file:'([^']+)'/g)].map(m=>m[1]);
          if(cards.length!==24) throw new Error('Expected 24 game cards, found '+cards.length);
          if(!menu.includes("id:'corrida'")) throw new Error('Hipódromo Estelar missing from menu');
          if(menu.includes('Corridas, odds e gestão de banca')) throw new Error('Legacy horse betting card remains');
          const horse=fs.readFileSync('corrida_de_cavalos.html','utf8');
          if(!horse.includes('Nova corrida · N / Enter')) throw new Error('Quick replay missing');
          if(!horse.includes('Sprint reserva')) throw new Error('Sprint reserve UI missing');
          NODE

      - name: Build deterministic complete ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          root=Path('.')
          out=root/'Quickplay_Collection_COMPLETE.zip'
          include=[]
          for p in root.iterdir():
              if not p.is_file() or p.name in {out.name,'Quickplay_Collection_COMPLETE.zip.sha256'}:
                  continue
              if p.suffix.lower() in {'.html','.md','.txt'} or p.name=='.nojekyll':
                  include.append(p)
          include.sort(key=lambda p:p.name.lower())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in include:
                  info=zipfile.ZipInfo(p.name,date_time=(2026,8,16,12,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              htmls=[n for n in names if n.endswith('.html')]
              if len(htmls)!=26: raise SystemExit(f'Expected 26 HTML files, found {len(htmls)}')
              required={'index.html','menu_minigames.html','corrida_de_cavalos.html','foguetinho.html','alien_threat.html','brain_matrix.html','rift_run.html','reef_runner.html'}
              missing=required-names
              if missing: raise SystemExit('Missing from ZIP: '+','.join(sorted(missing)))
              horse=z.read('corrida_de_cavalos.html').decode('utf-8')
              menu=z.read('index.html').decode('utf-8')
              if 'Nova corrida · N / Enter' not in horse: raise SystemExit('Quick replay missing from ZIP horse game')
              if 'Painel de odds' in horse or 'Apostar R$' in horse: raise SystemExit('Legacy betting gameplay remains in ZIP')
              if 'Corrida de habilidade com largada por reação, saltos e sprint estratégico.' not in menu: raise SystemExit('Updated horse card missing from ZIP menu')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('Quickplay_Collection_COMPLETE.zip.sha256').write_text(digest+'  Quickplay_Collection_COMPLETE.zip\n',encoding='ascii')
          print('Complete ZIP OK:',len(names),'files,',len(htmls),'HTML files',digest)
          PY

      - name: Upload complete ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quickplay_Collection_COMPLETE_Horse_Jockey
          path: |
            Quickplay_Collection_COMPLETE.zip
            Quickplay_Collection_COMPLETE.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Commit Horse Jockey release and refreshed package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Replace horse betting game with Jockey Challenge'
          git push origin HEAD:main
