name: Apply Snowball v1.7

on:
  push:
    branches:
      - agent/snowball-v17-staging
    paths:
      - '.snowball-v17/**'
      - '.github/workflows/apply-snowball-v17.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: agent/snowball-v17-staging
          path: patchsrc

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Rebuild and validate Snowball v1.7
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo '4d8336081cc1e68403ef0927a49bdcb08a343ed855afb5076052bd199c4e14c0  repo/snowball_avalanche.html' | sha256sum -c -
          base64 -d patchsrc/.snowball-v17/apply.b64 > /tmp/apply-v17.py.gz
          gunzip -c /tmp/apply-v17.py.gz > /tmp/apply-v17.py
          sed -i "s#p=Path('/mnt/data/snowball_avalanche.html')#p=Path('repo/snowball_avalanche.html')#" /tmp/apply-v17.py
          python3 /tmp/apply-v17.py
          echo '4e530c42140a1103b00ec0d8767963bc5f28995fb326ef78342acac91f43b5d2  repo/snowball_avalanche.html' | sha256sum -c -
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('repo/snowball_avalanche.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/snowball-v17.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/snowball-v17.js
          grep -q 'Infinite World v1.7' repo/snowball_avalanche.html
          grep -q 'Efeito Monitor Antigo' repo/snowball_avalanche.html
          grep -q 'MUSIC_GAIN=2.35' repo/snowball_avalanche.html
          grep -q 'function beginRunAudio' repo/snowball_avalanche.html
          grep -q 'function startCue' repo/snowball_avalanche.html
          grep -q 'function endCue' repo/snowball_avalanche.html
          grep -q 'gravityAlign=1.05' repo/snowball_avalanche.html

      - name: Commit v1.7 to main
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'Projeto Primata Games'
          git config user.email 'guilhermesteiglederdias@gmail.com'
          git add snowball_avalanche.html
          git commit -m 'Fix Snowball BGM monitor effect and gravity steering'
          git push origin HEAD:main
