name: Publish Quickplay V13

on:
  push:
    paths:
      - '.github/workflows/import-v13.yml'
      - 'import-v13/repair17-2'

permissions:
  contents: write

concurrency:
  group: quickplay-v13-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit source chunks
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/chunks.sha256 <<'EOF'
