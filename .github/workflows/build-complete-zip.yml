name: Build Quickplay complete ZIP

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.md'
      - '*.txt'
      - '.nojekyll'
      - '.pixel-joust-upload/**'
      - '.github/workflows/build-complete-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickplay-complete-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check staged Pixel Joust upload
        id: stage
        shell: bash
        run: |
          if [ -d .pixel-joust-upload ] && [ ! -f .pixel-joust-upload/READY ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Pixel Joust upload is still being staged; package build skipped.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble staged Pixel Joust
        if: steps.stage.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .pixel-joust-upload/READY ]; then
            echo 'No staged Pixel Joust release to assemble.'
            exit 0
          fi
          cat .pixel-joust-upload/part_* | base64 -d | gzip -dc > pixel_joust.html
          echo '390e10a317f4f0dd1b8725cc30a213c8abf99aa03f1c63ae0925e8eff55434d4  pixel_joust.html' | sha256sum -c -
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('pixel_joust.html','utf8');
          const scripts=s.match(/<script[^>]*>([\s\S]*?)<\/script>/g)||[];
          for(const b of scripts){
            const js=b.replace(/^<script[^>]*>/,'').replace(/<\/script>$/,'');
            new Function(js);
          }
          for(const marker of ['GAME_ID=\'pixel_joust\'','ppg_minigames_stats_v1','preview','ppg-exit-game','ENTER / ESPAÇO / R']){
            if(!s.includes(marker)) throw new Error('Pixel Joust release marker missing: '+marker);
          }
          if(/https?:\/\//i.test(s)) throw new Error('Pixel Joust contains an external URL/dependency');
          console.log('Pixel Joust staged release: scripts and collection markers OK');
          NODE
          rm -rf .pixel-joust-upload

      - name: Integrate Pixel Joust in Tier B
        if: steps.stage.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          game=Path('pixel_joust.html')
          if not game.exists():
              print('Pixel Joust not present yet; keeping current hall.')
              raise SystemExit(0)
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor="{file:'rift_run.html',id:'rift_run',name:'RIFT/RUN',emoji:'🛸',desc:'Corredor pseudo-3D de sobrevivência, combate, shield, grazes e canhão carregável.',new:true},"
          card="{file:'pixel_joust.html',id:'pixel_joust',name:'Pixel Joust',emoji:'⚔️',desc:'Duelo medieval de precisão com espada, escudo, fintas e impactos físicos.',new:true},"
          if "id:'pixel_joust'" not in s:
              if anchor not in s:
                  raise SystemExit('RIFT/RUN menu anchor not found')
              s=s.replace(anchor,anchor+'\n'+card,1)
          old="{id:'B',title:'Tier B',games:['toxic_stench','kombo_blocks','neon_pong','domination_wars','dropworks','pixel_bomber','rift_run']},"
          new="{id:'B',title:'Tier B',games:['toxic_stench','kombo_blocks','neon_pong','domination_wars','dropworks','pixel_bomber','rift_run','pixel_joust']},"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Tier B menu definition not found')
          if s.count("id:'pixel_joust'") != 1:
              raise SystemExit('Pixel Joust menu card must appear exactly once')
          p.write_text(s,encoding='utf-8')
          print('Pixel Joust integrated into Tier B')
          PY

      - name: Validate hall and release scripts
        if: steps.stage.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          function parseInline(f){
            const s=fs.readFileSync(f,'utf8');
            const scripts=s.match(/<script[^>]*>([\s\S]*?)<\/script>/g)||[];
            for(const b of scripts){
              const open=b.match(/^<script[^>]*>/)?.[0]||'';
              if(/type=["'](?:application\/json|importmap)["']/i.test(open)) continue;
              const js=b.replace(/^<script[^>]*>/,'').replace(/<\/script>$/,'');
              new Function(js);
            }
          }
          parseInline('index.html');
          if(fs.existsSync('pixel_joust.html')) parseInline('pixel_joust.html');
          const menu=fs.readFileSync('index.html','utf8');
          const cards=[...menu.matchAll(/file:'([^']+)'/g)].map(m=>m[1]);
          if(new Set(cards).size!==cards.length) throw new Error('Duplicate game files in hall');
          for(const f of cards) if(!fs.existsSync(f)) throw new Error('Hall points to missing game: '+f);
          if(fs.existsSync('pixel_joust.html')){
            if(!menu.includes("id:'pixel_joust'")) throw new Error('Pixel Joust card missing from hall');
            if(!menu.includes("'rift_run','pixel_joust']")) throw new Error('Pixel Joust is not in Tier B');
          }
          console.log('Hall OK:',cards.length,'games');
          NODE

      - name: Build deterministic complete ZIP
        if: steps.stage.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, re
          root=Path('.')
          out=root/'Quickplay_Collection_COMPLETE.zip'
          include=[]
          for p in root.iterdir():
              if not p.is_file() or p.name in {out.name,'Quickplay_Collection_COMPLETE.zip.sha256'}:
                  continue
              if p.suffix.lower() in {'.html','.md','.txt'} or p.name=='.nojekyll':
                  include.append(p)
          include.sort(key=lambda p:p.name.lower())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in include:
                  info=zipfile.ZipInfo(p.name,date_time=(2026,8,16,12,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              required={'index.html','menu_minigames.html'}
              if Path('pixel_joust.html').exists(): required.add('pixel_joust.html')
              missing=required-names
              if missing: raise SystemExit('Missing from ZIP: '+','.join(sorted(missing)))
              menu=z.read('index.html').decode('utf-8')
              cards=re.findall(r"file:'([^']+)'",menu)
              missing_cards=[f for f in cards if f not in names]
              if missing_cards: raise SystemExit('Hall games missing from ZIP: '+','.join(missing_cards))
              print('Complete ZIP OK:',len(names),'files,',len(cards),'hall games')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('Quickplay_Collection_COMPLETE.zip.sha256').write_text(digest+'  Quickplay_Collection_COMPLETE.zip\n',encoding='ascii')
          print('SHA256',digest)
          PY

      - name: Upload complete package artifact
        if: steps.stage.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Quickplay_Collection_COMPLETE
          path: |
            Quickplay_Collection_COMPLETE.zip
            Quickplay_Collection_COMPLETE.zip.sha256
          retention-days: 7

      - name: Commit refreshed collection and package
        if: steps.stage.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Add Pixel Joust to Tier B and refresh Quickplay package'
          git push origin HEAD:main
