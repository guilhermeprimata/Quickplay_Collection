
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zen Sudoku</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #F5F5F5;
      color: #5A3AC8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #FFB85C;
      text-shadow: 1px 1px 2px #5A3AC8;
    }

    .sudoku-container {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
    }

    .cell {
      width: 40px;
      height: 40px;
      text-align: center;
      font-size: 18px;
      border: none;
      outline: none;
      background-color: #FFFFFF;
      color: #5A3AC8;
    }

    .cell:disabled {
      background-color: #FFB85C;
      font-weight: bold;
    }

    .cell.invalid {
      background-color: #FF9999;
    }

    .bold-border {
      border-right: 2px solid #5A3AC8;
      border-bottom: 2px solid #5A3AC8;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      background-color: #5A3AC8;
      color: #FFB85C;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      margin: 5px;
    }

    button:hover {
      background-color: #3B2793;
    }

    .top-5 {
      margin-top: 20px;
      width: 100%;
      max-width: 300px;
    }

    .top-5 h2 {
      color: #FFB85C;
      text-shadow: 1px 1px 2px #5A3AC8;
    }

    .top-5 ul {
      list-style: none;
      padding: 0;
    }

    .top-5 li {
      background-color: #FFFFFF;
      color: #5A3AC8;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
    }
  </style>
<style id="ppg-viewport-fit">

<body>
  <h1>Zen Sudoku</h1>
  <div class="controls">
    <button onclick="startGame('easy')">Fácil</button>
    <button onclick="startGame('medium')">Médio</button>
    <button onclick="startGame('hard')">Difícil</button>
    <button onclick="resetBoard()">Reiniciar</button>
  </div>
  <div class="sudoku-container" id="sudoku"></div>
  <div class="controls">
    <span id="timer">00:00</span>
  </div>
  <div class="top-5">
    <h2>Top 5 Jogadores</h2>
    <ul id="top-5-list"></ul>
  </div>

  <script>
    const initialBoard = [
      [5, 3, '', '', 7, '', '', '', ''],
      [6, '', '', 1, 9, 5, '', '', ''],
      ['', 9, 8, '', '', '', '', 6, ''],
      [8, '', '', '', 6, '', '', '', 3],
      [4, '', '', 8, '', 3, '', '', 1],
      [7, '', '', '', 2, '', '', '', 6],
      ['', 6, '', '', '', '', 2, 8, ''],
      ['', '', '', 4, 1, 9, '', '', 5],
      ['', '', '', '', 8, '', '', 7, 9]
    ];

    let cells = [];
    let timer;
    let startTime;
    let difficulty;
    let top5 = JSON.parse(localStorage.getItem('top5')) || [];

    function createBoard(board) {
      const container = document.getElementById('sudoku');
      container.innerHTML = '';
      for (let row = 0; row < 9; row++) {
        cells[row] = [];
        for (let col = 0; col < 9; col++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 1;
          input.classList.add('cell');

          if (board[row][col] !== '') {
            input.value = board[row][col];
            input.disabled = true;
          } else {
            input.addEventListener('input', () => validateInput(row, col));
          }

          // Adiciona bordas grossas para separar blocos 3x3
          if ((col + 1) % 3 === 0 && col !== 8) input.style.borderRight = '2px solid #5A3AC8';
          if ((row + 1) % 3 === 0 && row !== 8) input.style.borderBottom = '2px solid #5A3AC8';

          container.appendChild(input);
          cells[row][col] = input;
        }
      }
    }

    function validateInput(row, col) {
      const value = cells[row][col].value;
      cells[row][col].classList.remove('invalid');

      if (!/^[1-9]$/.test(value)) {
        cells[row][col].classList.add('invalid');
        return;
      }

      // Verifica duplicatas na linha, coluna e bloco
      for (let i = 0; i < 9; i++) {
        if (i !== col && cells[row][i].value === value) {
          cells[row][col].classList.add('invalid');
          return;
        }
        if (i !== row && cells[i][col].value === value) {
          cells[row][col].classList.add('invalid');
          return;
        }
      }

      const startRow = Math.floor(row / 3) * 3;
      const startCol = Math.floor(col / 3) * 3;
      for (let r = startRow; r < startRow + 3; r++) {
        for (let c = startCol; c < startCol + 3; c++) {
          if ((r !== row || c !== col) && cells[r][c].value === value) {
            cells[row][col].classList.add('invalid');
            return;
          }
        }
      }

      checkWin();
    }

    function checkWin() {
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          if (cells[row][col].value === '' || cells[row][col].classList.contains('invalid')) {
            return;
          }
        }
      }
      clearInterval(timer);
      const timeTaken = Math.floor((Date.now() - startTime) / 1000);
      const playerName = prompt('Parabéns! Você completou o Sudoku. Insira seu nome:');
      if (playerName) {
        top5.push({ name: playerName, time: timeTaken, difficulty });
        top5.sort((a, b) => a.time - b.time);
        if (top5.length > 5) top5.pop();
        localStorage.setItem('top5', JSON.stringify(top5));
        updateTop5();
      }
    }

    function updateTop5() {
      const top5List = document.getElementById('top-5-list');
      top5List.innerHTML = '';
      top5.forEach(player => {
        const li = document.createElement('li');
        li.textContent = `${player.name} - ${player.time}s (${player.difficulty})`;
        top5List.appendChild(li);
      });
    }

    function startGame(level) {
      difficulty = level;
      const board = generateBoard(level);
      createBoard(board);
      startTime = Date.now();
      clearInterval(timer);
      timer = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      const timeElapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
      const seconds = String(timeElapsed % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${minutes}:${seconds}`;
    }

    function resetBoard() {
      startGame(difficulty);
    }

    function generateBoard(level) {
      const baseBoard = [
        [5, 3, 4, 6, 7, 8, 9, 1, 2],
        [6, 7, 2, 1, 9, 5, 3, 4, 8],
        [1, 9, 8, 3, 4, 2, 5, 6, 7],
        [8, 5, 9, 7, 6, 1, 4, 2, 3],
        [4, 2, 6, 8, 5, 3, 7, 9, 1],
        [7, 1, 3, 9, 2, 4, 8, 5, 6],
        [9, 6, 1, 5, 3, 7, 2, 8, 4],
        [2, 8, 7, 4, 1, 9, 6, 3, 5],
        [3, 4, 5, 2, 8, 6, 1, 7, 9]
      ];

      // Shuffle rows and columns within each 3x3 block
      for (let i = 0; i < 9; i += 3) {
        shuffle(baseBoard, i, i + 2);
        shuffle(baseBoard, i, i + 2, true);
      }

      // Remove numbers based on difficulty
      const board = baseBoard.map(row => row.slice());
      let cellsToRemove;
      if (level === 'easy') cellsToRemove = 20;
      else if (level === 'medium') cellsToRemove = 40;
      else cellsToRemove = 60;

      while (cellsToRemove > 0) {
        const row = Math.floor(Math.random() * 9);
        const col = Math.floor(Math.random() * 9);
        if (board[row][col] !== '') {
          board[row][col] = '';
          cellsToRemove--;
        }
      }

      return board;
    }

    function shuffle(board, start, end, isCol = false) {
      for (let i = start; i <= end; i++) {
        const j = Math.floor(Math.random() * (end - start + 1)) + start;
        if (isCol) {
          for (let k = 0; k < 9; k++) {
            [board[k][i], board[k][j]] = [board[k][j], board[k][i]];
          }
        } else {
          [board[i], board[j]] = [board[j], board[i]];
        }
      }
    }

    updateTop5();
    startGame('easy');
  </script>
