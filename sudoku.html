<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Zen Sudoku</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #F5F5F5;
      color: #5A3AC8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #FFB85C;
      text-shadow: 1px 1px 2px #5A3AC8;
    }

    .sudoku-container {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
    }

    .cell {
      width: 40px;
      height: 40px;
      text-align: center;
      font-size: 18px;
      border: none;
      outline: none;
      background-color: #FFFFFF;
      color: #5A3AC8;
    }

    .cell:disabled {
      background-color: #FFB85C;
      font-weight: bold;
    }

    .cell.invalid {
      background-color: #FF9999;
    }

    .bold-border {
      border-right: 2px solid #5A3AC8;
      border-bottom: 2px solid #5A3AC8;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      background-color: #5A3AC8;
      color: #FFB85C;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      margin: 5px;
    }

    button:hover {
      background-color: #3B2793;
    }

    .top-5 {
      margin-top: 20px;
      width: 100%;
      max-width: 300px;
    }

    .top-5 h2 {
      color: #FFB85C;
      text-shadow: 1px 1px 2px #5A3AC8;
    }

    .top-5 ul {
      list-style: none;
      padding: 0;
    }

    .top-5 li {
      background-color: #FFFFFF;
      color: #5A3AC8;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
    }

<body>
  <h1>Zen Sudoku</h1>
  <div class="controls">
    <button onclick="startGame('easy')">Fácil</button>
    <button onclick="startGame('medium')">Médio</button>
    <button onclick="startGame('hard')">Difícil</button>
    <button onclick="resetBoard()">Reiniciar</button>
  </div>
  <div class="sudoku-container" id="sudoku"></div>
  <div class="controls">
    <span id="timer">00:00</span>
  </div>
  <div class="top-5">
    <h2>Top 5 Jogadores</h2>
    <ul id="top-5-list"></ul>
  </div>

  <script>
    const initialBoard = [
      [5, 3, '', '', 7, '', '', '', ''],
      [6, '', '', 1, 9, 5, '', '', ''],
      ['', 9, 8, '', '', '', '', 6, ''],
      [8, '', '', '', 6, '', '', '', 3],
      [4, '', '', 8, '', 3, '', '', 1],
      [7, '', '', '', 2, '', '', '', 6],
      ['', 6, '', '', '', '', 2, 8, ''],
      ['', '', '', 4, 1, 9, '', '', 5],
      ['', '', '', '', 8, '', '', 7, 9]
    ];

    let cells = [];
    let timer;
    let startTime;
    let difficulty;
    let top5 = JSON.parse(localStorage.getItem('top5')) || [];

    function createBoard(board) {
      const container = document.getElementById('sudoku');
      container.innerHTML = '';
      for (let row = 0; row < 9; row++) {
        cells[row] = [];
        for (let col = 0; col < 9; col++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 1;
          input.classList.add('cell');

          if (board[row][col] !== '') {
            input.value = board[row][col];
            input.disabled = true;
          } else {
            input.addEventListener('input', () => validateInput(row, col));
          }

          // Adiciona bordas grossas para separar blocos 3x3
          if ((col + 1) % 3 === 0 && col !== 8) input.style.borderRight = '2px solid #5A3AC8';
          if ((row + 1) % 3 === 0 && row !== 8) input.style.borderBottom = '2px solid #5A3AC8';

          container.appendChild(input);
          cells[row][col] = input;
        }
      }
    }

    function validateInput(row, col) {
      const value = cells[row][col].value;
      cells[row][col].classList.remove('invalid');

      if (!/^[1-9]$/.test(value)) {
        cells[row][col].classList.add('invalid');
        return;
      }

      // Verifica duplicatas na linha, coluna e bloco
      for (let i = 0; i < 9; i++) {
        if (i !== col && cells[row][i].value === value) {
          cells[row][col].classList.add('invalid');
          return;
        }
        if (i !== row && cells[i][col].value === value) {
          cells[row][col].classList.add('invalid');
          return;
        }
      }

      const startRow = Math.floor(row / 3) * 3;
      const startCol = Math.floor(col / 3) * 3;
      for (let r = startRow; r < startRow + 3; r++) {
        for (let c = startCol; c < startCol + 3; c++) {
          if ((r !== row || c !== col) && cells[r][c].value === value) {
            cells[row][col].classList.add('invalid');
            return;
          }
        }
      }

      checkWin();
    }

    function checkWin() {
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          if (cells[row][col].value === '' || cells[row][col].classList.contains('invalid')) {
            return;
          }
        }
      }
      clearInterval(timer);
      const timeTaken = Math.floor((Date.now() - startTime) / 1000);
      const playerName = prompt('Parabéns! Você completou o Sudoku. Insira seu nome:');
      if (playerName) {
        top5.push({ name: playerName, time: timeTaken, difficulty });
        top5.sort((a, b) => a.time - b.time);
        if (top5.length > 5) top5.pop();
        localStorage.setItem('top5', JSON.stringify(top5));
        updateTop5();
      }
    }

    function updateTop5() {
      const top5List = document.getElementById('top-5-list');
      top5List.innerHTML = '';
      top5.forEach(player => {
        const li = document.createElement('li');
        li.textContent = `${player.name} - ${player.time}s (${player.difficulty})`;
        top5List.appendChild(li);
      });
    }

    function startGame(level) {
      difficulty = level;
      const board = generateBoard(level);
      createBoard(board);
      startTime = Date.now();
      clearInterval(timer);
      timer = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      const timeElapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
      const seconds = String(timeElapsed % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${minutes}:${seconds}`;
    }

    function resetBoard() {
      startGame(difficulty);
    }

    function sudokuSolutionCount(board, limit = 2) {
      let best = null, bestCandidates = null;
      for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (board[r][c] === '') {
        const used = new Set();
        for (let i = 0; i < 9; i++) { if (board[r][i] !== '') used.add(board[r][i]); if (board[i][c] !== '') used.add(board[i][c]); }
        const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)if(board[rr][cc] !== '')used.add(board[rr][cc]);
        const candidates=[];for(let n=1;n<=9;n++)if(!used.has(n))candidates.push(n);
        if (!candidates.length) return 0;
        if (!bestCandidates || candidates.length < bestCandidates.length) { best=[r,c]; bestCandidates=candidates; if(candidates.length===1) break; }
      }
      if (!best) return 1;
      let total=0;const [r,c]=best;for(const n of bestCandidates){board[r][c]=n;total+=sudokuSolutionCount(board,limit-total);board[r][c]='';if(total>=limit)return total}return total;
    }

    function generateBoard(level) {
      const baseBoard = [
        [5, 3, 4, 6, 7, 8, 9, 1, 2],
        [6, 7, 2, 1, 9, 5, 3, 4, 8],
        [1, 9, 8, 3, 4, 2, 5, 6, 7],
        [8, 5, 9, 7, 6, 1, 4, 2, 3],
        [4, 2, 6, 8, 5, 3, 7, 9, 1],
        [7, 1, 3, 9, 2, 4, 8, 5, 6],
        [9, 6, 1, 5, 3, 7, 2, 8, 4],
        [2, 8, 7, 4, 1, 9, 6, 3, 5],
        [3, 4, 5, 2, 8, 6, 1, 7, 9]
      ];
      for (let i = 0; i < 9; i += 3) { shuffle(baseBoard, i, i + 2); shuffle(baseBoard, i, i + 2, true); }
      const board=baseBoard.map(row=>row.slice()),target=level==='easy'?30:level==='medium'?40:50;
      const cells=Array.from({length:81},(_,i)=>i).sort(()=>Math.random()-.5);let removed=0,attempts=0;
      for (const pos of cells) {
        if (removed>=target || attempts++>81) break;
        const r=Math.floor(pos/9),c=pos%9,keep=board[r][c];board[r][c]='';
        const probe=board.map(row=>row.slice());if(sudokuSolutionCount(probe,2)===1)removed++;else board[r][c]=keep;
      }
      return board;
    }

    function shuffle(board, start, end, isCol = false) {
      for (let i = start; i <= end; i++) {
        const j = Math.floor(Math.random() * (end - start + 1)) + start;
        if (isCol) {
          for (let k = 0; k < 9; k++) {
            [board[k][i], board[k][j]] = [board[k][j], board[k][i]];
          }
        } else {
          [board[i], board[j]] = [board[j], board[i]];
        }
      }
    }

    updateTop5();
    startGame('easy');
  </script>

const CFG={"id": "zen_sudoku", "name": "Zen Sudoku", "emoji": "🔢", "desc": "Sudoku em três dificuldades com ranking local por tempo.", "how": "Preencha cada linha, coluna e bloco 3×3 com os números de 1 a 9 sem repetição. Escolha a dificuldade antes de começar.", "tip": "Procure linhas e blocos quase completos antes de chutar. Sudoku bom é dedução; chute é só o caos usando gravata.", "metric": "Melhor tempo", "unit": " s", "mode": "min"};
const STATS_KEY='ppg_minigames_stats_v1', PREF_KEY='ppg_platform_prefs_v1', REC_KEY='ppg_records_'+CFG.id;
const $=s=>document.querySelector(s), num=v=>{const m=String(v??'').replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:null};
const money=v=>{const s=String(v??'').replace(/R\$|◈|Créditos?|Banca:|💰/gi,'').trim();let m=s.match(/(-?[\d.,]+)\s*(K|M|B|T|Qa|Qi|Sx|Sp|Oc|No|Dc)?/i);if(!m)return null;let n=num(m[1]);const u=(m[2]||'').toLowerCase(),map={k:1e3,m:1e6,b:1e9,t:1e12,qa:1e15,qi:1e18,sx:1e21,sp:1e24,oc:1e27,no:1e30,dc:1e33};return n*(map[u]||1)};
window.__ppgHelpers={num,money};
function readJSON(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dayDiff(a,b){const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');return Math.round((B-A)/86400000)}
let all=readJSON(STATS_KEY,{}),st=all[CFG.id]||{starts:0,totalSeconds:0,longestStreak:0,currentStreak:0,lastDay:null};const today=dayKey();st.starts=(st.starts||0)+1;if(st.lastDay!==today){const dd=st.lastDay?dayDiff(st.lastDay,today):99;st.currentStreak=dd===1?(st.currentStreak||0)+1:1;st.longestStreak=Math.max(st.longestStreak||0,st.currentStreak);st.lastDay=today}st.lastStarted=Date.now();all[CFG.id]=st;writeJSON(STATS_KEY,all);
let lastTick=performance.now();function flushTime(){const now=performance.now(),d=Math.max(0,(now-lastTick)/1000);lastTick=now;all=readJSON(STATS_KEY,{});const x=all[CFG.id]||st;x.totalSeconds=(x.totalSeconds||0)+d;x.lastPlayed=Date.now();all[CFG.id]=x;writeJSON(STATS_KEY,all)}setInterval(flushTime,5000);addEventListener('pagehide',flushTime);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushTime();else lastTick=performance.now()});
let prefs=readJSON(PREF_KEY,{theme:'dark',sound:true});document.body.classList.toggle('ppg-light',prefs.theme==='light');document.body.classList.toggle('ppg-dark',prefs.theme!=='light');
const toolbar=document.createElement('nav');toolbar.id='ppg-toolbar';toolbar.innerHTML=`<button id="ppg-theme" title="Alternar modo claro/escuro">${prefs.theme==='light'?'🌙 Escuro':'☀️ Claro'}</button><button id="ppg-sound" title="Som e música">${prefs.sound?'🔊 Som':'🔇 Som'}</button><button id="ppg-records">🏆 Recordes</button><button id="ppg-about">ⓘ Sobre</button><a href="menu_minigames.html" id="ppg-menu">↩ Menu de Mini Games</a>`;document.body.appendChild(toolbar);
const modal=document.createElement('div');modal.className='ppg-modal';modal.id='ppg-modal';modal.innerHTML=`<div class="ppg-card"><button class="ppg-close" aria-label="Fechar">✕</button><div id="ppg-modal-body"></div></div>`;document.body.appendChild(modal);const body=$('#ppg-modal-body');function open(html){body.innerHTML=html;modal.classList.add('open')}function close(){modal.classList.remove('open')}modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.ppg-close'))close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('#ppg-about').onclick=()=>open(`<h2>${CFG.name}</h2><p>${CFG.desc}</p><h3>Como jogar</h3><p>${CFG.how}</p><h3>Dica de estratégia</h3><p>${CFG.tip}</p><p class="ppg-credit">Produção: Projeto Primata Games em 2026.</p>`);
$('#ppg-theme').onclick=()=>{prefs.theme=prefs.theme==='light'?'dark':'light';writeJSON(PREF_KEY,prefs);document.body.classList.toggle('ppg-light',prefs.theme==='light');document.body.classList.toggle('ppg-dark',prefs.theme==='dark');$('#ppg-theme').textContent=prefs.theme==='light'?'🌙 Escuro':'☀️ Claro';sfx(520,.05)};
// Áudio procedural comum: garante BGM + SFX sem arquivos externos.
let ac=null,master=null,music=null,beat=0;function initAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=prefs.sound?.12:0;master.connect(ac.destination)}function tone(f,d=.08,type='sine',vol=.08,when=0){if(!prefs.sound)return;initAudio();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d)}function sfx(f=420,d=.045){tone(f,d,'triangle',.11)}function startBgm(){if(music||!prefs.sound)return;initAudio();music=setInterval(()=>{if(document.hidden||!prefs.sound)return;const seq=[110,138.59,164.81,220,196,164.81,146.83,123.47],f=seq[beat++%seq.length];tone(f,.16,'triangle',.025);if(beat%4===1)tone(f/2,.1,'sine',.018)},360)}function stopBgm(){clearInterval(music);music=null}function unlock(){initAudio();ac?.resume();if(prefs.sound)startBgm()}addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});document.addEventListener('click',e=>{if(e.target.closest('button,a,input,select'))sfx(380+Math.random()*80,.035)},true);
$('#ppg-sound').onclick=e=>{e.stopPropagation();prefs.sound=!prefs.sound;writeJSON(PREF_KEY,prefs);initAudio();master.gain.setTargetAtTime(prefs.sound?.12:0,ac.currentTime,.02);if(prefs.sound){ac.resume();startBgm();sfx(660,.08)}else stopBgm();$('#ppg-sound').textContent=prefs.sound?'🔊 Som':'🔇 Som'};
// Ranking local por sessão. A mesma sessão é atualizada em vez de poluir o top 5 com cada incremento.
const sessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);function formatValue(v){if(v==null)return '—';if(Math.abs(v)>=1e9)return v.toLocaleString('pt-BR',{notation:'compact',maximumFractionDigits:2})+CFG.unit;return (Number.isInteger(v)?v:v.toFixed(2).replace('.',','))+CFG.unit}function metric(){try{const num=window.__ppgHelpers.num,money=window.__ppgHelpers.money;return null}catch{return null}}function upsert(v){if(v==null||!Number.isFinite(v)||(CFG.mode==='min'&&v<=0))return;let r=readJSON(REC_KEY,[]),me=r.find(x=>x.sessionId===sessionId);if(me){const better=CFG.mode==='min'?v<me.value:v>me.value;if(!better)return;me.value=v;me.at=Date.now()}else r.push({sessionId,value:v,at:Date.now()});r.sort((a,b)=>CFG.mode==='min'?a.value-b.value:b.value-a.value);writeJSON(REC_KEY,r.slice(0,5))}setInterval(()=>upsert(metric()),800);addEventListener('pagehide',()=>upsert(metric()));
function renderRecords(){const r=readJSON(REC_KEY,[]);const list=r.length?`<div class="ppg-record-list">${r.map((x,i)=>`<div class="ppg-record"><b>#${i+1}</b><span><strong>${formatValue(x.value)}</strong><br><small>${new Date(x.at).toLocaleDateString('pt-BR')}</small></span><small>${CFG.metric}</small></div>`).join('')}</div>`:`<div class="ppg-empty">Ainda não há marca registrada neste navegador. Jogue uma partida e ela aparece aqui.</div>`;open(`<h2>Recordes locais</h2><p>Top 5 persistente deste jogo, salvo somente neste navegador.</p>${list}`)}$('#ppg-records').onclick=renderRecords;
})();
