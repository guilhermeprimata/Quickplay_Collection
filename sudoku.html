
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zen Sudoku</title>
  <style>
    :root {
      --zen-bg-0: #090817;
      --zen-bg-1: #11102a;
      --zen-bg-2: #17163a;
      --zen-panel: rgba(23, 22, 58, .82);
      --zen-panel-strong: rgba(18, 17, 45, .96);
      --zen-panel-line: rgba(216, 205, 255, .14);
      --zen-text: #f5f1ff;
      --zen-muted: #aaa2c8;
      --zen-violet: #a985ff;
      --zen-violet-2: #7558df;
      --zen-cyan: #67ead6;
      --zen-gold: #ffc978;
      --zen-gold-2: #ffad62;
      --zen-danger: #ff6f86;
      --zen-cell: rgba(248, 247, 255, .96);
      --zen-cell-alt: rgba(241, 238, 252, .96);
      --zen-cell-text: #5644aa;
      --zen-given-bg: #fff0d0;
      --zen-given-text: #7b4e20;
      --zen-peer-bg: #ece6ff;
      --zen-same-bg: #d9fff7;
      --zen-grid: rgba(85, 68, 146, .17);
      --zen-grid-strong: #6751b9;
      --zen-shadow: 0 28px 70px rgba(0, 0, 0, .38);
      --zen-soft-shadow: 0 12px 34px rgba(0, 0, 0, .22);
      --zen-radius: 20px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--zen-text);
      background:
        radial-gradient(circle at 17% 12%, rgba(169, 133, 255, .18), transparent 28%),
        radial-gradient(circle at 83% 20%, rgba(103, 234, 214, .11), transparent 24%),
        radial-gradient(circle at 52% 100%, rgba(255, 201, 120, .08), transparent 34%),
        linear-gradient(145deg, var(--zen-bg-0), var(--zen-bg-1) 46%, #0c0b20);
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .30;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), transparent 82%);
    }

    body::after {
      content: "";
      position: fixed;
      left: 50%;
      bottom: -180px;
      width: min(760px, 92vw);
      height: 360px;
      transform: translateX(-50%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
      background: rgba(119, 89, 224, .10);
      filter: blur(64px);
    }

    .game-shell {
      width: min(920px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hero {
      text-align: center;
      line-height: 1;
      user-select: none;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--zen-cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .88;
    }

    h1 {
      margin: 0;
      color: var(--zen-text);
      font-size: clamp(28px, 4.8vh, 43px);
      font-weight: 900;
      letter-spacing: -.05em;
      text-shadow: 0 7px 26px rgba(0,0,0,.35);
    }

    h1 .zen-word {
      color: var(--zen-gold);
      text-shadow: 0 0 26px rgba(255, 201, 120, .20);
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--zen-muted);
      font-size: 11px;
      letter-spacing: .05em;
    }

    .game-panel {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--zen-panel-line);
      border-radius: calc(var(--zen-radius) + 4px);
      background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
      box-shadow: var(--zen-shadow), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(13px);
    }

    .game-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .game-controls button {
      min-height: 34px;
      margin: 0;
      padding: 7px 13px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 11px;
      color: #d8d2ee;
      background: rgba(11, 10, 28, .48);
      font: 800 12px/1 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .025em;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      transition: transform .16s ease, border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .game-controls button:hover {
      transform: translateY(-1px);
      color: #fff;
      border-color: rgba(169,133,255,.62);
      background: rgba(117, 88, 223, .22);
    }

    .game-controls button:active { transform: translateY(0) scale(.98); }

    .game-controls button.active {
      color: #171226;
      border-color: rgba(255, 201, 120, .92);
      background: linear-gradient(180deg, #ffd993, var(--zen-gold));
      box-shadow: 0 5px 18px rgba(255, 181, 98, .18), inset 0 1px 0 rgba(255,255,255,.62);
    }

    .game-controls .reset-btn {
      color: var(--zen-cyan);
      border-color: rgba(103, 234, 214, .24);
    }

    .play-area {
      display: grid;
      grid-template-columns: auto minmax(190px, 230px);
      gap: 12px;
      justify-content: center;
      align-items: stretch;
      margin-top: 9px;
    }

    .board-column {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: fit-content;
      max-width: 100%;
      gap: 8px;
      min-width: 0;
    }

    .board-frame {
      position: relative;
      width: fit-content;
      align-self: center;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.015)),
        rgba(7, 6, 20, .54);
      box-shadow: var(--zen-soft-shadow), inset 0 1px 0 rgba(255,255,255,.05);
    }

    .board-frame::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: 17px;
      background: linear-gradient(135deg, rgba(255,201,120,.28), transparent 22%, transparent 70%, rgba(103,234,214,.22));
      opacity: .62;
    }

    .sudoku-container {
      display: grid;
      width: fit-content;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 0;
      overflow: hidden;
      border: 3px solid var(--zen-grid-strong);
      border-radius: 10px;
      background: var(--zen-grid-strong);
      box-shadow: 0 8px 20px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.18);
    }

    .cell {
      width: 40px;
      height: 40px;
      margin: 0;
      padding: 0;
      border: 0;
      border-right: 1px solid var(--zen-grid);
      border-bottom: 1px solid var(--zen-grid);
      outline: none;
      border-radius: 0;
      text-align: center;
      font: 750 18px/1 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      color: var(--zen-cell-text);
      background: var(--zen-cell);
      caret-color: var(--zen-violet-2);
      box-shadow: none;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease, transform .12s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .cell:nth-child(odd) { background: var(--zen-cell-alt); }
    .cell.block-right { border-right: 3px solid var(--zen-grid-strong); }
    .cell.block-bottom { border-bottom: 3px solid var(--zen-grid-strong); }

    .cell:disabled {
      opacity: 1;
      -webkit-text-fill-color: var(--zen-given-text);
      color: var(--zen-given-text);
      background: linear-gradient(145deg, #fff4dc, var(--zen-given-bg));
      font-weight: 900;
      text-shadow: 0 1px 0 rgba(255,255,255,.65);
      cursor: default;
    }

    .cell.peer:not(.invalid) { background: var(--zen-peer-bg); }
    .cell.same:not(.invalid) {
      color: #14796b;
      background: var(--zen-same-bg);
      box-shadow: inset 0 0 0 2px rgba(55, 206, 181, .19);
    }
    .cell:disabled.same:not(.invalid) {
      color: #7a581d;
      -webkit-text-fill-color: #7a581d;
      background: #fff0b9;
    }

    .cell:not(:disabled):hover:not(:focus):not(.invalid) {
      background: #f8f5ff;
      box-shadow: inset 0 0 0 2px rgba(169,133,255,.20);
    }

    .cell:focus {
      position: relative;
      z-index: 4;
      color: #3e298f;
      background: #fff;
      box-shadow:
        inset 0 0 0 3px var(--zen-violet),
        0 0 0 2px rgba(169, 133, 255, .15),
        0 0 18px rgba(117, 88, 223, .18);
    }

    .cell.invalid {
      position: relative;
      z-index: 5;
      color: #a31935;
      background: #ffd9df;
      box-shadow: inset 0 0 0 3px var(--zen-danger), 0 0 16px rgba(255, 111, 134, .20);
      animation: invalidNudge .19s ease both;
    }

    .cell.valid-pop { animation: validPop .18s ease both; }

    @keyframes invalidNudge {
      0%,100% { transform: translateX(0); }
      35% { transform: translateX(-2px); }
      70% { transform: translateX(2px); }
    }

    @keyframes validPop {
      0% { transform: scale(.95); }
      65% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    .status-strip {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 6px;
    }

    .status-card {
      min-height: 48px;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 11px;
      background: rgba(8, 7, 22, .40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }

    .status-card small {
      display: block;
      margin-bottom: 3px;
      color: #8d85aa;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .status-card strong {
      color: #eee9ff;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .03em;
    }

    .timer-card { text-align: center; }
    #timer {
      color: var(--zen-cyan);
      font: 900 18px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: .08em;
      text-shadow: 0 0 15px rgba(103, 234, 214, .24);
    }

    .status-tip { text-align: right; }
    .status-tip strong { color: var(--zen-gold); }

    .top-5 {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 11px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      background:
        radial-gradient(circle at 100% 0, rgba(169,133,255,.11), transparent 44%),
        rgba(8, 7, 22, .42);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }

    .top-5::after {
      content: "";
      position: absolute;
      right: -34px;
      bottom: -38px;
      width: 150px;
      height: 150px;
      pointer-events: none;
      border: 1px solid rgba(169,133,255,.18);
      border-radius: 24px;
      opacity: .24;
      transform: rotate(9deg);
      background-image:
        linear-gradient(90deg, transparent 32.7%, rgba(169,133,255,.16) 33%, rgba(169,133,255,.16) 33.7%, transparent 34%),
        linear-gradient(90deg, transparent 65.7%, rgba(169,133,255,.16) 66%, rgba(169,133,255,.16) 66.7%, transparent 67%),
        linear-gradient(transparent 32.7%, rgba(103,234,214,.12) 33%, rgba(103,234,214,.12) 33.7%, transparent 34%),
        linear-gradient(transparent 65.7%, rgba(103,234,214,.12) 66%, rgba(103,234,214,.12) 66.7%, transparent 67%);
    }

    .top-5 > * { position: relative; z-index: 1; }

    .top-5-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .top-5 h2 {
      margin: 0;
      color: #eee9ff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .top-5-badge {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 9px;
      color: #1d1731;
      background: linear-gradient(145deg, #ffdda0, var(--zen-gold));
      box-shadow: 0 6px 16px rgba(255, 181, 98, .13);
      font-size: 13px;
    }

    .top-5 ul {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .top-5 li {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      margin: 0;
      padding: 6px 7px;
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 10px;
      color: #ddd7ef;
      background: rgba(255,255,255,.035);
      font-size: 10px;
    }

    .top-5 li:first-child {
      border-color: rgba(255,201,120,.22);
      background: linear-gradient(90deg, rgba(255,201,120,.10), rgba(255,255,255,.025));
    }

    .rank-index {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      color: #9d95b7;
      background: rgba(255,255,255,.055);
      font-weight: 900;
    }
    .top-5 li:first-child .rank-index { color: #261d20; background: var(--zen-gold); }

    .rank-main { min-width: 0; }
    .rank-name {
      display: block;
      overflow: hidden;
      color: #f5f1ff;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-difficulty { display: block; margin-top: 1px; color: #8e86a8; font-size: 8px; text-transform: uppercase; letter-spacing: .08em; }
    .rank-time { color: var(--zen-cyan); font: 850 10px/1 ui-monospace, Consolas, monospace; white-space: nowrap; }

    .empty-ranking {
      grid-template-columns: 1fr !important;
      min-height: 80px !important;
      place-items: center;
      padding: 12px !important;
      color: #8f87aa !important;
      text-align: center;
      line-height: 1.4;
    }

    body.ppg-light {
      --zen-bg-0: #eef0f8;
      --zen-bg-1: #e6e9f4;
      --zen-bg-2: #f6f4ff;
      --zen-panel: rgba(255,255,255,.80);
      --zen-panel-strong: rgba(255,255,255,.94);
      --zen-panel-line: rgba(64, 46, 116, .13);
      --zen-text: #2a2348;
      --zen-muted: #6e668a;
      --zen-shadow: 0 24px 56px rgba(56, 44, 102, .14);
      --zen-soft-shadow: 0 12px 30px rgba(56, 44, 102, .12);
      background:
        radial-gradient(circle at 17% 12%, rgba(117,88,223,.12), transparent 28%),
        radial-gradient(circle at 83% 20%, rgba(64,205,183,.10), transparent 24%),
        linear-gradient(145deg, #f8f8fc, #eceef7);
    }
    body.ppg-light .game-panel,
    body.ppg-light .top-5,
    body.ppg-light .status-card { background-color: rgba(255,255,255,.62); }
    body.ppg-light .game-controls button { color: #4b4267; background: rgba(255,255,255,.66); border-color: rgba(66,48,117,.12); }
    body.ppg-light .game-controls button.active { color: #342318; background: linear-gradient(180deg, #ffdf9f, #ffc978); }
    body.ppg-light .status-card strong,
    body.ppg-light .top-5 h2,
    body.ppg-light .rank-name { color: #332a53; }
    body.ppg-light .top-5 li { color: #554d70; background: rgba(255,255,255,.66); border-color: rgba(66,48,117,.09); }

    @media (max-width: 740px) {
      .game-shell { width: min(500px, 100%); }
      .subtitle { display: none; }
      .game-panel { padding: 8px; }
      .play-area { grid-template-columns: 1fr; margin-top: 7px; }
      .board-column { align-items: center; }
      .status-strip { width: 100%; }
      .top-5 { width: 100%; }
    }

    @media (max-height: 660px) and (min-width: 741px) {
      .eyebrow, .subtitle { display: none; }
      .game-shell { gap: 5px; }
      .game-panel { padding: 7px; }
      .play-area { margin-top: 6px; gap: 8px; }
      .status-card { min-height: 40px; padding: 5px 7px; }
      .top-5 { padding: 8px; }
      .top-5 li { min-height: 32px; padding: 4px 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
<style id="ppg-viewport-fit">
:root{--fitbar:var(--ppg-bar-h,48px);--cell:min(52px,calc((100vw - 46px)/9.2),calc((100dvh - var(--fitbar) - 210px)/9.2))}
html,body{height:100%;overflow:hidden}
body{height:100dvh!important;min-height:0!important;margin:0!important;padding:calc(var(--fitbar) + 5px) 8px 6px!important}
.sudoku-container{grid-template-columns:repeat(9,var(--cell))!important;grid-template-rows:repeat(9,var(--cell))!important}
.cell{width:var(--cell)!important;height:var(--cell)!important;font-size:clamp(14px,calc(var(--cell)*.43),21px)!important}
@media(max-width:740px){:root{--cell:min(48px,calc((100vw - 36px)/9.15),calc((100dvh - var(--fitbar) - 285px)/9.15))}.top-5{max-height:112px;overflow:auto}}
@media(max-height:650px) and (min-width:741px){:root{--cell:min(45px,calc((100vw - 300px)/9.15),calc((100dvh - var(--fitbar) - 200px)/9.15))}}
@media(max-height:610px) and (max-width:740px){.top-5{display:none}:root{--cell:min(44px,calc((100vw - 36px)/9.15),calc((100dvh - var(--fitbar) - 168px)/9.15))}}
</style>
</head>
<body>
  <main class="game-shell">
    <header class="hero">
      <div class="eyebrow">Projeto Primata Games · Logic Series</div>
      <h1><span class="zen-word">ZEN</span> SUDOKU</h1>
      <p class="subtitle">Nove números. Oitenta e uma casas. Nenhum espaço para o caos.</p>
    </header>

    <section class="game-panel" aria-label="Jogo Zen Sudoku">
      <div class="game-controls" aria-label="Controles da partida">
        <button type="button" data-level="easy" onclick="startGame('easy')">Fácil</button>
        <button type="button" data-level="medium" onclick="startGame('medium')">Médio</button>
        <button type="button" data-level="hard" onclick="startGame('hard')">Difícil</button>
        <button type="button" class="reset-btn" onclick="resetBoard()" title="Gerar novamente esta dificuldade">↻ Reiniciar</button>
      </div>

      <div class="play-area">
        <div class="board-column">
          <div class="board-frame">
            <div class="sudoku-container" id="sudoku" aria-label="Tabuleiro de Sudoku 9 por 9"></div>
          </div>

          <div class="status-strip" aria-label="Status da partida">
            <div class="status-card">
              <small>Dificuldade</small>
              <strong id="difficulty-label">FÁCIL</strong>
            </div>
            <div class="status-card timer-card">
              <small>Tempo</small>
              <strong id="timer">00:00</strong>
            </div>
            <div class="status-card status-tip">
              <small>Regra</small>
              <strong>1–9 · sem repetir</strong>
            </div>
          </div>
        </div>

        <aside class="top-5" aria-label="Top 5 jogadores">
          <div class="top-5-head">
            <h2>Melhores tempos</h2>
            <span class="top-5-badge" aria-hidden="true">♛</span>
          </div>
          <ul id="top-5-list"></ul>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const initialBoard = [
      [5, 3, '', '', 7, '', '', '', ''],
      [6, '', '', 1, 9, 5, '', '', ''],
      ['', 9, 8, '', '', '', '', 6, ''],
      [8, '', '', '', 6, '', '', '', 3],
      [4, '', '', 8, '', 3, '', '', 1],
      [7, '', '', '', 2, '', '', '', 6],
      ['', 6, '', '', '', '', 2, 8, ''],
      ['', '', '', 4, 1, 9, '', '', 5],
      ['', '', '', '', 8, '', '', 7, 9]
    ];

    let cells = [];
    let timer;
    let startTime;
    let difficulty;
    const TOP5_KEY='ppg_zen_sudoku_top5_v2';
    let top5 = JSON.parse(localStorage.getItem(TOP5_KEY) || localStorage.getItem('top5') || '[]');

    function createBoard(board) {
      const container = document.getElementById('sudoku');
      container.innerHTML = '';
      for (let row = 0; row < 9; row++) {
        cells[row] = [];
        for (let col = 0; col < 9; col++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.inputMode = 'numeric';
          input.autocomplete = 'off';
          input.maxLength = 1;
          input.classList.add('cell');
          input.dataset.row = row;
          input.dataset.col = col;
          input.setAttribute('aria-label', `Linha ${row + 1}, coluna ${col + 1}`);

          if (board[row][col] !== '') {
            input.value = board[row][col];
            input.disabled = true;
          } else {
            input.addEventListener('input', () => validateInput(row, col));
            input.addEventListener('focus', () => paintFocus(row, col));
            input.addEventListener('click', () => paintFocus(row, col));
          }

          // Separação visual dos blocos 3x3, sem alterar a estrutura do grid.
          if ((col + 1) % 3 === 0 && col !== 8) input.classList.add('block-right');
          if ((row + 1) % 3 === 0 && row !== 8) input.classList.add('block-bottom');

          container.appendChild(input);
          cells[row][col] = input;
        }
      }
    }

    function paintFocus(row, col) {
      const active = cells[row]?.[col];
      const value = active?.value || '';
      const blockRow = Math.floor(row / 3);
      const blockCol = Math.floor(col / 3);

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = cells[r][c];
          cell.classList.remove('peer', 'same');
          const sameBlock = Math.floor(r / 3) === blockRow && Math.floor(c / 3) === blockCol;
          if ((r === row || c === col || sameBlock) && !(r === row && c === col)) cell.classList.add('peer');
          if (value && cell.value === value && !(r === row && c === col)) cell.classList.add('same');
        }
      }
    }

    function validateInput(row, col) {
      const cell = cells[row][col];
      let value = cell.value.replace(/[^1-9]/g, '').slice(0, 1);
      if (cell.value !== value) cell.value = value;
      cell.classList.remove('invalid', 'valid-pop');
      paintFocus(row, col);

      // Apagar uma casa volta ao estado neutro; apenas valores conflitantes ficam vermelhos.
      if (value === '') return;

      // Verifica duplicatas na linha, coluna e bloco
      for (let i = 0; i < 9; i++) {
        if (i !== col && cells[row][i].value === value) {
          cells[row][col].classList.add('invalid');
          return;
        }
        if (i !== row && cells[i][col].value === value) {
          cells[row][col].classList.add('invalid');
          return;
        }
      }

      const startRow = Math.floor(row / 3) * 3;
      const startCol = Math.floor(col / 3) * 3;
      for (let r = startRow; r < startRow + 3; r++) {
        for (let c = startCol; c < startCol + 3; c++) {
          if ((r !== row || c !== col) && cells[r][c].value === value) {
            cells[row][col].classList.add('invalid');
            return;
          }
        }
      }

      cell.classList.add('valid-pop');
      setTimeout(() => cell.classList.remove('valid-pop'), 190);

    }

    function checkWin() {
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          if (cells[row][col].value === '' || cells[row][col].classList.contains('invalid')) {
            return;
          }
        }
      }
      clearInterval(timer);
      const timeTaken = Math.floor((Date.now() - startTime) / 1000);

    }

    function updateTop5() {
      const top5List = document.getElementById('top-5-list');
      top5List.innerHTML = '';
      const labels = { easy: 'Fácil', medium: 'Médio', hard: 'Difícil' };

      if (!top5.length) {
        const empty = document.createElement('li');
        empty.className = 'empty-ranking';
        empty.textContent = 'Seu primeiro tempo vai inaugurar este placar.';
        top5List.appendChild(empty);
        return;
      }

      top5.forEach((player, index) => {
        const li = document.createElement('li');
        const rank = document.createElement('span');
        const main = document.createElement('span');
        const name = document.createElement('span');
        const diff = document.createElement('small');
        const time = document.createElement('strong');
        const min = String(Math.floor(player.time / 60)).padStart(2, '0');
        const sec = String(player.time % 60).padStart(2, '0');

        rank.className = 'rank-index';
        main.className = 'rank-main';
        name.className = 'rank-name';
        diff.className = 'rank-difficulty';
        time.className = 'rank-time';

        rank.textContent = index + 1;
        name.textContent = player.name;
        diff.textContent = labels[player.difficulty] || player.difficulty || '—';
        time.textContent = `${min}:${sec}`;
        main.append(name, diff);
        li.append(rank, main, time);
        top5List.appendChild(li);

    }

    function startGame(level) {
      window.__ppgLastSudokuTime=null;
      difficulty = level || 'easy';
      const board = generateBoard(difficulty);
      createBoard(board);
      startTime = Date.now();
      clearInterval(timer);
      document.getElementById('timer').textContent = '00:00';
      timer = setInterval(updateTimer, 1000);

      const labels = { easy: 'FÁCIL', medium: 'MÉDIO', hard: 'DIFÍCIL' };
      document.getElementById('difficulty-label').textContent = labels[difficulty] || difficulty.toUpperCase();
      document.querySelectorAll('[data-level]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === difficulty);

    }

    function updateTimer() {
      const timeElapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
      const seconds = String(timeElapsed % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${minutes}:${seconds}`;
    }

    function resetBoard() {
      startGame(difficulty || 'easy');
    }

    function generateBoard(level) {
      const baseBoard = [
        [5, 3, 4, 6, 7, 8, 9, 1, 2],
        [6, 7, 2, 1, 9, 5, 3, 4, 8],
        [1, 9, 8, 3, 4, 2, 5, 6, 7],
        [8, 5, 9, 7, 6, 1, 4, 2, 3],
        [4, 2, 6, 8, 5, 3, 7, 9, 1],
        [7, 1, 3, 9, 2, 4, 8, 5, 6],
        [9, 6, 1, 5, 3, 7, 2, 8, 4],
        [2, 8, 7, 4, 1, 9, 6, 3, 5],
        [3, 4, 5, 2, 8, 6, 1, 7, 9]
      ];

      // Shuffle rows and columns within each 3x3 block
      for (let i = 0; i < 9; i += 3) {
        shuffle(baseBoard, i, i + 2);
        shuffle(baseBoard, i, i + 2, true);
      }

      // Remove numbers based on difficulty
      const board = baseBoard.map(row => row.slice());
      let cellsToRemove;
      if (level === 'easy') cellsToRemove = 20;
      else if (level === 'medium') cellsToRemove = 40;
      else cellsToRemove = 60;

      while (cellsToRemove > 0) {
        const row = Math.floor(Math.random() * 9);
        const col = Math.floor(Math.random() * 9);
        if (board[row][col] !== '') {
          board[row][col] = '';
          cellsToRemove--;
        }
      }

      return board;
    }

    function shuffle(board, start, end, isCol = false) {
      for (let i = start; i <= end; i++) {
        const j = Math.floor(Math.random() * (end - start + 1)) + start;
        if (isCol) {
          for (let k = 0; k < 9; k++) {
            [board[k][i], board[k][j]] = [board[k][j], board[k][i]];
          }
        } else {
          [board[i], board[j]] = [board[j], board[i]];
        }
      }
    }

    updateTop5();
    startGame('easy');
