<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forca Neon</title>
<style>
:root{
  --bg:#090b18;--bg2:#15112a;--panel:#12172b;--panel2:#1a2140;--text:#f4f7ff;--muted:#aeb8d7;
  --a:#2ce6be;--b:#805dff;--danger:#ff5c84;--good:#65ff9a;--line:#ffffff1f;--shadow:#0009;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;color:var(--text);background:
 radial-gradient(circle at 12% 18%,#2ce6be22,transparent 27%),
 radial-gradient(circle at 84% 10%,#805dff35,transparent 31%),
 linear-gradient(145deg,var(--bg),var(--bg2));overflow-x:hidden}
body[data-theme="light"]{--bg:#eef9f6;--bg2:#eeeaff;--panel:#ffffffd9;--panel2:#f7f5ff;--text:#172034;--muted:#59657f;--line:#1a22451c;--shadow:#48567b25}
button,select{font:inherit}button{cursor:pointer}
.shell{width:min(1050px,100%);margin:auto;padding:14px 14px 28px}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
 padding:10px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 12px 42px var(--shadow)}
.topbar button,.topbar a,.topbar select{min-height:40px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--panel2);color:var(--text);text-decoration:none;font-weight:800}
.topbar button:hover,.topbar a:hover,.topbar select:hover{filter:brightness(1.12)}
.brand{display:grid;place-items:center;text-align:center;padding:22px 8px 8px}.brand h1{margin:0;font-size:clamp(2.2rem,8vw,5.6rem);line-height:.9;letter-spacing:.03em;
 background:linear-gradient(90deg,var(--a),#fff 48%,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #6b5cff25}
.brand p{max-width:720px;margin:11px 0 0;color:var(--muted);font-weight:700}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:16px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel2) 72%,transparent));box-shadow:0 22px 70px var(--shadow)}
.play{padding:18px}.side{padding:18px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-weight:850}.status b{color:var(--text)}
.word{min-height:82px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.42em;margin:14px 0 8px;padding:12px;
 font-size:clamp(1.65rem,5vw,3rem);font-weight:950;letter-spacing:.05em;text-transform:uppercase}
.glyph{min-width:.72em;border-bottom:4px solid color-mix(in srgb,var(--a) 60%,var(--b));padding:0 .05em .12em;filter:drop-shadow(0 0 9px #2ce6be33)}
.glyph.sep{border:0;min-width:.4em}
.keyboard{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:12px 0}
.keyboard button{min-width:42px;min-height:42px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(145deg,#7a5cff,#3449bb);color:#fff;font-weight:950;box-shadow:0 8px 20px #241e6533}
.keyboard button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15)}.keyboard button:disabled{opacity:.28;filter:grayscale(.4);cursor:default}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:6px}.actions button{border:0;border-radius:12px;padding:10px 14px;font-weight:900}
.actions .hint{background:linear-gradient(135deg,#ffd166,#ff9f43);color:#231600}.actions .new{background:linear-gradient(135deg,var(--a),#32a6ff);color:#07171b}
.message{min-height:32px;text-align:center;font-weight:950;font-size:1.04rem;margin-top:9px}.message.good{color:var(--good)}.message.bad{color:var(--danger)}
.hints{display:grid;gap:8px}.hint-item{padding:10px 12px;border-left:4px solid var(--a);border-radius:10px;background:#2ce6be12;color:var(--text);font-weight:720;text-align:left}
canvas{width:min(100%,260px);aspect-ratio:1;display:block;margin:auto;border-radius:18px;background:radial-gradient(circle,#1d2547,#0b0f22 72%);border:1px solid var(--line)}
body[data-theme="light"] canvas{background:radial-gradient(circle,#f8fbff,#e4e8f9 72%)}
.rank h3{margin:0 0 8px}.rank ol{margin:0;padding-left:25px;color:var(--muted)}.rank li{padding:4px 0}.rank strong{color:var(--text)}
.modal,.pause{position:fixed;z-index:1000;inset:0;display:none;place-items:center;padding:18px;background:#030612d9;backdrop-filter:blur(10px)}
.modal.open,.pause.open{display:grid}.dialog{width:min(570px,96vw);max-height:88vh;overflow:auto;border:1px solid #ffffff24;border-radius:22px;padding:22px;background:#10162c;color:#f5f7ff;box-shadow:0 30px 110px #000c}
.dialog h2{margin-top:0}.dialog p{color:#c5cce3;line-height:1.55}.dialog button,.dialog a{border:1px solid #ffffff25;border-radius:11px;background:#242d50;color:#fff;padding:10px 13px;font-weight:850;text-decoration:none}
.dialog .stack{display:grid;gap:9px}.dialog .primary{background:linear-gradient(135deg,var(--a),var(--b));color:#061018}
.credit{font-weight:900;color:#fff!important;border-top:1px solid #ffffff1c;padding-top:12px}
.preview .topbar{display:none}.preview .shell{padding-top:4px}.preview .brand{padding-top:8px}
@media(max-width:760px){.game{grid-template-columns:1fr}.side{display:grid;grid-template-columns:200px 1fr;align-items:start}.word{min-height:70px}.shell{padding-inline:9px}}
@media(max-width:520px){.side{grid-template-columns:1fr}.keyboard button{min-width:36px;min-height:38px;padding:6px}.play,.side{padding:13px}.topbar{border-radius:0;margin:-9px -9px 0}}
</style>
</head>

<div class="shell">
  <nav class="topbar" aria-label="Game controls">
    <select id="langSelect" aria-label="Language"></select>
    <button id="soundBtn" type="button"></button>
    <button id="themeBtn" type="button"></button>
    <button id="pauseBtn" type="button"></button>
    <button id="recordsBtn" type="button"></button>
    <button id="aboutBtn" type="button"></button>
    <a id="menuBtn" href="menu_minigames.html"></a>

  <header class="brand">
    <h1 id="title">FORCA NEON</h1>

  <main class="game">
    <section class="card play" aria-live="polite">
      <div class="status">
        <span><span id="timeLabel"></span>: <b id="time">0.0</b> <span id="secondsLabel"></span></span>

      <div id="keyboard" class="keyboard"></div>
      <div class="actions">
        <button class="hint" id="hintBtn" type="button"></button>
        <button class="new" id="newBtn" type="button"></button>
      </div>
      <div id="message" class="message"></div>
      <div class="hints" id="hintList"></div>
    </section>

    <aside class="card side">
      <canvas id="hangman" width="260" height="260" aria-label="Hangman drawing"></canvas>
      <div class="rank">
        <h3 id="topLabel"></h3>
        <ol id="ranking"></ol>
      </div>
    </aside>
  </main>
</div>

<div id="modal" class="modal"><div class="dialog" role="dialog" aria-modal="true"><div id="modalBody"></div><button id="modalClose" type="button"></button></div></div>
<div id="pauseOverlay" class="pause"><div class="dialog" role="dialog" aria-modal="true">
  <h2 id="pauseTitle"></h2><p id="pauseDesc"></p>
  <div class="stack">
    <button class="primary" id="resumeBtn" type="button"></button>
    <button id="restartBtn" type="button"></button>
    <a id="exitBtn" href="menu_minigames.html"></a>
  </div>
</div></div>

function tone(freq=440,dur=.07,type='sine',gain=.035,delay=0){

let current=-1, word='', guesses=new Set(), wrong=new Set(), hintsUsed=0, gameOver=false, startAt=0, pauseAt=0, pausedTotal=0, paused=false, recent=[];
function graphemes(s){return Array.from(String(s))}
function sep(ch){return /[\s\-‐‑–—'’/]/u.test(ch)}
function canon(ch){
  if(locale==='ru')return ch.toLocaleUpperCase('ru-RU');
  if(locale==='tr')return ch.toLocaleUpperCase('tr-TR');
  if(ch==='ß'||ch==='ẞ')return'S';
  let u=ch.toLocaleUpperCase(locale);
  const special={'Œ':'O','Æ':'A','Ø':'O','Ł':'L','Đ':'D','Ð':'D','Þ':'T'};
  if(special[u])u=special[u];

}
function alphabet(){
  if(locale==='ru')return graphemes('АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ');

}

}
function chooseIndex(){
  let pool=Array.from({length:320},(_,i)=>i).filter(i=>!recent.includes(i));
  if(!pool.length)pool=Array.from({length:320},(_,i)=>i);
  const idx=pool[Math.floor(Math.random()*pool.length)]; recent.push(idx); if(recent.length>14)recent.shift(); return idx;
}

  ctx.shadowBlur=0;
}
new MutationObserver(draw).observe(document.body,{attributes:true,attributeFilter:['data-theme']});

function setPaused(next){
  if(gameOver&&next)return;next=!!next;if(next===paused)return;
  paused=next;if(paused){pauseAt=Date.now();$('#pauseOverlay').classList.add('open');sfx('tap')}else{pausedTotal+=Date.now()-pauseAt;pauseAt=0;$('#pauseOverlay').classList.remove('open')}
}
pauseBtn.onclick=()=>setPaused(true);$('#resumeBtn').onclick=()=>setPaused(false);$('#restartBtn').onclick=()=>{setPaused(false);startGame()};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();if($('#modal').classList.contains('open'))closeModal();else setPaused(!paused);return}
  if(paused)return;
  if(gameOver&&(e.key==='Enter'||e.key===' ')){e.preventDefault();startGame();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  const g=canon(e.key),b=[...keyboard.children].find(x=>x.dataset.guess===g);if(b&&!b.disabled){e.preventDefault();b.click()}
});

const modal=$('#modal'),modalBody=$('#modalBody');
function openModal(html){modalBody.innerHTML=html;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
$('#modalClose').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
recordsBtn.onclick=()=>{const rows=localeRecords();openModal(`<h2>${t('recordsTitle')}</h2>${rows.length?`<ol>${rows.map(r=>`<li><strong>${escapeHtml(r.name)}</strong> · ${Number(r.time).toFixed(1)}s · ${t('hintsUsed')}: ${r.hints} · ${t('mistakes')}: ${r.errors}</li>`).join('')}</ol>`:`<p>${t('noRecords')}</p>`}`)};
aboutBtn.onclick=()=>openModal(`<h2>${t('aboutTitle')}</h2><h3>${t('howTitle')}</h3><p>${t('how')}</p><h3>${t('tipTitle')}</h3><p>${t('tip')}</p><p class="credit">${t('production')}</p>`);

let statsLast=performance.now();
function today(){return new Date().toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000)}
function recordStart(){
  if(preview)return;const all=readJSON(STATS_KEY,{}),s=all.forca_neon||{starts:0,totalSeconds:0,longestStreak:0,currentStreak:0};
  s.starts=(s.starts||0)+1;const d=today();if(s.lastDay!==d){s.currentStreak=s.lastDay&&dayDiff(d,s.lastDay)===1?(s.currentStreak||0)+1:1;s.longestStreak=Math.max(s.longestStreak||0,s.currentStreak);s.lastDay=d}
  s.lastStarted=Date.now();all.forca_neon=s;writeJSON(STATS_KEY,all);statsLast=performance.now();
}
function flushStats(){
  if(preview){statsLast=performance.now();return}
  const now=performance.now(),dt=(!document.hidden&&!paused)?Math.max(0,(now-statsLast)/1000):0;statsLast=now;if(!dt)return;
  const all=readJSON(STATS_KEY,{}),s=all.forca_neon||{starts:0,totalSeconds:0};s.totalSeconds=(s.totalSeconds||0)+dt;s.lastPlayed=Date.now();all.forca_neon=s;writeJSON(STATS_KEY,all);
}
setInterval(()=>{if(!paused&&!gameOver)timeEl.textContent=elapsed().toFixed(1);flushStats()},100);
addEventListener('pagehide',flushStats);document.addEventListener('visibilitychange',()=>{flushStats();statsLast=performance.now()});

startBgm();startGame();
})();
</script>
</body>
