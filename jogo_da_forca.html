<!DOCTYPE html>
<html lang="pt-BR">

  <title>Forca Neon</title>
  <style>
    :root {
      --neon-a: #28E0B5;
      --neon-b: #6C4CFF;
      --neon-a-rgb: 40, 224, 181;
      --neon-b-rgb: 108, 76, 255;
      --text-color: #002776;
      --white: #ffffff;
      --dark-bg: #222;
      --dark-header: #111;
      --dark-text: #eee;
      --dark-button: #444;
      --dark-hint: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--neon-a);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-color);
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background-color: var(--neon-b);
      padding: 10px 0;
      flex-wrap: wrap;
    }

    .header-container img {
      height: 50px;
    }

    h1 {
      color: var(--white);
      margin: 0;
      font-size: 1.5rem;
    }

    #game-container {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #word-display {
      font-size: 1.5em;
      margin: 15px 0;
      letter-spacing: 5px;
      word-break: break-all;
    }

    #keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
      margin: 0 auto;
      gap: 5px;
      padding: 5px;
    }

    #keyboard button {
      margin: 0;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      min-width: 30px;
      border: none;
      border-radius: 4px;
      background-color: var(--neon-b);
      color: var(--white);
      transition: all 0.2s;
    }

    #keyboard button:hover:not(.used) {
      background-color: #003d7a;
    }

    #keyboard button.used {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    #hint, #timer, #ranking, #message {
      font-size: 1.2em;
      margin: 10px 0;
    }

    #hint-container {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      margin: 10px 0;
    }

    .hint-item {
      background-color: rgba(var(--neon-b-rgb), 0.1);
      padding: 8px 15px;
      border-radius: 5px;
      margin: 3px 0;
      width: fit-content;
      max-width: 90%;
      border-left: 4px solid var(--neon-b);
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0;
    }

    .buttons-container button {
      font-size: 1.1em;
      padding: 8px 15px;
      margin: 0;
      cursor: pointer;
      background-color: var(--neon-b);
      color: var(--white);
      border: none;
      border-radius: 5px;
      transition: all 0.2s;
    }

    .buttons-container button:hover {
      background-color: #003d7a;
    }

    canvas {
      display: block;
      margin: 10px auto;
      max-width: 100%;
      height: auto;
    }

    .credits {
      font-style: italic;
      margin-top: 20px;
      font-size: 0.9em;
    }

    /* Dark mode styles */
    .dark-mode {
      background-color: var(--dark-bg);
      color: var(--dark-text);
    }

    .dark-mode .header-container {
      background-color: var(--dark-header);
    }

    .dark-mode .buttons-container button,
    .dark-mode #keyboard button:not(.used) {
      background-color: var(--dark-button);
    }

    .dark-mode .hint-item {
      background-color: var(--dark-hint);
      color: var(--dark-text);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      #word-display {
        font-size: 1.2em;
        letter-spacing: 3px;
      }

      #keyboard button {
        padding: 6px 10px;
        font-size: 14px;
        min-width: 25px;
      }

      .buttons-container button {
        font-size: 1em;
        padding: 6px 12px;
      }

      #hint, #timer, #ranking, #message {
        font-size: 1em;
      }

      .header-container {
        padding: 8px 0;
      }

      .header-container img {
        height: 40px;
      }

      h1 {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 400px) {
      #keyboard {
        gap: 3px;
      }

      #keyboard button {
        padding: 5px 8px;
        font-size: 12px;
        min-width: 22px;
      }

      .buttons-container {
        gap: 5px;
      }

      .buttons-container button {
        font-size: 0.9em;
        padding: 5px 10px;
      }
    }
  </style>

        keyboard.appendChild(btn);

    function handleKeyPress(e) {

      const letter = e.key.toUpperCase();
      const btn = Array.from(keyboard.children).find(b => b.textContent === letter);

    }

    function startTimer() {
      startTime = Date.now();
      timer = setInterval(() => {
        const seconds = ((Date.now() - startTime) / 1000).toFixed(1);
        timeDisplay.textContent = seconds;
      }, 100);
    }

    function stopTimer() {
      clearInterval(timer);
    }

    function getRanking() {
      return JSON.parse(localStorage.getItem('hangmanRanking') || '[]');
    }

    function saveRanking(ranking) {

    }

      const ranking = getRanking();
      list.innerHTML = ranking.map(r => `<li>${r.name} - ${r.time.toFixed(1)}s - Palavra: ${r.word}, Dicas: ${r.hints}, Erros: ${r.wrongAttempts}</li>`).join('');

    function askForNameAndSave() {
      let playerName = prompt("Você fez um recorde! Digite seu nome:");

      const record = {
        name: playerName.trim(),
        time: finalTime,
        word: word,
        hints: usedHintsCount,
        wrongAttempts: wrongLetters.length

      const ranking = getRanking();
      ranking.push(record);
      ranking.sort((a, b) => a.time - b.time);
      if (ranking.length > 5) ranking.length = 5;
      saveRanking(ranking);
      renderRanking();
    }

    function startGame() {
      chooseWord();
      guessedLetters = [];
      wrongLetters = [];
      usedHintsCount = 0;
      gameOver = false;
      hintContainer.innerHTML = "";
      updateMessage("");
      createKeyboard();
      updateWordDisplay();
      drawHangman(0);
      renderRanking();
      stopTimer();
      timeDisplay.textContent = "0.0";
      startTimer();
      
      document.getElementById('hint-button').style.display = 'inline-block';
    }

    document.addEventListener('keydown', handleKeyPress);
    window.onload = startGame;
