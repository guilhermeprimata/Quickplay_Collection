<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velha Quântica 4×4 — PPG</title>
  <style>
    :root {
      --bg: #090b16;
      --panel: rgba(18, 22, 42, 0.85);
      --accent: #49f6ff;
      --accent-glow: rgba(73, 246, 255, 0.4);
      --plasma: #ff5e97;
      --plasma-glow: rgba(255, 94, 151, 0.4);
      --ink: #eaf3ff;
      --muted: #8ca3c7;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #151d3b 0%, var(--bg) 75%);
      color: var(--ink);
    }

    .shell {
      width: min(480px, calc(100vw - 16px));
      height: calc(100dvh - var(--ppg-bar-h, 48px) - 12px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    header {
      text-align: center;
      width: 100%;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vh, 2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent), #b475ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin: 6px 0;
    }
    .hud-card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 6px 10px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .hud-card span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .hud-card b { display: block; font-size: 1.25rem; font-family: ui-monospace, monospace; color: var(--gold); }

    .stage-wrap {
      position: relative;
      width: min(390px, 86vw);
      aspect-ratio: 1;
      border-radius: 20px;
      padding: 10px;
      background: rgba(10, 14, 28, 0.9);
      border: 1px solid rgba(73, 246, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(73, 246, 255, 0.05);
    }
    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      touch-action: none;
    }

    /* Modal Overlay de Fim de Jogo */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(4, 7, 18, 0.88);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      animation: fadeIn 0.2s ease-out;
    }
    .game-overlay.active { display: grid; }
    .game-overlay h2 { margin: 0 0 6px; font-size: 1.5rem; color: var(--accent); }
    .game-overlay p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
    .game-overlay input {
      width: 80%;
      padding: 8px 12px;
      background: #0d152c;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: #fff;
      font: 700 1rem inherit;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .btn-restart {
      padding: 10px 20px;
      background: linear-gradient(135deg, #49f6ff, #785cff);
      border: 0;
      border-radius: 10px;
      color: #050814;
      font-weight: 850;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-restart:hover { transform: scale(1.04); }

    .ranking-box {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px 12px;
      max-height: 85px;
      overflow-y: auto;
    }
    .ranking-box h3 { margin: 0 0 4px; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .ranking-box ol { margin: 0; padding-left: 18px; font-size: 0.82rem; font-family: ui-monospace, monospace; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>VELHA QUÂNTICA 4×4</h1>
    </header>

    <div class="hud-row">
      <div class="hud-card"><span>Cronômetro</span><b id="timer">00:00</b></div>
      <div class="hud-card"><span>Pontuação</span><b id="score">0</b></div>
    </div>

    <div class="stage-wrap">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <div class="game-overlay" id="overlay">
        <div>
          <h2 id="overTitle">Vitória!</h2>
          <p id="overDesc">Você conquistou 10 pontos.</p>
          <input type="text" id="playerName" placeholder="Seu apelido" maxlength="15" />
          <br />
          <button class="btn-restart" id="btnContinue">JOGAR NOVAMENTE</button>
        </div>
      </div>
    </div>

    <div class="ranking-box">
      <h3>🏆 Ranking Local</h3>
      <ol id="topPlayers"></ol>
    </div>
  </main>

  <script>
    'use strict';
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const size = 4;
    let cellSize = canvas.width / size;

    let board = Array(size).fill().map(() => Array(size).fill(""));
    let gameOver = false;
    let score = 0;
    let timer = 0;
    let timerInterval = null;
    let roundToken = 0;
    const SCORE_KEY = "ppg_velha_quantica_scores_v2";

    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const topPlayersList = document.getElementById("topPlayers");
    const overlay = document.getElementById("overlay");

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function initDPI() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cellSize = rect.width / size;
    }
    window.addEventListener('resize', () => { initDPI(); drawBoard(); });

    function drawBoard() {
      const w = canvas.getBoundingClientRect().width;
      ctx.clearRect(0, 0, w, w);

      // Linhas da grade com efeito Neon
      ctx.strokeStyle = 'rgba(73, 246, 255, 0.28)';
      ctx.lineWidth = 2;
      for (let i = 1; i < size; i++) {
        const p = i * cellSize;
        ctx.beginPath();
        ctx.moveTo(p, 8); ctx.lineTo(p, w - 8);
        ctx.moveTo(8, p); ctx.lineTo(w - 8, p);
        ctx.stroke();
      }

      // Desenha símbolos X e O estilizados
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const val = board[r][c];
          if (!val) continue;

          const cx = c * cellSize + cellSize / 2;
          const cy = r * cellSize + cellSize / 2;
          const rad = cellSize * 0.26;

          if (val === "X") {
            ctx.save();
            ctx.strokeStyle = "#49f6ff";
            ctx.shadowColor = "#49f6ff";
            ctx.shadowBlur = 12;
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(cx - rad, cy - rad); ctx.lineTo(cx + rad, cy + rad);
            ctx.moveTo(cx + rad, cy - rad); ctx.lineTo(cx - rad, cy + rad);
            ctx.stroke();
            ctx.restore();
          } else {
            ctx.save();
            ctx.strokeStyle = "#ff5e97";
            ctx.shadowColor = "#ff5e97";
            ctx.shadowBlur = 12;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
    }

    function checkWinner(player) {
      for (let i = 0; i < size; i++) {
        if (board[i].every(cell => cell === player)) return true;
        if (board.map(row => row[i]).every(cell => cell === player)) return true;
      }
      if (board.map((row, i) => row[i]).every(cell => cell === player)) return true;
      if (board.map((row, i) => row[size - 1 - i]).every(cell => cell === player)) return true;
      return false;
    }

    function isFull() {
      return board.flat().every(cell => cell !== "");
    }

    function aiMove() {
      if (gameOver) return;
      let empty = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === "") empty.push([r, c]);
        }
      }
      if (empty.length === 0) return;

      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = "O";
      window.PPG?.sfx?.("ui");
      drawBoard();

      if (checkWinner("O")) {
        endGame("Derrota Quântica", "A IA completou a sequência antes de você.");
      } else if (isFull()) {
        endGame("Colapso / Empate", "Nenhum vetor dominante formado.");
      }
    }

    function handleClick(e) {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const col = Math.floor(x / cellSize);
      const row = Math.floor(y / cellSize);

      if (row >= 0 && row < size && col >= 0 && col < size && board[row][col] === "") {
        board[row][col] = "X";
        window.PPG?.sfx?.("tap");
        drawBoard();

        if (checkWinner("X")) {
          score += 10;
          scoreDisplay.textContent = score;
          endGame("Vitória Holográfica!", "Você fechou uma linha quântica (+10 pts).");
        } else if (isFull()) {
          endGame("Empate!", "O grid foi saturado sem vencedores.");
        } else {
          const token = roundToken;
          setTimeout(() => { if (token === roundToken && !gameOver) aiMove(); }, 300);
        }
      }
    }

    function endGame(title, desc) {
      gameOver = true;
      window.PPG?.sfx?.(title.toLowerCase().includes("vitória") ? "success" : "error");
      clearInterval(timerInterval);
      document.getElementById('overTitle').textContent = title;
      document.getElementById('overDesc').textContent = desc;
      overlay.classList.add('active');
      document.getElementById('playerName').focus();
    }

    function resetGame() {
      roundToken++;
      board = Array(size).fill().map(() => Array(size).fill(""));
      gameOver = false;
      timer = 0;
      timerDisplay.textContent = "00:00";
      overlay.classList.remove('active');
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer++;
        timerDisplay.textContent = formatTime(timer);
      }, 1000);
      drawBoard();
    }

    function saveScore(name, pts) {
      if (!name) name = "Operador";
      const scores = JSON.parse(localStorage.getItem(SCORE_KEY) || localStorage.getItem("bbvelha_scores") || "[]");
      scores.push({ name, score: pts, at: Date.now() });
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem(SCORE_KEY, JSON.stringify(scores.slice(0, 5)));
      renderTopPlayers();
    }

    function renderTopPlayers() {
      const scores = JSON.parse(localStorage.getItem(SCORE_KEY) || localStorage.getItem("bbvelha_scores") || "[]");
      topPlayersList.innerHTML = "";
      if (!scores.length) {
        topPlayersList.innerHTML = "<li>Sem registros ainda</li>";
        return;
      }
      scores.forEach(s => {
        const li = document.createElement("li");
        li.textContent = `${s.name} — ${s.score} pts`;
        topPlayersList.appendChild(li);
      });
    }

    document.getElementById('btnContinue').addEventListener('click', () => {
      const nameInput = document.getElementById('playerName');
      if (nameInput.value.trim() && score > 0) {
        saveScore(nameInput.value.trim(), score);
      }
      resetGame();
    });

    canvas.addEventListener("click", handleClick);
    initDPI();
    renderTopPlayers();
    resetGame();
  </script>

.ppg-card{width:min(590px,96vw);max-height:min(80vh,720px);overflow:auto;padding:22px;border:1px solid #ffffff24;border-radius:20px;background:linear-gradient(145deg,#15182f,#0a0d1d);color:#f7f6ff;text-align:left;box-shadow:0 30px 90px #000a}.ppg-card h2{margin:0 0 8px;color:#dacbff}.ppg-card h3{margin:16px 0 5px;color:#63ecd6;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.ppg-card p,.ppg-card li{color:#d4d7e5;line-height:1.55}.ppg-credit{margin-top:18px;padding-top:12px;border-top:1px solid #ffffff18;font-weight:850;color:#fff!important}.ppg-close{float:right!important;border:0!important;border-radius:8px!important;background:#292e49!important;color:#fff!important;padding:7px 9px!important;cursor:pointer!important}

</style>
<script id="ppg-platform-v3-script">
(()=>{'use strict';

if(PREVIEW){window.PPG={sfx:()=>{},record:()=>{},syncSound:()=>{}};return}
const toolbar=document.createElement('nav');toolbar.id='ppg-toolbar';toolbar.setAttribute('aria-label','Controles Quickplay');toolbar.innerHTML=`<span class="ppg-brand">🦧 PPG</span><button id="ppg-theme">${prefs.theme==='light'?'🌙 Escuro':'☀️ Claro'}</button><button id="ppg-sound">${prefs.sound?'🔊 Som ON':'🔇 Som OFF'}</button><button id="ppg-records">🏆 Recordes</button><button id="ppg-about">ⓘ Sobre</button><a href="index.html">↩ Mini Games</a>`;document.body.prepend(toolbar);

const GENERIC_AUDIO=true;let ac=null,master=null,bgm=null,beat=0;function initAudio(){if(!GENERIC_AUDIO)return;if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=prefs.sound?.10:0;master.connect(ac.destination)}function tone(f,d=.06,type='triangle',v=.06,when=0){if(!GENERIC_AUDIO||!prefs.sound)return;initAudio();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}function sfx(k='ui'){if(!GENERIC_AUDIO)return;if(k==='tap')tone(520+(beat%5)*38,.025,'triangle',.025);else if(k==='success'){tone(523,.09,'triangle',.07);tone(784,.12,'sine',.05,.07)}else if(k==='error')tone(145,.18,'sawtooth',.06);else tone(460,.045,'triangle',.04)}function startBgm(){if(!GENERIC_AUDIO||bgm||!prefs.sound)return;initAudio();ac.resume().catch(()=>{});const seq=[110,138.59,164.81,146.83,123.47,164.81,196,146.83];bgm=setInterval(()=>{if(document.hidden||!prefs.sound)return;const f=seq[beat++%seq.length];tone(f,.18,'triangle',.014);if(beat%4===1)tone(f*2,.09,'sine',.009)},390)}function stopBgm(){clearInterval(bgm);bgm=null}

document.getElementById('ppg-sound').onclick=e=>{e.stopPropagation();setSound(!prefs.sound)};if(GENERIC_AUDIO){addEventListener('pointerdown',startBgm,{once:true});addEventListener('keydown',startBgm,{once:true})}else applyNativeSound(prefs.sound);
function recordEntry(data){let a=read(REC_KEY,[]);a.push({...data,at:data.at||Date.now()});write(REC_KEY,a.slice(-50));}
function renderRecords(){const scores=read(SCORE_KEY,read('bbvelha_scores',[]));const list=scores.length?'<div class="ppg-record-list">'+scores.map((r,i)=>'<div class="ppg-record"><b>#'+(i+1)+'</b><span><strong>'+String(r.name||'Operador').replace(/[<>]/g,'')+'</strong><br><small>'+new Date(r.at||Date.now()).toLocaleDateString('pt-BR')+'</small></span><strong>'+Number(r.score||0)+' pts</strong></div>').join('')+'</div>':'<div class="ppg-empty">Sem registros ainda.</div>';open('<h2>Recordes locais</h2><p>Top 5 persistente salvo neste navegador.</p>'+list);}
document.getElementById('ppg-records').onclick=renderRecords;
window.PPG={sfx,record:recordEntry,open,read,write,syncSound:on=>setSound(on,true),setSound};
})();
</script>
</body>
