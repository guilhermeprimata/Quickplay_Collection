<body>
  <h1>Velha Quântica</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="info">
    <p>Tempo: <span id="timer">0</span>s</p>
    <p>Pontuação: <span id="score">0</span></p>
  </div>
  <div class="top5">
    <h2>Top 5 Jogadores</h2>
    <ol id="topPlayers"></ol>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const size = 4;
    const cellSize = canvas.width / size;
    let board = Array(size).fill().map(() => Array(size).fill(""));
    let currentPlayer = "X";
    let gameOver = false;
    let score = 0;
    let timer = 0;
    let timerInterval;

    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const topPlayersList = document.getElementById("topPlayers");

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 1; i < size; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
        ctx.strokeStyle = "#5138B8";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c]) {
            ctx.font = "40px Arial";
            ctx.fillStyle = board[r][c] === "X" ? "#5138B8" : "#FFB45E";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(board[r][c], c * cellSize + cellSize / 2, r * cellSize + cellSize / 2);
          }
        }
      }
    }

    function checkWinner(player) {
      for (let i = 0; i < size; i++) {
        if (board[i].every(cell => cell === player)) return true;
        if (board.map(row => row[i]).every(cell => cell === player)) return true;
      }
      if (board.map((row, i) => row[i]).every(cell => cell === player)) return true;
      if (board.map((row, i) => row[size - 1 - i]).every(cell => cell === player)) return true;
      return false;
    }

    function isFull() {
      return board.flat().every(cell => cell !== "");
    }

    function lineCells() {
      const lines=[];
      for(let r=0;r<size;r++) lines.push(Array.from({length:size},(_,c)=>[r,c]));
      for(let c=0;c<size;c++) lines.push(Array.from({length:size},(_,r)=>[r,c]));
      lines.push(Array.from({length:size},(_,i)=>[i,i]));
      lines.push(Array.from({length:size},(_,i)=>[i,size-1-i]));
      return lines;
    }

    function immediateMove(mark) {
      for (const line of lineCells()) {
        const vals=line.map(([r,c])=>board[r][c]), empty=vals.findIndex(v=>v==='');
        if (empty>=0 && vals.filter(v=>v===mark).length===size-1) return line[empty];
      }
      return null;
    }

    function strategicScore(r,c) {
      let value = ((r===1||r===2)&&(c===1||c===2)) ? 4 : 1;
      for (const line of lineCells()) {
        if (!line.some(([rr,cc])=>rr===r&&cc===c)) continue;
        const vals=line.map(([rr,cc])=>board[rr][cc]), own=vals.filter(v=>v==='O').length, opp=vals.filter(v=>v==='X').length;
        if (!opp) value += [1,4,13,48][own] || 0;
        if (!own) value += [0,3,10,38][opp] || 0;
      }
      return value + Math.random()*2.5;
    }

    function aiMove() {
      if (gameOver) return;
      const empty=[];
      for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(board[r][c]==='')empty.push([r,c]);
      if (!empty.length) return;
      let move=immediateMove('O') || immediateMove('X');
      if (!move) {
        const ranked=empty.map(([r,c])=>({r,c,s:strategicScore(r,c)})).sort((a,b)=>b.s-a.s);
        if (Math.random()<.80) {
          const roll=Math.random(),pick=roll<.68?0:roll<.90?1:2;
          const m=ranked[Math.min(pick,ranked.length-1)]; move=[m.r,m.c];
        } else move=empty[(Math.random()*empty.length)|0];
      }
      const [r,c]=move; board[r][c]='O'; drawBoard();
      if (checkWinner('O')) endGame('IA venceu!');
      else if (isFull()) endGame('Empate!');
    }

    function handleClick(e) {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const row = Math.floor(y / cellSize);
      const col = Math.floor(x / cellSize);
      if (board[row][col] === "") {
        board[row][col] = "X";
        drawBoard();
        if (checkWinner("X")) {
          score = Math.max(10, 100 - timer * 2);
          scoreDisplay.textContent = score;
          endGame("Você venceu!");
        } else if (isFull()) {
          endGame("Empate!");
        } else {
          setTimeout(aiMove, 500);
        }
      }
    }

    function endGame(message) {
      gameOver = true;
      clearInterval(timerInterval);
      setTimeout(() => {
        if (score > 0) {
          const name = prompt(`${message}
Digite seu nome para salvar no ranking:`);
          if (name) saveScore(name, score);
        }
        resetGame();
      }, 900);
    }

    function resetGame() {
      board = Array(size).fill().map(() => Array(size).fill(""));
      gameOver = false;
      timer = 0;
      score = 0;
      timerDisplay.textContent = timer;
      scoreDisplay.textContent = score;
      timerInterval = setInterval(() => {
        timer++;
        timerDisplay.textContent = timer;
      }, 1000);
      drawBoard();
    }

    function saveScore(name, score) {
      const scores = JSON.parse(localStorage.getItem("velha_quantica_scores") || localStorage.getItem("bbvelha_scores") || "[]");
      scores.push({ name, score });
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem("velha_quantica_scores", JSON.stringify(scores.slice(0, 5)));
      renderTopPlayers();
    }

    function renderTopPlayers() {
      const scores = JSON.parse(localStorage.getItem("velha_quantica_scores") || localStorage.getItem("bbvelha_scores") || "[]");
      topPlayersList.innerHTML = "";
      scores.forEach(s => {
        const li = document.createElement("li");
        li.textContent = `${s.name} - ${s.score} pts`;
        topPlayersList.appendChild(li);
      });
    }

    canvas.addEventListener("click", handleClick);
    renderTopPlayers();
    resetGame();
  </script>

const toolbar=document.createElement('nav');toolbar.id='ppg-toolbar';toolbar.innerHTML=`<button id="ppg-theme" title="Alternar modo claro/escuro">${prefs.theme==='light'?'🌙 Escuro':'☀️ Claro'}</button><button id="ppg-sound" title="Som e música">${prefs.sound?'🔊 Som':'🔇 Som'}</button><button id="ppg-records">🏆 Recordes</button><button id="ppg-about">ⓘ Sobre</button><a href="menu_minigames.html" id="ppg-menu">↩ Menu de Mini Games</a>`;document.body.appendChild(toolbar);
const modal=document.createElement('div');modal.className='ppg-modal';modal.id='ppg-modal';modal.innerHTML=`<div class="ppg-card"><button class="ppg-close" aria-label="Fechar">✕</button><div id="ppg-modal-body"></div></div>`;document.body.appendChild(modal);const body=$('#ppg-modal-body');function open(html){body.innerHTML=html;modal.classList.add('open')}function close(){modal.classList.remove('open')}modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.ppg-close'))close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('#ppg-about').onclick=()=>open(`<h2>${CFG.name}</h2><p>${CFG.desc}</p><h3>Como jogar</h3><p>${CFG.how}</p><h3>Dica de estratégia</h3><p>${CFG.tip}</p><p class="ppg-credit">Produção: Projeto Primata Games em 2026.</p>`);
$('#ppg-theme').onclick=()=>{prefs.theme=prefs.theme==='light'?'dark':'light';writeJSON(PREF_KEY,prefs);document.body.classList.toggle('ppg-light',prefs.theme==='light');document.body.classList.toggle('ppg-dark',prefs.theme==='dark');$('#ppg-theme').textContent=prefs.theme==='light'?'🌙 Escuro':'☀️ Claro';sfx(520,.05)};
// Áudio procedural comum: garante BGM + SFX sem arquivos externos.
let ac=null,master=null,music=null,beat=0;function initAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=prefs.sound?.12:0;master.connect(ac.destination)}function tone(f,d=.08,type='sine',vol=.08,when=0){if(!prefs.sound)return;initAudio();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d)}function sfx(f=420,d=.045){tone(f,d,'triangle',.11)}function startBgm(){if(music||!prefs.sound)return;initAudio();music=setInterval(()=>{if(document.hidden||!prefs.sound)return;const seq=[110,138.59,164.81,220,196,164.81,146.83,123.47],f=seq[beat++%seq.length];tone(f,.16,'triangle',.025);if(beat%4===1)tone(f/2,.1,'sine',.018)},360)}function stopBgm(){clearInterval(music);music=null}function unlock(){initAudio();ac?.resume();if(prefs.sound)startBgm()}addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});document.addEventListener('click',e=>{if(e.target.closest('button,a,input,select'))sfx(380+Math.random()*80,.035)},true);
$('#ppg-sound').onclick=e=>{e.stopPropagation();prefs.sound=!prefs.sound;writeJSON(PREF_KEY,prefs);initAudio();master.gain.setTargetAtTime(prefs.sound?.12:0,ac.currentTime,.02);if(prefs.sound){ac.resume();startBgm();sfx(660,.08)}else stopBgm();$('#ppg-sound').textContent=prefs.sound?'🔊 Som':'🔇 Som'};
// Ranking local por sessão. A mesma sessão é atualizada em vez de poluir o top 5 com cada incremento.
const sessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);function formatValue(v){if(v==null)return '—';if(Math.abs(v)>=1e9)return v.toLocaleString('pt-BR',{notation:'compact',maximumFractionDigits:2})+CFG.unit;return (Number.isInteger(v)?v:v.toFixed(2).replace('.',','))+CFG.unit}function metric(){try{const num=window.__ppgHelpers.num,money=window.__ppgHelpers.money;return num(document.querySelector('#score')?.textContent)}catch{return null}}function upsert(v){if(v==null||!Number.isFinite(v)||(CFG.mode==='min'&&v<=0))return;let r=readJSON(REC_KEY,[]),me=r.find(x=>x.sessionId===sessionId);if(me){const better=CFG.mode==='min'?v<me.value:v>me.value;if(!better)return;me.value=v;me.at=Date.now()}else r.push({sessionId,value:v,at:Date.now()});r.sort((a,b)=>CFG.mode==='min'?a.value-b.value:b.value-a.value);writeJSON(REC_KEY,r.slice(0,5))}setInterval(()=>upsert(metric()),800);addEventListener('pagehide',()=>upsert(metric()));
function renderRecords(){const r=readJSON(REC_KEY,[]);const list=r.length?`<div class="ppg-record-list">${r.map((x,i)=>`<div class="ppg-record"><b>#${i+1}</b><span><strong>${formatValue(x.value)}</strong><br><small>${new Date(x.at).toLocaleDateString('pt-BR')}</small></span><small>${CFG.metric}</small></div>`).join('')}</div>`:`<div class="ppg-empty">Ainda não há marca registrada neste navegador. Jogue uma partida e ela aparece aqui.</div>`;open(`<h2>Recordes locais</h2><p>Top 5 persistente deste jogo, salvo somente neste navegador.</p>${list}`)}$('#ppg-records').onclick=renderRecords;
})();
</script>

<script id="ppg-fs-runtime">(()=>{'use strict';const q=new URLSearchParams(location.search),embedded=q.get('embedded')==='1',auto=q.get('autofs')==='1';const btn=document.getElementById('ppgFullscreenBtn');const mobile=()=>matchMedia('(max-width:900px)').matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);function markOrientation(){document.body.classList.toggle('ppg-needs-landscape',mobile()&&innerHeight>innerWidth)}async function lockLandscape(){if(!mobile())return true;try{if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');markOrientation();return true}}catch(e){}markOrientation();return false}async function goFS(){try{if(embedded&&parent!==window){const pd=parent.document,el=pd.getElementById('ppgGameLauncher')||pd.documentElement;if(!pd.fullscreenElement&&el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});}else if(!document.fullscreenElement&&document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:'hide'})}}catch(e){}await lockLandscape();markOrientation()}btn?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();goFS()});addEventListener('resize',markOrientation);addEventListener('orientationchange',markOrientation);document.addEventListener('fullscreenchange',markOrientation);markOrientation();if(auto){const once=()=>{goFS();removeEventListener('pointerdown',once,true);removeEventListener('keydown',once,true)};addEventListener('pointerdown',once,true);addEventListener('keydown',once,true)}if(embedded&&parent!==window){document.addEventListener('click',e=>{const a=e.target.closest('a,button');if(!a)return;const href=(a.getAttribute('href')||'').toLowerCase();const txt=(a.textContent||'').toLowerCase();if(href==='index.html'||href.endsWith('/index.html')||href.includes('menu_minigames')||txt.includes('voltar ao menu')||txt.includes('back to menu')){e.preventDefault();e.stopPropagation();parent.postMessage({type:'ppg-exit-game'},location.origin)}},true)}})();</script>
