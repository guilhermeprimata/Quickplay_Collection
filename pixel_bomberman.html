<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Bomberman</title>
  <style>
    body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
    canvas { background: #222; display: block; margin: auto; }
  </style>
</head>
<body>
<h2>Pixel Bomberman</h2>
<canvas id="game" width="480" height="480"></canvas>
<p id="hud">Vidas: 3 | Pontos: 0</p>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const tileSize = 32;
const cols = canvas.width / tileSize;
const rows = canvas.height / tileSize;

let map = [];
let bombs = [];
let flames = [];
let enemies = [];
let score = 0;
let lives = 3;
let enemyMoveTimer = 0;
let framesSinceDamage = 0;
let killsSinceVoucher = 0;

const player = {
  x: 1,
  y: 1,
  alive: true
};

function drawPixelArt(x, y, color, pattern) {
  const px = x * tileSize;
  const py = y * tileSize;
  ctx.fillStyle = color;
  for (let i = 0; i < pattern.length; i++) {
    for (let j = 0; j < pattern[i].length; j++) {
      if (pattern[i][j]) {
        ctx.fillRect(px + j * 4, py + i * 4, 4, 4);
      }
    }
  }
}

const spritePlayer = [
  [0,1,0],
  [1,1,1],
  [1,0,1]
];

const spriteEnemy = [
  [1,1,1],
  [1,0,1],
  [1,1,1]
];

const spriteBlock = [
  [1,1,1],
  [1,0,1],
  [1,1,1]
];

const spriteWall = [
  [1,0,1],
  [0,1,0],
  [1,0,1]
];

function initMap() {
  map = [];
  for (let y = 0; y < rows; y++) {
    map[y] = [];
    for (let x = 0; x < cols; x++) {
      if (y % 2 === 1 && x % 2 === 1) {
        map[y][x] = "wall";
      } else if (Math.random() < 0.2 && !(x === 1 && y === 1)) {
        map[y][x] = "block";
      } else {
        map[y][x] = "empty";
      }
    }
  }
  enemies = [];
  for (let i = 0; i < 5; i++) {
    let ex, ey;
    do {
      ex = Math.floor(Math.random() * cols);
      ey = Math.floor(Math.random() * rows);
    } while (map[ey][ex] !== "empty" || (ex === 1 && ey === 1));
    enemies.push({ x: ex, y: ey });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (map[y][x] === "wall") drawPixelArt(x, y, "#555", spriteWall);
      else if (map[y][x] === "block") drawPixelArt(x, y, "#964B00", spriteBlock);
    }
  }
  drawPixelArt(player.x, player.y, "cyan", spritePlayer);
  bombs.forEach(b => drawPixelArt(b.x, b.y, "red", spriteBlock));
  flames.forEach(f => drawPixelArt(f.x, f.y, "orange", spriteWall));
  enemies.forEach(e => drawPixelArt(e.x, e.y, "lime", spriteEnemy));
}

function placeBomb() {
  bombs.push({ x: player.x, y: player.y, timer: 60 });
}

function explodeBomb(bomb) {
  const beforeEnemies=enemies.length;
  const positions = [
    { x: bomb.x, y: bomb.y },
    { x: bomb.x + 1, y: bomb.y },
    { x: bomb.x - 1, y: bomb.y },
    { x: bomb.x, y: bomb.y + 1 },
    { x: bomb.x, y: bomb.y - 1 }
  ];
  positions.forEach(pos => {
    if (map[pos.y] && map[pos.y][pos.x] === "block") {
      map[pos.y][pos.x] = "empty";
      score += 10;
    }
    flames.push({ x: pos.x, y: pos.y, timer: 30 });
    enemies = enemies.filter(e => !(e.x === pos.x && e.y === pos.y));
  });
  const killed=beforeEnemies-enemies.length;killsSinceVoucher+=killed;if(killsSinceVoucher>=8&&lives<3){killsSinceVoucher-=8;lives++;}
  if (positions.some(p => p.x === player.x && p.y === player.y)) {
    lives--;framesSinceDamage=0;
    if (lives <= 0) {
      alert("Game Over! Pontuação: " + score);
      lives = 3;
      score = 0;
      initMap();
    }
  }
}

function updateEnemies() {
  enemyMoveTimer++;
  if (enemyMoveTimer % 60 !== 0) return; // move a cada 60 frames

  enemies.forEach(e => {
    const dirs = ["up", "down", "left", "right"];
    const dir = dirs[Math.floor(Math.random() * dirs.length)];
    let dx = 0, dy = 0;
    if (dir === "up") dy = -1;
    if (dir === "down") dy = 1;
    if (dir === "left") dx = -1;
    if (dir === "right") dx = 1;
    const nx = e.x + dx;
    const ny = e.y + dy;
    if (map[ny] && map[ny][nx] === "empty") {
      e.x = nx;
      e.y = ny;
    }
    if (e.x === player.x && e.y === player.y) {
      lives--;framesSinceDamage=0;
      if (lives <= 0) {
        alert("Game Over! Pontuação: " + score);
        lives = 3;
        score = 0;
        initMap();
      }
    }
  });
}

function update() {
  framesSinceDamage++;if(lives<3&&framesSinceDamage>=1800){lives++;framesSinceDamage=0;}
  bombs.forEach(b => {
    b.timer--;
    if (b.timer <= 0) {
      explodeBomb(b);
    }
  });
  bombs = bombs.filter(b => b.timer > 0);
  flames.forEach(f => f.timer--);
  flames = flames.filter(f => f.timer > 0);
  updateEnemies();
  document.getElementById("hud").textContent = `Vidas: ${lives} | Pontos: ${score}`;
}

document.addEventListener("keydown", e => {
  let dx = 0, dy = 0;
  if (e.key === "ArrowUp") dy = -1;
  else if (e.key === "ArrowDown") dy = 1;
  else if (e.key === "ArrowLeft") dx = -1;
  else if (e.key === "ArrowRight") dx = 1;
  else if (e.key === " ") placeBomb();

  const nx = player.x + dx;
  const ny = player.y + dy;
  if (map[ny] && map[ny][nx] === "empty") {
    player.x = nx;
    player.y = ny;
  }
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initMap();
loop();
</script>
